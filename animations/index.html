<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>統計手繪動畫</title>
<link rel="stylesheet" href="fonts/iansui/400.css">
<link rel="stylesheet" href="fonts/400.css">
<link rel="stylesheet" href="fonts/700.css">
<style>html,body{margin:0;background:#222}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script src="characters.js"></script>
<script src="props.js"></script>
<script src="audio.js"></script>
<script src="episodes.js"></script>
<script src="episodes_m1.js"></script>
<script src="episodes_m1b.js"></script>
<script src="episodes_m3.js"></script>
<script src="episodes_m2.js"></script>
<script src="episodes_m45.js"></script>
<script src="episodes_more.js"></script>
<script>
const TIMELINES = {};
const qs = new URLSearchParams(location.search);
const EPKEY = qs.get('ep') || '1';
// "1v" = 第 1 支的配音版：場景時間由旁白決定
if (EPKEY.endsWith('v')) document.write('<script src="voice/ep' + EPKEY.slice(0, -1) + '_timeline.js"><\/script>');
</script>
<script>
// piecewise map from narrated scene time to the original animation time, keyed on each line's beat
function narrated(base, tl) {
  const scenes = base.scenes.map((b, i) => {
    const s = tl.scenes[i], o = b.t1 - b.t0, beats = b.beats || s.lines.map((_, j) => j * o / s.lines.length);
    const pts = [[0, 0]];
    s.lines.forEach((l, j) => pts.push([l.t0, Math.max(beats[j], pts[pts.length - 1][1])]));
    pts.push([s.lines[s.lines.length - 1].t1, o - .001]);
    const map = lt => {
      for (let j = 1; j < pts.length; j++) if (lt < pts[j][0]) return lerp(pts[j - 1][1], pts[j][1], (lt - pts[j - 1][0]) / Math.max(1e-6, pts[j][0] - pts[j - 1][0]));
      return o - .001;
    };
    return { t0: s.t0, t1: s.t1, lines: s.lines, draw(lt) { b.draw(map(lt), o); } };
  });
  return { ...base, dur: tl.dur, scenes, voiced: true };
}
const EP = EPKEY.endsWith('v') ? narrated(EPISODES[EPKEY.slice(0, -1)], TIMELINES[EPKEY.slice(0, -1)]) : EPISODES[EPKEY];
ctx = document.getElementById('c').getContext('2d');
const XFADE = .35;

function drawScene(sc, lt, alpha) {
  ALPHA = alpha;
  SEED = 1000 * (EP.scenes.indexOf(sc) + 1);
  RLT = lt;
  sc.draw(lt, sc.t1 - sc.t0);
  SEED = 900000 + 1000 * EP.scenes.indexOf(sc);
  if (!sc.lines) return subtitle(sc.sub, lt, sc.t1 - sc.t0);
  const L = sc.lines, D = sc.t1 - sc.t0;
  for (let j = 0; j < L.length; j++) {
    const a = j === 0 ? 0 : L[j].t0 - .12, b = j === L.length - 1 ? D : L[j + 1].t0 - .12;
    if (lt >= a && lt < b) { subtitle(L[j].disp, lt - a, b - a); break; }
  }
}
function renderFrame(t) {
  T = t; BOIL = Math.floor(t * BOIL_RATE);
  ALPHA = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawPaper();
  const i = EP.scenes.findIndex(s => t >= s.t0 && t < s.t1);
  const idx = i < 0 ? EP.scenes.length - 1 : i;
  const sc = EP.scenes[idx], lt = t - sc.t0;
  if (idx > 0 && lt < XFADE) {
    const pv = EP.scenes[idx - 1];
    drawScene(pv, pv.t1 - pv.t0 - .001, 1 - ease(lt / XFADE));
    drawScene(sc, lt, ease(lt / XFADE));
  } else drawScene(sc, lt, 1);
  ALPHA = 1; SEED = 990000;
  episodeTag(EP.tag);
  const k = ease((t - (EP.dur - 3.6)) / .4);
  sourceCard(EP.sources, k);
  // fade from/to paper at the very start and end
  const f = Math.min(clamp(t / .25), clamp((EP.dur - t) / .4));
  if (f < 1) { ctx.globalAlpha = 1 - f; ctx.fillStyle = '#f4ead3'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
async function warmup() {
  for (let t = 0; t < EP.dur; t += .25) renderFrame(t);
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 300));
  for (let t = 0; t < EP.dur; t += .25) renderFrame(t);
  await document.fonts.ready;
  return [...document.fonts].filter(f => f.status === 'loaded').length;
}
function frameJPEG(t) { renderFrame(t); return document.getElementById('c').toDataURL('image/jpeg', .94); }
window.READY = (async () => { await warmup(); return true; })();
if (qs.get('play')) { const st = performance.now(); (function loop() { renderFrame(((performance.now() - st) / 1000) % EP.dur); requestAnimationFrame(loop); })(); }
else if (qs.get('t')) window.READY.then(() => renderFrame(+qs.get('t')));
</script>
</body>
</html>
