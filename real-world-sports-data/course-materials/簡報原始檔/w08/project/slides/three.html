<p class="eyebrow">選方法</p>
<h2>選方法之前先回答三個問題</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">結果變項是什麼型態：連續、二元、序位，還是計數？</p></div>
<div class="step"><p class="n">2</p><p class="s">比較幾組？各組是獨立的，還是同一批人重複測量？</p></div>
<div class="step"><p class="n">3</p><p class="s">想得到差異的大小，還是只想知道有沒有差異？</p></div>
</div>
<p class="note">AI 選的方法通常不會錯得離譜。它沒問你的是第三個問題。</p>
<p class="foot">真實世界運動大數據分析　W08</p>
<aside>請學生拿主資料集的一題來回答這三個問題，例如「規律運動與否，在體育學習認知上有沒有差」。前兩題決定下一頁表格的格子，第三題決定要報告什麼。</aside>
