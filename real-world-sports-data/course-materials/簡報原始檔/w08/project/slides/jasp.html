<p class="eyebrow">獨立驗證</p>
<h2>用 JASP 重做同一個檢定</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">把同一份資料匯入 JASP。</p></div>
<div class="step"><p class="n">2</p><p class="s">用點選方式重做 AI 寫程式跑過的那個檢定。</p></div>
<div class="step"><p class="n">3</p><p class="s">核對三個數字：統計量、自由度、p 值。</p></div>
</div>
<p class="note">數字不一致時，原因通常是遺漏值的處理方式不同，或變異數是否假設相等。</p>
<p class="foot">真實世界運動大數據分析　W08</p>
<aside>用十分鐘帶過 JASP 介面，可搭配既有的〈JASP簡介.pdf〉。現場示範一個不一致的例子：程式用 Welch t 檢定，JASP 預設用 Student t 檢定，自由度就不同。這是第 6 週「獨立重做」技術的實作。</aside>
</section>
