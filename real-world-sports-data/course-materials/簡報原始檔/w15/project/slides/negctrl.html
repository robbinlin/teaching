<h2>負對照：一個不該受處理影響的結果</h2>
<div class="rows">
<div class="row"><p class="k">做法</p><p class="v">找一個理論上不受處理影響、但受同樣混淆因子影響的結果。</p></div>
<div class="row"><p class="k">判讀</p><p class="v">分析顯示處理對它也有「效果」，表示混淆沒有處理乾淨。</p></div>
<div class="row"><p class="k">例子</p><p class="v">參加運動社團不應該影響是否近視。調整後兩組近視比例仍有差異，就要懷疑有未測的家庭或學校因素。</p></div>
<div class="row"><p class="k">條件</p><p class="v">資料裡要有適合的變項。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W15</p>
