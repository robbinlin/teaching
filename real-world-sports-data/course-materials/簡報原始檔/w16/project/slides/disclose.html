<p class="eyebrow">AI 使用揭露</p>
<h2>AI 使用揭露的四個要素</h2>
<table class="t">
<tr class="hd"><th style="width:24%">要素</th><th style="width:76%">例子</th></tr>
<tr><td>工具與版本</td><td>工具名稱、模型版本、使用日期</td></tr>
<tr><td>用在哪裡</td><td>撰寫資料清理與分析程式；起草結果段落</td></tr>
<tr><td>沒用在哪裡</td><td>研究問題、DAG 與調整集、結論由作者決定</td></tr>
<tr><td>人做了什麼驗證</td><td>衍生變項經交叉表檢查；主要結果以 JASP 獨立重現；引用經作者核對原文</td></tr>
</table>
<p class="small gap">主要期刊的共同立場：AI 不能列為作者；使用須揭露；作者對全部內容負責。</p>
<p class="foot">真實世界運動大數據分析　W16</p>
<aside>揭露要具體到讀者能判斷風險。第四列最重要，它對應整學期的驗證紀錄。期刊立場可參考 ICMJE 建議中 AI 輔助技術一節，列在延伸閱讀。</aside>
</section>
