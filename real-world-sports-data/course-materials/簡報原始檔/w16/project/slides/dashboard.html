<h2>互動儀表板值得做的情況</h2>
<div class="rows">
<div class="row"><p class="k">值得做</p><p class="v">讀者想查自己關心的那一個縣市或那一所學校；資料會持續更新。</p></div>
<div class="row"><p class="k">不值得做</p><p class="v">只是為了一次報告。靜態的表與圖更容易審查，也更容易重現。</p></div>
<div class="row"><p class="k">資料來源</p><p class="v">儀表板讀取 data/derived/ 的結果，不另外計算。</p></div>
</div>
<p class="note">請 AI 做儀表板時，它常在頁面裡重新寫一次資料處理邏輯，與報告用的程式不一致。</p>
<p class="foot">真實世界運動大數據分析　W16</p>
