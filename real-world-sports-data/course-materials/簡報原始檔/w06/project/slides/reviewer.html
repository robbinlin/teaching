<p class="eyebrow">驗證技術</p>
<h2>請另一個 AI 當審查者</h2>
<div class="rows">
<div class="row"><p class="k">做法</p><p class="v">把程式與輸出交給另一個模型，請它找問題。</p></div>
<div class="row"><p class="k">它會給什麼</p><p class="v">一些真的問題，也有一些不存在的問題。</p></div>
<div class="row"><p class="k">怎麼用</p><p class="v">每一項意見都是待查證的線索。判定由你做，而且要有輸出作為證據。</p></div>
<div class="row"><p class="k">不要做</p><p class="v">請同一個對話中的同一個模型審查自己剛寫的程式。它傾向同意自己。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W06</p>
<aside>期中規則的預告：書面審查可以用 AI，但把正確的做法誤指為錯誤要扣分。AI 審查者提出的意見，要自己查證後才寫進審查意見表。</aside>
