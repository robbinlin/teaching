<h2>兩個解讀上的錯誤</h2>
<div class="rows">
<div class="row"><p class="k">命名當成發現</p><p class="v">把四群命名為「運動熱衷型」「被動參與型」，讀者會以為資料裡真的有四種學生。命名之前先列出各群在每個變項上的平均。</p></div>
<div class="row"><p class="k">循環論證</p><p class="v">用九題分群，再檢定各群在這九題上是否有顯著差異。當然有，分群就是為了讓它們不同。</p></div>
</div>
<p class="note">要驗證分群有意義，用一個沒有參與分群的外部變項。</p>
<p class="foot">真實世界運動大數據分析　W12</p>
<aside>AI 特別擅長替每一群取漂亮的名字。課堂任務最後會請 AI 命名，再討論這些名字有多少是資料支持的。外部變項的例子：規律運動與否。</aside>
