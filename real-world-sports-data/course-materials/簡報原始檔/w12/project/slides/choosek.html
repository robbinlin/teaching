<p class="eyebrow">選群數</p>
<h2>三種指標常給出不同答案</h2>
<p class="body">組內平方和的轉折點、輪廓係數、gap 統計量。沒有單一正確方法。實務上的判斷順序：</p>
<div class="steps gap">
<div class="step"><p class="n">1</p><p class="s">指標建議的範圍，例如 3 到 5 群。</p></div>
<div class="step"><p class="n">2</p><p class="s">在這個範圍內，哪個 k 的結果最穩定。</p></div>
<div class="step"><p class="n">3</p><p class="s">哪個 k 的各群可以被清楚描述，而且每群人數不會太少。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W12</p>
<aside>請 AI 選群數時，它通常只報一種指標並直接給出答案。要求它三種都報，並說明為什麼選這個 k。第 2 步的「穩定」下一頁說明怎麼檢查。</aside>
</section>
