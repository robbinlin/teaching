<p class="eyebrow">識別假設</p>
<h2>從觀察性資料得到因果結論的三個條件</h2>
<table class="t">
<tr class="hd"><th style="width:14%">假設</th><th style="width:26%">意思</th><th style="width:38%">在本例中</th><th style="width:22%">能用資料檢驗嗎</th></tr>
<tr><td>可交換性</td><td>調整某些變項後，兩組可比</td><td>所有同時影響參加社團與規律運動的因素都測到了</td><td>不能</td></tr>
<tr><td>正值性</td><td>每種特徵的人都有機會落在兩組</td><td>沒有哪類學校完全沒有社團</td><td>可以部分檢查</td></tr>
<tr><td>一致性</td><td>「處理」的定義夠明確</td><td>「參加社團」指哪種社團、多久、多頻繁</td><td>靠定義</td></tr>
</table>
<p class="note">可交換性無法用資料證明，只能靠領域知識主張，並在報告中接受質疑。</p>
<p class="foot">真實世界運動大數據分析　W13</p>
<aside>可交換性是整個因果推論最需要人判斷的地方。正值性第 14 週用傾向分數的重疊圖檢查。一致性請學生回頭看編碼簿：社團題的題目原文怎麼問，回溯期間多長。</aside>
</section>
