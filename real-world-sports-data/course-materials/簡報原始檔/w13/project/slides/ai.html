<h2>AI 列候選變項，箭頭方向由你判斷</h2>
<div class="rows">
<div class="row"><p class="k">可以做</p><p class="v">請它列出候選的混淆因子，補上你沒想到的。</p></div>
<div class="row"><p class="k">常見的錯</p><p class="v">把中介與結果的後果一併列為「應控制的變項」。每一項都要自己判斷箭頭方向。</p></div>
<div class="row"><p class="k">不能寫</p><p class="v">「依 AI 建議調整下列變項。」DAG 是研究者的主張。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W13</p>
<aside>課後作業就是做這件事：請 AI 針對同一題提出「應控制的變項」，學生逐項標註混淆、中介、衝突因子或無關。為箭頭找依據可以用第 2 週的文獻工具，每筆引用仍須自己開過原文。</aside>
