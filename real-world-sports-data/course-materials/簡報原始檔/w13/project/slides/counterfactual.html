<h2>每位學生有兩個結果，只看得到一個</h2>
<div class="rows">
<div class="row"><p class="k">Y(1)</p><p class="v">如果參加社團，是否規律運動。</p></div>
<div class="row"><p class="k">Y(0)</p><p class="v">如果不參加社團，是否規律運動。</p></div>
<div class="row"><p class="k">效果</p><p class="v">Y(1) − Y(0)。每個人只會實現其中一個，另一個永遠看不到。</p></div>
</div>
<p class="note">缺的那一半要靠別人的資料來填，而「別人」必須夠像。隨機分派讓兩組在所有特徵上平均而言相同，包含沒有測量到的特徵。觀察性資料沒有這個保證。</p>
