<h2>區辨力與校準是兩件事</h2>
<div class="rows">
<div class="row"><p class="k">區辨力</p><p class="v">ROC 曲線下面積。模型能否把會發生與不會發生的人排開。</p></div>
<div class="row"><p class="k">校準</p><p class="v">模型說 30% 的那群人，實際是不是約 30% 發生。畫校準圖。</p></div>
<div class="row"><p class="k">選定門檻下</p><p class="v">敏感度、特異度、陽性預測值。門檻由錯誤的代價決定。</p></div>
</div>
<p class="note">區辨力高而校準差的模型，排序可以用，機率不能用。</p>
<p class="foot">真實世界運動大數據分析　W11</p>
