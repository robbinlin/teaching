<h2>從簡單的模型開始</h2>
<table class="t">
<tr class="hd"><th style="width:32%">模型</th><th style="width:68%">特點</th></tr>
<tr><td>邏輯斯迴歸</td><td>基準。係數可檢查，不易過度配適</td></tr>
<tr><td>正則化邏輯斯迴歸</td><td>特徵多或彼此相關時較穩定</td></tr>
<tr><td>隨機森林</td><td>自動處理非線性與交互作用</td></tr>
<tr><td>梯度提升樹</td><td>表格資料上通常最準，需要調參</td></tr>
</table>
<p class="note">特徵只有十幾個的調查資料，複雜模型未必勝過邏輯斯迴歸。先建基準，複雜模型要贏過基準才值得用。</p>
<p class="foot">真實世界運動大數據分析　W11</p>
<aside>請 AI 建預測模型時，它常直接給梯度提升樹。要求它先交出邏輯斯迴歸基準，再比較。課堂任務第 2 步就是建基準。</aside>
