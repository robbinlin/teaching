<p class="eyebrow">傾向分數的概念</p>
<h2>傾向分數：接受處理的機率</h2>
<p class="lead">e(X) = P(處理 = 1 | X)</p>
<div class="rows gap">
<div class="row"><p class="k">定義</p><p class="v">給定一位學生的特徵之後，他參加運動社團的機率。</p></div>
<div class="row"><p class="k">用處</p><p class="v">十幾個混淆因子無法逐一配對。傾向分數相同的兩個人，這些因子的分布平均而言相同。</p></div>
<div class="row"><p class="k">限制</p><p class="v">只能平衡放進模型的變項。沒測到的混淆因子，它無能為力。</p></div>
<div class="row"><p class="k">放哪些變項</p><p class="v">由第 13 週畫的 DAG 與調整集決定。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W14</p>
<aside>強調降維：把多個變項的平衡問題，變成一個分數的平衡問題。接著馬上講限制，避免學生以為傾向分數能處理未測混淆。請各組拿出第 13 週的調整集。</aside>
</section>
