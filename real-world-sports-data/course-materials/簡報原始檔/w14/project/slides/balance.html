<section id="balance" data-transition="fade">
<p class="eyebrow">平衡診斷</p>
<h2>平衡用標準化平均差診斷</h2>
<div class="rows">
<div class="row"><p class="k">標準化平均差</p><p class="v">兩組平均的差除以合併標準差。一般以小於 0.1 為可接受。</p></div>
<div class="row"><p class="k">不用 p 值</p><p class="v">配對後樣本變小，p 值自然變大，看起來沒有顯著差異，實際上差異可能沒變。</p></div>
<div class="row"><p class="k">Love plot</p><p class="v">每個變項調整前後的標準化平均差。</p></div>
<div class="row"><p class="k">分布圖</p><p class="v">兩組傾向分數的重疊情形。沒有重疊的區域，正值性不成立，那些人沒有可比的對象。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W14</p>
<aside>標準化平均差（SMD）不受樣本數影響，這是它優於 p 值的原因。補充：也不要用傾向分數模型的區辨力評估它的好壞，目的是平衡，不是預測誰參加社團。Love plot 與分布圖是報告中必備的兩張圖。</aside>
</section>
