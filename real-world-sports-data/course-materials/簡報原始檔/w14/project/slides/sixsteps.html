<section id="sixsteps" data-transition="fade">
<p class="eyebrow">六個步驟</p>
<h2>傾向分數分析的六個步驟</h2>
<table class="t">
<tr class="hd"><th style="width:20%">步驟</th><th style="width:38%">做什麼</th><th style="width:42%">常見錯誤</th></tr>
<tr><td>1 資料準備</td><td>處理遺漏值；定義處理與結果</td><td>完整個案刪掉太多人</td></tr>
<tr><td>2 估計傾向分數</td><td>以處理為結果的邏輯斯迴歸</td><td>依 p 值選變項；放入中介</td></tr>
<tr><td>3 配對或加權</td><td>讓兩組在共變項上可比</td><td>沒有說明估計的對象是誰</td></tr>
<tr><td>4 平衡診斷</td><td>標準化平均差、分布重疊</td><td>用 p 值檢查平衡</td></tr>
<tr><td>5 估計效果</td><td>在調整後的樣本上比較結果</td><td>標準誤未考慮配對或權重</td></tr>
<tr><td>6 敏感度分析</td><td>未測混淆要多強才能推翻結論</td><td>省略</td></tr>
</table>
<p class="foot">真實世界運動大數據分析　W14</p>
<aside>步驟 1 到 4 是設計階段，不使用結果變項。步驟 5 才打開結果。步驟 6 留到下週。第 2 步的變項選擇也不能用逐步法，也不能放入結果的後果。</aside>
</section>
