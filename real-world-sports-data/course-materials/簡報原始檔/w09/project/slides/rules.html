<p class="eyebrow">規則</p>
<h2>四條規則</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">書面審查可以使用任何工具，包含 AI 助理。必須繳交完整的對話或執行紀錄。</p></div>
<div class="step"><p class="n">2</p><p class="s">口頭答詢不可使用任何工具。教師從你的審查意見中挑一到兩項，請你說明為什麼這是問題、你怎麼確認的。</p></div>
<div class="step"><p class="n">3</p><p class="s">每一項審查意見都必須附上輸出作為證據。沒有證據的意見不計分。</p></div>
<div class="step"><p class="n">4</p><p class="s">把正確的做法誤指為錯誤，每項扣 2 分。AI 審查者提出的意見，自己查證後才寫進來。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W09</p>
<aside>第 4 條要特別強調：把報告丟給 AI 請它列出問題，再原封不動貼上，會被扣分。AI 提的每一項都只是待查證的線索。</aside>
</section>
