<section id="grading" data-transition="fade">
<p class="eyebrow">評分</p>
<h2>一百分怎麼算</h2>
<table class="t">
<tr class="hd"><th style="width:22%">項目</th><th style="width:12%">配分</th><th style="width:66%">標準</th></tr>
<tr><td>找出的問題</td><td>40</td><td>每個正確指認的問題依嚴重程度給 3–6 分</td></tr>
<tr><td>證據</td><td>30</td><td>每項意見是否附有能證明問題存在的輸出</td></tr>
<tr><td>修正</td><td>20</td><td>修正後的程式與數字是否正確</td></tr>
<tr><td>口頭答詢</td><td>10</td><td>能否不看資料說明問題的原因與確認方式</td></tr>
<tr><td>誤報</td><td>扣分</td><td>每項扣 2 分</td></tr>
</table>
<p class="foot">真實世界運動大數據分析　W09</p>
<aside>證據與修正合計五十分，比找出問題還多。找到五個並且都有證據與修正，分數會高於列出十個卻沒有輸出。</aside>
</section>
