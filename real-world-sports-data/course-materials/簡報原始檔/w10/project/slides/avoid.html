<section id="avoid" data-transition="fade">
<p class="eyebrow">模型檢查</p>
<h2>兩件不該做的事</h2>
<div class="rows">
<div class="row"><p class="k">逐步選取</p><p class="v">讓程式依 p 值自動挑變項。選出的模型 p 值偏小、信賴區間偏窄，換一份樣本就選出不同的變項。</p></div>
<div class="row"><p class="k">用 ROC 曲線支持因果主張</p><p class="v">曲線下面積衡量的是區辨力，是預測的指標。</p></div>
</div>
<p class="note">課程既有程式在同一個邏輯斯迴歸裡同時輸出勝算比與 ROC 曲線。兩者回答的是不同的問題。</p>
<p class="foot">真實世界運動大數據分析　W10</p>
<aside>AI 被要求「找出重要的預測因子」時，常主動使用逐步選取。請學生在規格書裡明確寫：變項事前指定，不用自動選取。</aside>
</section>
