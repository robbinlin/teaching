<p class="eyebrow">表二謬誤</p>
<h2>一個模型只回答一個暴露</h2>
<p class="say">為了估計某個暴露而建的模型，<br>其他共變項的係數<br>沒有對應的因果解釋。</p>
<p class="after">目的是描述，寫「調整後的關聯」；目的是因果，每個暴露有自己的調整集。</p>
<p class="foot">真實世界運動大數據分析　W10</p>
<aside>目的是描述時可以報告全部係數，但用語是「調整後的關聯」，不寫「影響因子」。請學生回頭看自己讀過的論文：有沒有把迴歸表的每一列都寫成「某某是規律運動的影響因子」？</aside>
