<h2>表一依分組變項列出樣本特徵</h2>
<p class="body">它回答三個問題：樣本是誰、兩組在哪些地方不同、每個變項缺多少。</p>
<table class="t gap">
<tr class="hd"><th style="width:36%">變項型態</th><th style="width:64%">報告方式</th></tr>
<tr><td>連續、近似對稱</td><td>平均（標準差）</td></tr>
<tr><td>連續、偏態</td><td>中位數（四分位距）</td></tr>
<tr><td>類別</td><td>人數（百分比），註明分母</td></tr>
<tr><td>所有變項</td><td>遺漏人數</td></tr>
</table>
<p class="note">R 的 gtsummary::tbl_summary() 一行可以產生。產生之後手算其中一格。</p>
<p class="foot">真實世界運動大數據分析　W07</p>
<aside>主要分組變項以規律運動與否為例。現場用 tbl_summary 產生一張表一，挑一個類別變項的百分比，請學生用 count 手算核對，確認分母是誰。</aside>
