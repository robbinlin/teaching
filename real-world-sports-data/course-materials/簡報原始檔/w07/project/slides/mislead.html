<h2>四種常見的誤導</h2>
<div class="rows">
<div class="row"><p class="k">統計量不對</p><p class="v">軸標籤寫百分比，柱高是人數。第 6 週案例三。</p></div>
<div class="row"><p class="k">截斷的 y 軸</p><p class="v">62% 與 65%，y 軸從 60 開始，看起來差了一倍以上。</p></div>
<div class="row"><p class="k">立體與雙 y 軸</p><p class="v">立體柱的高度難以比較；雙軸的刻度可以調出想要的交叉。</p></div>
<div class="row"><p class="k">只畫平均</p><p class="v">兩組平均差 0.1 分，分布幾乎完全重疊，長條圖看不出來。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W07</p>
<aside>第二項現場示範：同一組比例，y 軸從 0 與從 60 開始各畫一張，並排比較。第四項改畫箱形圖或疊合的密度圖，讓學生看到重疊的程度。</aside>
