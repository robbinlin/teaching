<p class="eyebrow">請 AI 畫圖</p>
<h2>請 AI 畫圖時的三條規則</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">要求它同時輸出圖背後的摘要表。</p></div>
<div class="step"><p class="n">2</p><p class="s">圖上任取一個數字，與表格核對。</p></div>
<div class="step"><p class="n">3</p><p class="s">每張圖配一句話，說明它回答什麼問題。說不出來的圖刪掉。</p></div>
</div>
<p class="foot">真實世界運動大數據分析　W07</p>
<aside>第 1、2 條就是第 6 週檢核清單的第 3 項：每張圖至少有一個數字與表格核對過。第 3 條用來擋掉 AI 一次產生十張圖的情況。</aside>
