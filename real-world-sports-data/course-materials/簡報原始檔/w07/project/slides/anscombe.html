<section id="anscombe" class="stmt" data-transition="fade">
<p class="eyebrow">為什麼先看資料</p>
<p class="say">四組資料，平均、變異數、<br>相關係數、迴歸線幾乎相同。<br>畫出來是四種形狀。</p>
<p class="after">Anscombe（1973）。請 AI 做分析時，先要分布與圖，再要模型。</p>
<p class="foot">真實世界運動大數據分析　W07</p>
<aside>現場用 R 內建的 anscombe 資料畫出四張散布圖，先給學生看四組的摘要統計量，再看圖。摘要統計量相同不代表資料相同。</aside>
</section>
