<h2>日期的月與日，由系統設定決定</h2>
<p class="code">01/02/2019</p>
<div class="rows gap">
<div class="row"><p class="k">兩種讀法</p><p class="v">一月二日，或二月一日。取決於系統設定（SAS 的 DATESTYLE），不取決於資料。</p></div>
<div class="row"><p class="k">讀入後檢查</p><p class="v">最小值與最大值是否在合理範圍。</p></div>
<div class="row"><p class="k">再檢查</p><p class="v">「日」大於 12 的筆數是否合理。全部都不超過 12，月與日很可能讀反了。</p></div>
</div>
