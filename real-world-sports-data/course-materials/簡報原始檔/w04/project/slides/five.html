<section id="five" data-transition="fade">
<p class="eyebrow">審查五問</p>
<h2>每拿到一段清理程式，依序回答五題</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">讀進幾列、幾欄？和編碼簿記載的一致嗎？</p></div>
<div class="step"><p class="n">2</p><p class="s">每一欄的型態對嗎？該是數值的欄位有沒有被讀成文字？</p></div>
<div class="step"><p class="n">3</p><p class="s">遺漏碼處理了哪些欄位？漏了哪些？</p></div>
<div class="step"><p class="n">4</p><p class="s">每一步之後，遺漏值增加幾筆？列數減少幾列？</p></div>
<div class="step"><p class="n">5</p><p class="s">有沒有哪一步在沒有訊息的情況下刪掉資料？</p></div>
</div>
<p class="note">第 4、5 題的答案不在程式裡，在輸出與紀錄檔裡。</p>
<p class="foot">真實世界運動大數據分析　W04</p>
<aside>用剛才的 SAS 程式示範回答第 3 題。然後執行它，打開紀錄檔，示範第 4、5 題要去哪裡找答案。只看程式不看紀錄檔，等於沒有審查。這五題是今天課堂任務的工具，也是期中的基礎。</aside>
</section>
