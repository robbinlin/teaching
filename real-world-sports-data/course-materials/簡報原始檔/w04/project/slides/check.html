<h2>審查清理程式時，五個必做的檢查</h2>
<table class="t">
<tr class="hd"><th style="width:32%">什麼時候</th><th style="width:68%">檢查什麼</th></tr>
<tr><td>讀入之後</td><td>核對列數與欄數</td></tr>
<tr><td>每個轉換步驟前後</td><td>各算一次遺漏數</td></tr>
<tr><td>每個會刪列的步驟前後</td><td>各算一次列數</td></tr>
<tr><td>去重之前</td><td>先列出重複的紀錄</td></tr>
<tr><td>執行完畢</td><td>讀過紀錄檔中的每一則 NOTE 與 WARNING</td></tr>
</table>
<p class="note">把第二、三項的數字逐步記下來，就是第 6 週要學的列數帳。</p>
