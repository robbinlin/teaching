<p class="eyebrow">用 AI 找文獻</p>
<h2>四類文獻工具，各做一件事</h2>
<table class="t">
<tr class="hd"><th style="width:30%">工具</th><th style="width:70%">適合做什麼</th></tr>
<tr><td>Elicit、Consensus</td><td>以研究問題搜尋，回傳論文與摘要整理</td></tr>
<tr><td>Scite</td><td>查一篇論文被後續研究支持還是反駁</td></tr>
<tr><td>PubMed</td><td>確認論文確實存在、書目正確</td></tr>
<tr><td>NotebookLM</td><td>對自己上傳的全文提問，回答附原文位置</td></tr>
</table>
<p class="note">規則只有一條：寫進報告的每一筆引用，自己開過原文，說得出研究設計與主要結果。</p>
<p class="foot">真實世界運動大數據分析　W02</p>
<aside>現場用其中一個工具查「運動社團參與與學生規律運動」，挑一篇結果，打開原文核對 AI 摘要中的樣本數與主要結果。讓學生看到摘要與原文可能不一致。這條規則同時是課綱 AI 使用規範的第五條。</aside>
</section>
