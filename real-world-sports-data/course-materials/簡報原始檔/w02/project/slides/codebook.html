<h2>分析之前，從編碼簿找出六件事</h2>
<table class="t">
<tr class="hd"><th style="width:30%">項目</th><th style="width:70%">要找什麼</th></tr>
<tr><td>母體與抽樣方式</td><td>分層、叢集、權重變項的名稱</td></tr>
<tr><td>題目原文與回溯期間</td><td>問的是「上學期」還是「過去七天」</td></tr>
<tr><td>選項與數值編碼</td><td>每個數字對應哪個選項</td></tr>
<tr><td>遺漏與不適用的編碼</td><td>主資料集為 -1</td></tr>
<tr><td>跳答邏輯</td><td>哪些人不會被問到這一題</td></tr>
<tr><td>衍生變項</td><td>釋出單位已經算好的欄位</td></tr>
</table>
<p class="note">模型看不到編碼簿時，會把 -1 當作數值，把類別代碼當作連續變項。</p>
