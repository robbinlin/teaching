<section id="task" class="task" data-transition="fade">
<p class="eyebrow">課堂任務　60 分鐘</p>
<h2>寫規格、交換執行、比對數字</h2>
<div class="steps">
<div class="step"><p class="n">1</p><p class="s">每組為第 2 週選定的描述性問題寫一頁規格書。（25 分鐘）</p></div>
<div class="step"><p class="n">2</p><p class="s">與另一組交換。拿到別組規格書的組，不可詢問原作者，直接交給 AI 執行。（20 分鐘）</p></div>
<div class="step"><p class="n">3</p><p class="s">兩組比對數字。列出不一致的每一處，回頭在規格書補上缺漏的決定。（15 分鐘）</p></div>
</div>
<p class="note">不能問原作者。規格書沒寫到的，就讓模型自己決定，看它決定了什麼。</p>
<p class="foot">真實世界運動大數據分析　W03</p>
<aside>發下一頁空白規格書範本，期末專案沿用同一格式。交換執行時最常出現的差異是分母，讓學生自己發現，不要先提示。第 3 步請各組把不一致處寫在白板上，全班看有哪些是共同的。</aside>
</section>
