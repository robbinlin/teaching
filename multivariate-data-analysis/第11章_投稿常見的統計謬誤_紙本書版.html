<script>
const BOOK={"file": "第11章_投稿常見的統計謬誤_紙本書版", "caseNo": "11", "title": "第二位審查人", "header": "CASE 11  ·  第二位審查人  ·  Statistical Fallacies", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "FALLACIES", "en": "Reviewing the Numbers Behind a Claim", "tag": "CASE 11 ・ Common Statistical Errors in Manuscripts", "tagline": ["每一個 p 值都小於 .05，", "每一個結論都站不住。"], "summary": "一份投稿宣稱：冷水浸泡能加速大學足球員的賽後恢復，按摩無效，而且多睡一小時就能減少三成傷害。第一位審查人建議直接接受。主編請以安擔任第二位審查人。從表一的描述統計到討論的最後一句，謬誤一個接一個浮出水面。", "conflict": "這份稿件需要的不是更多 p 值，而是<em>正確的問題、正確的檢定、誠實的報告<\/em>。"}, "cast": {"editor": {"name": "戴宛蓉", "role": "《運動科學學報》主編", "look": {"shirt": "#3d5a80", "hair": "#2a2a2a", "hairStyle": "long", "glasses": true, "acc": "clipboard"}, "quips": ["審查人 A 說沒問題，但我不放心。", "我們要的是正確，不是漂亮。", "這些都要寫進方法。"]}, "author": {"name": "魏承澤", "role": "運動防護研究者（通訊作者）", "look": {"shirt": "#a0522d", "hair": "#333333", "acc": "laptop"}, "quips": ["每個 p 值都小於 .05 啊。", "討論是我們最有信心的部分。", "離群值……刪掉不行嗎？"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["先看表一，再看摘要。", "證據不足，不等於證明不存在。", "相關，不等於因果。"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["標準差比平均數還大？", "32 次 t 檢定……", "p = 0.000000000 是什麼意思？"]}}, "acts": [{"key": "第一幕", "title": "表一與摘要", "scene": {"type": "meeting", "cast": ["editor", "hero", "ra"], "screen": {"title": "稿件 SJ-2026-118", "sub": "冷水浸泡加速大學足球員賽後恢復", "lines": ["N ＝ 72（三種恢復方式）", "審查人 A：建議接受", "審查人 B：沈以安", "期限：兩週"]}}, "fig": {"cap": "圖 1.1　主編辦公室", "sub": "戴宛蓉主編把稿件交給以安。白板上寫著稿件編號與第一位審查人的意見。點擊角色，可讀到他們的心聲。"}, "beats": [{"s": "n", "t": "深夜，研究室。這一份檔案的封面寫著：<em>第二位審查人<\/em>。"}, {"s": "n", "t": "《運動科學學報》主編戴宛蓉寄來一份稿件：魏承澤團隊比較三種賽後恢復方式——冷水浸泡、加壓衣與按摩——對大學足球員肌肉痠痛與肌酸激酶（CK）的影響。"}, {"s": "editor", "t": "第一位審查人建議直接接受。可是我總覺得哪裡怪怪的。以安，請你當第二位審查人，從頭看一次。"}, {"s": "ra", "t": "學姊，審稿要從哪裡看起？摘要嗎？"}, {"s": "hero", "t": "從表一。描述統計寫錯的稿子，後面的推論通常也站不穩。"}, {"s": "n", "t": "表一：冷水浸泡組賽後 24 小時 CK = 420 ± 560 U/L。"}, {"s": "ra", "t": "標準差比平均數還大？那平均減一個標準差，不就是負的了？"}, {"type": "viz", "title": "420 ± 560 的樣子", "text": ["每一顆球是一位冷水浸泡組選手的 CK（n ＝ 18）。第一步：大多數人擠在 600 U/L 以下，只有少數人拖出一條長長的右尾，最高 2 150。", "第二步依「420 ± 560」畫出常態曲線：兩成多的面積落在 0 以下，但 CK 不可能為負。第三步標出中位數 310 與平均 420：平均被右尾拉走，中位數與四分位距才描述得了這份資料。"], "model": {"type": "drops", "title": "冷水浸泡組賽後 24 小時 CK", "x": [-1000, 2400], "counts": [0, 0, 0, 0, 0, 6, 7, 3, 0, 0, 1, 0, 0, 0, 0, 1, 0], "dist": {"mu": 420, "sd": 560}, "curve": false, "color": "teal", "xLabel": "CK（U/L）", "steps": [{"cap": "18 位選手：大多擠在 600 以下，右尾很長"}, {"cap": "「420 ± 560」的常態：兩成多落在 0 以下", "curve": true, "shade": {"from": -1000, "to": 0, "label": "不可能的負值", "color": "red"}, "marks": [{"x": 0, "label": "0", "color": "red"}]}, {"cap": "平均被拉走；中位數 310 才是典型值", "curve": true, "marks": [{"x": 310, "label": "中位數", "color": "teal"}, {"x": 420, "label": "平均", "color": "red"}]}]}, "cap": "圖 V1　平均 ± 標準差畫出來的樣子", "sub": "球為冷水浸泡組 18 位選手的 CK，黑線是平均 420、SD 560 的常態曲線；紅色區間為不可能出現的負值（數值為教學示意）。"}, {"type": "choice", "header": "CK 該怎麼描述？", "q": "冷水浸泡組 CK = 420 ± 560 U/L（n = 18）。CK 不可能為負，且有一位選手高達 2 150。你會建議作者怎麼描述？", "opts": [{"t": "維持平均 ± 標準差，這是期刊的慣例。", "good": false, "fb": "平均 ± SD 只在近似常態時有意義：± 1 SD 約含 68% 的資料。420 − 560 是負值，而 CK 不可能為負，代表分布高度右偏，平均與 SD 都被極端值拉走。"}, {"t": "改報中位數與四分位距，並附最小、最大值或箱形圖。", "good": true, "fb": "偏態資料用中位數 [Q1, Q3] 描述：310 [220, 520] U/L。推論時可考慮對數轉換或無母數檢定，並在方法中說明理由。"}, {"t": "刪除 2 150 那位選手，讓標準差變小。", "good": false, "fb": "刪除不利的極端值，是 BMJ「十種作弊法」之一。極端值要先查明是測量錯誤還是真實反應，依事先訂定的規則處理並揭露。"}, {"t": "改報平均 ± 標準誤（SEM），數字比較好看。", "good": false, "fb": "SEM 描述的是平均數估計的精確度，不是資料的變異。用 SEM 取代 SD 讓變異看起來變小，是投稿中常見的誤導。"}]}, {"type": "note", "id": "desc"}, {"s": "n", "t": "摘要寫著：「冷水浸泡（p = .02）與加壓衣（p = .03）顯著降低痠痛，按摩無效（p = .07）；冷水浸泡優於按摩，且效果最顯著。」"}, {"s": "hero", "t": "這一句話裡，至少藏了三個謬誤。先從 p 值本身說起。"}, {"type": "note", "id": "pvalue"}, {"type": "choice", "header": "冷水浸泡優於按摩？", "scene": {"type": "meeting", "cast": ["editor", "hero", "ra"], "screen": {"title": "痠痛 VAS 的平均改變（mm）", "bars": [["冷水浸泡", 20, "−20，p ＝ .02"], ["加壓衣", 1.5, "−1.5，p ＝ .03"], ["按摩", 20, "−20，p ＝ .07"]]}}, "fig": {"cap": "圖 1.2　摘要裡的三個 p 值", "sub": "柱高為痠痛下降的幅度。冷水浸泡與按摩下降得一樣多，加壓衣幾乎沒有下降，三者卻都被用 p 值排了名次。"}, "q": "冷水浸泡：−20 mm，p = .02；按摩：−20 mm，p = .07。作者據此宣稱「冷水浸泡優於按摩，按摩無效」。你的審查意見是？", "opts": [{"t": "同意：一個顯著、一個不顯著，差異很清楚。", "good": false, "fb": "兩組平均改變都是 −20 mm。「與 0 比較」的顯著性不同，不代表兩組之間有差；直接比較冷水浸泡與按摩，差異是 0。"}, {"t": "要求直接檢定兩法之差、報告各組 95% CI；p = .07 不能解讀為無效。", "good": true, "fb": "按摩的 95% CI 為 [−42, 2]，與冷水浸泡的 [−36, −4] 大幅重疊。正確結論：兩者效果相近，按摩的估計較不精確，而不是無效。"}, {"t": "建議改寫成「冷水浸泡的效果更顯著」。", "good": false, "fb": "p 值不能用來排名效果大小。p 值較小，可能只是樣本較大或變異較小。比較效果要看效果量與信賴區間。"}, {"t": "建議按摩組繼續收案，直到 p ＜ .05 為止。", "good": false, "fb": "看結果決定何時停止收案，是 BMJ「作弊法」之一，會讓型一錯誤膨脹。樣本數應事先以檢定力分析決定。"}]}, {"type": "note", "id": "ci"}, {"s": "n", "t": "以安在審查意見寫下第一段，標題是「描述與推論」。"}]}, {"key": "第二幕", "title": "重複的陷阱", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "結果 2：免疫指標", "lines": ["4 項指標 × 4 個時間點", "前後測：獨立樣本 t", "共 32 次 t 檢定", "2 次 p ＜ .05"]}}, "fig": {"cap": "圖 2.1　研究室的第二天", "sub": "以安與柏哲翻到結果的第二部分：一張密密麻麻、標滿星號的表格。"}, "beats": [{"s": "n", "t": "第二天，研究室。以安和柏哲翻到結果的第二部分。"}, {"s": "ra", "t": "他們在運動前、運動後、運動後 20 分鐘與 120 分鐘，測了淋巴細胞數、T 淋巴細胞亞群、B 細胞與 NK 細胞比例。"}, {"s": "hero", "t": "而且同一位選手的前後測，用的是<em>獨立樣本 t 檢定<\/em>。"}, {"s": "ra", "t": "我用附錄裡四位選手的資料試算：獨立 t 的 p = .32，配對 t 的 p = .022。同一份資料，差這麼多？"}, {"type": "note", "id": "paired"}, {"s": "ra", "t": "再來，他們在每個時間點、每項指標都各做一次 t 檢定，總共 32 次，其中 2 次 p ＜ .05。"}, {"type": "viz", "title": "32 次檢定，會中幾次？", "text": ["假設冷水浸泡對免疫指標完全沒有效果（所有 H₀ 為真）。每一顆球是一篇假想的研究，落在哪一格代表它得到幾個 p < .05。第一步每篇做 10 次檢定：約 40% 的研究至少「中」一次（紅球）。", "第二步改成本稿的 32 次：1 − .95³² ≈ .81，八成的研究至少有一個顯著結果，平均 32 × .05 ＝ 1.6 個。本稿的 2 個顯著，正落在純機率最常出現的位置。"], "model": {"type": "drops", "title": "每篇做 10 次檢定", "x": [-0.5, 6.5], "counts": [60, 32, 7, 1, 0, 0, 0], "curve": false, "color": "teal", "xLabel": "顯著的檢定個數", "shade": {"from": 0.5, "to": 6.5, "label": "≥ 1 次：40%", "color": "red"}, "steps": [{"cap": "m ＝ 10：四成研究至少一次偽陽性"}, {"cap": "m ＝ 32：八成研究至少一次，平均 1.6 次", "title": "每篇做 32 次檢定", "counts": [19, 33, 27, 14, 5, 2, 0], "shade": {"from": 0.5, "to": 6.5, "label": "≥ 1 次：81%", "color": "red"}, "marks": [{"x": 2, "label": "本稿 2 次", "color": "ink"}]}]}, "cap": "圖 V2　虛無假設下的「顯著」", "sub": "100 篇假想研究，每篇做 m 次獨立的 α ＝ .05 檢定；紅球為至少出現一次偽陽性的研究（依二項分布計算）。"}, {"type": "choice", "header": "32 次 t 檢定", "q": "4 項免疫指標 × 4 個時間點 × 2 組，作者做了 32 次 t 檢定，2 次 p ＜ .05，宣稱「冷水浸泡提升 NK 細胞」。你的建議是？", "opts": [{"t": "接受：有兩個顯著結果，證據充分。", "good": false, "fb": "32 次 α = .05 的檢定，即使所有虛無假設都為真，也預期約有 1.6 次顯著。兩個顯著結果，和純機率幾乎無法區分。"}, {"t": "事先指定主要指標，以重複測量模型分析；其餘列為探索性並校正。", "good": true, "fb": "把多個時間點放進同一個模型，以組別 × 時間交互作用檢定「兩組的變化型態是否不同」，追蹤檢定再用 Bonferroni 或 Holm 校正。探索性分析可以做，但要誠實標示。"}, {"t": "只報告那 2 個顯著結果，讓文章更聚焦。", "good": false, "fb": "只報顯著結果、隱藏其餘 30 次檢定，就是「資料挖掘」（data dredging），讀者完全無法評估偽陽性的風險。"}, {"t": "把 α 放寬到 .10，避免漏掉真正的效果。", "good": false, "fb": "放寬 α 只會讓偽陽性更多。要避免漏掉真效果，應在設計階段做檢定力分析、增加樣本，而不是事後調整門檻。"}]}, {"type": "note", "id": "multiple"}, {"s": "n", "t": "下一頁是性別的次群分析。"}, {"s": "ra", "t": "二因子 ANOVA：性別 × 恢復方式交互作用 F(2, 66) = 1.10，p = .34。可是討論裡寫：「冷水浸泡只對女性有效。」"}, {"type": "viz", "title": "女性顯著，男性不顯著", "text": ["作者分別在女性與男性做檢定。第一步：女性冷水浸泡的痠痛改變 −24 mm，95% CI [−41, −7]，不含 0，p ＝ .01。第二步：男性 −18 mm，CI [−48, 12] 跨過 0，p ＝ .21。", "第三步才回答「效果是否因性別而不同」：兩性之差只有 −6 mm，CI [−37, 25] 大幅跨過 0，與交互作用檢定（p ＝ .34）的結論一致。男性的 CI 較寬，只是估計較不精確。"], "model": {"type": "boxes", "title": "冷水浸泡的痠痛改變（mm）", "ymin": -55, "ymax": 30, "yLabel": "mm", "refs": [{"value": 0, "label": "0", "color": "red"}], "groups": [{"label": "女性", "stats": [-41, -41, -24, -7, -7], "mean": -24, "color": "teal"}, {"label": "男性", "stats": [-48, -48, -18, 12, 12], "mean": -18, "color": "gold"}, {"label": "兩性之差", "stats": [-37, -37, -6, 25, 25], "mean": -6, "color": "purple"}], "steps": [{"cap": "女性：CI 不含 0 → p ＝ .01", "groups": [{"label": "女性", "stats": [-41, -41, -24, -7, -7], "mean": -24, "color": "teal"}]}, {"cap": "男性：CI 跨過 0 → p ＝ .21", "groups": [{"label": "女性", "stats": [-41, -41, -24, -7, -7], "mean": -24, "color": "teal"}, {"label": "男性", "stats": [-48, -48, -18, 12, 12], "mean": -18, "color": "gold"}]}, {"cap": "兩性之差：−6，CI 大幅跨過 0"}]}, "cap": "圖 V3　分組檢定 vs 直接比較", "sub": "方塊從下緣到上緣為 95% CI，中線為平均改變，紅線為 0（數值為教學示意）。"}, {"type": "choice", "header": "只對女性有效？", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "二因子 ANOVA 摘要", "lines": ["性別：F(1, 66) ＝ 4.92，p ＝ .03", "恢復方式：F(2, 66) ＝ 4.21，p ＝ .02", "交互作用：F(2, 66) ＝ 1.10，p ＝ .34", "討論：「只對女性有效」"]}}, "fig": {"cap": "圖 2.2　ANOVA 摘要表與討論段落", "sub": "三個檢定結果寫在同一張表上，討論卻只引用了分組後的兩個 p 值。"}, "q": "性別 × 恢復方式交互作用 F(2, 66) = 1.10，p = .34。作者卻寫「冷水浸泡只對女性有效（女性 p = .01，男性 p = .21）」。你的意見是？", "opts": [{"t": "同意：女性顯著、男性不顯著，就是只對女性有效。", "good": false, "fb": "這是「顯著與不顯著的差，不一定顯著」的另一個版本。要宣稱效果因性別而不同，該看的正是交互作用，而它不顯著。"}, {"t": "交互作用不顯著，不能宣稱效果因性別而異；應解釋主效果。", "good": true, "fb": "交互作用不顯著時，不能把分組結果寫成差異化的效果。若性別差異是重要問題，應事先規劃、確保足夠的檢定力，並報告交互作用的效果量與 CI。"}, {"t": "建議刪掉男性資料，只分析女性。", "good": false, "fb": "事後只挑表現好的子群分析，是 BMJ「作弊法」之一：結果不如預期時，就去找某個「有效」的子群。"}, {"t": "p = .34 很接近顯著，可以視為有交互作用。", "good": false, "fb": "p = .34 一點都不接近 .05。即使真的接近，也只能說證據不足，不能當成顯著來解釋。"}]}, {"type": "note", "id": "interaction"}, {"s": "n", "t": "以安在審查意見寫下第二段：「重複測量、多重檢定與交互作用」。"}]}, {"key": "第三幕", "title": "最後一段討論", "scene": {"type": "meeting", "cast": ["editor", "author", "hero", "ra"], "screen": {"title": "討論與結論", "lines": ["睡眠時數 vs 傷害：r ＝ −.48", "p ＝ 0.000000000", "線上問卷：312 位自願填答", "「多睡 1 小時，傷害少 30%」"]}}, "fig": {"cap": "圖 3.1　線上審稿會議", "sub": "主編請作者魏承澤一起說明。白板上是稿件的最後一段討論，也是作者最有信心的部分。"}, "beats": [{"s": "n", "t": "一週後，主編召開審稿會議，通訊作者魏承澤也受邀說明。"}, {"s": "author", "t": "討論是我們最有信心的部分。312 位選手的線上問卷顯示，睡眠時數與一季的傷害次數相關 r = −.48，p = 0.000000000。"}, {"s": "author", "t": "所以我們建議：每晚多睡一小時，就能減少 30% 的運動傷害。"}, {"s": "ra", "t": "（小聲）p 值寫到小數點後九位……"}, {"s": "hero", "t": "精確度是小問題：寫 p ＜ .001 就夠了。真正的問題是：<em>相關，不等於因果<\/em>。"}, {"type": "viz", "title": "睡眠與傷害：分組再看", "text": ["第一步把所有選手畫在一起：睡得越多，傷害越少，迴歸線明顯向下，斜率約 −.70。這就是作者看到的相關。", "第二步依訓練負荷把選手分成三組：高負荷的選手睡得少、傷得多，低負荷的相反；但在每一組<em>內部<\/em>，睡眠與傷害幾乎無關，三條線的斜率都只有 −.05。整體的負斜率，大半來自訓練負荷這個潛藏變項。"], "model": {"type": "fit", "title": "睡眠時數與一季傷害次數", "xLabel": "睡眠（時）", "yLabel": "傷害次數", "showSlope": true, "x": [5, 9.5], "y": [0, 4.5], "overall": "合併", "groups": [{"label": "高負荷", "color": "red", "points": [[5.4, 3.66], [5.65, 2.2], [5.9, 3.34], [6.15, 4.08], [6.4, 2.72], [6.65, 3.06], [6.9, 4.0], [7.15, 2.54]]}, {"label": "中負荷", "color": "gold", "points": [[6.3, 2.66], [6.55, 1.2], [6.8, 2.34], [7.05, 3.08], [7.3, 1.72], [7.55, 2.06], [7.8, 3.0], [8.05, 1.54]]}, {"label": "低負荷", "color": "teal", "points": [[7.3, 1.66], [7.55, 0.2], [7.8, 1.34], [8.05, 2.08], [8.3, 0.72], [8.55, 1.06], [8.8, 2.0], [9.05, 0.54]]}], "steps": [{"cap": "全部選手：睡越多、傷越少", "overall": false, "groups": [{"label": "全部", "color": "ink", "points": [[5.4, 3.66], [5.65, 2.2], [5.9, 3.34], [6.15, 4.08], [6.4, 2.72], [6.65, 3.06], [6.9, 4.0], [7.15, 2.54], [6.3, 2.66], [6.55, 1.2], [6.8, 2.34], [7.05, 3.08], [7.3, 1.72], [7.55, 2.06], [7.8, 3.0], [8.05, 1.54], [7.3, 1.66], [7.55, 0.2], [7.8, 1.34], [8.05, 2.08], [8.3, 0.72], [8.55, 1.06], [8.8, 2.0], [9.05, 0.54]]}]}, {"cap": "依訓練負荷分組：組內斜率幾乎為 0"}]}, "cap": "圖 V4　潛藏變項製造的斜率", "sub": "橫軸為每晚睡眠時數，縱軸為一季傷害次數；紅、黃、綠為訓練負荷高、中、低三組，黑線為忽略分組的合併迴歸（數值為教學示意）。"}, {"type": "choice", "header": "多睡一小時？", "q": "線上問卷 312 位選手：睡眠時數與一季傷害次數 r = −.48。作者建議「每晚多睡 1 小時可減少 30% 傷害」。你的意見是？", "opts": [{"t": "同意：r = −.48 且 p 極小，證據很強。", "good": false, "fb": "p 值很小，只代表相關不太可能為 0，不代表因果。訓練負荷、賽程密度等潛藏變項，可能同時影響睡眠與傷害。"}, {"t": "改寫為相關描述、討論潛藏變項；因果宣稱需實驗或縱貫設計。", "good": true, "fb": "橫斷面相關只能支持「睡眠較少的選手，傷害較多」。要支持介入建議，需要控制訓練負荷的縱貫資料，或隨機分派的睡眠延長實驗。"}, {"t": "改用迴歸分析，迴歸係數就代表因果。", "good": false, "fb": "迴歸只是換一種方式描述相關。沒有設計上的控制，迴歸係數一樣不能解讀為因果效果。"}, {"t": "樣本有 312 人，代表性足夠，可推論到所有選手。", "good": false, "fb": "樣本大小無法彌補選樣偏差。自願填答的線上問卷可能只收到特定類型的選手，1936 年《文學文摘》的失敗就是例子。"}]}, {"type": "note", "id": "causal"}, {"s": "editor", "t": "那 312 位的問卷呢？樣本數不小了。"}, {"s": "hero", "t": "樣本大不代表有代表性。1936 年《文學文摘》回收了 240 萬份問卷，還是把總統選舉預測錯了。"}, {"s": "ra", "t": "還有圖二：一張 3D 長條圖，y 軸從 90 開始畫，三組看起來差了兩倍。"}, {"type": "viz", "title": "截斷 y 軸的魔術", "text": ["第一步模仿稿件的圖二：y 軸從 90 開始，柱子只畫出 90 以上的部分（1.8、2.8、3.7），最高的一組看起來是最低一組的兩倍。", "第二步把 y 軸還原到 0：三組其實是 91.8、92.8、93.7，最大差距約 2%，幾乎一樣高。截斷座標軸與 3D 透視都會放大差異；若非截斷不可，至少要清楚標出斷軸。"], "model": {"type": "columns", "title": "y 軸從 0 開始", "values": [91.8, 92.8, 93.7], "labels": ["組 1", "組 2", "組 3"], "highlight": 3, "yLabel": "指標", "showValues": true, "connect": false, "steps": [{"cap": "從 90 起畫：看起來差了兩倍", "title": "y 軸從 90 開始", "values": [1.8, 2.8, 3.7], "yLabel": "指標 − 90", "markIndex": 2}, {"cap": "從 0 起畫：差距只有約 2%"}]}, "cap": "圖 V5　同一份資料，兩種畫法", "sub": "兩個步驟是同樣的三個平均數，只差在 y 軸從哪裡開始（數值為教學示意）。"}, {"s": "hero", "t": "截斷座標軸會把 2% 的差異畫成兩倍高。圖表應該支持資料的訊息，而不是放大它。"}, {"type": "note", "id": "sample"}, {"s": "author", "t": "我承認……有三位選手的 CK 被我們當成離群值刪掉了。按摩組原本預計收 24 人，看到結果不顯著，就停止收案了。"}, {"s": "editor", "t": "這些都要寫進方法，讀者才能判斷結果的可信度。"}, {"type": "choice", "header": "給主編的建議", "q": "綜合所有問題，你會給主編什麼審查建議？", "opts": [{"t": "接受：主要 p 值都小於 .05。", "good": false, "fb": "本稿的 p 值多來自錯誤的檢定、未校正的多重比較，或對交互作用的誤讀。p ＜ .05 不能為錯誤的分析背書。"}, {"t": "大幅修改：依意見重新分析，揭露所有分析與排除的資料後再審。", "good": true, "fb": "資料本身有價值，錯誤多可修正：正確描述偏態資料、使用配對與重複測量模型、校正多重比較、報告 CI、收斂因果宣稱，並揭露資料排除與停止收案。"}, {"t": "拒絕：統計錯誤太多，資料毫無價值。", "good": false, "fb": "錯誤在分析與詮釋，不在資料本身。審查的目的是讓好的資料得到正確的分析，而不是懲罰作者。"}, {"t": "小幅修改：把 p 值改成三位小數即可。", "good": false, "fb": "報告精確度只是最表面的問題。描述、推論、設計與詮釋上的錯誤都必須處理。"}]}, {"s": "n", "t": "會議結束後，以安送出了十二頁的審查意見。最後一句是：「本研究的資料值得一個更誠實的分析。」"}]}], "notes": {"desc": {"no": 1, "t": "描述統計的誤用", "blocks": [{"type": "h", "t": "平均與標準差的前提"}, {"type": "p", "t": "常態分布下，約 68% 的值落在平均 ± 1 SD、95% 落在 ± 2 SD、99% 落在 ± 3 SD。分布明顯偏斜時，這些關係不再成立，平均與 SD 也無法傳達分布的形狀。"}, {"type": "h", "t": "一個極端值的威力"}, {"type": "p", "t": "資料 1、2、3、4、5：平均 3、中位數 3、SD 1.58。把 5 換成 500：平均變成 102、SD 變成 222.49，但中位數仍是 3、四分位距仍是 2。"}, {"type": "h", "t": "建議做法"}, {"type": "bullet", "t": "偏態或小樣本：報告中位數與四分位距（或最小、最大值）。"}, {"type": "bullet", "t": "近似常態：報告平均 ± SD，而不是 ± SEM。"}, {"type": "bullet", "t": "CK、乳酸、免疫細胞數等生理指標常為右偏，報告前先畫圖。"}], "fig": {"model": {"type": "boxes", "title": "賽後 24 小時 CK", "groups": [{"label": "冷水浸泡", "stats": [140, 220, 310, 520, 1100], "mean": 420, "outliers": [2150], "color": "teal"}, {"label": "加壓衣", "stats": [150, 240, 340, 560, 1180], "mean": 445, "outliers": [1980], "color": "gold"}, {"label": "按摩", "stats": [160, 250, 360, 600, 1250], "mean": 470, "outliers": [1900], "color": "purple"}], "yLabel": "U/L", "steps": [{"cap": "冷水浸泡：平均 420 被極端值往上拉", "groups": [{"label": "冷水浸泡", "stats": [140, 220, 310, 520, 1100], "mean": 420, "outliers": [2150], "color": "teal"}]}, {"cap": "三組都右偏：用中位數與四分位距描述"}]}, "cap": "圖 N1　右偏的肌酸激酶", "sub": "箱形為中位數與四分位距，點為平均數，最上方的單點為極端值。平均數被少數高值往上拉（數值為教學示意）。", "points": ["SD 大於平均、而數值又不可能為負：分布多半右偏。", "描述統計是讀者理解資料的第一扇窗，別讓它起霧。"]}}, "pvalue": {"no": 2, "t": "p 值到底是什麼？", "blocks": [{"type": "h", "t": "定義"}, {"type": "p", "t": "在虛無假設為真的前提下，得到和觀察值一樣極端、或更極端結果的機率；也就是檢定統計量外側尾端的面積。"}, {"type": "h", "t": "三個常見誤讀"}, {"type": "bullet", "t": "「p = .02 比 p = .03 更顯著」：p 值同時受效果大小與樣本數影響，不能拿來排名效果。"}, {"type": "bullet", "t": "「p = .02，證明 H₁ 為真」：p 值不是任何假設為真的機率。"}, {"type": "bullet", "t": "「p = .07，所以無效」：<em>證據不足，不等於證明不存在<\/em>。是「無效」，還是「無法證明有效」？"}, {"type": "h", "t": "顯著與不顯著的差，不一定顯著"}, {"type": "p", "t": "冷水浸泡與 0 有差、按摩與 0 沒差，不代表冷水浸泡與按摩有差：兩者平均都是 −20 mm。要比較兩種方法，必須直接檢定兩者的差。"}], "fig": {"model": {"type": "curves", "title": "虛無假設下的 t 分布", "x": [-4, 4], "curves": [{"type": "normal", "mu": 0, "sd": 1, "label": "H₀", "color": "gray"}], "xLabel": "t", "yLabel": "密度", "steps": [{"cap": "虛無假設為真時，t 值的分布"}, {"cap": "觀察到 t ＝ 2.50：右尾面積 ≈ .01，雙尾 p ≈ .02", "shade": {"curve": 0, "from": 2.5, "to": 4, "label": "p/2 ≈ .01", "color": "red"}, "marks": [{"x": 2.5, "label": "t ＝ 2.50", "color": "ink"}]}]}, "cap": "圖 N2　p 值是尾端的面積", "sub": "曲線為虛無假設下的 t 分布（以常態近似）。冷水浸泡的 t(17) = 2.50，超過臨界值 2.11；右尾紅色面積加上左尾對稱面積，就是 p ≈ .02。", "points": ["p 值回答「若 H₀ 為真，資料有多罕見」。", "它不回答「效果有多大」，也不回答「H₀ 為真的機率」。"]}}, "ci": {"no": 3, "t": "信賴區間與實務意義", "blocks": [{"type": "h", "t": "只報 p 值不夠"}, {"type": "p", "t": "p 值只回答「是否不太可能為 0」。信賴區間同時告訴我們效果的方向、大小與精確度：區間下限若幾乎貼著 0，即使 p ＜ .05，真正的效果也可能小到沒有意義。"}, {"type": "h", "t": "統計顯著 vs 實務重要"}, {"type": "p", "t": "加壓衣：−1.5 mm，95% CI [−2.8, −0.2]，p = .03。統計上顯著，卻遠小於痠痛量表的最小臨床重要差異（約 13 mm）。大樣本中的微小差異可以非常顯著，卻毫無實務意義。"}, {"type": "p", "t": "反過來，小樣本中的大差異可能不顯著卻很重要。下「沒有效果」的結論之前，先看檢定力與信賴區間：區間若同時涵蓋 0 與重要的效果，代表我們<em>還不知道<\/em>。"}], "fig": {"model": {"type": "boxes", "title": "痠痛平均改變的 95% CI", "ymin": -45, "ymax": 5, "groups": [{"label": "冷水浸泡", "stats": [-36, -36, -20, -4, -4], "mean": -20, "color": "teal"}, {"label": "加壓衣", "stats": [-2.8, -2.8, -1.5, -0.2, -0.2], "mean": -1.5, "color": "gold"}, {"label": "按摩", "stats": [-42, -42, -20, 2, 2], "mean": -20, "color": "purple"}], "yLabel": "mm", "steps": [{"cap": "冷水 vs 按摩：平均都是 −20，CI 大幅重疊", "groups": [{"label": "冷水浸泡", "stats": [-36, -36, -20, -4, -4], "mean": -20, "color": "teal"}, {"label": "按摩", "stats": [-42, -42, -20, 2, 2], "mean": -20, "color": "purple"}], "refs": [{"value": 0, "label": "0", "color": "ink"}]}, {"cap": "加壓衣：顯著，但遠小於臨床重要差異", "refs": [{"value": 0, "label": "0", "color": "ink"}, {"value": -13, "label": "MCID −13", "color": "red"}]}]}, "cap": "圖 N3　三種恢復方式的效果與 95% CI", "sub": "每個方塊從下緣到上緣就是一組的 95% CI，中線與點為平均改變。冷水浸泡與按摩的區間大幅重疊；加壓衣的區間很窄，卻離最小臨床重要差異（−13 mm）很遠（數值為教學示意）。", "points": ["加壓衣：顯著，但不重要。", "按摩：不顯著，但不能說無效。", "效果量＋95% CI＋p 值，三者缺一不可。"]}}, "paired": {"no": 4, "t": "被忽略的配對", "blocks": [{"type": "h", "t": "同一個人，不是兩個人"}, {"type": "p", "t": "重複測量來自同一個人，彼此不獨立，不能用獨立樣本的方法分析。講義的例子：四位受試者的前後測。"}, {"type": "formula", "t": "差異 18、10、6、10：d̄ ＝ 11，s_d ＝ 5.03"}, {"type": "bullet", "t": "獨立 t：差 11，95% CI [−14.1, 36.1]，p = .32。"}, {"type": "bullet", "t": "配對 t：t(3) = 4.37，95% CI [3.0, 19.0]，p = .022。"}, {"type": "p", "t": "同樣的平均差，獨立 t 把人與人之間的差異（56 到 90）全算成誤差；配對 t 只看每個人自己的改變，而四個人全都上升。"}, {"type": "h", "t": "審稿時怎麼發現？"}, {"type": "p", "t": "看自由度：四個人做配對 t，df 應為 3；若寫成 df = 6，就是被當成兩組獨立樣本了。也可檢查方法是否提到「同一受試者」卻用了獨立樣本檢定。"}], "fig": {"model": {"type": "lines", "title": "四位受試者的前後測", "xLabels": ["前測", "後測"], "series": [{"label": "1", "values": [60, 78], "color": "teal"}, {"label": "2", "values": [56, 66], "color": "blue"}, {"label": "3", "values": [90, 96], "color": "gold"}, {"label": "4", "values": [78, 88], "color": "purple"}], "ymin": 50, "ymax": 100, "yLabel": "分數", "steps": [{"cap": "兩群人的平均：71 → 82，差 11", "series": [{"label": "平均", "values": [71, 82], "color": "red"}]}, {"cap": "每個人自己：四條線全部往上"}]}, "cap": "圖 N4　四條線全部往上", "sub": "每條線是一位受試者的前後測。人與人之間差很多，但每個人自己的改變方向一致：這正是配對設計要抓住的訊號（資料取自講義範例）。", "points": ["獨立 t 問：兩群人平均不同嗎？配對 t 問：每個人變了嗎？", "超過兩個時間點時，改用重複測量 ANOVA 或混合模型。"]}}, "multiple": {"no": 5, "t": "多重檢定的代價", "blocks": [{"type": "h", "t": "檢定越多，偽陽性越多"}, {"type": "formula", "t": "α_FW ＝ 1 − (1 − .05)ᵐ"}, {"type": "p", "t": "7 組兩兩比較共有 21 對，整體型一錯誤率約 .66；32 次檢定約 .81，預期約 1.6 次偽陽性。"}, {"type": "h", "t": "多重檢定常藏在這些地方"}, {"type": "bullet", "t": "逐一檢定基線特徵，想證明兩組「相等」。"}, {"type": "bullet", "t": "三組以上的兩兩比較；同一組解釋變項的多個結果指標。"}, {"type": "bullet", "t": "未事先規劃的次群分析、期中分析，以及每個時間點各比一次。"}, {"type": "h", "t": "怎麼處理"}, {"type": "p", "t": "事先指定主要結果；用整體模型（ANOVA、MANOVA、重複測量模型）取代逐一檢定；必要時以 Bonferroni（α ÷ m）或 Holm 校正。探索性分析要明白標示為探索性。"}], "fig": {"model": {"type": "columns", "title": "做 m 次檢定，至少一次偽陽性", "values": [0.05, 0.143, 0.265, 0.401, 0.537, 0.659, 0.806], "labels": ["1", "3", "6", "10", "15", "21", "32"], "highlight": 0, "markIndex": 6, "plane": {"value": 0.05, "label": "α ＝ .05", "color": "teal"}, "notes": [{"text": "紅柱：本稿 32 次", "at": 2, "color": "red"}], "yLabel": "α_FW", "showValues": true, "steps": [{"cap": "檢定 1、3、6 次：偽陽性機率快速上升", "values": [0.05, 0.143, 0.265], "labels": ["1", "3", "6"], "markIndex": -1, "notes": []}, {"cap": "本稿 32 次：至少一次偽陽性 ≈ .81"}]}, "cap": "圖 N5　檢定次數與整體型一錯誤", "sub": "橫軸是檢定次數 m（假設彼此獨立），柱高是至少一次偽陽性的機率；綠色平面為 α = .05。紅柱是本稿的 32 次 t 檢定。", "points": ["顯著結果的個數，要和預期偽陽性數 m × α 比較。", "資料挖掘：不揭露地算很多 p 值，只報顯著的那幾個。"]}}, "interaction": {"no": 6, "t": "交互作用的正確解讀", "blocks": [{"type": "h", "t": "二因子 ANOVA 的三個問題"}, {"type": "bullet", "t": "性別有沒有主效果？"}, {"type": "bullet", "t": "恢復方式有沒有主效果？"}, {"type": "bullet", "t": "性別 × 恢復方式有沒有交互作用？"}, {"type": "p", "t": "交互作用問的是：恢復方式的效果，是否<em>因性別而不同<\/em>。在剖面圖上，交互作用就是線條不平行的程度。"}, {"type": "h", "t": "常見錯誤"}, {"type": "p", "t": "交互作用不顯著，卻在討論中寫「某處理只在某一組有效」。分別在女性、男性做檢定，一個顯著、一個不顯著，並不等於兩組的效果有差：人數較少的一組，檢定力本來就較低。"}, {"type": "p", "t": "交互作用顯著時則相反：主效果可能誤導，應改做簡單主效果分析，描述各組內的效果。"}], "fig": {"model": {"type": "lines", "title": "性別 × 恢復方式", "xLabels": ["冷水浸泡", "加壓衣", "按摩"], "series": [{"label": "女性", "values": [-24, -4, -19], "color": "teal"}, {"label": "男性", "values": [-18, -1, -15], "color": "gold"}], "ymin": -30, "ymax": 0, "yLabel": "痠痛改變（mm）", "steps": [{"cap": "女性：三種恢復方式的痠痛改變", "series": [{"label": "女性", "values": [-24, -4, -19], "color": "teal"}]}, {"cap": "加上男性：兩條線幾乎平行（p ＝ .34）"}]}, "cap": "圖 N6　兩條線大致平行", "sub": "女性（綠）與男性（黃）在三種恢復方式的痠痛平均改變。兩條線幾乎平行（交互作用 p = .34），差異主要是整體水準不同（數值為教學示意）。", "points": ["交互作用看「線是否平行」，不是看「哪一組顯著」。", "分組檢定的顯著與否，混入了各組樣本數的差異。"]}}, "causal": {"no": 7, "t": "相關不等於因果", "blocks": [{"type": "h", "t": "潛藏變項"}, {"type": "p", "t": "講義的例子：鞋子尺寸與閱讀成績相關（背後是年齡）、冰淇淋銷量與溺水人數相關（背後是氣溫）、開燈睡覺與近視相關。兩個變項一起變動，可能是第三個變項同時影響了它們。"}, {"type": "p", "t": "本稿中，<em>訓練負荷與賽程密度<\/em>可能同時壓縮睡眠、提高傷害風險。"}, {"type": "h", "t": "宣稱因果需要什麼？"}, {"type": "bullet", "t": "時間順序：原因發生在結果之前。"}, {"type": "bullet", "t": "排除其他解釋：隨機分派，或在設計與分析中控制混淆變項。"}, {"type": "bullet", "t": "一致性與劑量反應：在不同樣本中重複出現。"}, {"type": "p", "t": "橫斷面問卷的 r = −.48，只能寫成「睡眠較少的選手，傷害較多」，不能寫成「多睡就能減少傷害」。"}], "fig": {"model": {"type": "paths", "title": "相關背後的第三個變項", "nodes": [{"id": "L", "label": "訓練負荷", "kind": "lat", "x": -0.4, "y": 0.85}, {"id": "G", "label": "賽程密度", "kind": "lat", "x": 0.4, "y": 0.85}, {"id": "S", "label": "睡眠", "x": -0.65, "y": 0.2}, {"id": "I", "label": "傷害", "x": 0.65, "y": 0.2}], "edges": [{"from": "L", "to": "S", "color": "red", "label": "−"}, {"from": "L", "to": "I", "color": "red"}, {"from": "G", "to": "S", "color": "red"}, {"from": "G", "to": "I", "color": "red", "label": "＋"}, {"from": "S", "to": "I", "double": true, "color": "gray", "label": "r ＝ −.48"}], "steps": [{"cap": "觀察到的：睡眠與傷害 r ＝ −.48", "nodes": [{"id": "S", "label": "睡眠", "x": -0.65, "y": 0.2}, {"id": "I", "label": "傷害", "x": 0.65, "y": 0.2}], "edges": [{"from": "S", "to": "I", "double": true, "color": "gray", "label": "r ＝ −.48"}]}, {"cap": "另一種解釋：負荷與賽程同時影響兩者"}]}, "cap": "圖 N7　相關背後的第三個變項", "sub": "方塊為測得的變項，紅球為未測量的潛藏變項。灰色弧線是觀察到的相關；紅色箭頭是另一種同樣能產生這個相關的解釋。", "points": ["相關可以用來預測，不能直接拿來介入。", "「多睡一小時減少 30% 傷害」是因果宣稱，需要實驗證據。"]}}, "sample": {"no": 8, "t": "代表性與研究者自由度", "blocks": [{"type": "h", "t": "樣本大不等於樣本好"}, {"type": "p", "t": "1936 年《文學文摘》從電話簿、俱樂部名冊與雜誌訂戶寄出上千萬份問卷，回收約 240 萬份，預測 Landon 對 Roosevelt 為 57：43，實際結果是 38：62。問題出在<em>選樣偏差<\/em>與<em>無反應偏差<\/em>。"}, {"type": "h", "t": "BMJ「十種作弊法」節錄"}, {"type": "bullet", "t": "刪掉不利的離群值，保留有利的。"}, {"type": "bullet", "t": "忽略退出者，只分析完全配合的人。"}, {"type": "bullet", "t": "看到顯著就提早結束，接近顯著就延長收案。"}, {"type": "bullet", "t": "結果不如預期，就找有效的子群，或換一種檢定。"}, {"type": "h", "t": "報告與圖表也要誠實"}, {"type": "p", "t": "p ＜ .001 即可，不必寫 p = 0.000000000；體重寫 60 kg 而非 60.18 kg。圖表不要截斷座標軸或用 3D 效果誇大差異。"}], "fig": {"model": {"type": "bars", "title": "1936 年總統選舉（%）", "rows": [["預測 L", 57, "gray"], ["實際 L", 38, "red"], ["預測 R", 43, "gray"], ["實際 R", 62, "teal"]], "max": 70}, "cap": "圖 N8　240 萬份問卷的失敗", "sub": "L 為 Landon，R 為 Roosevelt。灰柱是《文學文摘》的預測，紅、綠柱是實際得票率。樣本再大，選樣偏差也不會自己消失。", "points": ["先問樣本從哪裡來，再問樣本有多大。", "每一個分析決定都要事先規劃，或誠實揭露。"]}}}, "ending": {"title": "第二位審查人：結案", "paragraphs": ["三個月後，修改稿寄回來了。CK 改以中位數與四分位距描述；免疫指標改用組別 × 時間的混合模型，主要結果事先指定；摘要不再為三種恢復方式排名，而是並列效果量與 95% CI。", "「只對女性有效」與「多睡一小時減少 30% 傷害」從結論中刪除，被刪掉的三位選手與提早停止收案的經過寫進了方法。結論變得保守，卻第一次經得起檢驗。"], "takeaway": "統計謬誤很少是計算錯誤，多半是問錯了問題：把配對當獨立、把不顯著當無效、把相關當因果、把很多 p 值當很多發現。審稿人的工作，是把問題問回正確的位置。", "verdict": ["審查意見被主編全文採納：你看穿了每一個謬誤。修改稿順利刊登。", "審查意見大致中肯，但有幾個謬誤溜過了審查，留在已刊登的論文裡。", "稿件以原樣刊登：多數謬誤沒有被指出，結論將在下一篇文獻回顧中被質疑。"]}};

  const tex=canvasTex(2048,Math.max(64,Math.round(2048*h/w)),(g,cw,ch)=>{g.scale(2,2);cw/=2;ch/=2;g.fillStyle='#efe6d0';g.fillRect(0,0,cw,ch);for(let i=0;i<2500;i++){g.fillStyle=`rgba(120,90,50,${Math.random()*0.08})`;g.fillRect(Math.random()*cw,Math.random()*ch,2,1);}const gr=g.createLinearGradient(0,0,0,70);gr.addColorStop(0,'rgba(60,40,20,.25)');gr.addColorStop(1,'rgba(60,40,20,0)');g.fillStyle=gr;g.fillRect(0,0,cw,70);g.strokeStyle='rgba(60,40,20,.35)';g.lineWidth=2;g.setLineDash([10,8]);g.strokeRect(14,14,cw-28,ch-28);g.setLineDash([]);
    g.fillStyle=INK;g.textAlign='center';g.font='bold 44px '+FONT;g.fillText('掀開紙片，看回饋',cw/2,ch/2+6);g.font='bold 26px '+FONT;g.fillStyle=INK2;g.fillText('LIFT THE FLAP',cw/2,ch/2+52);});
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pageMat(tex));front.rotation.x=-Math.PI/2;front.position.z=h/2;front.castShadow=true;pivot.add(front);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xe6dcc4,roughness:.95}));back.rotation.x=Math.PI/2;back.position.set(0,-0.001,h/2);pivot.add(back);
  pivot.userData={type:'flap'};pivot.scale.setScalar(0.001);book.add(pivot);gsap.to(pivot.scale,{x:1,y:1,z:1,duration:0.8,ease:'elastic.out(1,0.55)'});AUDIO.pop(2);return pivot;}

/* ===================== State machine ===================== */
const ACTS=arr(B.acts);
const S={state:'TITLE',busy:false,act:0,beat:0,sceneGroup:null,chars:{},choice:null,picked:null,scene:null,onNote:false,pendingTurn:false};
window.S=S;
const chapTxt=document.getElementById('chapTxt');document.getElementById('chapKey').textContent=B.caseNo?'CASE '+B.caseNo:(B.short||'BOOK');
async function locked(fn){if(S.busy)return;S.busy=true;try{await fn();}catch(e){console.error(e);}finally{S.busy=false;}}
function buildScene(spec){const g=new THREE.Group();if(spec&&('model' in spec)){if(spec.model){const st=arr(spec.model.steps);const base=Object.assign({},spec.model);delete base.steps;const h=modelHolder(st.length?Object.assign({},base,st[0]):base,0);g.add(h);if(st.length>1)g.userData.steps={base,list:st,i:0,holder:h,hold:num(spec.model.stepHold,2.6)};}const TL=num(spec.model&&spec.model.tilt,-0.62);g.rotation.x=TL;g.position.y=0.36;g.position.z=0.26;g.scale.setScalar(1.06);if(spec.compact){g.scale.setScalar(0.9);g.position.z=-0.3;g.position.y=0.34;}S.chars={};}else{S.chars=buildStory(g,spec);g.rotation.x=num(spec&&spec.tilt,-0.42);g.scale.setScalar(0.8);g.position.y=0.5;g.position.z=0.22;}anchor.add(g);S.sceneGroup=g;g.traverse(o=>{if(o.userData.type==='char')o.userData.baseY=o.position.y;});g.children.forEach(c=>{c.userData.bs=c.scale.x;c.scale.setScalar(0.001);});
  return new Promise(res=>{let n=0;if(!g.children.length)return res();g.children.forEach((c,i)=>gsap.to(c.scale,{x:c.userData.bs,y:c.userData.bs,z:c.userData.bs,duration:0.9,ease:'elastic.out(1,0.5)',delay:Math.min(i,20)*0.05,onStart:()=>{if(i%3===0)AUDIO.pop(i%5);},onComplete:()=>{if(++n===g.children.length)res();}}));});}
let STEP=null,PEND=null;
function stepTick(){const sg=S.sceneGroup;const st=sg&&sg.userData.steps;if(!st||S.busy||S.state==='TURN'||S.state==='LIFTING')return;const a=st.holder.userData.an;if(CLOCK-a.t0<Math.max(a.end+st.hold,4.5))return;
  st.i=(st.i+1)%st.list.length;const old=st.holder;let rot=0;old.traverse(o=>{if(o.userData.float)rot=o.userData.rotBase;});
  gsap.to(old.scale,{x:0.001,y:0.001,z:0.001,duration:0.3,ease:'power2.in',onComplete:()=>sg.remove(old)});
  const h=modelHolder(Object.assign({},st.base,st.list[st.i]),rot);h.userData.an.t0+=0.25;sg.add(h);st.holder=h;AUDIO.pop(st.i%5);
  if(STEP){STEP.i=st.i;STEP.cap=st.list[st.i].cap||'';if(S.reR)S.reR(rightCanvas);if(S.reL){S.reL(leftCanvas);if(lastCue)drawCue(lastCue);}}}
window.__dbg=()=>{const sg=S.sceneGroup,st=sg&&sg.userData.steps;return {clock:CLOCK,step:st?st.i:null,end:st?st.holder.userData.an.end:null,t0:st?st.holder.userData.an.t0:null};};
function flatten(){const g=S.sceneGroup;if(!g)return Promise.resolve();return new Promise(res=>{let n=0;if(!g.children.length){anchor.remove(g);S.sceneGroup=null;return res();}g.children.forEach((c,i)=>gsap.to(c.scale,{y:0.001,z:0.001,duration:0.4,ease:'power3.in',delay:Math.min(i,20)*0.02,onComplete:()=>{if(++n===g.children.length){anchor.remove(g);S.sceneGroup=null;res();}}}));});}
function snapshotRight(){flipFrontCanvas.getContext('2d').drawImage(rightCanvas,0,0,PW,PH);flipFrontTex.needsUpdate=true;}
async function turnPage(newLeftDraw,newRightDraw,sceneSpec){S.state='TURN';STEP=PEND?PEND.step:null;S.reL=PEND?PEND.left:null;S.reR=PEND?PEND.right:null;PEND=null;snapshotRight();if(flap){book.remove(flap);flap=null;}
  await flatten();pageNo+=2;newLeftDraw(flipBackCanvas);flipBackTex.needsUpdate=true;rightNote=null;newRightDraw(rightCanvas);
  flipPivot.rotation.z=0;flipPivot.visible=true;AUDIO.flip();
  await new Promise(r=>gsap.to(flipPivot.rotation,{z:Math.PI,duration:1.1,ease:'power2.inOut',onComplete:r}));
  newLeftDraw(leftCanvas);flipPivot.visible=false;if(sceneSpec)await buildScene(sceneSpec);}
const A=()=>ACTS[S.act]||{beats:[]};
function nextIsTurn(){const nb=arr(A().beats)[S.beat+1];return !nb||nb.type==='choice'||nb.type==='note'||nb.type==='scene';}
function cont(h){return {k:h.k,t:String(h.t).replace('（續）','')+'（續）'};}
function textBlock(b){return b.s===undefined||b.s==='n'||!CAST[b.s]?{type:'narr',t:b.t}:{type:'say',s:b.s,t:b.t};}
function enterAct(i){S.act=i;const a=A();return locked(async()=>{S.scene=a.scene||{type:'lab',cast:Object.keys(B.cast||{}).slice(0,3)};currentFig=a.fig||{cap:'',sub:''};S.chap=(a.key||'')+' ・ '+(a.title||'');chapTxt.textContent=S.chap;S.onNote=false;S.pendingTurn=false;doc=[];curHeader={k:a.key||'',t:a.title||''};
  await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';S.beat=0;}).then(()=>{if(S.state==='READING'&&S.beat===0)showBeat();});}
function finishAct(){const a=A();const last=S.act>=ACTS.length-1;const blk={type:'end',t:(a.key||'')+' ・ 完'};const cue=last?'翻頁看結案報告 ▸':'翻頁進入'+(ACTS[S.act+1].key||'下一幕')+' ▸';
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  doc.push(blk);const y=renderLeft(leftCanvas,doc,curHeader);if(y>PH-120&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  S.state='END';drawCue(cue);}
function showBeat(){const b=arr(A().beats)[S.beat];if(!b){finishAct();return;}
  if(b.type==='note'){const n=(B.notes||{})[b.id];if(!n){S.beat++;showBeat();return;}locked(async()=>{S.onNote=true;const ns=arr(((n.fig||{}).model||{}).steps);PEND={step:ns.length>1?{i:0,n:ns.length,cap:ns[0].cap||''}:null,left:null,right:c=>renderNoteRight(c,n)};chapTxt.textContent='研究筆記 '+n.no+' ・ '+n.t;await turnPage(c=>renderNoteLeft(c,n),c=>renderNoteRight(c,n),{model:(n.fig||{}).model,compact:arr((n.fig||{}).table).length>0});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='viz'){const vs=arr((b.model||{}).steps);const n={no:'',t:b.title||'',fig:{model:b.model,cap:b.cap||'',sub:b.sub||'',points:b.points}};locked(async()=>{S.onNote=true;chapTxt.textContent='模型動畫 ・ '+(b.title||'');PEND={step:vs.length>1?{i:0,n:vs.length,cap:vs[0].cap||''}:null,left:c=>renderVizLeft(c,b),right:c=>renderNoteRight(c,n)};await turnPage(c=>renderVizLeft(c,b),c=>renderNoteRight(c,n),{model:b.model});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='scene'){if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;if(b.title)curHeader={k:curHeader.k,t:b.title};S.pendingTurn=true;S.beat++;showBeat();return;}
  if(b.type==='choice'){S.state='CHOICE';S.choice=b;S.picked=null;S.onNote=false;S.pendingTurn=false;if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;
    locked(async()=>{chapTxt.textContent=(A().key||'')+' ・ 研究決策';const opts=arr(b.opts);let sz=38,osz=33;const est=measureRuns(parseEm(b.q),PW-240,sz,sz*1.45,true)+opts.reduce((s,o)=>s+measureRuns(parseEm(o.t),PW-360,osz,osz*1.45)+46,0);if(est>820){sz=34;osz=29;}if(est>1000){sz=31;osz=26;}
      doc=[{type:'question',t:b.q,sz},...opts.map((o,i)=>({type:'option',k:'ABCDE'[i],t:o.t,idx:i,state:'',sz:osz}))];curHeader={k:(A().key||'')+' ・ 研究決策',t:b.header||'你會怎麼做？'};
      await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),b.model?{model:b.model}:S.scene);S.state='CHOICE';drawCue('點選一個選項 ▸');});return;}
  const blk=textBlock(b);
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  doc.push(blk);const yEnd=renderLeft(leftCanvas,doc,curHeader);
  if(yEnd>PH-150&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  AUDIO.click();drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');}
function showEnding(){locked(async()=>{chapTxt.textContent='結案報告';await turnPage(c=>renderEndLeft(c),c=>renderEndRight(c),(B.ending&&B.ending.model)?{model:B.ending.model}:((B.ending&&B.ending.scene)||null));S.state='DONE';if(window.__markDone)window.__markDone();});}
function advance(){if(S.busy)return;if(S.state==='TITLE'){AUDIO.init();if(ACTS.length)enterAct(0);return;}
  if(S.state==='READING'||S.state==='AFTER'){S.beat++;showBeat();return;}
  if(S.state==='END'){if(S.act<ACTS.length-1)enterAct(S.act+1);else showEnding();}}
function pickOption(idx){if(S.state!=='CHOICE'||S.picked!==null)return;const o=arr(S.choice.opts)[idx];if(!o)return;S.picked=idx;AUDIO.click();DECISIONS.push({q:S.choice.header||S.choice.q,t:o.t,good:!!o.good});
  doc.forEach(b=>{if(b.type==='option')b.state=b.idx===idx?'picked':'dim';});
  // fit question+options+feedback on page: shrink feedback if needed
  let fsz=32;doc.push({type:'feedback',t:o.fb||'',good:!!o.good,sz:fsz});let y=renderLeft(leftCanvas,doc,curHeader);
  while(y>PH-110&&fsz>22){fsz-=2;doc[doc.length-1].sz=fsz;y=renderLeft(leftCanvas,doc,curHeader);}
  if(y>PH-110){doc=doc.filter(b=>b.type!=='option'||b.state==='picked');y=renderLeft(leftCanvas,doc,curHeader);}
  if(fbRect){flap=makeFlap(fbRect);S.state='FLAP';drawCue('掀開紙片 ▸');}else{S.state='AFTER';}}
function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=arr(S.choice.opts)[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});
  gsap.delayedCall(1.0,()=>{AUDIO.chime(!!o.good);S.state='AFTER';S.pendingTurn=true;renderLeft(leftCanvas,doc,curHeader);drawCue(nextIsTurn()?'翻頁 ▸':'翻頁繼續 ▸');});}
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips||['……'];rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}
window.__api={advance,pickOption,liftFlap};

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,dragRot=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup&&!S.onNote){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
