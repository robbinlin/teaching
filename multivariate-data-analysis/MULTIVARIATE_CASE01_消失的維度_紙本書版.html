<script>
const BOOK={"file": "MULTIVARIATE_CASE01_消失的維度_紙本書版", "caseNo": "00", "title": "消失的維度", "header": "CASE 01  ·  消失的維度  ·  PCA × Factor Analysis", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "MULTIVARIATE", "en": "The Hidden Structure of Data", "tag": "CASE 01 ・ PCA × Factor Analysis", "tagline": ["當數據不只一個維度，", "真相也不只有一種解釋。"], "summary": "某研究團隊宣稱，他們從 24 項運動表現指標中找到了三個決定運動員成功的核心因素。但同一批資料使用 PCA 與因素分析，竟然得到不同的結構。更令人懷疑的是，研究團隊將主成分直接解釋成具有因果意義的心理與生理構念。", "conflict": "我們發現的究竟是資料的<em>主要變異方向<\/em>，還是真正存在的<em>潛在構念<\/em>？"}, "cast": {"prof": {"name": "周啟宏教授", "role": "研究團隊主持人", "look": {"shirt": "#2b3a6b", "hair": "#9a9a9a", "acc": "tie"}, "quips": ["我們解釋了 56% 的變異！", "審查委員當初都說很好。", "轉軸只是數學技巧吧？"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["資料不會說謊，但會被誤讀。", "先問問題，再選方法。", "我想再看一次相關矩陣。"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["學姊，要不要先吃宵夜？", "原來 Kaiser 準則會騙人……"]}, "stat": {"name": "方靜儀", "role": "統計學家", "look": {"shirt": "#8a6bbf", "hair": "#3a2a22", "hairStyle": "long", "glasses": true}, "quips": ["結構是幾何，構念是理論。", "轉軸不改總變異，只改解釋。", "先看共同性，再談命名。"]}}, "acts": [{"key": "第一幕", "title": "三個核心因素", "scene": {"type": "conference", "cast": ["prof", "hero", "ra"], "screen": {"title": "24 項指標 → 3 個核心因素", "sub": "主成分分析（未轉軸）・解釋變異 56%", "bars": [["綜合運動潛能", 6.88, "λ = 6.88"], ["心理韌性", 3.78, "λ = 3.78"], ["有氧能力", 2.86, "λ = 2.86"]]}}, "fig": {"cap": "圖 1.1　年度運動科學研討會", "sub": "周教授的團隊在台上發表三個「核心因素」。以安與柏哲站在會場右側。點擊角色，可讀到他們此刻的心聲。"}, "beats": [{"s": "n", "t": "深夜十一點，研究室只剩一盞燈。桌上的第一份檔案，封面寫著：<em>消失的維度<\/em>。"}, {"s": "n", "t": "三個月前，年度運動科學研討會。周啟宏教授的團隊發表了一項大型研究：312 位菁英運動員、24 項表現指標。"}, {"s": "prof", "t": "經過主成分分析，24 個變數被濃縮成三個核心因素：<em>綜合運動潛能<\/em>、<em>心理韌性<\/em>、以及<em>有氧能力<\/em>。三者合計解釋了 56% 的變異。"}, {"type": "note", "id": "pca"}, {"s": "prof", "t": "其中「心理韌性」與國手選拔結果高度相關。我們建議把它納入明年的選訓標準。"}, {"s": "hero", "t": "（翻著手冊）等等……在「心理韌性」這個成分上，垂直跳和深蹲的負荷量是<em>負的<\/em>，專注力量表是正的？"}, {"s": "hero", "t": "一個「心理」構念，為什麼會被肌力測驗反向定義？"}, {"type": "note", "id": "load"}, {"s": "ra", "t": "學姊，大家都在鼓掌耶。而且他們解釋了 56% 的變異，這不是很厲害嗎？"}, {"s": "hero", "t": "解釋了很多變異，不代表解釋了<em>對的東西<\/em>。回去之後，我想把相關矩陣重新跑一次。"}, {"type": "viz", "title": "56% 與被捨棄的 44%", "text": ["24 個標準化指標，每個的變異數都是 1，總變異就是 24。動畫第一步立起前三個主成分的特徵值 6.88、3.78、2.86；第二步用金線把它們逐一累加到 13.52，也就是 24 的 56%。", "第三步把其餘 21 個成分合成一根紅柱：10.48，占 44%。「解釋 56%」說的是保留了多少變異，既沒有交代<em>被捨棄的是什麼<\/em>，也無法證明成分的名稱是對的。"], "model": {"type": "columns", "values": [6.88, 3.78, 2.86], "labels": ["PC1", "PC2", "PC3"], "highlight": 3, "showValues": true, "connect": false, "yLabel": "特徵值 λ", "steps": [{"cap": "前三個主成分的特徵值：6.88、3.78、2.86"}, {"cap": "累加：6.88 → 10.66 → 13.52，占 24 的 56%", "lines": [{"values": [6.88, 10.66, 13.52], "label": "累積 λ", "color": "gold"}]}, {"cap": "其餘 21 個成分合計 10.48：44% 被捨棄", "values": [6.88, 3.78, 2.86, 10.48], "labels": ["PC1", "PC2", "PC3", "其餘21個"], "markIndex": 3, "lines": [{"values": [6.88, 10.66, 13.52], "label": "累積 λ", "color": "gold"}], "notes": [{"text": "捨棄 44%", "at": 3, "color": "red"}]}]}, "cap": "圖 V1　解釋變異的帳本", "sub": "柱高為特徵值 λ，總變異 ＝ 24。綠柱為保留的三個主成分，金線為累積特徵值，紅柱為其餘 21 個成分的合計。"}, {"type": "choice", "header": "這個問題需要什麼？", "scene": {"type": "matrix", "cast": ["hero", "ra"], "n": 9, "blocks": 3}, "fig": {"cap": "圖 1.2　24 × 24 相關矩陣的區塊結構", "sub": "同一類指標之間的相關（高柱）明顯高於跨類別的相關（矮柱）。資料本來就有結構；問題是：研究團隊的三個成分，是怎麼切出這個結構的？"}, "q": "面對 24 個彼此高度相關的表現指標，你認為這個研究問題真正需要的是什麼？", "opts": [{"t": "降維：把 24 個變數壓縮成少數綜合分數，方便後續使用。", "good": false, "fb": "這是 PCA 的思維：用最少的成分保留最多變異。它回答的是「資料怎麼最有效地摘要」，但不保證任何成分對應到理論構念。"}, {"t": "探索潛在構念：找出是什麼共同原因，讓這些變數彼此相關。", "good": true, "fb": "這是因素分析的思維：變數之所以相關，是因為背後有共同因素。要宣稱「心理韌性」這種構念存在，需要的是這種測量模型，而不是單純的變異摘要。"}, {"t": "不需要減少變數，直接用 24 個變數建模。", "good": false, "fb": "24 個高度相關的預測變數會帶來嚴重的多重共線性，而且研究團隊的目的本來就是想討論「構念」。問題不在要不要減少變數，而在減少的方式要回答什麼問題。"}]}, {"type": "note", "id": "fa"}, {"s": "n", "t": "研討會結束。以安把 24 × 24 的相關矩陣列印出來，貼滿了研究室的牆。"}, {"s": "hero", "t": "在決定用 PCA 還是因素分析之前，還有一個更基本的問題：<em>到底該保留幾個？<\/em>"}, {"type": "note", "id": "howmany"}, {"s": "n", "t": "凌晨一點，以安把結果寫進筆記本，翻到下一頁。"}]}, {"key": "第二幕", "title": "牆上的矩陣", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "24 × 24 相關矩陣", "lines": ["肌力類指標：r ＝ .5～.7", "心理量表：r ＝ .4～.6", "跨區塊：r ＝ .1～.3", "N ＝ 312，變數 ＝ 24"]}}, "fig": {"cap": "圖 2.1　兩週後的研究室", "sub": "資料到手了：312 人、24 個變數，和研究團隊用的一模一樣。螢幕上是重新整理過的相關矩陣。"}, "beats": [{"s": "n", "t": "兩週後。研究室。"}, {"s": "ra", "t": "學姊，資料拿到了。312 人、24 個變數，和他們用的一模一樣。"}, {"s": "hero", "t": "先別急著跑模型。看看相關矩陣：肌力類指標彼此相關 .5 到 .7，心理量表彼此相關 .4 到 .6，但跨區塊的相關只有 .1 到 .3。"}, {"s": "ra", "t": "所以資料本來就有「區塊結構」？"}, {"s": "hero", "t": "對。真正的問題是：他們的三個成分，是怎麼切出這個結構的。"}, {"type": "viz", "title": "把相關矩陣重新排隊", "text": ["每一根柱子是兩個指標的相關係數，柱越高、顏色越深，相關越強。第一步依原始檔案的欄位順序排列六個代表指標：高柱散落各處，看不出規律。", "第二步只是把同類指標排在一起，數字一個都沒改：肌力、心理、耐力三個<em>區塊<\/em>立刻浮現。區塊內相關 .5 到 .7，跨區塊只有 .1 到 .3，資料本來就有三群。"], "model": {"type": "matrix", "title": "六個代表指標的相關", "labels": ["深蹲", "垂直跳", "專注", "自信", "攝氧", "恢復"], "values": [[1, 0.66, 0.15, 0.2, 0.25, 0.18], [0.66, 1, 0.12, 0.18, 0.22, 0.15], [0.15, 0.12, 1, 0.52, 0.1, 0.2], [0.2, 0.18, 0.52, 1, 0.12, 0.16], [0.25, 0.22, 0.1, 0.12, 1, 0.55], [0.18, 0.15, 0.2, 0.16, 0.55, 1]], "showAbove": 0.3, "steps": [{"cap": "原始欄位順序：高相關散落各處", "labels": ["深蹲", "專注", "攝氧", "垂直跳", "自信", "恢復"], "values": [[1, 0.15, 0.25, 0.66, 0.2, 0.18], [0.15, 1, 0.1, 0.12, 0.52, 0.2], [0.25, 0.1, 1, 0.22, 0.12, 0.55], [0.66, 0.12, 0.22, 1, 0.18, 0.15], [0.2, 0.52, 0.12, 0.18, 1, 0.16], [0.18, 0.2, 0.55, 0.15, 0.16, 1]]}, {"cap": "同類指標排在一起：三個區塊浮現"}]}, "cap": "圖 V2　同一個矩陣，換個順序", "sub": "柱高為相關係數，金色為對角線，只標出 r ≥ .30 的數值。六個指標取自 24 項中的代表指標（數值為教學示意）。"}, {"s": "hero", "t": "周教授的團隊用的是<em>未轉軸<\/em>的主成分。第一主成分是所有變數的加權總和；第二主成分是「心理量表 對 肌力測驗」的對比。"}, {"s": "ra", "t": "所以「心理韌性」其實是……一個「心理強、肌力弱」的方向？"}, {"s": "hero", "t": "它是變異第二大的方向，不是一個構念。我們用主軸因子法重跑，再做轉軸，看看結構會怎麼變。"}, {"type": "note", "id": "rotate"}, {"type": "viz", "title": "平行分析：和隨機比大小", "text": ["平行分析用與本研究同樣大小（312 人 × 24 個變數）、但彼此毫無關聯的隨機資料，反覆計算特徵值。第一步：每顆球是一次模擬得到的第 4 個特徵值，堆成的分布中心約 1.34。", "第二步標出 Kaiser 的 λ ＝ 1 與實際的第 4 個特徵值 1.15：它雖然大於 1，卻<em>比幾乎所有隨機結果都小<\/em>。第三步換成第 3 個特徵值：實際的 2.7 遠高於隨機的 1.41，值得保留。"], "model": {"type": "drops", "title": "隨機資料的第 4 個特徵值", "x": [0.9, 1.6], "dist": {"mu": 1.34, "sd": 0.04}, "n": 150, "bins": 21, "seed": 11, "xLabel": "特徵值 λ", "steps": [{"cap": "隨機資料的 λ₄：集中在 1.34 附近"}, {"cap": "實際 λ₄ ＝ 1.15：大於 1，卻小於隨機", "marks": [{"x": 1.0, "label": "λ ＝ 1", "color": "gold"}, {"x": 1.15, "label": "實際 1.15", "color": "red"}]}, {"cap": "換成 λ₃：實際 2.7 遠高於隨機的 1.41", "title": "隨機資料的第 3 個特徵值", "x": [1.2, 2.8], "dist": {"mu": 1.41, "sd": 0.04}, "n": 80, "bins": 25, "marks": [{"x": 2.7, "label": "實際 2.7", "color": "teal"}]}]}, "cap": "圖 V3　平行分析的落球實驗", "sub": "每顆球是一組隨機資料（312 × 24）算出的特徵值，黑線為其分布曲線；直線為 Kaiser 準則與實際特徵值（數值為教學示意）。"}, {"type": "choice", "header": "要保留幾個因素？", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "特徵值（前 6 個）", "sub": "Kaiser 建議 4 ・ 平行分析建議 3", "bars": [["1", 7.1], ["2", 3.6], ["3", 2.7], ["4", 1.15], ["5", 0.95], ["6", 0.86]]}}, "fig": {"cap": "圖 2.2　特徵值與兩種準則", "sub": "第 4 個特徵值 1.15 略高於 1，但低於平行分析的隨機門檻 1.34。"}, "q": "跑完分析，你會保留幾個因素？（Kaiser 準則建議 4 個，平行分析建議 3 個）", "opts": [{"t": "4 個：Kaiser 準則說特徵值大於 1 的有 4 個。", "good": false, "fb": "第 4 個特徵值只略高於 1，平行分析顯示它低於隨機資料的期望值。第 4 個因素上只有三個低負荷題目，而且都來自同一台穿戴裝置：這是<em>測量方法<\/em>，不是構念。"}, {"t": "3 個：平行分析與陡坡圖都指向 3，而且三個因素都能解釋。", "good": true, "fb": "平行分析與陡坡圖一致支持 3 個因素。轉軸後三個因素分別對應爆發力／力量、耐力／恢復、心理／專注，具有理論可解釋性。"}, {"t": "2 個：因素越少越簡潔。", "good": false, "fb": "2 個因素時，耐力與心理指標被迫併在一起，交叉負荷大量增加、共同性下降。簡潔不能以結構失真為代價。"}, {"t": "5 個以上：解釋變異越多越好。", "good": false, "fb": "解釋變異會隨因素數單調上升，這不是選擇依據。過度萃取會產生只有一兩個題目的「碎片因素」，無法複製也無法命名。"}]}, {"s": "ra", "t": "三個因素看起來很乾淨。可是有兩個指標怪怪的。"}, {"s": "hero", "t": "「教練評分」同時落在爆發力與心理因素上，「反應力量指數」幾乎不屬於任何因素。這要看<em>共同性<\/em>。"}, {"type": "note", "id": "communality"}, {"type": "choice", "header": "交叉負荷與低共同性", "scene": {"type": "matrix", "cast": ["hero", "ra"], "n": 9, "blocks": 3}, "fig": {"cap": "圖 2.3　轉軸後的區塊結構", "sub": "三個區塊對應三個因素。少數指標橫跨兩個區塊，或幾乎不與任何區塊相關。"}, "q": "「教練評分」同時負荷在爆發力與心理因素上（約 .52 ／ .43）；「反應力量指數」的共同性只有 .09。你會怎麼處理？", "opts": [{"t": "全部刪掉，讓結構變乾淨。", "good": false, "fb": "刪題能讓表格變好看，但也可能刪掉理論上重要的內容。教練評分的交叉負荷其實合理：教練本來就同時在看身體與心理。"}, {"t": "回到題目的測量內容，區分「合理的交叉負荷」與「測量不良」，分別處理並在報告中揭露。", "good": true, "fb": "教練評分的交叉負荷有理論意義，可保留並說明；反應力量指數共同性極低，與其他指標幾乎沒有共同變異，應檢討測量方式，或在報告中列為獨立指標。"}, {"t": "忽略，反正整體結構看起來不錯。", "good": false, "fb": "低共同性的題目會讓因素分數的信度下降；交叉負荷不處理，會讓「心理」因素混進肌力成分，這正是周教授團隊犯的錯。"}]}, {"s": "ra", "t": "所以……他們的「心理韌性」，其實是轉軸之前的第二主成分？"}, {"s": "hero", "t": "對。轉軸後它會分開成「心理」和「爆發力」兩個因素，負號消失了。那個反向的肌力負荷，是<em>數學產物<\/em>。"}, {"s": "n", "t": "三天後，學術會議。周教授的團隊將回應質疑。"}]}, {"key": "第三幕", "title": "結構不等於構念", "scene": {"type": "conference", "cast": ["prof", "hero", "stat"], "screen": {"title": "未轉軸 PCA 與 轉軸後 PAF", "lines": ["PCA 成分 2：專注 +.62 ／ 垂直跳 −.58", "PAF 因素 1：爆發力／力量", "PAF 因素 2：心理／專注", "PAF 因素 3：耐力／恢復"]}}, "fig": {"cap": "圖 3.1　回應質疑的會議", "sub": "投影幕上並排著兩張表：未轉軸的 PCA，以及轉軸後的因素分析。"}, "beats": [{"s": "n", "t": "會議室裡，投影幕上並排著兩張表：未轉軸的 PCA，以及轉軸後的因素分析。"}, {"s": "prof", "t": "沈博士，你的分析和我們的差別只是轉軸而已。轉軸不會改變解釋的總變異。"}, {"s": "hero", "t": "是的，總變異不變。但<em>構念的定義<\/em>改變了。轉軸前，你們把「心理量表高、肌力低」這個對比方向，命名為心理韌性。"}, {"s": "hero", "t": "轉軸後，心理量表自成一個因素，肌力指標自成另一個。原本的負號消失了。那不是心理韌性的特徵，而是未轉軸成分的數學性質。"}, {"type": "viz", "title": "轉軸：同一群點，換座標", "text": ["每個小球是一個指標的負荷量座標：它在三個成分上的負荷，決定它在空間中的位置。第一步是未轉軸的 PCA：所有指標都偏向 PC1 正向，心理量表與肌力指標則被 PC2 推往上下兩端。", "第二步換成轉軸後的三個因素：每一群指標幾乎只貼著一條軸，<em>負號消失了<\/em>。各群之間的相對位置不變（這是一次正交轉軸），改變的只是座標軸放在哪裡。"], "model": {"type": "scatter3d", "seed": 7, "axes": ["F1 爆發", "F3 耐力", "F2 心理"], "groups": [{"label": "肌力指標", "color": "red", "center": [0.5, 0.05, 0.05], "sd": 0.035, "n": 7}, {"label": "心理量表", "color": "teal", "center": [0.05, 0.5, 0.05], "sd": 0.035, "n": 7}, {"label": "耐力指標", "color": "gold", "center": [0.05, 0.05, 0.5], "sd": 0.035, "n": 7}], "steps": [{"cap": "未轉軸：PC2 把心理與肌力拉成兩端", "axes": ["PC1", "PC3", "PC2"], "groups": [{"label": "肌力指標", "color": "red", "center": [0.35, -0.32, -0.18], "sd": 0.035, "n": 7}, {"label": "心理量表", "color": "teal", "center": [0.35, 0.32, -0.18], "sd": 0.035, "n": 7}, {"label": "耐力指標", "color": "gold", "center": [0.35, 0.0, 0.37], "sd": 0.035, "n": 7}]}, {"cap": "轉軸後：每群指標只貼著一個因素軸"}]}, "cap": "圖 V4　轉軸前後的負荷量空間", "sub": "紅：肌力指標，綠：心理量表，金：耐力指標。座標為負荷量（經縮放），兩步之間是一次正交轉軸（數值為教學示意）。"}, {"s": "stat", "t": "我補充一點。主成分分析回答的是「怎麼用最少的成分保留最多變異」；因素分析才是在問「什麼共同原因讓這些變數相關」。兩者的目的不同。"}, {"s": "prof", "t": "但我們的三成分模型，在國手選拔上預測得很好。"}, {"s": "hero", "t": "預測好，不代表命名對。你可以用它預測，但不能把它當成「心理韌性」，去告訴教練：這個選手心理不夠強。"}, {"s": "stat", "t": "如果要把它變成選訓標準，下一步是在新樣本上做<em>驗證性因素分析<\/em>。"}, {"type": "note", "id": "cfa"}, {"type": "choice", "header": "資料支持原本的理論嗎？", "q": "現在輪到你下結論：資料是否支持研究團隊原本的理論？", "opts": [{"t": "完全支持：三個因素就是三個核心構念，可以直接作為選訓標準。", "good": false, "fb": "探索性因素分析只能顯示資料「相容於」三因素結構。要宣稱構念存在並拿來做決策，還需要在新樣本上做驗證性因素分析，以及信度與效度證據。"}, {"t": "部分支持：資料相容於三個相關的潛在因素，但 PCA 成分不能直接等同構念；需在新樣本以 CFA 驗證後，才能應用於選訓。", "good": true, "fb": "這是資料能支持的範圍：結構存在，命名需修正，應用需等待驗證。"}, {"t": "不支持：這批資料無法產生任何有意義的結構。", "good": false, "fb": "這太過了。轉軸後的三因素結構清楚且可解釋；問題在於研究者的解釋超出了模型能回答的範圍，而不是資料沒有結構。"}]}, {"s": "n", "t": "會議結束時，周教授在筆記本上劃掉了「心理韌性」四個字。"}]}], "notes": {"pca": {"no": 1, "t": "主成分分析在做什麼？", "blocks": [{"type": "h", "t": "核心想法"}, {"type": "p", "t": "PCA 把 p 個彼此相關的變數，重新組合成 p 個<em>互不相關<\/em>的新變數，稱為主成分。第 1 個主成分盡可能抓住最多變異；第 2 個在與第 1 個垂直的前提下，抓住剩下最多的變異，依此類推。"}, {"type": "formula", "t": "PC₁ ＝ w₁Z₁ ＋ w₂Z₂ ＋ … ＋ w₂₄Z₂₄"}, {"type": "p", "t": "權重 w 來自相關矩陣 R 的<em>特徵向量<\/em>；每個主成分的變異量，就是對應的<em>特徵值<\/em> λ。"}, {"type": "h", "t": "「解釋 56% 變異」是什麼意思？"}, {"type": "p", "t": "24 個標準化變數，每個變異數都是 1，總變異就是 24。前三個特徵值相加約 13.4，而 13.4 ÷ 24 ≈ 56%。換句話說，還有 <em>44% 的資訊被捨棄<\/em>了。"}, {"type": "formula", "t": "解釋比例 ＝ (λ₁＋λ₂＋λ₃) ÷ 24"}], "fig": {"model": {"type": "scatter3d", "seed": 20241101, "axes": ["Z₁ 垂直跳", "Z₂ 深蹲", "Z₃ 專注力"], "arrows": [{"label": "PC1：變異最大（λ₁）"}, {"label": "PC2 ⟂ PC1"}, {"label": "PC3"}], "steps": [{"cap": "三個高度相關的指標：點雲呈斜長橢球", "arrows": []}, {"cap": "PC1：沿著點雲拉得最長的方向", "arrows": [{"label": "PC1：變異最大（λ₁）"}]}, {"cap": "PC2、PC3 依序與前面的軸垂直"}]}, "cap": "圖 N1　PC1 沿著資料「拉得最長」的方向", "sub": "三個高度相關的指標，點雲呈斜長的橢球。PCA 先找最長的軸（綠），再依序找與它垂直的軸（紅、黃）。", "points": ["PCA 是<em>數學轉換<\/em>，不是統計模型：沒有誤差項，也不假設有潛在原因。", "它分析的是<em>全部變異<\/em>，包含每個指標特有的變異與測量誤差。", "主成分只是變數的加權總和；名稱是研究者事後給的詮釋。"]}}, "load": {"no": 2, "t": "負荷量怎麼讀？", "blocks": [{"type": "h", "t": "負荷量＝指標與成分的相關"}, {"type": "p", "t": "在 PCA 中，負荷量 a ＝ w × √λ，可以讀成「這個指標與這個成分的相關係數」，介於 −1 與 1 之間。絕對值越大，這個指標越能代表該成分。"}, {"type": "h", "t": "正負號本身沒有意義"}, {"type": "p", "t": "特徵向量可以整體反轉：把一個成分的所有負荷量同時乘以 −1，模型完全不變。真正重要的是<em>同一個成分內<\/em>，哪些指標同號、哪些反號。"}, {"type": "h", "t": "這是一個雙極成分"}, {"type": "p", "t": "專注力為正、垂直跳與深蹲為負，代表這個成分對比的是「心理量表高、肌力低」與「肌力高、心理量表低」的選手。把它命名為「心理韌性」，等於忽略了另一半的內容。"}, {"type": "p", "t": "第 1 個成分常吸走所有指標共有的變異；之後的成分被迫與它垂直，常常就成了<em>對比型<\/em>成分。這是數學限制，不一定是真實構念。"}], "fig": {"model": {"type": "bars", "title": "成分 2：被命名為「心理韌性」", "rows": [["專注力", 0.62], ["自信心", 0.55], ["焦慮", 0.48], ["攝氧量", 0.1], ["深蹲", -0.51], ["垂直跳", -0.58]], "max": 0.7, "thresholds": [0.4, -0.4], "posLabel": "心理量表端", "negLabel": "肌力端", "steps": [{"cap": "心理量表端：專注、自信、焦慮為正", "rows": [["專注力", 0.62], ["自信心", 0.55], ["焦慮", 0.48], ["攝氧量", 0.1]]}, {"cap": "肌力端：深蹲、垂直跳為負，兩端對立"}]}, "cap": "圖 N2　一端是心理量表，另一端是肌力", "sub": "半透明線為常用的 |a| ≥ .40 門檻。綠柱向上、紅柱向下：兩端都有高負荷量的指標。", "points": ["先看絕對值：哪些指標的 |a| 夠大？", "再看分組：同號的是一群，反號的是另一群。", "最後才命名：名稱要同時說明兩端。"]}}, "fa": {"no": 3, "t": "PCA 與因素分析", "blocks": [{"type": "h", "t": "因素分析的測量模型"}, {"type": "p", "t": "因素分析假設每個觀察指標，都由<em>共同因素<\/em> F 與<em>獨特因素<\/em> ε 組成。以第 7 個指標為例："}, {"type": "formula", "t": "Z₇ ＝ λ₇₁F₁ ＋ λ₇₂F₂ ＋ λ₇₃F₃ ＋ ε₇"}, {"type": "p", "t": "λ 是因素負荷量，ε 是這個指標獨有的部分（含測量誤差）。所以每個指標的變異可以拆成兩塊："}, {"type": "formula", "t": "1 ＝ h²（共同性）＋ u²（獨特性）"}, {"type": "h", "t": "關鍵差別"}, {"type": "p", "t": "PCA 分析相關矩陣的<em>全部變異<\/em>；因素分析把對角線的 1 換成共同性，只分析<em>共同變異<\/em>（例如主軸因子法 PAF）。因此只有因素分析能回答：「這些指標會相關，是因為背後有共同原因嗎？」"}], "fig": {"model": {"type": "paths", "nodes": [{"id": "x1", "label": "Z₁", "x": -0.95, "y": 0.2}, {"id": "x2", "label": "Z₂", "x": -0.75, "y": 0.2}, {"id": "x3", "label": "Z₃", "x": -0.55, "y": 0.2}, {"id": "x4", "label": "Z₄", "x": -0.35, "y": 0.2}, {"id": "pc", "label": "PC", "kind": "comp", "x": -0.65, "y": 0.78}, {"id": "f", "label": "F", "kind": "lat", "x": 0.6, "y": 0.82}, {"id": "y1", "label": "Z₁", "x": 0.3, "y": 0.42}, {"id": "y2", "label": "Z₂", "x": 0.5, "y": 0.42}, {"id": "y3", "label": "Z₃", "x": 0.7, "y": 0.42}, {"id": "y4", "label": "Z₄", "x": 0.9, "y": 0.42}, {"id": "e1", "label": "ε", "kind": "err", "x": 0.3, "y": 0.08}, {"id": "e2", "label": "ε", "kind": "err", "x": 0.5, "y": 0.08}, {"id": "e3", "label": "ε", "kind": "err", "x": 0.7, "y": 0.08}, {"id": "e4", "label": "ε", "kind": "err", "x": 0.9, "y": 0.08}], "edges": [{"from": "x1", "to": "pc", "color": "teal"}, {"from": "x2", "to": "pc", "color": "teal"}, {"from": "x3", "to": "pc", "color": "teal"}, {"from": "x4", "to": "pc", "color": "teal", "label": "w"}, {"from": "f", "to": "y1", "color": "red"}, {"from": "f", "to": "y2", "color": "red"}, {"from": "f", "to": "y3", "color": "red"}, {"from": "f", "to": "y4", "color": "red", "label": "λ"}, {"from": "e1", "to": "y1", "color": "gray"}, {"from": "e2", "to": "y2", "color": "gray"}, {"from": "e3", "to": "y3", "color": "gray"}, {"from": "e4", "to": "y4", "color": "gray"}], "title": "左：PCA（指標 → 成分）　右：因素分析（因素 → 指標）"}, "table": [["", "PCA", "因素分析"], ["箭頭方向", "指標 → 成分", "因素 → 指標"], ["分析的變異", "全部變異", "只有共同變異"], ["誤差項", "沒有", "有（ε）"], ["結果的地位", "加權總分", "潛在構念的估計"]], "cap": "圖 N3　箭頭方向決定了模型在回答什麼", "sub": "方塊是觀察指標，球體 F 是潛在因素，六角柱 PC 是成分，灰色小球 ε 是獨特誤差。", "points": ["想摘要資料、降維 → PCA。", "想找潛在構念、發展量表 → 因素分析。"]}}, "howmany": {"no": 4, "t": "要保留幾個？", "blocks": [{"type": "h", "t": "三種常見準則"}, {"type": "p", "t": "<em>Kaiser 準則<\/em>：保留特徵值大於 1 的成分。它簡單，但在變數多時常常<em>保留太多<\/em>。"}, {"type": "p", "t": "<em>陡坡圖<\/em>：把特徵值由大到小畫出來，找曲線「轉折變平」的位置。好用，但判斷帶有主觀成分。"}, {"type": "p", "t": "<em>平行分析<\/em>：用同樣樣本數與變數數產生大量隨機資料，計算它們的特徵值。只保留<em>比隨機資料還大<\/em>的成分。這是目前最推薦的方法。"}, {"type": "h", "t": "這份資料的情況"}, {"type": "p", "t": "Kaiser 準則建議 4 個，平行分析建議 3 個。第 4 個特徵值 1.15 雖然大於 1，卻不比隨機資料大。不同準則給出不同答案時，研究者必須說明選擇的理由。"}], "fig": {"model": {"type": "columns", "values": [7.1, 3.6, 2.7, 1.15, 0.95, 0.86, 0.78, 0.71, 0.65, 0.6], "highlight": 3, "markIndex": 3, "plane": {"value": 1, "label": "Kaiser 平面：λ ＝ 1"}, "lines": [{"values": [1.62, 1.5, 1.41, 1.34, 1.27, 1.21, 1.15, 1.1, 1.05, 1.0], "label": "平行分析：隨機資料的 λ", "color": "gold"}], "notes": [{"text": "保留 3 個", "at": 1, "color": "teal"}], "yLabel": "特徵值 λ", "steps": [{"cap": "Kaiser 準則：λ ＞ 1 的有 4 個", "highlight": 4, "markIndex": null, "lines": [], "notes": [{"text": "Kaiser：4 個", "at": 1, "color": "gold"}]}, {"cap": "平行分析：第 4 個低於隨機的 1.34，保留 3 個"}]}, "cap": "圖 N4　陡坡圖與平行分析", "sub": "圓柱為實際特徵值，黃線為隨機資料的特徵值，綠色平面為 λ ＝ 1（數值為教學示意）。", "points": ["報告時應同時列出準則與結果，不要只寫「依 Kaiser 準則」。", "保留的數量會改變每個成分的內容；這正是第二幕要追查的問題。"]}}, "rotate": {"no": 5, "t": "轉軸在做什麼？", "blocks": [{"type": "h", "t": "同一個空間，換一組座標軸"}, {"type": "p", "t": "萃取出 3 個因素後，因素空間就固定了。<em>轉軸<\/em>是在這個空間裡旋轉座標軸，讓每個指標盡量只在一個因素上有高負荷，這叫<em>簡單結構<\/em>。"}, {"type": "p", "t": "轉軸不會改變總解釋變異，也不會改變每個指標的共同性；改變的是<em>變異在因素之間怎麼分配<\/em>，也就是因素的意義。"}, {"type": "h", "t": "正交與斜交"}, {"type": "p", "t": "<em>正交轉軸<\/em>（如 Varimax）假設因素彼此不相關；<em>斜交轉軸<\/em>（如 Promax、Oblimin）允許因素相關。運動表現的爆發力、耐力與心理通常彼此相關，斜交轉軸往往更貼近現實。"}, {"type": "formula", "t": "Σ h²（轉軸前）＝ Σ h²（轉軸後）"}], "fig": {"model": {"type": "lines", "title": "同一組指標：轉軸前後的負荷量", "xLabels": ["專注力", "自信心", "焦慮", "攝氧量", "深蹲", "垂直跳"], "series": [{"label": "未轉軸 PC2", "values": [0.62, 0.55, 0.48, 0.1, -0.51, -0.58], "color": "red"}, {"label": "轉軸後 心理因素", "values": [0.74, 0.69, 0.61, 0.08, 0.06, 0.03], "color": "teal"}], "ymin": -0.7, "ymax": 0.8, "yLabel": "負荷量", "steps": [{"cap": "未轉軸 PC2：心理與肌力兩端對立", "series": [{"label": "未轉軸 PC2", "values": [0.62, 0.55, 0.48, 0.1, -0.51, -0.58], "color": "red"}]}, {"cap": "轉軸後心理因素：只剩心理量表高負荷"}]}, "cap": "圖 N5　轉軸後，負號消失了", "sub": "紅線是未轉軸的第二主成分，兩端對立；綠線是轉軸後的心理因素，只有心理量表有高負荷（數值為教學示意）。", "points": ["轉軸改變的是「解釋」，不是「資料」。", "報告必須寫明用了哪一種轉軸，以及為什麼。"]}}, "communality": {"no": 6, "t": "共同性與交叉負荷", "blocks": [{"type": "h", "t": "共同性 h²"}, {"type": "p", "t": "共同性是一個指標的變異中，能被所有共同因素解釋的比例。它等於該指標在各因素上負荷量的平方和。"}, {"type": "formula", "t": "h² ＝ λ₁² ＋ λ₂² ＋ λ₃²"}, {"type": "p", "t": "共同性很低（例如 < .20）代表這個指標幾乎不與其他指標共享變異：可能測的是另一件事，也可能是測量品質不佳。"}, {"type": "h", "t": "交叉負荷"}, {"type": "p", "t": "一個指標同時在兩個因素上有不小的負荷（例如都 > .30），就是交叉負荷。它不一定是壞事：教練評分本來就同時反映身體與心理。關鍵是<em>回到題目內容判斷<\/em>，而不是一律刪除。"}], "fig": {"model": {"type": "bars", "title": "各指標的共同性 h²", "rows": [["深蹲", 0.71], ["教練評分", 0.62], ["專注力", 0.58], ["HRV", 0.14], ["睡眠", 0.12], ["RSI", 0.09, "red"]], "max": 0.8, "thresholds": [0.2]}, "cap": "圖 N6　誰和其他指標沒有共同語言？", "sub": "門檻線為 h² ＝ .20。反應力量指數（RSI）、睡眠品質與 HRV 都來自同一台穿戴裝置，共同性偏低（數值為教學示意）。", "points": ["低共同性：先檢討測量，再決定是否保留。", "交叉負荷：先問理論，再決定怎麼處理。"]}}, "cfa": {"no": 7, "t": "從 EFA 到 CFA", "blocks": [{"type": "h", "t": "探索 vs 驗證"}, {"type": "p", "t": "<em>探索性因素分析（EFA）<\/em>讓資料決定每個指標屬於哪個因素；<em>驗證性因素分析（CFA）<\/em>則是研究者事先指定結構，再檢驗資料是否支持。"}, {"type": "p", "t": "同一批資料不能既用來找結構、又用來證明結構。合理的流程是：在樣本 A 做 EFA，在新的樣本 B 做 CFA。"}, {"type": "h", "t": "常用的適配指標"}, {"type": "bullet", "t": "CFI、TLI ≥ .95：模型比「完全不相關」好多少。"}, {"type": "bullet", "t": "RMSEA ≤ .06：每單位自由度的近似誤差。"}, {"type": "bullet", "t": "SRMR ≤ .08：觀察與模型相關之間的平均殘差。"}, {"type": "p", "t": "通過 CFA 之後，還需要信度（如 ω 係數）與效度證據，構念才能拿去做選訓決策。"}], "fig": {"model": {"type": "paths", "title": "三因素 CFA：每個指標只屬於一個因素", "nodes": [{"id": "F1", "label": "爆發力", "kind": "lat", "x": -0.6, "y": 0.85}, {"id": "F2", "label": "心理", "kind": "lat", "x": 0.0, "y": 0.85}, {"id": "F3", "label": "耐力", "kind": "lat", "x": 0.6, "y": 0.85}, {"id": "a", "label": "深蹲", "x": -0.8, "y": 0.3}, {"id": "b", "label": "垂直跳", "x": -0.45, "y": 0.3}, {"id": "c", "label": "專注", "x": -0.15, "y": 0.3}, {"id": "d", "label": "自信", "x": 0.15, "y": 0.3}, {"id": "e", "label": "攝氧", "x": 0.45, "y": 0.3}, {"id": "f", "label": "恢復", "x": 0.8, "y": 0.3}], "edges": [{"from": "F1", "to": "a", "color": "red"}, {"from": "F1", "to": "b", "color": "red"}, {"from": "F2", "to": "c", "color": "red"}, {"from": "F2", "to": "d", "color": "red"}, {"from": "F3", "to": "e", "color": "red"}, {"from": "F3", "to": "f", "color": "red"}, {"from": "F1", "to": "F2", "double": true, "color": "purple"}, {"from": "F2", "to": "F3", "double": true, "color": "purple", "label": "因素相關"}], "steps": [{"cap": "EFA：每個因素都連到每一個指標", "edges": [{"from": "F1", "to": "a", "color": "red"}, {"from": "F1", "to": "b", "color": "red"}, {"from": "F1", "to": "c", "color": "gray"}, {"from": "F1", "to": "d", "color": "gray"}, {"from": "F1", "to": "e", "color": "gray"}, {"from": "F1", "to": "f", "color": "gray"}, {"from": "F2", "to": "a", "color": "gray"}, {"from": "F2", "to": "b", "color": "gray"}, {"from": "F2", "to": "c", "color": "red"}, {"from": "F2", "to": "d", "color": "red"}, {"from": "F2", "to": "e", "color": "gray"}, {"from": "F2", "to": "f", "color": "gray"}, {"from": "F3", "to": "a", "color": "gray"}, {"from": "F3", "to": "b", "color": "gray"}, {"from": "F3", "to": "c", "color": "gray"}, {"from": "F3", "to": "d", "color": "gray"}, {"from": "F3", "to": "e", "color": "red"}, {"from": "F3", "to": "f", "color": "red"}]}, {"cap": "CFA：只保留指定的負荷與因素相關"}]}, "cap": "圖 N7　事先指定的測量模型", "sub": "紅色箭頭為因素負荷，紫色雙向弧線為因素間相關。沒有畫出的箭頭，就是被固定為 0 的負荷。", "points": ["EFA 找假設，CFA 驗證假設。", "驗證要用新樣本，否則只是在重複同一個結果。"]}}}, "ending": {"title": "消失的維度：結案", "paragraphs": ["周教授的團隊同意修改「心理韌性」的命名。原本被當成構念的第二主成分，被確認為未轉軸時的對比方向。", "以安的修正版報告採用主軸因子法與斜交轉軸，保留 3 個因素，並將共同性過低的穿戴裝置指標列為獨立指標。下一步，是在新樣本上以 CFA 驗證這個結構。"], "takeaway": "統計模型呈現的「結構」是資料變異的幾何；研究者宣稱的「構念」是理論的語言。兩者之間，需要測量模型、轉軸選擇與新樣本驗證來搭橋。", "verdict": ["審查通過：你的每一個決策都與研究問題一致。修正版報告順利刊登。", "有條件接受：核心結構被保留，但有幾個決策留下了可被質疑的空間。", "退回重審：分析決策與研究問題不一致，「心理韌性」仍留在選訓草案裡。"]}};

function runAnims(h){const a=h.userData.an;if(!a)return;const lt=CLOCK-a.t0;for(const it of a.intro){if(it.done)continue;const p=(lt-it.d)/it.dur;if(p<0)continue;if(p>=1){it.fn(1);it.done=true;continue;}it.fn(it.e(p));}for(const fn of a.idle)fn(lt,a.end);}

function makeFlap(rect){const w=cvW(rect.w),h=cvH(rect.h);const pivot=new THREE.Group();const p0=cvToWorld(rect.x+rect.w/2,rect.y);pivot.position.set(p0.x,THICK+0.008,p0.z);
  const tex=canvasTex(2048,Math.max(64,Math.round(2048*h/w)),(g,cw,ch)=>{g.scale(2,2);cw/=2;ch/=2;g.fillStyle='#efe6d0';g.fillRect(0,0,cw,ch);for(let i=0;i<2500;i++){g.fillStyle=`rgba(120,90,50,${Math.random()*0.08})`;g.fillRect(Math.random()*cw,Math.random()*ch,2,1);}const gr=g.createLinearGradient(0,0,0,70);gr.addColorStop(0,'rgba(60,40,20,.25)');gr.addColorStop(1,'rgba(60,40,20,0)');g.fillStyle=gr;g.fillRect(0,0,cw,70);g.strokeStyle='rgba(60,40,20,.35)';g.lineWidth=2;g.setLineDash([10,8]);g.strokeRect(14,14,cw-28,ch-28);g.setLineDash([]);
    g.fillStyle=INK;g.textAlign='center';g.font='bold 44px '+FONT;g.fillText('掀開紙片，看回饋',cw/2,ch/2+6);g.font='bold 26px '+FONT;g.fillStyle=INK2;g.fillText('LIFT THE FLAP',cw/2,ch/2+52);});
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pageMat(tex));front.rotation.x=-Math.PI/2;front.position.z=h/2;front.castShadow=true;pivot.add(front);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xe6dcc4,roughness:.95}));back.rotation.x=Math.PI/2;back.position.set(0,-0.001,h/2);pivot.add(back);

const chapTxt=document.getElementById('chapTxt');document.getElementById('chapKey').textContent=B.caseNo?'CASE '+B.caseNo:(B.short||'BOOK');
async function locked(fn){if(S.busy)return;S.busy=true;try{await fn();}catch(e){console.error(e);}finally{S.busy=false;}}
function buildScene(spec){const g=new THREE.Group();if(spec&&('model' in spec)){if(spec.model){const st=arr(spec.model.steps);const base=Object.assign({},spec.model);delete base.steps;const h=modelHolder(st.length?Object.assign({},base,st[0]):base,0);if(ARC)h.userData.an.t0+=0.95;g.add(h);if(st.length>1)g.userData.steps={base,list:st,i:0,holder:h,hold:num(spec.model.stepHold,2.6)};}const TL=num(spec.model&&spec.model.tilt,-0.62);g.rotation.x=TL;g.position.y=0.36;g.position.z=0.26;g.scale.setScalar(1.06);if(spec.compact){g.scale.setScalar(0.9);g.position.z=-0.3;g.position.y=0.34;}S.chars={};}else{S.chars=buildStory(g,spec);g.rotation.x=num(spec&&spec.tilt,-0.42);g.scale.setScalar(0.8);g.position.y=0.5;g.position.z=0.22;}anchor.add(g);S.sceneGroup=g;if(spec&&spec.model){const H=[];g.traverse(o=>{if(o.userData.an)H.push(o.userData.an);});H.forEach(q=>q.intro.forEach(x=>x.fn(1)));
    const measure=()=>{g.updateMatrixWorld(true);const bx=new THREE.Box3(),b1=new THREE.Box3();g.traverse(o=>{if((o.isMesh||o.isSprite)&&o.visible&&o.geometry&&!(o.isMesh&&o.material&&o.material.depthWrite===false)){if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();b1.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);bx.union(b1);}});return bx;};
    let bx=measure();if(!bx.isEmpty()){const k=anchor.scale.x,sz=bx.getSize(new THREE.Vector3());const lim=spec.compact?[1.9,1.15,1.35]:[2.45,1.5,1.7];const f=Math.max(0.8,Math.min(lim[0]/(sz.x/k),lim[1]/(sz.z/k),lim[2]));g.scale.multiplyScalar(f);
      bx=measure();const c=bx.getCenter(new THREE.Vector3());const want=rightPage.localToWorld(new THREE.Vector3(0,spec.compact?0.56:0.6,0));g.position.x+=(want.x-c.x)/k;g.position.z+=(want.z-c.z)/k;}
    H.forEach(q=>q.intro.forEach(x=>{if(!x.done)x.fn(0);}));}if(ARC)ARC.inkIn(g,spec&&spec.model?spec.model:spec);g.traverse(o=>{if(o.userData.type==='char')o.userData.baseY=o.position.y;});g.children.forEach(c=>{c.userData.bs=c.scale.x;c.scale.setScalar(0.001);});
  return new Promise(res=>{let n=0;if(!g.children.length)return res();g.children.forEach((c,i)=>gsap.to(c.scale,{x:c.userData.bs,y:c.userData.bs,z:c.userData.bs,duration:0.9,ease:'elastic.out(1,0.5)',delay:Math.min(i,20)*0.05+(ARC?0.95:0),onStart:()=>{if(i%3===0)AUDIO.pop(i%5);},onComplete:()=>{if(++n===g.children.length)res();}}));});}
let STEP=null,PEND=null;
function stepTick(){const sg=S.sceneGroup;const st=sg&&sg.userData.steps;if(!st||S.busy||S.state==='TURN'||S.state==='LIFTING')return;const a=st.holder.userData.an;if(CLOCK-a.t0<Math.max(a.end+st.hold,4.5))return;
  st.i=(st.i+1)%st.list.length;const old=st.holder;let rot=0;old.traverse(o=>{if(o.userData.float)rot=o.userData.rotBase;});
  gsap.to(old.scale,{x:0.001,y:0.001,z:0.001,duration:0.3,ease:'power2.in',onComplete:()=>sg.remove(old)});
  const h=modelHolder(Object.assign({},st.base,st.list[st.i]),rot);h.userData.an.t0+=0.25;sg.add(h);st.holder=h;if(ARC)ARC.inkSwap(h);AUDIO.pop(st.i%5);
  if(STEP){STEP.i=st.i;STEP.cap=st.list[st.i].cap||'';if(S.reR)S.reR(rightCanvas);if(S.reL){S.reL(leftCanvas);if(lastCue)drawCue(lastCue);}}}
window.__dbg=()=>{const sg=S.sceneGroup,st=sg&&sg.userData.steps;return {clock:CLOCK,step:st?st.i:null,end:st?st.holder.userData.an.end:null,t0:st?st.holder.userData.an.t0:null};};
function flatten(){const g=S.sceneGroup;if(!g)return Promise.resolve();if(ARC)ARC.inkOut(g);return new Promise(res=>{let n=0;if(!g.children.length){anchor.remove(g);S.sceneGroup=null;return res();}g.children.forEach((c,i)=>gsap.to(c.scale,{y:0.001,z:0.001,duration:0.4,ease:'power3.in',delay:Math.min(i,20)*0.02,onComplete:()=>{if(++n===g.children.length){anchor.remove(g);S.sceneGroup=null;res();}}}));});}
function snapshotRight(){flipFrontCanvas.getContext('2d').drawImage(rightCanvas,0,0,PW,PH);flipFrontTex.needsUpdate=true;}
async function turnPage(newLeftDraw,newRightDraw,sceneSpec){S.state='TURN';STEP=PEND?PEND.step:null;S.reL=PEND?PEND.left:null;S.reR=PEND?PEND.right:null;PEND=null;snapshotRight();if(flap){book.remove(flap);flap=null;}
  await flatten();pageNo+=2;newLeftDraw(flipBackCanvas);flipBackTex.needsUpdate=true;rightNote=null;newRightDraw(rightCanvas);
  flipPivot.rotation.z=0;flipPivot.visible=true;AUDIO.flip();
  await new Promise(r=>gsap.to(flipPivot.rotation,{z:Math.PI,duration:1.1,ease:'power2.inOut',onComplete:r}));
  newLeftDraw(leftCanvas);flipPivot.visible=false;if(sceneSpec)await buildScene(sceneSpec);}
const A=()=>ACTS[S.act]||{beats:[]};
function nextIsTurn(){const nb=arr(A().beats)[S.beat+1];return !nb||nb.type==='choice'||nb.type==='note'||nb.type==='scene';}
function cont(h){return {k:h.k,t:String(h.t).replace('（續）','')+'（續）'};}
function textBlock(b){return b.s===undefined||b.s==='n'||!CAST[b.s]?{type:'narr',t:b.t}:{type:'say',s:b.s,t:b.t};}
function enterAct(i){S.act=i;const a=A();return locked(async()=>{S.scene=a.scene||{type:'lab',cast:Object.keys(B.cast||{}).slice(0,3)};currentFig=a.fig||{cap:'',sub:''};S.chap=(a.key||'')+' ・ '+(a.title||'');chapTxt.textContent=S.chap;S.onNote=false;S.pendingTurn=false;doc=[];curHeader={k:a.key||'',t:a.title||''};
  await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';S.beat=0;}).then(()=>{if(S.state==='READING'&&S.beat===0)showBeat();});}
function finishAct(){const a=A();const last=S.act>=ACTS.length-1;const blk={type:'end',t:(a.key||'')+' ・ 完'};const cue=last?'翻頁看結案報告 ▸':'翻頁進入'+(ACTS[S.act+1].key||'下一幕')+' ▸';
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  doc.push(blk);const y=renderLeft(leftCanvas,doc,curHeader);if(y>PH-120&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  S.state='END';drawCue(cue);}
function showBeat(){const b=arr(A().beats)[S.beat];if(!b){finishAct();return;}
  if(b.type==='note'){const n=(B.notes||{})[b.id];if(!n){S.beat++;showBeat();return;}locked(async()=>{S.onNote=true;const ns=arr(((n.fig||{}).model||{}).steps);PEND={step:ns.length>1?{i:0,n:ns.length,cap:ns[0].cap||''}:null,left:null,right:c=>renderNoteRight(c,n)};chapTxt.textContent='研究筆記 '+n.no+' ・ '+n.t;await turnPage(c=>renderNoteLeft(c,n),c=>renderNoteRight(c,n),{model:(n.fig||{}).model,compact:arr((n.fig||{}).table).length>0});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='viz'){const vs=arr((b.model||{}).steps);const n={no:'',t:b.title||'',fig:{model:b.model,cap:b.cap||'',sub:b.sub||'',points:b.points}};locked(async()=>{S.onNote=true;chapTxt.textContent='模型動畫 ・ '+(b.title||'');PEND={step:vs.length>1?{i:0,n:vs.length,cap:vs[0].cap||''}:null,left:c=>renderVizLeft(c,b),right:c=>renderNoteRight(c,n)};await turnPage(c=>renderVizLeft(c,b),c=>renderNoteRight(c,n),{model:b.model});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='scene'){if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;if(b.title)curHeader={k:curHeader.k,t:b.title};S.pendingTurn=true;S.beat++;showBeat();return;}
  if(b.type==='choice'){S.state='CHOICE';S.choice=b;S.picked=null;S.onNote=false;S.pendingTurn=false;if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;
    locked(async()=>{chapTxt.textContent=(A().key||'')+' ・ 研究決策';const opts=arr(b.opts);let sz=38,osz=33;const est=measureRuns(parseEm(b.q),PW-240,sz,sz*1.45,true)+opts.reduce((s,o)=>s+measureRuns(parseEm(o.t),PW-360,osz,osz*1.45)+46,0);if(est>820){sz=34;osz=29;}if(est>1000){sz=31;osz=26;}
      doc=[{type:'question',t:b.q,sz},...opts.map((o,i)=>({type:'option',k:'ABCDE'[i],t:o.t,idx:i,state:'',sz:osz}))];curHeader={k:(A().key||'')+' ・ 研究決策',t:b.header||'你會怎麼做？'};
      await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),b.model?{model:b.model}:S.scene);S.state='CHOICE';drawCue('點選一個選項 ▸');});return;}
  const blk=textBlock(b);
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  doc.push(blk);const yEnd=renderLeft(leftCanvas,doc,curHeader);
  if(yEnd>PH-150&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  AUDIO.click();drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');}
function showEnding(){locked(async()=>{chapTxt.textContent='結案報告';await turnPage(c=>renderEndLeft(c),c=>renderEndRight(c),(B.ending&&B.ending.model)?{model:B.ending.model}:((B.ending&&B.ending.scene)||null));S.state='DONE';if(window.__markDone)window.__markDone();});}
function advance(){if(S.busy)return;if(S.state==='TITLE'){AUDIO.init();if(ACTS.length)enterAct(0);return;}
  if(S.state==='READING'||S.state==='AFTER'){S.beat++;showBeat();return;}
  if(S.state==='END'){if(S.act<ACTS.length-1)enterAct(S.act+1);else showEnding();}}
function pickOption(idx){if(S.state!=='CHOICE'||S.picked!==null)return;const o=arr(S.choice.opts)[idx];if(!o)return;S.picked=idx;AUDIO.click();DECISIONS.push({q:S.choice.header||S.choice.q,t:o.t,good:!!o.good});
  doc.forEach(b=>{if(b.type==='option')b.state=b.idx===idx?'picked':'dim';});
  // fit question+options+feedback on page: shrink feedback if needed
  let fsz=32;doc.push({type:'feedback',t:o.fb||'',good:!!o.good,sz:fsz});let y=renderLeft(leftCanvas,doc,curHeader);
  while(y>PH-110&&fsz>22){fsz-=2;doc[doc.length-1].sz=fsz;y=renderLeft(leftCanvas,doc,curHeader);}
  if(y>PH-110){doc=doc.filter(b=>b.type!=='option'||b.state==='picked');y=renderLeft(leftCanvas,doc,curHeader);}
  if(fbRect){flap=makeFlap(fbRect);S.state='FLAP';drawCue('掀開紙片 ▸');}else{S.state='AFTER';}}
function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=arr(S.choice.opts)[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});
  gsap.delayedCall(1.0,()=>{AUDIO.chime(!!o.good);S.state='AFTER';S.pendingTurn=true;renderLeft(leftCanvas,doc,curHeader);drawCue(nextIsTurn()?'翻頁 ▸':'翻頁繼續 ▸');});}
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips||['……'];rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}
window.__api={advance,pickOption,liftFlap};

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,dragRot=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup&&!S.onNote){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(ARC)ARC.tick(dt,t);if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
