<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTIVARIATE｜紙本書版・第一幕原型</title>
<style>
:root{--paper:#f3ecdc;--ink:#2a2419;--font:"Noto Serif TC","Source Han Serif TC","PMingLiU","Microsoft JhengHei",serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3b2a1c;font-family:var(--font);color:var(--ink)}
#three{position:fixed;inset:0}
#three canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.pill{position:absolute;top:18px;background:rgba(243,236,220,.92);border:1px solid rgba(60,40,20,.25);border-radius:999px;padding:7px 14px;font-size:13px;letter-spacing:.08em;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
#chap{left:18px}
#chap b{font-size:11px;letter-spacing:.25em;color:#8a7a5a;font-weight:400}
#tools{right:18px;padding:5px 8px;gap:4px}
#tools button{border:none;background:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}

#tools svg{width:18px;height:18px;fill:none;stroke:#5a4a30;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.off svg{stroke:#b8a98a}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:rgba(243,236,220,.7);transition:opacity 1s}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#3b2a1c;color:#d9c9a8;letter-spacing:.3em;font-size:13px;transition:opacity .6s}
</style>
</head>
<body>
<div id="three"></div>
<div id="ui">
  <div id="loading">翻開書本中…</div>
  <div id="chap" class="pill"><b>CASE 01</b><span id="chapTxt">扉頁</span></div>
  <div id="tools" class="pill"><button id="btnMute" title="音樂開關"><svg id="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg></button></div>
  <div id="hint">點擊書頁或按空白鍵翻閱 ・ 點擊角色可讀到他們的心聲</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
gsap.ticker.lagSmoothing(0);
/* ===================== Web Audio ===================== */
const AUDIO=(function(){let ctx,master,music,noise,muted=false,ready=false;const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
  function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=0.8;master.connect(ctx.destination);music=ctx.createGain();music.gain.value=0.35;const dl=ctx.createDelay(1);dl.delayTime.value=0.4;const fb=ctx.createGain();fb.gain.value=0.3;dl.connect(fb);fb.connect(dl);const wet=ctx.createGain();wet.gain.value=0.3;dl.connect(wet);wet.connect(master);music.connect(master);music.connect(dl);
    const n=ctx.sampleRate;noise=ctx.createBuffer(1,n,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    let next=ctx.currentTime+0.6,last=3;(function tick(){while(next<ctx.currentTime+1.2){let i=Math.max(0,Math.min(8,last+Math.floor(Math.random()*5)-2));last=i;const o=ctx.createOscillator();o.type='triangle';o.frequency.value=PENTA[i];const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;const g=ctx.createGain();const t=next,dur=1.4+Math.random();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.14,t+0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(music);o.start(t);o.stop(t+dur+0.1);next+=0.9+Math.random()*1.2;}setTimeout(tick,400);})();ready=true;}
  const sg=v=>{const g=ctx.createGain();g.gain.value=v;g.connect(master);return g;};
  function flip(){if(!ctx||muted)return;const t=ctx.currentTime,s=ctx.createBufferSource();s.buffer=noise;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.8;bp.frequency.setValueAtTime(600,t);bp.frequency.exponentialRampToValueAtTime(3000,t+0.3);const g=sg(0.001);g.gain.exponentialRampToValueAtTime(0.45,t+0.08);g.gain.exponentialRampToValueAtTime(0.001,t+0.45);s.connect(bp);bp.connect(g);s.start(t);s.stop(t+0.5);}
  function pop(p){if(!ctx||muted)return;const t=ctx.currentTime,o=ctx.createOscillator();o.type='sine';const b=260+(p||0)*40;o.frequency.setValueAtTime(b,t);o.frequency.exponentialRampToValueAtTime(b*2.5,t+0.1);const g=sg(0.001);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);o.start(t);o.stop(t+0.2);}
  function click(){if(!ctx||muted)return;const t=ctx.currentTime,o=ctx.createOscillator();o.type='square';o.frequency.value=1100;const g=sg(0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);o.connect(g);o.start(t);o.stop(t+0.05);}
  function chime(good){if(!ctx||muted)return;const t=ctx.currentTime;(good?[523.25,659.25,783.99]:[392,349.23]).forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;const g=sg(0.001);g.gain.setValueAtTime(0.0001,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.2,t+i*0.12+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.6);o.connect(g);o.start(t+i*0.12);o.stop(t+i*0.12+0.7);});}
  function toggle(){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:0.8,ctx.currentTime,0.05);return muted;}
  return {init,flip,pop,click,chime,toggle,get ready(){return ready;}};})();

/* ===================== Three.js world ===================== */
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;document.getElementById('three').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2b1d12);scene.fog=new THREE.Fog(0x2b1d12,14,30);

fitCamera();camera.position.copy(camHome.pos);const camTarget=camHome.target.clone();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitCamera();if(typeof gsap!=='undefined'){camera.position.copy(camHome.pos);camTarget.copy(camHome.target);}renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.AmbientLight(0xffe6c4,0.35));scene.add(new THREE.HemisphereLight(0xfff1dc,0x4a3220,0.45));
const key=new THREE.DirectionalLight(0xffe2b8,1.15);key.position.set(-3,7,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=4;key.shadow.camera.bottom=-4;key.shadow.bias=-0.0006;scene.add(key);

const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,flatShading:true},o||{}));

const MAXANI=renderer.capabilities.getMaxAnisotropy();

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;return t;}
// desk (procedural wood)
const woodTex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#6b4a2e';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.strokeStyle=`rgba(${40+Math.random()*30},${22+Math.random()*18},${10+Math.random()*10},${0.25+Math.random()*0.35})`;g.lineWidth=1+Math.random()*3;g.beginPath();let y=Math.random()*h;g.moveTo(0,y);for(let x=0;x<=w;x+=64){y+=(Math.random()-.5)*6;g.lineTo(x,y);}g.stroke();}g.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<3000;i++)g.fillRect(Math.random()*w,Math.random()*h,2,1);});
woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping;woodTex.repeat.set(3,3);
const desk=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({map:woodTex,roughness:.75}));desk.rotation.x=-Math.PI/2;desk.position.y=-0.3;desk.receiveShadow=true;scene.add(desk);

/* ---------- paper ---------- */
const PW=1024,PH=1400,RES=2;const paperBase=document.createElement('canvas');paperBase.width=PW*RES;paperBase.height=PH*RES;(function(g){g.setTransform(RES,0,0,RES,0,0);g.fillStyle='#f4eddc';g.fillRect(0,0,PW,PH);for(let i=0;i<9000;i++){g.fillStyle=`rgba(${120+Math.random()*60},${100+Math.random()*50},${60+Math.random()*40},${Math.random()*0.08})`;g.fillRect(Math.random()*PW,Math.random()*PH,1+Math.random()*2,1);}const gr=g.createLinearGradient(0,0,PW,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');})(paperBase.getContext('2d'));
function paperCanvas(){const c=document.createElement('canvas');c.width=PW*RES;c.height=PH*RES;const g=c.getContext('2d');g.setTransform(RES,0,0,RES,0,0);g.drawImage(paperBase,0,0,PW,PH);return c;}
function spineShade(g,side){const gr=side==='L'?g.createLinearGradient(PW-70,0,PW,0):g.createLinearGradient(0,0,70,0);gr.addColorStop(side==='L'?0:1,'rgba(40,35,30,0)');gr.addColorStop(side==='L'?1:0,'rgba(40,35,30,.16)');g.fillStyle=gr;g.fillRect(side==='L'?PW-70:0,0,70,PH);}
// rich text layout: runs [{t,c,b,sz}]
function parseEm(s){const runs=[];const re=/<em>([\s\S]*?)<\/em>/g;let i=0,m;while((m=re.exec(s))){if(m.index>i)runs.push({t:s.slice(i,m.index)});runs.push({t:m[1],em:true});i=m.index+m[0].length;}if(i<s.length)runs.push({t:s.slice(i)});return runs.map(r=>({...r,t:r.t.replace(/<[^>]+>/g,'')}));}
const NOSTART='。，、」』）！？；：…·';
function drawRuns(g,runs,x,y,maxW,size,lh,color,emColor,bold){g.textBaseline='alphabetic';let cx=x,cy=y;const chars=[];runs.forEach(r=>{for(const ch of r.t)chars.push({ch,em:!!r.em});});
  for(let i=0;i<chars.length;i++){const {ch,em}=chars[i];g.font=`${bold||em?'bold ':''}${size}px ${FONT}`;const w=g.measureText(ch).width;if(ch==='\n'){cx=x;cy+=lh;continue;}
    if(cx+w>x+maxW&&!NOSTART.includes(ch)){cx=x;cy+=lh;}
    g.fillStyle=em?emColor:color;g.fillText(ch,cx,cy);if(!(bold||em)){g.strokeStyle=g.fillStyle;g.lineWidth=size*0.045;g.lineJoin='round';g.strokeText(ch,cx,cy);}cx+=w+(/[a-zA-Z0-9]/.test(ch)?0:0.5);}
  return cy+lh;}

/* ---------- book geometry ---------- */
const BW=2.2,BH=3.0,THICK=0.22;
const book=new THREE.Group();scene.add(book);
const coverMat=mat(0x3a2f2a,{roughness:.9});
book.add(at(box(BW*2+0.32,0.06,BH+0.24,coverMat),0,-0.03,0));// hard cover
[-1,1].forEach(s=>{const stack=box(BW-0.02,THICK,BH-0.02,0xe9e1cc);stack.position.set(s*(BW/2+0.08),THICK/2,0);book.add(stack);const edge=box(BW-0.02,THICK,0.012,0xd9cfb6);edge.position.set(s*(BW/2+0.08),THICK/2,BH/2-0.005);book.add(edge);});
book.add(at(box(0.16,THICK+0.02,BH,0x2e2622),0,THICK/2,0));// spine groove
const leftCanvas=paperCanvas(),rightCanvas=paperCanvas();
const leftTex=new THREE.CanvasTexture(leftCanvas),rightTex=new THREE.CanvasTexture(rightCanvas);[leftTex,rightTex].forEach(t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;});
function pageMesh(tex){const m=new THREE.Mesh(new THREE.PlaneGeometry(BW,BH),pageMat(tex));m.rotation.x=-Math.PI/2;m.receiveShadow=true;return m;}
const leftPage=pageMesh(leftTex);leftPage.position.set(-(BW/2+0.08),THICK+0.002,0);book.add(leftPage);
const rightPage=pageMesh(rightTex);rightPage.position.set(BW/2+0.08,THICK+0.002,0);book.add(rightPage);
const anchor=new THREE.Group();anchor.position.set(BW/2+0.08,THICK+0.004,0.05);anchor.scale.setScalar(0.82);book.add(anchor);
// flip sheet (pivot at spine, extends +x)
const flipPivot=new THREE.Group();flipPivot.position.set(0.0,THICK+0.004,0);flipPivot.visible=false;book.add(flipPivot);
const flipFrontCanvas=paperCanvas(),flipBackCanvas=paperCanvas();const flipFrontTex=new THREE.CanvasTexture(flipFrontCanvas),flipBackTex=new THREE.CanvasTexture(flipBackCanvas);[flipFrontTex,flipBackTex].forEach(t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;});
const flipFront=new THREE.Mesh(new THREE.PlaneGeometry(BW,BH),pageMat(flipFrontTex));flipFront.rotation.x=-Math.PI/2;flipFront.position.x=BW/2+0.08;flipFront.castShadow=true;flipPivot.add(flipFront);
const flipBack=new THREE.Mesh(new THREE.PlaneGeometry(BW,BH),pageMat(flipBackTex));flipBack.rotation.x=Math.PI/2;flipBack.rotateZ(Math.PI);flipBack.position.set(BW/2+0.08,-0.002,0);flipPivot.add(flipBack);
// canvas <-> world mapping on the left page
const L_X=-(BW/2+0.08);
const cvToWorld=(cx,cy)=>new THREE.Vector3(L_X+(cx/PW-0.5)*BW,THICK+0.004,(cy/PH-0.5)*BH);
const cvW=px=>px/PW*BW,cvH=px=>px/PH*BH;

/* ---------- characters & props (paper-friendly palette) ---------- */
function makeChar(o){o=Object.assign({skin:0xf0cdaa,shirt:0x4f7cc1,pants:0x3a3a4a,hair:0x3a2a22,hairStyle:'short',glasses:false,coat:false,acc:null,scale:1},o);const g=new THREE.Group();
  [-0.09,0.09].forEach(x=>{g.add(at(cyl(0.07,0.08,0.26,o.pants,8),x,0.13,0));g.add(at(box(0.16,0.07,0.22,0x2a2a2a),x,0.035,0.04));});
  const bodyC=o.coat?0xf5f1e6:o.shirt;g.add(at(cyl(0.2,0.24,0.42,bodyC,10),0,0.47,0));if(o.coat)g.add(at(box(0.13,0.36,0.05,o.shirt),0,0.48,0.22));if(o.acc==='tie')g.add(at(box(0.05,0.22,0.02,0xb34a4a),0,0.5,0.24));

const CHARS={
  prof:{name:'周啟宏教授',o:{shirt:0x2b3a6b,hair:0x9a9a9a,acc:'tie'},quips:['我們解釋了 56% 的變異！','審查委員當初都說很好。','轉軸只是數學技巧吧？']},

const MATHF='"Cambria Math","Cambria","Times New Roman",'+FONT;
function seeded(s){return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function arrow(g,x1,y1,x2,y2,col,lw,head){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw||3;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();const a=Math.atan2(y2-y1,x2-x1),hs=head||16;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));g.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));g.closePath();g.fill();}
function label(g,t,x,y,size,col,align,bold){g.fillStyle=col||INK;g.font=(bold?'bold ':'')+size+'px '+FONT;g.textAlign=align||'left';g.fillText(t,x,y);g.textAlign='left';}

// 圖 N1：PCA 的幾何意義
function figPCA(g,x,y,w,h){const cx=x+w/2,cy=y+h/2+10,sc=Math.min(w,h)/7.2;const r=seeded(20241101);
  g.strokeStyle='rgba(60,40,20,.5)';g.lineWidth=2;arrow(g,x+30,cy,x+w-20,cy,'rgba(60,40,20,.6)',2,12);arrow(g,cx,y+h-20,cx,y+30,'rgba(60,40,20,.6)',2,12);
  label(g,'Z₁ 垂直跳（標準化）',x+w-20,cy+38,24,INK2,'right',true);label(g,'Z₂ 深蹲負荷',cx+14,y+46,24,INK2,'left',true);
  const ang=-Math.PI/4;
  g.save();g.translate(cx,cy);g.rotate(ang);g.strokeStyle='rgba(12,74,69,.45)';g.setLineDash([8,8]);g.lineWidth=2.5;g.beginPath();g.ellipse(0,0,2.5*sc,0.95*sc,0,0,Math.PI*2);g.stroke();g.setLineDash([]);g.restore();
  for(let i=0;i<140;i++){const a=gauss(r)*1.15,b=gauss(r)*0.42;const px=cx+(a*Math.cos(ang)-b*Math.sin(ang))*sc,py=cy+(a*Math.sin(ang)+b*Math.cos(ang))*sc;g.fillStyle='rgba(23,18,12,.55)';g.beginPath();g.arc(px,py,4.5,0,Math.PI*2);g.fill();}
  arrow(g,cx,cy,cx+Math.cos(ang)*2.9*sc,cy+Math.sin(ang)*2.9*sc,TEAL,6,22);arrow(g,cx,cy,cx+Math.cos(ang-Math.PI/2)*1.2*sc,cy+Math.sin(ang-Math.PI/2)*1.2*sc,ACC,6,20);
  label(g,'PC1：變異最大的方向',cx+Math.cos(ang)*2.9*sc-10,cy+Math.sin(ang)*2.9*sc-18,26,TEAL,'right',true);
  label(g,'PC2：與 PC1 垂直',cx+Math.cos(ang-Math.PI/2)*1.2*sc-14,cy+Math.sin(ang-Math.PI/2)*1.2*sc-8,26,ACC,'right',true);
  label(g,'λ₁ ＝ 資料沿 PC1 的變異量（特徵值）',x+40,y+h-24,24,INK2,'left',true);}

function figLoad(g,x,y,w,h){const rows=[['專注力量表',.62],['自信心量表',.55],['焦慮（反向計分）',.48],['最大攝氧量',.10],['深蹲 1RM',-.51],['垂直跳',-.58]];
  const lx=x+250,mid=lx+(w-260)/2,half=(w-300)/2,top=y+80,rh=(h-150)/rows.length;
  label(g,'成分 2（研究團隊命名為「心理韌性」）',x+w/2,y+36,26,INK,'center',true);
  g.strokeStyle='rgba(60,40,20,.55)';g.lineWidth=2;g.beginPath();g.moveTo(mid,top-10);g.lineTo(mid,top+rh*rows.length);g.stroke();
  [-.4,.4].forEach(v=>{const px=mid+v/0.7*half;g.strokeStyle='rgba(134,32,15,.5)';g.setLineDash([6,6]);g.beginPath();g.moveTo(px,top-10);g.lineTo(px,top+rh*rows.length);g.stroke();g.setLineDash([]);label(g,(v>0?'+':'−')+'.40',px,top-18,22,ACC,'center',true);});
  label(g,'0',mid,top-18,22,INK2,'center',true);
  rows.forEach(([n,v],i)=>{const yy=top+i*rh,bh=rh*0.56,bw=Math.abs(v)/0.7*half;g.fillStyle=v>=0?'rgba(12,74,69,.85)':'rgba(134,32,15,.85)';g.fillRect(v>=0?mid:mid-bw,yy+(rh-bh)/2,bw,bh);
    label(g,n,lx-16,yy+rh/2+9,25,INK,'right',true);label(g,(v>0?'+':'−')+Math.abs(v).toFixed(2).slice(1),v>=0?mid+bw+10:mid-bw-10,yy+rh/2+9,23,v>=0?TEAL:ACC,v>=0?'left':'right',true);});
  label(g,'◀ 肌力端',mid-half,y+h-14,24,ACC,'left',true);label(g,'心理量表端 ▶',mid+half,y+h-14,24,TEAL,'right',true);}

// 圖 N3：PCA 與因素分析的路徑圖
function figPath(g,x,y,w,h){const half=w/2;
  function boxV(bx,by,t){g.fillStyle='#fffaf0';g.strokeStyle=INK;g.lineWidth=2.5;g.fillRect(bx-36,by-24,72,48);g.strokeRect(bx-36,by-24,72,48);label(g,t,bx,by+9,24,INK,'center',true);}
  // PCA
  label(g,'PCA：指標 → 成分',x+half/2,y+34,26,TEAL,'center',true);label(g,'（加權總和，沒有誤差項）',x+half/2,y+66,21,INK2,'center',true);
  const ys=[0,1,2,3].map(i=>y+120+i*78);const bx1=x+70,px=x+half-80,py=y+120+117;
  ys.forEach((yy,i)=>{boxV(bx1,yy,'Z'+'₁₂₃₄'[i]);arrow(g,bx1+38,yy,px-62,py+(yy-py)*0.25,TEAL,2.5,13);});
  g.fillStyle='rgba(12,74,69,.12)';g.strokeStyle=TEAL;g.lineWidth=3;roundRect(g,px-60,py-34,120,68,8);g.fill();g.stroke();label(g,'PC',px,py+10,28,TEAL,'center',true);
  label(g,'w',x+half/2+10,py-56,24,TEAL,'center',true);
  g.strokeStyle='rgba(60,40,20,.3)';g.lineWidth=1.5;g.beginPath();g.moveTo(x+half,y+20);g.lineTo(x+half,y+h-20);g.stroke();
  // FA
  const fx=x+half+80,fy=py,bx2=x+w-130,ex=x+w-36;
  label(g,'因素分析：因素 → 指標',x+half+half/2,y+34,26,ACC,'center',true);label(g,'（共同原因＋獨特誤差 ε）',x+half+half/2,y+66,21,INK2,'center',true);
  g.fillStyle='rgba(134,32,15,.1)';g.strokeStyle=ACC;g.lineWidth=3;g.beginPath();g.arc(fx,fy,44,0,Math.PI*2);g.fill();g.stroke();label(g,'F',fx,fy+11,32,ACC,'center',true);
  ys.forEach((yy,i)=>{arrow(g,fx+46,fy+(yy-fy)*0.25,bx2-40,yy,ACC,2.5,13);boxV(bx2,yy,'Z'+'₁₂₃₄'[i]);g.strokeStyle=INK2;g.lineWidth=2;g.beginPath();g.arc(ex,yy,16,0,Math.PI*2);g.stroke();label(g,'ε',ex,yy+7,20,INK2,'center',true);arrow(g,ex-17,yy,bx2+38,yy,INK2,2,10);});
  label(g,'λ',fx+70,fy-60,26,ACC,'center',true);
  // 對照表
  const ty=y+h-250,cols=[x+20,x+230,x+w/2+110],rows=[['','PCA','因素分析'],['箭頭方向','指標 → 成分','因素 → 指標'],['分析的變異','全部變異','只有共同變異'],['誤差項','沒有','有（ε）'],['結果的地位','加權總分','潛在構念的估計']];
  rows.forEach((r,i)=>{const yy=ty+i*48;if(i===0||i===1){g.fillStyle='rgba(60,40,20,.45)';g.fillRect(x+20,yy+(i?-34:14),w-40,1.5);}r.forEach((t,j)=>label(g,t,cols[j],yy,24,i===0?(j===1?TEAL:ACC):(j===0?INK2:INK),'left',true));});
  g.fillStyle='rgba(60,40,20,.45)';g.fillRect(x+20,ty+4*48+16,w-40,1.5);}

// 圖 N4：陡坡圖與平行分析
function figScree(g,x,y,w,h){const ev=[7.1,3.6,2.7,1.15,0.95,0.86,0.78,0.71,0.65,0.6],pa=[1.62,1.5,1.41,1.34,1.27,1.21,1.15,1.1,1.05,1.0];
  const ox=x+90,oy=y+h-70,aw=w-130,ah=h-130,ymax=8;const X=i=>ox+(i+0.5)*aw/ev.length,Y=v=>oy-v/ymax*ah;
  g.strokeStyle='rgba(60,40,20,.6)';g.lineWidth=2;g.beginPath();g.moveTo(ox,oy-ah);g.lineTo(ox,oy);g.lineTo(ox+aw,oy);g.stroke();
  [0,2,4,6,8].forEach(v=>label(g,String(v),ox-14,Y(v)+8,22,INK2,'right',true));ev.forEach((_,i)=>label(g,String(i+1),X(i),oy+32,22,INK2,'center',true));
  label(g,'成分序號',ox+aw,oy+62,22,INK2,'right',true);label(g,'特徵值 λ',ox-70,oy-ah-18,22,INK2,'left',true);
  g.strokeStyle=TEAL;g.setLineDash([4,6]);g.lineWidth=2.5;g.beginPath();g.moveTo(ox,Y(1));g.lineTo(ox+aw,Y(1));g.stroke();label(g,'Kaiser：λ ＞ 1',X(0)-20,Y(1)+34,23,TEAL,'left',true);
  g.strokeStyle=ACC;g.setLineDash([12,8]);g.lineWidth=3;g.beginPath();pa.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();g.setLineDash([]);g.strokeStyle='rgba(134,32,15,.6)';g.lineWidth=1.5;g.beginPath();g.moveTo(X(6.5),Y(2.55));g.lineTo(X(6.5),Y(1.2)-4);g.stroke();label(g,'平行分析：隨機資料的 λ',X(5),Y(2.7),23,ACC,'left',true);
  g.strokeStyle=INK;g.lineWidth=3;g.beginPath();ev.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  ev.forEach((v,i)=>{g.fillStyle=i<3?TEAL:(i===3?ACC:INK2);g.beginPath();g.arc(X(i),Y(v),i<4?9:6,0,Math.PI*2);g.fill();});
  label(g,'λ₁～λ₃ 都高於隨機線 → 保留 3 個',X(1)+24,Y(5.3),24,TEAL,'left',true);
  g.strokeStyle='rgba(134,32,15,.6)';g.lineWidth=1.5;g.beginPath();g.moveTo(X(3)+6,Y(1.15)-10);g.lineTo(X(4),Y(3.9)+8);g.stroke();label(g,'λ₄ ＝ 1.15：過了 Kaiser，',X(4),Y(3.9),23,ACC,'left',true);label(g,'卻低於隨機線',X(4),Y(3.9)+30,23,ACC,'left',true);
  label(g,'（示意圖：數值為教學用）',ox+aw,y+22,20,INK2,'right',true);}

function tag(text,h,col,bg){const fs=64,pad=20;const c=document.createElement('canvas');const g=c.getContext('2d');g.font='bold '+fs+'px '+FONT;const w=Math.ceil(g.measureText(text).width)+pad*2;c.width=w;c.height=fs+pad*2;g.font='bold '+fs+'px '+FONT;
  if(bg!==false){g.fillStyle=bg||'rgba(255,250,238,.9)';roundRect(g,2,2,w-4,c.height-4,24);g.fill();g.strokeStyle='rgba(60,40,20,.35)';g.lineWidth=3;g.stroke();}
  g.fillStyle=col||INK;g.textBaseline='middle';g.fillText(text,pad,c.height/2+4);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;
  h*=1.4;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,toneMapped:false}));sp.scale.set(h*w/c.height,h,1);sp.renderOrder=10;sp.raycast=()=>{};return sp;}
function arrow3(a,b,col,r){const g=new THREE.Group();const dir=b.clone().sub(a);const len=dir.length();const hl=Math.min(r*6,len*0.4);
  const shaft=cyl(r,r,len-hl,col,10);shaft.position.y=(len-hl)/2;const head=cone(r*2.6,hl,col,12);head.position.y=len-hl/2;g.add(shaft,head);
  g.position.copy(a);g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());return g;}
function seg(a,b,col,r){const d=b.clone().sub(a);const c=cyl(r,r,d.length(),col,8);c.position.copy(a.clone().add(b).multiplyScalar(0.5));c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return c;}

function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=S.choice.opts[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});gsap.delayedCall(1.0,()=>{AUDIO.chime(o.good);S.state='AFTER';renderLeft(leftCanvas,doc,curHeader);drawCue('繼續閱讀 ▸');});}
// quip on right page
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips;rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
let dragRot=null;renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}}renderer.domElement.style.cursor=cur;});
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
</script>
</body>
