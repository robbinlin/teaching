<script>
const BOOK={"file": "第04章_重複測量設計_紙本書版", "caseNo": "04", "theme": "arcane", "title": "消失的進步", "header": "CASE 04  ·  消失的進步  ·  Repeated Measures", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "REPEATED", "en": "Same Athletes, Changing Over Time", "tag": "CASE 04 ・ Repeated-Measures Design", "tagline": ["同一個人測了四次，", "卻被當成四個陌生人。"], "summary": "一篇研討會論文宣稱：12 週高強度間歇訓練（HIIT）對中長跑選手的乳酸閾值速度「沒有顯著效果」，教練準備把間歇課表整個刪掉。但這份資料其實是同一批選手、四個時間點，還有一組從未被分析的對照組。被丟掉的，是設計裡本來就有的資訊。", "conflict": "訓練真的無效，還是分析<em>把每位選手和自己的關聯<\/em>拆散了？"}, "cast": {"lead": {"name": "韓正宇", "role": "運動生理學副教授", "look": {"shirt": "#6b4f2a", "hair": "#4a4a4a", "glasses": true, "acc": "laptop"}, "quips": ["t(30) = 1.04，p = .31，很清楚。", "前測後測，不就是兩組數字嗎？", "對照組？我沒拿到那份資料。"]}, "coach": {"name": "羅建廷", "role": "田徑隊總教練", "look": {"shirt": "#b5462e", "hair": "#2a2a2a", "hairStyle": "cap", "acc": "whistle"}, "quips": ["我帶隊十年，看得出誰在進步。", "間歇課表很累，選手怨聲載道。", "不顯著，那就砍掉吧。"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["同一個人，不能當兩個人算。", "先看設計，再選檢定。", "平均在變，那每個人呢？"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["16 加 16 減 2，我算對了吧？", "Mauchly 是誰？", "原來資料要轉成長格式……"]}, "stat": {"name": "葉思妤", "role": "生物統計顧問", "look": {"shirt": "#7a5aa6", "hair": "#3a2a22", "hairStyle": "long", "glasses": true}, "quips": ["前測是最好的共變量。", "球形不是裝飾，是假設。", "先檢查斜率同質，再談組別效果。"]}}, "acts": [{"key": "第一幕", "title": "無效的訓練", "scene": {"type": "conference", "cast": ["lead", "coach", "hero", "ra"], "screen": {"title": "12 週 HIIT：無顯著效果", "sub": "獨立樣本 t(30) = 1.04，p = .31", "bars": [["前測", 14.2, "M = 14.20"], ["後測", 14.56, "M = 14.56"]]}}, "fig": {"cap": "圖 1.1　全國大專運動科學研討會", "sub": "韓正宇副教授在台上報告「HIIT 無效」的結論，羅教練坐在第一排點頭。以安與柏哲站在會場右側。點擊角色，可讀到他們的心聲。"}, "beats": [{"s": "n", "t": "深夜，研究室。桌上的第四份檔案，封面寫著：<em>消失的進步<\/em>。"}, {"s": "n", "t": "半年前，全國大專運動科學研討會。韓正宇副教授報告一項訓練研究：16 名中長跑選手接受 12 週高強度間歇訓練（HIIT），訓練前後各測一次乳酸閾值速度。"}, {"s": "lead", "t": "前測平均 14.20 km/h，後測 14.56 km/h。獨立樣本 t 檢定，t(30) = 1.04，p = .31。結論很清楚：<em>HIIT 對乳酸閾值沒有顯著效果<\/em>。"}, {"s": "coach", "t": "所以明年可以把間歇課表砍掉，回到傳統的長距離慢跑。選手也輕鬆一點。"}, {"s": "hero", "t": "（低聲）前測和後測是同一批 16 個人。為什麼自由度是 30？"}, {"s": "ra", "t": "學姊，30 不就是 16 加 16 減 2 嗎？"}, {"s": "hero", "t": "對，這正是問題。那個公式假設兩組是<em>不同的人<\/em>。"}, {"type": "viz", "title": "同一批人的兩次測量", "text": ["第一步只看論文報告的兩個平均：前測 14.20、12 週 14.56 km/h，差 0.36。若把它們當成兩組陌生人，選手之間 13 到 15 km/h 的個別差異，會全部被算進誤差。", "第二步畫出其中四位選手各自的前後測：起點高低差了將近 2 km/h，但四條線<em>都往上<\/em>。每個人和自己比，個別差異就被消去，這正是配對設計的力量。"], "model": {"type": "lines", "title": "乳酸閾值速度", "xLabels": ["前測", "12 週"], "ymin": 13.0, "ymax": 15.5, "yLabel": "km/h", "series": [{"label": "全組平均", "values": [14.2, 14.56], "color": "ink"}], "steps": [{"cap": "論文的兩個平均：14.20 → 14.56"}, {"cap": "四位選手：起點差很多，但都往上", "series": [{"label": "甲", "values": [13.2, 14.3], "color": "teal"}, {"label": "乙", "values": [14.0, 14.6], "color": "blue"}, {"label": "丁", "values": [14.4, 14.5], "color": "purple"}, {"label": "丙", "values": [15.1, 15.3], "color": "gold"}]}]}, "cap": "圖 V1　平均差背後的四個人", "sub": "點為乳酸閾值速度（km/h）。全組平均取自論文；四位選手的個人數值為教學示意。", "points": ["個別差異大，個人內的改變卻一致。"]}, {"type": "choice", "header": "前後測該怎麼比？", "q": "同一批 16 名選手，在 HIIT 前後各測一次乳酸閾值速度。比較前後測平均，應該用哪一種檢定？", "opts": [{"t": "獨立樣本 t 檢定：前測一組、後測一組，df = 30。", "good": false, "fb": "前後測是同一批人，分數高度相關（r = .90）。獨立 t 假設兩組互相獨立，把選手之間的個別差異全部算進誤差，標準誤被高估約三倍，才得到 p = .31。"}, {"t": "配對 t 檢定：每人算後測減前測，檢定差異平均是否為 0，df = 15。", "good": true, "fb": "配對 t 讓每位選手當自己的對照，選手間的差異被消去。重新分析：t(15) = 3.28，p = .005，d_z = 0.82。但這只證明「有改變」，還不能證明改變是 HIIT 造成的。"}, {"t": "只比較後測是否高於全國常模，不需要前測。", "good": false, "fb": "常模來自不同母群，與本隊選手的起點無關。單組後測設計沒有比較基準，也浪費了前測已經蒐集到的配對資訊。"}, {"t": "Mann–Whitney U 檢定，因為每組只有 16 人。", "good": false, "fb": "Mann–Whitney 也是獨立樣本的方法，同樣忽略配對。若擔心常態性，配對資料的無母數選擇是 Wilcoxon 符號等級檢定或符號檢定。"}]}, {"type": "note", "id": "paired"}, {"type": "viz", "title": "如果 HIIT 完全無效", "text": ["想像 HIIT 毫無效果，同樣的研究重做 200 次，每次算一個 t 值。第一步讓 200 顆球落下，堆出虛無假設下的分布（以常態近似），紅色是 t ＞ 2.13 的右側拒絕域；獨立 t ＝ 1.04 落在分布中段，很常見。", "第二步標出配對 t ＝ 3.28：它落在右尾外側，200 次裡幾乎碰不到。同一份資料，只因為<em>誤差的算法<\/em>不同，結論就從「無效」變成「有改變」。"], "model": {"type": "drops", "title": "虛無假設下重做 200 次", "x": [-4, 4], "dist": {"mu": 0, "sd": 1}, "n": 200, "bins": 17, "seed": 7, "shade": {"from": 2.13, "to": 4, "label": "拒絕域", "color": "red"}, "xLabel": "t 值", "marks": [{"x": 1.04, "label": "獨立 t", "color": "gold"}], "steps": [{"cap": "獨立 t ＝ 1.04：落在分布中段"}, {"cap": "配對 t ＝ 3.28：遠在拒絕域裡", "marks": [{"x": 1.04, "label": "獨立 t", "color": "gold"}, {"x": 3.28, "label": "配對 t", "color": "teal"}]}]}, "cap": "圖 V2　虛無分布裡的兩個 t 值", "sub": "每顆球代表一次「HIIT 無效」的模擬研究（數值為教學示意）；紅色為右側拒絕域，臨界值 t(15) ＝ 2.13。", "points": ["配對 t(15) ＝ 3.28，p ＝ .005。"]}, {"s": "coach", "t": "不過我帶隊十年，國中、高中、大學選手的閾值速度一路往上。練了就會進步，這還需要統計嗎？"}, {"s": "hero", "t": "教練，那是<em>不同年齡的不同人<\/em>。橫斷面的年齡差異，不等於同一個人隨時間的改變。"}, {"type": "note", "id": "waves"}, {"s": "n", "t": "散會後，以安寫了一封信給韓教授，請求原始資料。"}]}, {"key": "第二幕", "title": "四個時間點", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "HIIT 組原始資料", "lines": ["n ＝ 16 名中長跑選手", "前測、4 週、8 週、12 週", "乳酸閾值速度（km/h）", "附件：教練的達標紀錄"]}}, "fig": {"cap": "圖 2.1　三週後的研究室", "sub": "資料寄來了。原來每 4 週都測了一次，論文卻只報告了第一次和最後一次。"}, "beats": [{"s": "n", "t": "三週後，研究室。韓教授的資料寄來了。"}, {"s": "ra", "t": "學姊，原來他們不只測兩次！每 4 週都測了一次，只是論文只報告前測和 12 週。"}, {"s": "hero", "t": "還有另一張表：教練把每個人的前後測分成「達標」與「未達標」。前測 6 人達標，後測 11 人。"}, {"s": "ra", "t": "這個簡單，我做個卡方檢定就好。"}, {"type": "choice", "header": "達標表怎麼檢定？", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "達標人數（n ＝ 16）", "bars": [["前測達標", 6, "6 人"], ["後測達標", 11, "11 人"]]}}, "fig": {"cap": "圖 2.2　教練的達標紀錄", "sub": "同樣 16 個人，前測與後測各被分類一次。達標人數從 6 人變成 11 人。"}, "q": "教練把選手前後測分為「達標」與「未達標」：前測 6 人、後測 11 人達標。這張表該用什麼檢定？", "opts": [{"t": "Pearson 卡方檢定：把前測、後測當兩組做 2 × 2 獨立性檢定。", "good": false, "fb": "這張表的 32 個「人次」其實只有 16 個人，前後分類彼此相關。卡方檢定的獨立性假設被破壞，算出來的 p 值沒有意義。"}, {"t": "McNemar 檢定：只用前後分類不一致的選手；人數少時用精確檢定。", "good": true, "fb": "不一致的選手 b = 6（未→達）、c = 1（達→未），b + c 只有 7，宜用精確二項檢定：p = .125。達標人數看似大增，證據其實很薄弱。"}, {"t": "不需要檢定：6 人變 11 人，進步一目了然。", "good": false, "fb": "描述統計不能取代推論。16 人中只有 7 人改變分類，在虛無假設下這種不平衡並不罕見（精確 p = .125）。"}, {"t": "Fisher 精確檢定，因為有細格人數小於 5。", "good": false, "fb": "Fisher 精確檢定處理的是小樣本，但它仍是<em>獨立<\/em>樣本的檢定。配對的二分資料要用 McNemar（或其精確版本）。"}]}, {"type": "note", "id": "mcnemar"}, {"s": "hero", "t": "把連續的速度切成兩段，丟掉了很多資訊。我們回到四次的連續測量。"}, {"s": "ra", "t": "我跑了單因子重複測量 ANOVA：F(3, 45) = 4.10，p = .012！有效果！"}, {"s": "hero", "t": "先別急。Mauchly 球形檢定呢？"}, {"s": "ra", "t": "W = .41，p = .004……Greenhouse–Geisser 的 ε 是 .58。這代表什麼？"}, {"type": "note", "id": "sphericity"}, {"type": "choice", "header": "球形假設被違反", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "重複測量 ANOVA 輸出", "lines": ["時間：F(3, 45) ＝ 4.10，p ＝ .012", "Mauchly W ＝ .41，p ＝ .004", "ε（Greenhouse–Geisser）＝ .58", "ε（Huynh–Feldt）＝ .64"]}}, "fig": {"cap": "圖 2.3　軟體輸出的三行關鍵數字", "sub": "未校正的 F 檢定看起來很漂亮，但 Mauchly 檢定亮起了紅燈。"}, "q": "四波重複測量 ANOVA：F(3, 45) = 4.10，p = .012；Mauchly W = .41，p = .004，ε̂GG = .58。你會怎麼報告？", "opts": [{"t": "照報 F(3, 45) = 4.10，p = .012；Mauchly 只是參考。", "good": false, "fb": "違反球形時，未校正的 F 檢定型一錯誤率會膨脹，實際 α 可能遠高於 .05。未校正的自由度與 p 值不能直接報告。"}, {"t": "Greenhouse–Geisser 校正：F(1.74, 26.1) = 4.10，p = .033，並報告 ε。", "good": true, "fb": "ε̂ ＜ .75，採 GG 校正：兩個自由度都乘以 .58。F 值不變，p 值變大但仍顯著。也可改用不假設球形的多變量取向（MANOVA）或混合模型。"}, {"t": "刪掉 12 週那一波，讓資料比較符合球形。", "good": false, "fb": "為了符合假設而刪資料，等於改變研究問題；12 週正是主要結果。應該校正檢定，而不是修剪資料。"}, {"t": "改做四組的單因子獨立 ANOVA，就不需要球形假設。", "good": false, "fb": "這和第一幕的錯誤一樣：把同一批人當成四組不同的人，違反獨立性，也丟掉了重複測量帶來的檢定力。"}]}, {"type": "viz", "title": "自由度打折之後", "text": ["第一步是未校正的 F(3, 45) 分布右尾：黑線是臨界值 2.81，紅線是觀察到的 F ＝ 4.10，紅色面積就是 p ＝ .012。但這個分布只在<em>球形成立<\/em>時才對。", "第二步把兩個自由度都乘上 ε̂ ＝ .58，換成 F(1.74, 26.1)：尾巴變厚，臨界值升到 3.52，同樣的 F ＝ 4.10，p 變成 .033。校正不改變 F 值，只改變拿來比較的分布。"], "model": {"type": "curves", "title": "F 分布的右尾（放大）", "x": [2, 6], "ymin": 0, "ymax": 0.16, "xLabel": "F", "yLabel": "密度", "curves": [{"type": "points", "points": [[2, 0.1478], [2.25, 0.1104], [2.5, 0.0824], [2.75, 0.0615], [3, 0.0459], [3.25, 0.0343], [3.5, 0.0257], [3.75, 0.0193], [4, 0.0145], [4.25, 0.0109], [4.5, 0.0082], [5, 0.0047], [5.5, 0.0027], [6, 0.0016]], "label": "F(3, 45)", "labelAt": 2.6, "color": "blue"}], "shade": {"curve": 0, "from": 4.1, "to": 6, "label": "p ＝ .012", "color": "red"}, "marks": [{"x": 2.81, "label": "2.81", "color": "ink"}, {"x": 4.1, "label": "4.10", "color": "red"}], "steps": [{"cap": "未校正 F(3, 45)：臨界值 2.81，p ＝ .012"}, {"cap": "GG 校正 F(1.74, 26.1)：臨界值 3.52，p ＝ .033", "curves": [{"type": "points", "points": [[2, 0.1478], [2.25, 0.1104], [2.5, 0.0824], [2.75, 0.0615], [3, 0.0459], [3.25, 0.0343], [3.5, 0.0257], [3.75, 0.0193], [4, 0.0145], [4.25, 0.0109], [4.5, 0.0082], [5, 0.0047], [5.5, 0.0027], [6, 0.0016]], "label": "未校正", "labelAt": 2.4, "color": "blue"}, {"type": "points", "points": [[2, 0.129], [2.25, 0.1037], [2.5, 0.0837], [2.75, 0.0679], [3, 0.0552], [3.25, 0.0451], [3.5, 0.037], [3.75, 0.0304], [4, 0.0251], [4.25, 0.0207], [4.5, 0.0172], [5, 0.0119], [5.5, 0.0084], [6, 0.0059]], "label": "GG 校正", "labelAt": 3.0, "color": "teal"}], "shade": {"curve": 1, "from": 4.1, "to": 6, "label": "p ＝ .033", "color": "red"}, "marks": [{"x": 3.52, "label": "3.52", "color": "ink"}, {"x": 4.1, "label": "4.10", "color": "red"}]}]}, "cap": "圖 V3　校正前後的 F 分布", "sub": "只畫 F ＞ 2 的右尾。黑線為 α ＝ .05 的臨界值，紅線為觀察到的 F ＝ 4.10，紅色面積為 p 值。"}, {"s": "hero", "t": "F 檢定只告訴我們「平均」在變。可是每位選手的變化都一樣嗎？把資料轉成長格式，一人一條線畫出來。"}, {"type": "note", "id": "trajectory"}, {"s": "ra", "t": "起點低的人進步比較多……可是，這會不會只是趨中迴歸？"}, {"s": "hero", "t": "好問題。要分開訓練效果、自然成熟、季節與趨中迴歸，只靠一組人不夠。我們需要<em>對照組<\/em>。"}, {"s": "n", "t": "以安撥了電話給羅教練。電話那頭沉默了很久。"}]}, {"key": "第三幕", "title": "前測的影子", "scene": {"type": "meeting", "cast": ["lead", "coach", "hero", "stat"], "screen": {"title": "HIIT 組 vs 對照組", "lines": ["隨機分派：各 16 人", "前測：14.20 vs 14.45", "後測：14.56 vs 14.41", "只比後測：p ＝ .35"]}}, "fig": {"cap": "圖 3.1　系館會議室", "sub": "白板上第一次出現了對照組。韓教授、羅教練、以安與統計顧問葉思妤圍著桌子坐下。"}, "beats": [{"s": "n", "t": "原來，羅教練當年把 32 名選手隨機分成兩隊：一隊做 HIIT，一隊照舊慢跑。論文從頭到尾沒有提到對照組。"}, {"s": "coach", "t": "對照組那邊沒什麼變化，我以為不重要，就沒交給韓教授。"}, {"s": "lead", "t": "就算加上對照組，兩組後測直接比較也不顯著，p = .35。"}, {"s": "hero", "t": "因為選手之間的起點差異太大，把訓練效果淹沒了。前測，是我們手上最好的共變量。"}, {"type": "viz", "title": "把前測放回模型", "text": ["第一步只比後測：兩條水平線是 HIIT 組（14.56）與對照組（14.41）的後測平均，紅色殘差是每位選手離組平均的距離。起點差異讓殘差很長，0.15 的差距被淹沒（p ＝ .35）。", "第二步以前測為共變量：線轉成平行的組內斜率，殘差大幅縮短。兩條平行線之間的<em>垂直距離<\/em>，就是控制前測後的組別效果，約 0.35 km/h。"], "model": {"type": "fit", "title": "後測對前測", "xLabel": "前測", "yLabel": "後測", "x": [12.5, 16.7], "y": [12.9, 16.5], "residuals": true, "groups": [{"label": "HIIT", "color": "teal", "points": [[15.68, 15.68], [12.68, 13.29], [14.62, 15.16], [13.98, 14.2], [14.05, 14.35], [14.21, 15.13], [13.03, 13.88], [14.2, 14.22], [13.78, 14.08], [16.52, 16.28], [14.5, 15.5], [14.12, 14.27], [14.17, 14.31], [13.91, 14.69], [13.66, 13.68], [14.09, 14.24]], "line": {"b0": 14.56, "b1": 0}}, {"label": "對照", "color": "red", "points": [[13.87, 13.41], [14.24, 14.7], [15.69, 15.49], [14.9, 14.63], [13.08, 13.14], [14.38, 14.25], [13.89, 14.17], [14.5, 14.53], [13.11, 13.85], [14.57, 14.04], [14.57, 14.63], [15.62, 15.25], [14.63, 14.93], [14.78, 14.13], [13.2, 13.34], [16.17, 16.07]], "line": {"b0": 14.41, "b1": 0}}], "steps": [{"cap": "只比後測：殘差＝離組平均的距離"}, {"cap": "加入前測：殘差變短，兩線距離約 0.35", "groups": [{"label": "HIIT", "color": "teal", "points": [[15.68, 15.68], [12.68, 13.29], [14.62, 15.16], [13.98, 14.2], [14.05, 14.35], [14.21, 15.13], [13.03, 13.88], [14.2, 14.22], [13.78, 14.08], [16.52, 16.28], [14.5, 15.5], [14.12, 14.27], [14.17, 14.31], [13.91, 14.69], [13.66, 13.68], [14.09, 14.24]], "line": {"b0": 3.2, "b1": 0.8}}, {"label": "對照", "color": "red", "points": [[13.87, 13.41], [14.24, 14.7], [15.69, 15.49], [14.9, 14.63], [13.08, 13.14], [14.38, 14.25], [13.89, 14.17], [14.5, 14.53], [13.11, 13.85], [14.57, 14.04], [14.57, 14.63], [15.62, 15.25], [14.63, 14.93], [14.78, 14.13], [13.2, 13.34], [16.17, 16.07]], "line": {"b0": 2.85, "b1": 0.8}}]}]}, "cap": "圖 V4　共變量讓訓練效果浮現", "sub": "點為 32 位選手（綠：HIIT、紅：對照，各 16 人），紅色短線為殘差。組平均與故事一致，個人數值為教學示意。", "points": ["隨機分派＋前測共變量：誤差小、檢定力高。"]}, {"s": "stat", "t": "問題是：要用<em>增益分數<\/em>，還是 <em>ANCOVA<\/em>？"}, {"type": "choice", "header": "增益分數或 ANCOVA？", "q": "32 名選手隨機分派到 HIIT 與對照組，前測略有差異（14.20 vs 14.45）。比較兩組 12 週後的效果，主要分析最好用？", "opts": [{"t": "只比較兩組後測（獨立 t）。", "good": false, "fb": "隨機分派下後測比較是不偏的，但選手間起點差異大、誤差變異大，檢定力低（本例 p = .35），白白浪費了前測的資訊。"}, {"t": "ANCOVA：後測為依變項、前測為共變量，先檢查組別 × 前測交互作用。", "good": true, "fb": "隨機分派時，ANCOVA 調整前測後檢定力通常最高。依講義步驟，先確認交互作用不顯著（斜率同質），再解釋組別效果。"}, {"t": "增益分數的獨立 t 檢定，這是唯一正確的做法。", "good": false, "fb": "增益分數也可行（本例 p = .014），但它強迫前後測斜率 β = 1。前後測相關小於 1 時，ANCOVA 的誤差較小，是隨機試驗中更有效率的選擇。"}, {"t": "2 × 2 重複測量 ANOVA，看組別主效果。", "good": false, "fb": "組別主效果比的是兩組「前後測平均」，混入了起點差異。對應訓練效果的是組別 × 時間交互作用，而它在數學上等同增益分數 t 檢定。"}]}, {"type": "note", "id": "ancova"}, {"s": "stat", "t": "結果出來了。前測 × 組別交互作用 F(1, 28) = 0.42，p = .52，斜率同質。移除交互作用後，組別效果 F(1, 29) = 9.8，p = .004，淨 η² = .25。"}, {"s": "lead", "t": "所以 HIIT 有效，是我的分析方法看不見它。"}, {"type": "viz", "title": "趨中迴歸的影子", "text": ["第二幕柏哲問過：起點低的人進步較多，會不會只是趨中迴歸？第一步畫出 HIIT 組 16 人的前測（橫軸）與進步量（縱軸）：線往右下傾斜，起點低的人進步多。", "第二步加入沒有做 HIIT 的對照組：它的線<em>同樣往右下傾斜<\/em>，斜率幾乎一樣。沒有訓練也會出現的負斜率，來自測量誤差與趨中迴歸；HIIT 的效果，是兩條線之間的垂直距離。"], "model": {"type": "fit", "title": "進步量對前測", "xLabel": "前測", "yLabel": "進步量", "x": [12.5, 16.7], "y": [-0.8, 1.2], "showSlope": true, "groups": [{"label": "HIIT", "color": "teal", "points": [[15.68, 0.0], [12.68, 0.61], [14.62, 0.54], [13.98, 0.22], [14.05, 0.3], [14.21, 0.92], [13.03, 0.85], [14.2, 0.02], [13.78, 0.3], [16.52, -0.24], [14.5, 1.0], [14.12, 0.15], [14.17, 0.14], [13.91, 0.78], [13.66, 0.02], [14.09, 0.15]]}], "steps": [{"cap": "HIIT 組：起點越低，進步越多"}, {"cap": "對照組也往右下傾斜：這部分不是訓練", "groups": [{"label": "HIIT", "color": "teal", "points": [[15.68, 0.0], [12.68, 0.61], [14.62, 0.54], [13.98, 0.22], [14.05, 0.3], [14.21, 0.92], [13.03, 0.85], [14.2, 0.02], [13.78, 0.3], [16.52, -0.24], [14.5, 1.0], [14.12, 0.15], [14.17, 0.14], [13.91, 0.78], [13.66, 0.02], [14.09, 0.15]]}, {"label": "對照", "color": "red", "points": [[13.87, -0.46], [14.24, 0.46], [15.69, -0.2], [14.9, -0.27], [13.08, 0.06], [14.38, -0.13], [13.89, 0.28], [14.5, 0.03], [13.11, 0.74], [14.57, -0.53], [14.57, 0.06], [15.62, -0.37], [14.63, 0.3], [14.78, -0.65], [13.2, 0.14], [16.17, -0.1]]}]}]}, "cap": "圖 V5　負斜率不等於訓練效果", "sub": "進步量＝後測 − 前測。綠：HIIT、紅：對照，線尾數字為斜率 b。個人數值為教學示意。", "points": ["只有一組時，無法分開訓練效果與趨中迴歸。"]}, {"s": "hero", "t": "更準確地說：設計裡本來就有的三種資訊——<em>配對、多波、對照組<\/em>——都被分析丟掉了。"}, {"type": "note", "id": "toolbox"}, {"type": "choice", "header": "更正版的結論", "q": "韓教授決定投出更正版論文。結論句你會怎麼寫？", "opts": [{"t": "HIIT 讓每位選手的乳酸閾值速度都提升 0.36 km/h。", "good": false, "fb": "0.36 是 HIIT 組平均的前後變化，沒有扣除對照組；個人軌跡也顯示有人幾乎沒進步。平均效果不等於每個人的效果。"}, {"t": "控制前測後，HIIT 組比對照組高 0.35 km/h；附 95% CI、效果量與個別差異。", "good": true, "fb": "完整寫法：F(1, 29) = 9.8，p = .004，淨 η² = .25，調整後差異 0.35 km/h，95% CI [0.12, 0.58]；並描述個人軌跡的異質性。"}, {"t": "原研究的 p = .31 是錯的，改成配對 t 的 p = .005，HIIT 有效。", "good": false, "fb": "配對 t 只證明 HIIT 組有改變，無法排除成熟、季節或測驗練習效應。因果結論需要與隨機分派的對照組比較。"}, {"t": "各種分析結果互相矛盾，無法判斷 HIIT 是否有效。", "good": false, "fb": "結果並不矛盾：把錯誤的分析（獨立 t、未校正自由度）移除後，配對、多波與對照組三條證據方向一致。"}]}, {"s": "n", "t": "三個月後，韓教授投出了更正版論文。羅教練把間歇課表留了下來，只是每 4 週多排了一次測驗。"}]}], "notes": {"paired": {"no": 1, "t": "配對 t 檢定", "blocks": [{"type": "h", "t": "為什麼不能用獨立 t？"}, {"type": "p", "t": "前後測來自同一批選手，本例兩次分數的相關 r = .90。獨立 t 假設兩組互相獨立，把選手之間的個別差異全部算進誤差，標準誤被嚴重高估（.35 對 .11）。"}, {"type": "h", "t": "先算差異分數，再檢定"}, {"type": "p", "t": "每位選手算 dᵢ ＝ 後測 − 前測，問題就變成「d 的平均是否為 0」的單一樣本 t 檢定。這就是講義的<em>摘要統計量取向<\/em>（Student, 1908）：把一個人的重複測量，化約成一個分數。"}, {"type": "formula", "t": "t ＝ d̄ ÷ (s_d ÷ √n)，df ＝ n − 1"}, {"type": "formula", "t": "s_d² ＝ s₁² ＋ s₂² − 2r·s₁s₂"}, {"type": "p", "t": "r 越大，s_d 越小。本例 d̄ = 0.36、s_d = 0.44，t(15) = 3.28，p = .005，效果量 d_z = d̄ ÷ s_d = 0.82。"}, {"type": "p", "t": "「配對」包含三種情形：天生的配對（雙胞胎）、配對樣本（配對控制組）與重複測量（前後測）。"}], "fig": {"model": {"type": "curves", "title": "虛無假設下的 t 分布", "x": [-4, 4], "curves": [{"type": "normal", "mu": 0, "sd": 1, "label": "H₀", "color": "gray", "labelAt": -1.8}], "shade": {"curve": 0, "from": 2.13, "to": 4, "label": "拒絕域", "color": "red"}, "marks": [{"x": 1.04, "label": "獨立 t ＝ 1.04", "color": "gold"}, {"x": 3.28, "label": "配對 t ＝ 3.28", "color": "teal"}], "xLabel": "t", "yLabel": "密度"}, "cap": "圖 N1　同一個差異，兩個 t 值", "sub": "曲線為虛無假設下的 t 分布（以常態近似），紅色為右側拒絕域。同樣的平均差 0.36 km/h，獨立 t 只有 1.04，配對 t 卻是 3.28（數值為教學示意）。", "points": ["配對設計的力量來自<em>每個人當自己的對照<\/em>。", "配對資料誤用獨立 t，會讓檢定力大幅流失。", "報告配對 t：df = n − 1，附差異的平均、SD 與 95% CI。"]}}, "waves": {"no": 2, "t": "研究改變的三要素", "blocks": [{"type": "h", "t": "改變研究需要什麼？"}, {"type": "bullet", "t": "<em>多波資料<\/em>：兩波只看得到「差多少」，看不出軌跡形狀，也容易把測量誤差當成改變；三波以上才開始能描述個人軌跡。"}, {"type": "bullet", "t": "<em>有意義的時間尺度<\/em>：週、月、年齡、賽季、訓練次數都可以，但必須單調遞增，並記錄每一波的間距。"}, {"type": "bullet", "t": "<em>會系統性改變的結果變項<\/em>：連續、可等化，且在每一波都同樣有效、同樣可信。"}, {"type": "h", "t": "橫斷面不等於縱貫"}, {"type": "p", "t": "比較國中、高中、大學選手，看到的是<em>不同人<\/em>之間的差異，混入了選材、流失與世代效應。Lord（1963）也提醒：同一份測驗在不同年齡，可能測到不同的東西。"}, {"type": "h", "t": "兩個層次的問題"}, {"type": "p", "t": "個體內改變：每位選手怎麼隨時間改變？個體間差異：什麼特徵可以預測誰進步得多？"}], "fig": {"model": {"type": "lines", "title": "三位選手：起點相同、終點相近", "xLabels": ["前測", "4 週", "8 週", "12 週"], "series": [{"label": "甲：穩定上升", "values": [14.0, 14.12, 14.24, 14.36], "color": "teal"}, {"label": "乙：先升後平", "values": [14.0, 14.3, 14.4, 14.44], "color": "gold"}, {"label": "丙：上下波動", "values": [14.0, 14.2, 14.02, 14.28], "color": "red"}], "ymin": 13.9, "ymax": 14.5, "yLabel": "km/h", "steps": [{"cap": "只看兩端：三人都是一條上升直線", "title": "只有兩波時", "xLabels": ["前測", "12 週"], "series": [{"label": "甲：穩定上升", "values": [14.0, 14.36], "color": "teal"}, {"label": "乙：先升後平", "values": [14.0, 14.44], "color": "gold"}, {"label": "丙：上下波動", "values": [14.0, 14.28], "color": "red"}]}, {"cap": "補上中間兩波：三種完全不同的改變形狀"}]}, "cap": "圖 N2　只看兩端，三人一模一樣", "sub": "三位選手的前測相同、12 週後測也只差 0.1 km/h 左右，但中間兩波揭露了完全不同的改變形狀（數值為教學示意）。", "points": ["兩波資料會把所有軌跡都畫成直線。", "多波設計才能分辨真實改變與隨機波動。"]}}, "mcnemar": {"no": 3, "t": "配對的類別資料", "blocks": [{"type": "h", "t": "達標表不是普通的 2 × 2"}, {"type": "p", "t": "同一位選手前後各被分類一次，兩次分類並不獨立。一般的 Pearson 卡方檢定假設每個人只出現一次，用在這裡是錯的。"}, {"type": "h", "t": "McNemar：只看「改變的人」"}, {"type": "p", "t": "前後都達標（5 人）或都未達標（4 人）的選手，對「有沒有改變」不提供資訊。檢定只用不一致的兩格：未→達 b = 6、達→未 c = 1。"}, {"type": "formula", "t": "H₀：π₁₂ ＝ π₂₁"}, {"type": "formula", "t": "χ² ＝ (b − c)² ÷ (b ＋ c)，df ＝ 1"}, {"type": "p", "t": "本例 χ² = 3.57，但 b + c 只有 7，應改用精確二項檢定：p = .125，不顯著。"}, {"type": "h", "t": "順序資料：符號檢定"}, {"type": "p", "t": "自覺費力（RPE）等順序量表，只看每人前後的方向，記為「＋」或「−」，相同者不計；檢定統計量 T 為「＋」的個數。"}], "fig": {"model": {"type": "bars", "title": "16 名選手的前後測分類（比例）", "rows": [["皆達標", 0.31, "gray"], ["皆未達", 0.25, "gray"], ["未→達", 0.38, "teal"], ["達→未", 0.06, "red"]], "max": 0.45, "steps": [{"cap": "16 人的四種前後分類"}, {"cap": "只有改變分類的兩格進入檢定：b ＝ 6、c ＝ 1", "title": "進入檢定的兩格", "rows": [["未→達", 0.38, "teal"], ["達→未", 0.06, "red"]]}]}, "cap": "圖 N3　只有不一致的兩格會進入檢定", "sub": "柱高為佔 16 人的比例：皆達標 5 人、皆未達 4 人（灰），未→達 6 人（綠）、達→未 1 人（紅）。只有綠、紅兩格進入檢定。", "points": ["連續 → 配對 t；順序 → 符號檢定或 Wilcoxon；二分 → McNemar。", "把連續速度切成達標與否，會丟失資訊、降低檢定力。"]}}, "sphericity": {"no": 4, "t": "球形假設與校正", "blocks": [{"type": "h", "t": "重複測量 ANOVA 的關鍵假設"}, {"type": "p", "t": "單因子重複測量 ANOVA 把總變異拆成受試者間、時間、殘差（時間 × 受試者）三塊。它要求<em>球形<\/em>：任兩個時間點的差異分數，變異數都相等。複合對稱是球形的充分條件。"}, {"type": "formula", "t": "F ＝ MS時間 ÷ MS殘差"}, {"type": "formula", "t": "df ＝ k − 1，(k − 1)(n − 1)"}, {"type": "h", "t": "違反時：用 ε 校正自由度"}, {"type": "p", "t": "把兩個自由度都乘以 ε 再查 F 分布；ε 的下限是 1/(k − 1)。慣例：ε̂ ＜ .75 用 Greenhouse–Geisser，ε̂ ＞ .75 可用 Huynh–Feldt。"}, {"type": "p", "t": "本例 k = 4、n = 16、ε̂GG = .58：F(1.74, 26.1) = 4.10，p = .033（未校正 p = .012）。"}, {"type": "p", "t": "Mauchly 檢定在小樣本檢定力低、大樣本過度敏感，建議一律報告 ε 與校正後結果。"}], "fig": {"model": {"type": "bars", "title": "六組差異分數的變異數", "rows": [["0–4", 0.06], ["4–8", 0.08], ["8–12", 0.06], ["0–8", 0.12], ["4–12", 0.14], ["0–12", 0.2, "red"]], "max": 0.22, "thresholds": [0.11], "steps": [{"cap": "若球形成立：六根柱一樣高（示意）", "title": "球形成立時（示意）", "rows": [["0–4", 0.11], ["4–8", 0.11], ["8–12", 0.11], ["0–8", 0.11], ["4–12", 0.11], ["0–12", 0.11]]}, {"cap": "本例：相隔越遠，差異分數變異越大"}]}, "cap": "圖 N4　相隔越遠，差異越不穩定", "sub": "每根柱是兩個時間點（週）之間差異分數的變異數，門檻線為平均。球形要求六根柱等高（數值為教學示意）。", "points": ["球形看的是<em>差異分數<\/em>的變異數。", "報告：F(1.74, 26.1) = 4.10, p = .033, ε = .58。", "只有兩個時間點時，球形必然成立。"]}}, "trajectory": {"no": 5, "t": "個人成長軌跡", "blocks": [{"type": "h", "t": "從平均到個人"}, {"type": "p", "t": "重複測量 ANOVA 回答「平均有沒有變」。研究改變更想知道：<em>每個人<\/em>怎麼變？講義的四個步驟："}, {"type": "bullet", "t": "1. 選定函數形式（此處為直線）。"}, {"type": "bullet", "t": "2. 對每位選手各跑一條 OLS 迴歸：速度 ＝ 截距 ＋ 斜率 × 週。"}, {"type": "bullet", "t": "3. 收集所有人的截距（起始狀態）與斜率（改變速率）。"}, {"type": "bullet", "t": "4. 把擬合線疊回各自的原始資料，檢查是否合適。"}, {"type": "h", "t": "本例摘要"}, {"type": "p", "t": "截距 M = 14.2、SD = 0.95；斜率 M = 0.030 km/h／週、SD = 0.025；兩者相關 r = −.45：起點低的選手進步較快。"}, {"type": "p", "t": "注意：測量誤差會讓這個負相關被高估（趨中迴歸）。正式分析應改用多層次（混合效果）成長模型，資料需轉成長格式。"}], "fig": {"model": {"type": "lines", "title": "四位 HIIT 組選手的軌跡", "xLabels": ["前測", "4 週", "8 週", "12 週"], "series": [{"label": "甲", "values": [13.2, 13.6, 14.0, 14.3], "color": "teal"}, {"label": "乙", "values": [14.0, 14.3, 14.5, 14.6], "color": "blue"}, {"label": "丁", "values": [14.4, 14.3, 14.6, 14.5], "color": "purple"}, {"label": "丙", "values": [15.1, 15.2, 15.3, 15.3], "color": "gold"}], "ymin": 13.0, "ymax": 15.5, "yLabel": "km/h", "steps": [{"cap": "全組平均：每 4 週穩定上升 0.12", "series": [{"label": "全組平均", "values": [14.2, 14.32, 14.44, 14.56], "color": "ink"}]}, {"cap": "四位選手：起點越低，進步越多"}]}, "cap": "圖 N5　平均線背後的四條人生", "sub": "每條線是一位選手的四次測量。起點最低的甲進步最多，起點最高的丙幾乎持平，丁上下波動（數值為教學示意）。", "points": ["平均軌跡可能沒有任何一個人真的長那樣。", "截距與斜率的個別差異，可再用性別、訓練年資等變項預測。"]}}, "ancova": {"no": 6, "t": "增益分數與 ANCOVA", "blocks": [{"type": "h", "t": "兩種常見做法"}, {"type": "p", "t": "<em>增益分數<\/em>：比較兩組的（後測 − 前測），等同 2 組 × 2 時間重複測量 ANOVA 的交互作用。"}, {"type": "p", "t": "<em>ANCOVA<\/em>：以後測為依變項、前測為共變量："}, {"type": "formula", "t": "yᵢⱼ ＝ μ ＋ αᵢ ＋ β(xᵢⱼ − x̄) ＋ εᵢⱼ"}, {"type": "p", "t": "增益分數等於強迫 β = 1；ANCOVA 讓資料估計 β。前後測相關小於 1 時，ANCOVA 的誤差較小、檢定力較高。"}, {"type": "h", "t": "講義的分析步驟"}, {"type": "bullet", "t": "先放入 組別 × 前測 交互作用；顯著代表斜率不同質，停下來改做斜率分析。"}, {"type": "bullet", "t": "不顯著則移除交互作用，再檢定共變量與組別效果。"}, {"type": "h", "t": "前提"}, {"type": "p", "t": "隨機分派時，ANCOVA 是首選。非隨機的既有組別，兩種方法可能給出相反結論（Lord's paradox），必須回到研究設計判斷。"}], "fig": {"model": {"type": "curves", "title": "後測對前測：兩條平行線", "x": [12.8, 16.4], "ymin": 12.8, "ymax": 16.4, "curves": [{"type": "line", "a": 1.75, "b": 0.9, "label": "HIIT", "color": "teal", "labelAt": 15.9}, {"type": "line", "a": 1.4, "b": 0.9, "label": "對照", "color": "red", "labelAt": 16.2}], "dots": [[12.97, 13.19, "teal"], [13.71, 14.22, "teal"], [13.73, 14.07, "teal"], [14.07, 14.31, "teal"], [14.2, 14.45, "teal"], [14.31, 14.55, "teal"], [14.69, 15.02, "teal"], [15.45, 15.64, "teal"], [13.24, 13.49, "red"], [13.33, 13.18, "red"], [14.63, 14.57, "red"], [14.63, 14.46, "red"], [14.69, 14.71, "red"], [14.83, 14.49, "red"], [15.63, 15.43, "red"], [16.14, 15.95, "red"]], "xLabel": "前測（km/h）", "yLabel": "後測", "steps": [{"cap": "增益分數：斜率被強迫為 1", "curves": [{"type": "line", "a": 0.29, "b": 1, "label": "HIIT", "color": "teal", "labelAt": 15.9}, {"type": "line", "a": -0.105, "b": 1, "label": "對照", "color": "red", "labelAt": 16.2}]}, {"cap": "ANCOVA：由資料估計共同斜率 β ＝ .90"}]}, "cap": "圖 N6　兩條平行線之間的距離", "sub": "點為選手（綠：HIIT、紅：對照）。兩條線是組內迴歸線，共同斜率 β 為 .90；兩線的垂直距離 0.35 km/h 就是調整後的組別效果（數值為教學示意）。", "points": ["ANCOVA 比較的是<em>調整後平均<\/em>：相同前測下的後測差。", "先檢查斜率同質，再解釋組別效果。"]}}, "toolbox": {"no": 7, "t": "重複測量的工具箱", "blocks": [{"type": "h", "t": "兩種資料格式"}, {"type": "p", "t": "<em>寬格式<\/em>（person-level）：一人一列、每波一欄，適合配對 t、重複測量 ANOVA、MANOVA。<em>長格式<\/em>（person-period）：一人多列，至少含 ID、時間、結果；可處理不等距、缺測與隨時間變動的共變量。"}, {"type": "h", "t": "共變結構的取捨"}, {"type": "p", "t": "重複測量 ANOVA 假設球形（如複合對稱，只需估 2 個參數）。MANOVA 取向不假設結構，k 波要估 k(k ＋ 1)/2 個參數（k = 4 時 10 個），樣本少時檢定力下降。"}, {"type": "p", "t": "混合效果模型可選擇結構（如 AR(1)），某幾波缺測的選手不必整列刪除；GEE 則估計母群平均效果。"}, {"type": "h", "t": "優點與代價"}, {"type": "p", "t": "縱貫設計讓每個人當自己的對照、把個體內變異從總變異中分離，所以檢定力高；代價是缺值、流失與較複雜的分析。"}], "fig": {"model": {"type": "paths", "title": "依資料型態選方法", "nodes": [{"id": "R", "label": "重複測量", "x": 0, "y": 0.95}, {"id": "W2", "label": "兩波", "x": -0.55, "y": 0.6}, {"id": "WK", "label": "多波", "x": 0.55, "y": 0.6}, {"id": "T", "label": "配對 t", "x": -0.95, "y": 0.15}, {"id": "S", "label": "符號", "x": -0.6, "y": 0.15}, {"id": "M", "label": "McNemar", "x": -0.22, "y": 0.15}, {"id": "A", "label": "RM ANOVA", "x": 0.2, "y": 0.15}, {"id": "MV", "label": "MANOVA", "x": 0.58, "y": 0.15}, {"id": "MX", "label": "混合模型", "x": 0.95, "y": 0.15}], "edges": [{"from": "R", "to": "W2", "color": "ink"}, {"from": "R", "to": "WK", "color": "ink"}, {"from": "W2", "to": "T", "color": "teal", "label": "連續"}, {"from": "W2", "to": "S", "color": "teal", "label": "順序"}, {"from": "W2", "to": "M", "color": "teal", "label": "二分"}, {"from": "WK", "to": "A", "color": "purple", "label": "球形"}, {"from": "WK", "to": "MV", "color": "purple", "label": "無結構"}, {"from": "WK", "to": "MX", "color": "purple", "label": "缺測"}]}, "cap": "圖 N7　先看波數與資料型態，再選方法", "sub": "左側是兩個時間點的配對方法，右側是多個時間點的三種取向；箭頭上的字是選擇的關鍵條件。", "points": ["寬格式適合傳統方法；長格式是成長模型的起點。", "選方法就是在選「對共變結構做多少假設」。"]}}}, "ending": {"title": "消失的進步：結案", "paragraphs": ["韓教授的更正版論文改以 ANCOVA 為主要分析，前測為共變量，並在附錄報告四波資料的 Greenhouse–Geisser 校正結果與個人成長軌跡。原本「HIIT 無效」的結論被撤回。", "被找回來的不是新資料，而是設計裡本來就有的三種資訊：同一個人的配對、四個時間點的軌跡，以及一組被遺忘的對照組。"], "takeaway": "重複測量的價值在於「每個人當自己的對照」。分析若把同一個人當成陌生人，不只會算錯 p 值，還會讓真實的改變消失。", "verdict": ["審查通過：你的每一個決策都尊重了資料的配對與時間結構。更正版順利刊登。", "有條件接受：主要結論正確，但部分分析仍忽略了重複測量的相關或假設檢查。", "退回重審：分析仍把同一批選手當成不同的人，HIIT 課表岌岌可危。"]}};
</script>

renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(ARC)ARC.tick(dt,t);if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
</script>
