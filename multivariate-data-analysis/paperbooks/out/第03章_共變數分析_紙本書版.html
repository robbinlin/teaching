<script>
const BOOK={"file": "第03章_共變數分析_紙本書版", "caseNo": "03", "title": "逆轉的名次", "header": "CASE 03  ·  逆轉的名次  ·  ANCOVA", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "ANCOVA", "en": "Adjusting for Where You Start", "tag": "CASE 03 ・ Analysis of Covariance", "tagline": ["起跑線不同的比賽，", "終點不能直接比。"], "summary": "一位主任教練讓三支排球校隊各接受一種訓練，一學期後，增強式訓練組的防守敏捷後測拿下第一名，他建議聯賽各隊全面改用增強式訓練。但三隊在訓練前的起點並不相同。研究者以前測為共變項重新分析後，名次翻轉了，而這個翻轉本身，也需要小心解讀。", "conflict": "後測第一名，是訓練的效果，還是<em>起跑線<\/em>本來就在前面？"}, "cast": {"coach": {"name": "魏崇文", "role": "排球主任教練", "look": {"shirt": "#8b2f3a", "hair": "#5a5a5a", "hairStyle": "short", "acc": "clipboard"}, "quips": ["增強式訓練，後測第一名！", "我的隊員本來就比較優秀。", "調整平均數？數學把戲吧？"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["起跑線不同，終點就不能直接比。", "先看斜率是否平行。", "調整後的平均，才是要比的數字。"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["學姊，名次翻過來了！", "原來 F 變大，是因為誤差變小……"]}, "rev": {"name": "宋怡君", "role": "期刊審查委員", "look": {"shirt": "#3d6b8c", "hair": "#2a2a2a", "hairStyle": "short", "glasses": true, "acc": "laptop"}, "quips": ["共變項要事先決定。", "調整只在重疊範圍內可信。", "統計控制不等於隨機分派。"]}}, "acts": [{"key": "第一幕", "title": "後測第一名", "scene": {"type": "field", "cast": ["coach", "hero", "ra"], "screen": {"title": "後測防守敏捷得分", "sub": "三種訓練 ・ 各 6 人", "bars": [["傳統", 4.5, "4.5"], ["複合式", 12.0, "12.0"], ["增強式", 13.0, "13.0"]]}}, "fig": {"cap": "圖 1.1　排球教練研習會", "sub": "研習會在球場旁舉行，看板上是三種訓練的後測平均。魏教練站在看板前，以安與柏哲在一旁聽著。點擊角色，可讀到他們此刻的心聲。"}, "beats": [{"s": "n", "t": "深夜，研究室。第三份檔案的封面寫著：<em>逆轉的名次<\/em>。"}, {"s": "n", "t": "故事從一場大專排球教練研習會開始。主任教練魏崇文發表了一項為期一學期的訓練介入。"}, {"s": "coach", "t": "我們讓三支校隊各接受一種訓練：傳統訓練、複合式訓練、增強式訓練。一學期後，測量防守敏捷。"}, {"s": "coach", "t": "增強式訓練組後測平均 13.0 分，第一名！單因子 ANOVA 也顯著。我建議聯賽各隊都改用增強式訓練。"}, {"s": "ra", "t": "學姊，13 分比傳統組的 4.5 分高了快三倍，看起來很明顯。"}, {"s": "hero", "t": "等等，他是以<em>整支隊伍<\/em>分派訓練的。三隊在訓練前，防守敏捷一樣嗎？"}, {"s": "n", "t": "以安翻到附錄。前測平均：傳統組 3.0 分、複合式組 4.5 分、增強式組 9.0 分。"}, {"s": "hero", "t": "增強式組的起跑線，是傳統組的三倍。後測比較高，有多少是訓練，又有多少是原本就比較好？"}, {"type": "viz", "title": "起跑線與終點線", "text": ["第一步是研習會看板上的<em>後測平均<\/em>：增強式 13.0、複合式 12.0、傳統 4.5，增強式看似遙遙領先。第二步換成論文附錄裡的<em>前測平均<\/em>：增強式 9.0，是傳統組 3.0 的三倍。", "第三步把前、後測並排：增強式組的終點最高，起點也最高。後測的差距裡混著兩種東西，一是訓練的效果，二是原本的起點差異；只比後測，無法把兩者分開。"], "model": {"type": "bars", "title": "後測平均（各 6 人）", "rows": [["傳統", 4.5, "blue"], ["複合式", 12.0, "teal"], ["增強式", 13.0, "gold"]], "max": 14, "steps": [{"cap": "後測：增強式 13.0 拿下第一"}, {"cap": "前測：增強式 9.0，起點就最高", "title": "前測平均（各 6 人）", "rows": [["傳統", 3.0, "blue"], ["複合式", 4.5, "teal"], ["增強式", 9.0, "gold"]]}, {"cap": "並排：起點高的組，終點也高", "title": "前測與後測", "rows": [["傳統前", 3.0, "blue"], ["傳統後", 4.5, "blue"], ["複合前", 4.5, "teal"], ["複合後", 12.0, "teal"], ["增強前", 9.0, "gold"], ["增強後", 13.0, "gold"]]}]}, "cap": "圖 V1　後測第一名的起跑線", "sub": "柱高為各組平均（藍：傳統、綠：複合式、黃：增強式），數值取自研習會看板與論文附錄。", "points": ["只比後測，起點差異會被誤當成訓練效果。"]}, {"type": "note", "id": "what"}, {"type": "choice", "header": "該用什麼分析？", "q": "研究者手上有三組選手的前測與後測防守敏捷分數，想比較三種訓練的效果。最恰當的分析是？", "opts": [{"t": "只比較後測的單因子 ANOVA。", "good": false, "fb": "後測 ANOVA 完全忽略起點差異。增強式組前測就高出傳統組 6 分，後測較高，很可能只是延續原本的優勢。"}, {"t": "以前測為共變項、後測為依變項的 ANCOVA，並逐一檢查前提。", "good": true, "fb": "ANCOVA 以迴歸排除前測的影響，比較「前測相同時」的預期後測；移除共變項解釋的變異後，檢定力也會提高。但前提要先檢查，尤其是斜率同質性。"}, {"t": "先檢定前測差異，顯著才用 ANCOVA，否則用 ANOVA。", "good": false, "fb": "講義提到實務上常先比較前測，這能幫助了解組別是否等質；但是否納入共變項，應依理論與它和依變項的相關事先決定。前後測高度相關時，即使隨機分組也應納入。"}, {"t": "前測、後測分別當依變項，各做一次變異數分析。", "good": false, "fb": "兩次分開的 ANOVA 無法回答「控制前測後，組間是否仍有差異」，還會增加型一誤差。"}]}, {"type": "note", "id": "power"}, {"type": "viz", "title": "誤差從哪裡變小", "text": ["兩組隨機分派的選手（甲、乙），前測平均都是 6.0。第一步是 ANOVA 的看法：每組只用一條<em>水平線<\/em>（組平均）代表，紅色殘差是每位選手離組平均的距離；前測高的人後測也高，殘差很長。", "第二步讓前測進入模型：線轉成共同斜率 0.7，殘差明顯縮短，誤差均方從 2.97 降到 0.67。兩組差距仍是 3 分，分母變小，F 值就變大。"], "model": {"type": "fit", "title": "同一份資料，兩種誤差", "xLabel": "前測", "yLabel": "後測", "x": [0, 10.5], "y": [3, 17], "showSlope": true, "residuals": true, "groups": [{"color": "blue", "points": [[6.4, 9.9], [7.8, 10.8], [6.4, 9.3], [1.6, 6.4], [8.1, 9.3], [6.7, 9.2], [3.8, 6.4], [7.2, 10.7]], "line": {"b0": 9.0, "b1": 0}}, {"color": "teal", "points": [[6.3, 12.7], [5.1, 10.6], [5.3, 12.9], [1.8, 8.4], [9.0, 13.9], [7.9, 12.4], [5.4, 12.2], [7.2, 12.9]], "line": {"b0": 12.0, "b1": 0}}], "steps": [{"cap": "ANOVA：殘差＝離組平均的距離"}, {"cap": "ANCOVA：殘差＝離斜率線的距離，變短了", "groups": [{"color": "blue", "points": [[6.4, 9.9], [7.8, 10.8], [6.4, 9.3], [1.6, 6.4], [8.1, 9.3], [6.7, 9.2], [3.8, 6.4], [7.2, 10.7]], "line": {"b0": 4.8, "b1": 0.7}}, {"color": "teal", "points": [[6.3, 12.7], [5.1, 10.6], [5.3, 12.9], [1.8, 8.4], [9.0, 13.9], [7.9, 12.4], [5.4, 12.2], [7.2, 12.9]], "line": {"b0": 7.8, "b1": 0.7}}]}]}, "cap": "圖 V2　共變項如何縮小誤差", "sub": "點為兩組各 8 位選手，紅線為殘差，線尾數字為斜率 b（數值為教學示意）。", "points": ["組間差距不變，誤差變小 → F 變大。"]}, {"s": "ra", "t": "所以 ANCOVA 不只讓比較比較公平，還會讓 F 值變大？"}, {"s": "hero", "t": "前提是共變項真的和依變項有關。我們需要原始資料，一筆一筆跑。"}, {"s": "n", "t": "研習會後，以安以期刊審查委員的身分，正式向魏教練索取原始資料。"}]}, {"key": "第二幕", "title": "平行的斜率", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "前測與後測的範圍", "lines": ["傳統：前測 1–5，後測 2–7", "複合式：前測 2–7，後測 10–14", "增強式：前測 6–12，後測 11–15", "N ＝ 18，每組 6 人"]}}, "fig": {"cap": "圖 2.1　研究室裡的 18 筆資料", "sub": "每位選手有兩個分數：訓練前的前測與一學期後的後測。螢幕上列出三組的分數範圍。"}, "beats": [{"s": "n", "t": "資料寄來了。18 位選手，每人兩個分數：前測與後測。"}, {"s": "ra", "t": "我直接在 SPSS 跑 ANCOVA？"}, {"s": "hero", "t": "還不行。第一步是檢查<em>組內迴歸係數同質性<\/em>：三組「前測→後測」的迴歸線，必須大致平行。"}, {"s": "n", "t": "柏哲在「單變量：模式」中選了「自訂」，放入前測、組別，以及組別 × 前測。"}, {"type": "note", "id": "slopes"}, {"type": "viz", "title": "三條斜率平行嗎", "text": ["第一步讓 18 位選手的點落下，程式替<em>每一組各自<\/em>畫出最小平方迴歸線：傳統 0.90、複合式 0.63、增強式 0.58。三條線傾斜程度相近，差異像是每組只有 6 人的抽樣波動。", "第二步把三組合併，估計<em>共同組內斜率<\/em> b ＝ 0.66，三條線變成平行。斜率同質性檢定問的正是：從第一步換成第二步，會不會損失太多解釋力？"], "model": {"type": "fit", "title": "前測 → 後測", "xLabel": "前測", "yLabel": "後測", "x": [0, 13], "y": [0, 18], "showSlope": true, "groups": [{"color": "blue", "points": [[3, 5], [1, 2], [2, 4], [4, 3], [3, 6], [5, 7]]}, {"color": "teal", "points": [[4, 13], [3, 11], [2, 10], [6, 12], [5, 12], [7, 14]]}, {"color": "gold", "points": [[10, 14], [6, 11], [12, 15], [10, 12], [7, 12], [9, 14]]}], "steps": [{"cap": "各組各自的斜率：0.90、0.63、0.58"}, {"cap": "共同斜率 b ＝ 0.66：三條線平行", "groups": [{"color": "blue", "points": [[3, 5], [1, 2], [2, 4], [4, 3], [3, 6], [5, 7]], "line": {"b0": 2.52, "b1": 0.66}}, {"color": "teal", "points": [[4, 13], [3, 11], [2, 10], [6, 12], [5, 12], [7, 14]], "line": {"b0": 9.03, "b1": 0.66}}, {"color": "gold", "points": [[10, 14], [6, 11], [12, 15], [10, 12], [7, 12], [9, 14]], "line": {"b0": 7.06, "b1": 0.66}}]}]}, "cap": "圖 V3　各自的斜率與共同斜率", "sub": "點為 18 位選手的原始資料（藍：傳統、綠：複合式、黃：增強式），線尾數字為斜率 b。"}, {"s": "ra", "t": "組別 × 前測：F(2, 12) ＝ 0.27，p ＝ .768。"}, {"type": "choice", "header": "交互作用不顯著之後", "q": "斜率同質性檢定中，組別 × 前測的交互作用 p ＝ .768，未達顯著。下一步應該？", "opts": [{"t": "共變項沒有作用，改用 ANOVA。", "good": false, "fb": "組別 × 前測檢定的是「三組斜率是否不同」，不是前測有沒有預測力。本案前測與後測的組內相關約 .75，共變項顯然有作用。"}, {"t": "斜率可視為相同；移除交互作用項，以完全因子模式執行 ANCOVA。", "good": true, "fb": "斜率同質成立，三條組內迴歸線可合併為一條共同斜率，用來調整各組平均。交互作用項只用於檢查，正式的 ANCOVA 模式不再放入。"}, {"t": "交互作用不顯著，代表三種訓練沒有差異。", "good": false, "fb": "交互作用與組別主效果是兩件事。斜率平行只說明前測與後測的關係在三組相同；組間差異要在下一步的 ANCOVA 中檢定。"}, {"t": "直接報告這個含交互作用模型中的組別 F 值。", "good": false, "fb": "含交互作用的模型中，組別效果是「前測 ＝ 0 時」的組間差異，通常沒有實質意義。應移除交互作用項後再檢定組別。"}]}, {"s": "hero", "t": "斜率平行。合併三組後的組內斜率是 0.66：前測每多 1 分，後測平均多 0.66 分。"}, {"type": "note", "id": "model"}, {"s": "ra", "t": "Levene 檢定 F(2, 15) ＝ 1.57，p ＝ .241，變異數也同質。"}, {"type": "note", "id": "assump"}, {"s": "n", "t": "柏哲按下執行，ANCOVA 摘要表跳了出來。"}, {"s": "ra", "t": "組別 F(2, 14) ＝ 47.18，p ＜ .001！可是……調整後平均，名次換了。"}, {"s": "hero", "t": "複合式 12.66、增強式 10.69、傳統 6.15。增強式組從第一名掉到第二。"}, {"type": "viz", "title": "沿著斜率滑到 5.5", "text": ["第一步的三個點是各組<em>原始平均<\/em>，各自站在自己的前測位置：傳統 (3.0, 4.5)、複合式 (4.5, 12.0)、增強式 (9.0, 13.0)。三條線是斜率 0.66 的組內迴歸線。", "第二步讓每個點沿著自己的線滑到總前測平均 5.5。增強式向左滑 3.5 分，下降 0.66 × 3.5 ≈ 2.31，落到 10.69；傳統向右滑 2.5 分，升到 6.15。這就是調整公式的幾何意義。"], "model": {"type": "curves", "x": [0, 12], "ymin": 0, "ymax": 18, "curves": [{"type": "line", "a": 2.52, "b": 0.66, "label": "傳統", "labelAt": 11, "color": "blue"}, {"type": "line", "a": 9.03, "b": 0.66, "label": "複合式", "labelAt": 1.5, "color": "teal"}, {"type": "line", "a": 7.06, "b": 0.66, "label": "增強式", "labelAt": 11, "color": "gold"}], "xLabel": "前測", "yLabel": "後測", "dots": [[3, 4.5, "blue"], [4.5, 12, "teal"], [9, 13, "gold"]], "steps": [{"cap": "原始平均：各站在自己的前測位置", "marks": [{"x": 3, "label": "3.0", "color": "blue"}, {"x": 9, "label": "9.0", "color": "gold"}]}, {"cap": "滑到 X̄ ＝ 5.5：讀出調整後平均", "dots": [[5.5, 6.15, "blue"], [5.5, 12.66, "teal"], [5.5, 10.69, "gold"]], "marks": [{"x": 5.5, "label": "X̄ ＝ 5.5", "color": "red"}]}]}, "cap": "圖 V4　調整後平均的幾何意義", "sub": "三條平行線斜率皆為 0.66（藍：傳統、綠：複合式、黃：增強式）。點為各組平均，紅線為總前測平均 5.5。", "points": ["Ȳ調整 ＝ Ȳⱼ − 0.66 × (X̄ⱼ − 5.5)"]}, {"type": "note", "id": "adjmean"}, {"type": "choice", "header": "要比較哪一組平均？", "q": "ANCOVA 的組別效果顯著，接著要做事後比較。下列哪一種做法正確？", "opts": [{"t": "以原始後測平均（4.5、12.0、13.0）做事後檢定。", "good": false, "fb": "原始平均沒有排除前測的影響，和 ANCOVA 檢定的不是同一件事。事後比較必須以調整後平均數為準。"}, {"t": "比較調整後平均數，以 Bonferroni 校正成對比較。", "good": true, "fb": "在 SPSS 中以 EM 平均數比較主效應：ANCOVA 的事後比較以調整後平均數為標準。結果：複合式與增強式都顯著優於傳統，兩者之間未達顯著。"}, {"t": "改比較前後測的進步分數。", "good": false, "fb": "進步分數（後測 − 前測）隱含斜率等於 1 的假設；本例組內斜率只有 0.66，與 ANCOVA 回答的不是同一個問題。"}, {"t": "名次換了，代表 ANCOVA 有錯，應改報原始平均。", "good": false, "fb": "名次改變正是調整的作用：增強式組前測遠高於平均，扣除前測帶來的優勢後，預期後測就下降了。這不是錯誤，但要謹慎解讀。"}]}, {"s": "ra", "t": "複合式比增強式高 1.97 分，可是 Bonferroni 校正後不顯著。"}, {"s": "hero", "t": "所以「增強式最好」不成立，但我們也不能反過來說「複合式最好」。還有一個更大的問題，得跟另一位審查委員討論。"}]}, {"key": "第三幕", "title": "不重疊的起點", "scene": {"type": "meeting", "cast": ["coach", "hero", "rev", "ra"], "screen": {"title": "前測分數的分布", "lines": ["傳統：1–5（M ＝ 3.0）", "複合式：2–7（M ＝ 4.5）", "增強式：6–12（M ＝ 9.0）", "前測 F(2, 15) ＝ 17.04"]}}, "fig": {"cap": "圖 3.1　期刊編輯部的會議室", "sub": "白板上列出三隊的前測範圍。增強式組的最低分，比傳統組的最高分還高。"}, "beats": [{"s": "n", "t": "期刊編輯部的小會議室。魏教練、以安，還有另一位審查委員宋怡君。"}, {"s": "coach", "t": "調整後增強式還是很高啊。而且既然前測差這麼多，不就正好需要 ANCOVA 來控制嗎？"}, {"s": "rev", "t": "ANCOVA 能調整的，是<em>共變項的線性影響<\/em>。它不能把三支不同的隊伍，變成隨機分派的三組。"}, {"s": "hero", "t": "看前測分布：增強式組最低 6 分，傳統組最高 5 分。這兩組在前測上<em>完全沒有重疊<\/em>。"}, {"s": "hero", "t": "調整後平均是在問「如果三組前測都是 5.5 分」。增強式組沒有任何人接近 5.5 分，這個答案是沿著迴歸線<em>外推<\/em>出來的。"}, {"type": "viz", "title": "誰站在 5.5 附近", "text": ["第一步讓 18 位選手的<em>前測分數<\/em>一顆顆落進格子，紅線是總平均 5.5，高於 5.5 的球染成黃色。第二步只留增強式組：6 顆球全落在 6 分以上，沒有人接近 5.5。", "第三步只留傳統組：6 顆球全在 5 分以下。調整後平均回答的是「前測 5.5 時」的後測，但這兩組在 5.5 附近都<em>沒有資料<\/em>，答案只能沿迴歸線外推。"], "model": {"type": "drops", "title": "18 位選手的前測", "x": [0.5, 12.5], "counts": [1, 2, 3, 2, 2, 2, 2, 0, 1, 2, 0, 1], "curve": false, "color": "teal", "shade": {"from": 5.5, "to": 12.5, "label": "高於 5.5", "color": "gold"}, "marks": [{"x": 5.5, "label": "X̄ ＝ 5.5", "color": "red"}], "xLabel": "前測得分", "steps": [{"cap": "全部 18 人：前測從 1 分分散到 12 分"}, {"cap": "只看增強式：最低 6 分，全在 5.5 右側", "title": "增強式組的前測", "counts": [0, 0, 0, 0, 0, 1, 1, 0, 1, 2, 0, 1], "color": "gold", "shade": null}, {"cap": "只看傳統：最高 5 分，全在 5.5 左側", "title": "傳統組的前測", "counts": [1, 1, 2, 1, 1, 0, 0, 0, 0, 0, 0, 0], "color": "blue", "shade": null}]}, "cap": "圖 V5　調整點落在資料的空白處", "sub": "每顆球是一位選手的前測分數（1–12 分），紅線為總前測平均 5.5。", "points": ["共變項不重疊時，調整後平均是外推，不是觀察。"]}, {"type": "note", "id": "caveat"}, {"type": "choice", "header": "前測差異這麼大", "q": "三隊以隊為單位分派，前測差異顯著（p ＜ .001），分布也幾乎不重疊。這份共變數分析的結果應如何定位？", "opts": [{"t": "ANCOVA 已統計控制前測，結果等同隨機分派。", "good": false, "fb": "統計控制只排除共變項的線性影響。隊伍之間的教練、動機、位置組成等差異都沒有被控制，也無法靠一個前測補救。"}, {"t": "前測差異顯著，正好證明需要 ANCOVA，結果完全可信。", "good": false, "fb": "前測差異越大，調整越依賴迴歸線外推與線性假設，結果越脆弱。差異大是警訊，不是背書。"}, {"t": "僅為初步證據：調整依賴外推，宜審慎解讀，並建議隨機分派重做。", "good": true, "fb": "準實驗設計中，ANCOVA 是減少偏誤的工具，不是萬靈丹。報告應揭露非隨機分組與共變項不重疊的限制，把結論定位為初步證據。"}, {"t": "改用進步分數比較，就不用考慮前測差異。", "good": false, "fb": "進步分數同樣受起點差異影響（天花板效應、迴歸均值），且可能與 ANCOVA 得到相反結論（Lord's paradox）。換方法不會消除設計問題。"}]}, {"s": "coach", "t": "那我的研究就沒有價值了嗎？"}, {"s": "rev", "t": "有價值，只要寫對。把四個步驟、效果量與限制都寫清楚，就是一篇誠實的準實驗研究。"}, {"type": "choice", "header": "結果怎麼寫？", "q": "要在論文中報告 ANCOVA 的主要結果。下列哪一種寫法最恰當？", "opts": [{"t": "F ＝ 47.18，p ＝ .000，增強式組最佳。", "good": false, "fb": "缺少自由度與效果量；p 值不可能為 0，應寫 p ＜ .001；而且「增強式組最佳」與調整後平均不符。"}, {"t": "F(2, 14) ＝ 47.18，p ＜ .001，ηp² ＝ .87，附斜率檢定與調整後平均。", "good": true, "fb": "依序報告前提檢查、主要檢定（含自由度與效果量）、調整後平均與事後比較，讀者能完整重建分析。討論中還應說明非隨機分組的限制。"}, {"t": "F(2, 15) ＝ 47.18，p ＜ .001，證明訓練方式造成差異。", "good": false, "fb": "誤差自由度應為 N − k − 1 ＝ 18 − 3 − 1 ＝ 14，共變項會用掉 1 個自由度；準實驗設計也不宜使用「造成」這類因果語言。"}, {"t": "只列調整後平均數，不需要 F 值。", "good": false, "fb": "只有平均數，讀者無法判斷差異是否超出隨機變動，也無從評估效果大小。應同時報告統計量、自由度、p 值與效果量。"}]}, {"s": "n", "t": "一個月後，魏教練的修正稿寄到編輯部。標題裡的「增強式訓練最佳」不見了。"}, {"s": "hero", "t": "起跑線不同的比賽，ANCOVA 能幫忙估算，卻不能代替一場公平的起跑。"}]}], "notes": {"what": {"no": 1, "t": "什麼是共變數分析", "blocks": [{"type": "h", "t": "以統計控制補實驗控制"}, {"type": "p", "t": "實際研究中，無法一一排除會影響結果的無關變項（干擾變項）。<em>共變數分析（ANCOVA）<\/em>以「統計控制」彌補「實驗控制」的不足，減少誤差變異、提高檢定力。"}, {"type": "p", "t": "它結合變異數分析與迴歸分析，屬於一般線性模型（GLM）：先用迴歸排除<em>共變項<\/em>對依變項的影響，再比較各組平均。"}, {"type": "h", "t": "變項的尺度"}, {"type": "bullet", "t": "自變項：類別，如三種訓練。"}, {"type": "bullet", "t": "依變項：連續，如後測防守敏捷。"}, {"type": "bullet", "t": "共變項：連續，最常用前測分數。"}, {"type": "p", "t": "共變項應在設計階段依理論決定：與依變項相關，且不受實驗處理影響（例如在介入前測量）。"}], "fig": {"model": {"type": "paths", "title": "ANCOVA 概念圖", "nodes": [{"id": "G", "label": "訓練組別", "x": -0.65, "y": 0.8}, {"id": "X", "label": "前測", "x": -0.65, "y": 0.2}, {"id": "Y", "label": "後測", "x": 0.6, "y": 0.5}, {"id": "e", "label": "ε", "kind": "err", "x": 0.95, "y": 0.85}], "edges": [{"from": "G", "to": "Y", "color": "teal", "label": "組別效果"}, {"from": "X", "to": "Y", "color": "gold", "label": "斜率 b"}, {"from": "e", "to": "Y", "color": "gray"}, {"from": "G", "to": "X", "double": true, "color": "purple", "label": "前測差異"}], "steps": [{"cap": "隨機分組：組別與前測無關，沒有紫色弧線", "edges": [{"from": "G", "to": "Y", "color": "teal", "label": "組別效果"}, {"from": "X", "to": "Y", "color": "gold", "label": "斜率 b"}, {"from": "e", "to": "Y", "color": "gray"}]}, {"cap": "以隊伍分派：組別與前測相關（紫色弧線）"}]}, "cap": "圖 N1　組別與共變項同時指向依變項", "sub": "綠色箭頭為要檢定的組別效果，黃色箭頭為前測對後測的迴歸（共同斜率 b），紫色弧線為組別與前測的關聯：隨機分組時應接近 0。", "points": ["先扣掉黃色箭頭解釋的部分，再看綠色箭頭。", "紫色弧線越強，調整越冒險（見第三幕）。"]}}, "power": {"no": 2, "t": "為什麼檢定力變高", "blocks": [{"type": "h", "t": "三個圓圈的故事"}, {"type": "p", "t": "把依變項的變異想成一個圓（100%）。組別與依變項重疊 20%，前測與依變項重疊 30%；隨機分組時，組別與前測幾乎不重疊。"}, {"type": "p", "t": "只做 ANOVA 時，組別的 20% 要和其餘 80% 的未解釋變異相比。ANCOVA 先移除前測的 30%，剩下 70%，組別占比變成 20% ÷ 70% ≈ 28.6%。"}, {"type": "formula", "t": "ηp² ＝ SS組別 ÷ (SS組別 ＋ SS誤差)"}, {"type": "p", "t": "誤差變異變小，F 值變大，檢定力提高。代價是每個共變項用掉 1 個誤差自由度："}, {"type": "formula", "t": "df誤差 ＝ N − k − c"}, {"type": "p", "t": "c 為共變項個數。本案 N ＝ 18、k ＝ 3、c ＝ 1，誤差自由度為 14。"}], "fig": {"model": {"type": "bars", "title": "組別效果占「可解釋空間」的比例", "rows": [["ANOVA", 0.2, "blue"], ["ANCOVA", 0.286, "teal"]], "max": 0.35, "steps": [{"cap": "ANOVA：組別 20% ÷ 全部 100%", "rows": [["ANOVA", 0.2, "blue"]]}, {"cap": "ANCOVA：先移除前測 30%，20% ÷ 70%"}]}, "table": [["", "ANOVA", "ANCOVA"], ["組別", "20%", "20%"], ["共變項", "—", "30%"], ["誤差", "80%", "50%"], ["組別占比", "20 ÷ 100", "20 ÷ 70"]], "cap": "圖 N2　同樣 20% 的組別效果，在 ANCOVA 中更顯眼", "sub": "柱高為組別效果的（偏）η²。下表為三圓圈示意的變異拆解（數值為教學示意，取自講義的目測比例）。", "points": ["共變項與依變項相關越高，誤差減得越多。", "與依變項無關的共變項，只會白白浪費自由度。"]}}, "slopes": {"no": 3, "t": "迴歸斜率同質性", "blocks": [{"type": "h", "t": "為什麼要平行？"}, {"type": "p", "t": "ANCOVA 用<em>一條共同的組內斜率<\/em>調整所有組。若各組「前測→後測」的斜率不同，組間差異會隨前測高低而改變，就沒有單一的「調整後差異」可以報告。"}, {"type": "h", "t": "怎麼檢定"}, {"type": "p", "t": "SPSS：分析 → 一般線性模式 → 單變量，「模式」選「自訂」，放入前測、組別、組別 × 前測，看交互作用那一列："}, {"type": "formula", "t": "組別 × 前測：F(2, 12) ＝ 0.27"}, {"type": "p", "t": "p ＝ .768，未達顯著：三條組內迴歸線可視為平行，可繼續 ANCOVA。"}, {"type": "h", "t": "若不平行"}, {"type": "p", "t": "輕微不平行影響有限；嚴重時硬做 ANCOVA 會導致錯誤結論。這代表可能存在<em>調節模型<\/em>：訓練效果取決於前測水準。應保留交互作用，比較不同前測水準下的組間差異（如 Johnson–Neyman 法）。"}], "fig": {"model": {"type": "lines", "title": "若斜率不平行（示意）", "xLabels": ["前測低", "前測中", "前測高"], "series": [{"label": "複合式", "values": [8, 11, 14], "color": "teal"}, {"label": "增強式", "values": [11, 12, 13], "color": "gold"}], "ymin": 6, "ymax": 15, "yLabel": "預期後測", "steps": [{"cap": "平行：各前測水準下的組間差距都一樣", "title": "若斜率平行（示意）", "series": [{"label": "複合式", "values": [8, 11, 14], "color": "teal"}, {"label": "增強式", "values": [7, 10, 13], "color": "gold"}]}, {"cap": "不平行：組間差距隨前測水準翻轉"}]}, "cap": "圖 N3　斜率不平行時，組間差距隨前測改變", "sub": "示意：若兩組斜率不同，前測低時增強式較高，前測高時複合式較高；「調整後差異」取決於在哪個前測值比較（數值為教學示意）。", "points": ["本案 F(2, 12) ＝ 0.27：斜率平行，可以合併。", "斜率不平行是調節效果的訊號，不是雜訊。"]}}, "model": {"no": 4, "t": "組內迴歸線與調整", "blocks": [{"type": "h", "t": "ANCOVA 模型"}, {"type": "formula", "t": "Yᵢⱼ ＝ μ ＋ τⱼ ＋ b(Xᵢⱼ − X̄) ＋ εᵢⱼ"}, {"type": "p", "t": "τⱼ 是第 j 組的效果，b 是合併三組後的<em>組內迴歸係數<\/em>（共同斜率）。本案 b ＝ 0.66。"}, {"type": "h", "t": "調整後平均數"}, {"type": "formula", "t": "Ȳ調整 ＝ Ȳⱼ − b(X̄ⱼ − X̄)"}, {"type": "p", "t": "把每組沿著自己的迴歸線，移到總前測平均 X̄ ＝ 5.5 的位置，讀出預期後測："}, {"type": "bullet", "t": "傳統：4.5 − 0.66 × (3.0 − 5.5) ＝ 6.15"}, {"type": "bullet", "t": "複合式：12.0 − 0.66 × (4.5 − 5.5) ＝ 12.66"}, {"type": "bullet", "t": "增強式：13.0 − 0.66 × (9.0 − 5.5) ＝ 10.69"}, {"type": "p", "t": "前測高於總平均的組被往下調，低於總平均的組被往上調。"}], "fig": {"model": {"type": "curves", "x": [0, 12], "ymin": 0, "ymax": 18, "curves": [{"type": "line", "a": 2.52, "b": 0.66, "label": "傳統", "labelAt": 4, "color": "gray"}, {"type": "line", "a": 9.03, "b": 0.66, "label": "複合式", "labelAt": 1.5, "color": "teal"}, {"type": "line", "a": 7.06, "b": 0.66, "label": "增強式", "labelAt": 11, "color": "gold"}], "marks": [{"x": 5.5, "label": "X̄ ＝ 5.5", "color": "red"}], "dots": [[3, 5, "gray"], [1, 2, "gray"], [2, 4, "gray"], [4, 3, "gray"], [3, 6, "gray"], [5, 7, "gray"], [4, 13, "teal"], [3, 11, "teal"], [2, 10, "teal"], [6, 12, "teal"], [5, 12, "teal"], [7, 14, "teal"], [10, 14, "gold"], [6, 11, "gold"], [12, 15, "gold"], [10, 12, "gold"], [7, 12, "gold"], [9, 14, "gold"]], "xLabel": "前測", "yLabel": "後測", "steps": [{"cap": "18 位選手與三條斜率 0.66 的平行線", "marks": []}, {"cap": "紅線 X̄ ＝ 5.5 與三線的交點＝調整後平均"}]}, "cap": "圖 N4　三條平行的組內迴歸線", "sub": "點為 18 位選手（灰：傳統、綠：複合式、黃：增強式），三條線斜率皆為 0.66。紅線 X̄ ＝ 5.5 與各線的交點，就是調整後平均數。", "points": ["調整後平均＝「如果前測都是 5.5 分」的預期後測。", "增強式組的點全在 6 分以上：它的交點是外推出來的。"]}}, "assump": {"no": 5, "t": "四大前提與四步驟", "blocks": [{"type": "h", "t": "ANCOVA 的前提"}, {"type": "bullet", "t": "<em>隨機性與獨立性<\/em>：樣本隨機、觀察值彼此獨立。"}, {"type": "bullet", "t": "<em>常態性<\/em>：各組依變項（殘差）近似常態。"}, {"type": "bullet", "t": "<em>變異數同質性<\/em>：各組誤差變異相等，以 Levene 檢定。"}, {"type": "bullet", "t": "<em>迴歸斜率同質性<\/em>：共變項與依變項的關係在各組相同。"}, {"type": "p", "t": "另外兩個常被忽略的條件：共變項與依變項為<em>線性關係<\/em>；共變項在處理<em>之前<\/em>測量，且信度高。"}, {"type": "h", "t": "四個步驟"}, {"type": "p", "t": "① 組內迴歸係數同質性檢定 → ② Levene 變異數同質性檢定 → ③ 共變數分析（調整後平均的組間差異）→ ④ 以調整後平均做事後比較。"}, {"type": "p", "t": "本案 Levene F(2, 15) ＝ 1.57，p ＝ .241，變異數同質。"}], "fig": {"model": {"type": "boxes", "title": "三組的後測分數", "groups": [{"label": "傳統", "stats": [2, 3, 4.5, 6, 7], "mean": 4.5, "color": "gray"}, {"label": "複合式", "stats": [10, 11, 12, 13, 14], "mean": 12, "color": "teal"}, {"label": "增強式", "stats": [11, 12, 13, 14, 15], "mean": 13, "color": "purple"}], "ymin": 0, "ymax": 16, "yLabel": "後測得分"}, "cap": "圖 N5　三組後測的分布", "sub": "盒子為 Q₁ 到 Q₃，黑線為中位數，金色菱形為原始平均數。三個盒子的高度相近，與 Levene 檢定結果一致。", "points": ["四個步驟有順序：先檢查前提，再看組別效果。", "斜率同質性是 ANCOVA 特有、也最常被跳過的一步。"]}}, "adjmean": {"no": 6, "t": "調整後平均與事後比較", "blocks": [{"type": "h", "t": "摘要表"}, {"type": "formula", "t": "組別：F(2, 14) ＝ 47.18，p ＜ .001"}, {"type": "p", "t": "SS組別 ＝ 114.94、SS誤差 ＝ 17.05，ηp² ＝ 114.94 ÷ 131.99 ≈ .87。共變項（前測）本身也顯著：F(1, 14) ＝ 18.43，p ＜ .001。"}, {"type": "h", "t": "事後比較看「調整後」"}, {"type": "p", "t": "以調整後平均做 Bonferroni 成對比較：複合式比傳統高 6.51、增強式比傳統高 4.54，皆顯著；複合式比增強式高 1.97，未達顯著（未校正 p ≈ .055）。"}, {"type": "p", "t": "結論：兩種新訓練都優於傳統訓練，但無法區分複合式與增強式孰優。"}, {"type": "h", "t": "SPSS"}, {"type": "p", "t": "單變量 → 選項：把組別選入「顯示平均數」，勾選比較主效應（Bonferroni）、敘述統計、同質性檢定、參數估計值。"}], "fig": {"model": {"type": "lines", "title": "原始平均 vs 調整後平均", "xLabels": ["傳統", "複合式", "增強式"], "series": [{"label": "原始平均", "values": [4.5, 12.0, 13.0], "color": "gray"}, {"label": "調整後", "values": [6.15, 12.66, 10.69], "color": "teal"}], "ymin": 2, "ymax": 14, "yLabel": "後測得分", "steps": [{"cap": "原始後測平均：增強式第一", "series": [{"label": "原始平均", "values": [4.5, 12.0, 13.0], "color": "gray"}]}, {"cap": "調整後：複合式第一，增強式降到第二"}]}, "cap": "圖 N6　調整前後，名次換了", "sub": "灰線為原始後測平均，綠線為排除前測影響後的調整平均數。前測最高的增強式組被往下調，前測最低的傳統組被往上調。", "points": ["原始：增強式 13.0 ＞ 複合式 12.0 ＞ 傳統 4.5。", "調整後：複合式 12.66 ＞ 增強式 10.69 ＞ 傳統 6.15。"]}}, "caveat": {"no": 7, "t": "共變項的陷阱", "blocks": [{"type": "h", "t": "ANCOVA 不能取代隨機分派"}, {"type": "p", "t": "隨機分組時，組別與前測幾乎無關，ANCOVA 主要用來<em>提高檢定力<\/em>。以班級或隊伍分派的準實驗設計中，組間前測差異大，ANCOVA 被用來<em>調整偏誤<\/em>，結果就高度依賴模型假設。"}, {"type": "h", "t": "三個警訊"}, {"type": "bullet", "t": "<em>不重疊<\/em>：各組共變項範圍不重疊時，調整後平均是迴歸線外推的結果。"}, {"type": "bullet", "t": "<em>測量誤差<\/em>：共變項信度不足時，調整不完全，殘留偏誤。"}, {"type": "bullet", "t": "<em>未測量的差異<\/em>：教練、動機、位置組成等，都不在模型裡。"}, {"type": "h", "t": "Lord's paradox"}, {"type": "p", "t": "同一份前後測資料，用進步分數與 ANCOVA 可能得到相反結論，因為兩者回答的問題不同。非隨機分組時，沒有任何統計調整能保證得到因果效果。"}], "fig": {"model": {"type": "boxes", "title": "三組的前測分數", "groups": [{"label": "傳統", "stats": [1, 2, 3, 4, 5], "mean": 3, "color": "gray"}, {"label": "複合式", "stats": [2, 3, 4.5, 6, 7], "mean": 4.5, "color": "teal"}, {"label": "增強式", "stats": [6, 7, 9.5, 10, 12], "mean": 9, "color": "purple"}], "ymin": 0, "ymax": 13, "yLabel": "前測得分", "steps": [{"cap": "三隊前測：增強式整個盒子高於傳統"}, {"cap": "總平均 5.5：增強式沒有人在這條線以下", "refs": [{"value": 5.5, "label": "X̄ ＝ 5.5", "color": "red"}]}]}, "cap": "圖 N7　三隊的前測幾乎不重疊", "sub": "盒鬚圖為三隊的前測分數，金色菱形為平均數。總平均 5.5 分，低於增強式組的最低分 6 分。", "points": ["前測 F(2, 15) ＝ 17.04，p ＜ .001：起點差異巨大。", "調整後平均不是觀察到的事實，而是模型的推估。"]}}}, "ending": {"title": "逆轉的名次：結案", "paragraphs": ["魏教練的修正稿依四個步驟重新報告：斜率同質（F(2, 12) ＝ 0.27，p ＝ .768）、變異數同質（Levene p ＝ .241）；控制前測後，訓練方式效果顯著，F(2, 14) ＝ 47.18，p ＜ .001，ηp² ＝ .87。", "調整後平均顯示複合式（12.66）與增強式（10.69）都優於傳統訓練（6.15），兩者之間未達顯著。論文在限制中說明以隊伍為單位分派、前測分布幾乎不重疊，結論定位為初步證據；下學期改以選手為單位隨機分派重做。"], "takeaway": "ANCOVA 讓起點不同的組別能「站在同一條起跑線上」比較，但這條起跑線是迴歸畫出來的。斜率要平行、範圍要重疊、分組最好隨機，調整後的名次才站得住。", "verdict": ["審查通過：你依序完成 ANCOVA 的每一步，也看見了它的極限。修正稿順利刊登。", "有條件接受：主要分析正確，但有幾處判斷讓調整後的結論顯得過度自信。", "退   if(b.type==='scene'){if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;if(b.title)curHeader={k:curHeader.k,t:b.title};S.pendingTurn=true;S.beat++;showBeat();return;}
  if(b.type==='choice'){S.state='CHOICE';S.choice=b;S.picked=null;S.onNote=false;S.pendingTurn=false;if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;
    locked(async()=>{chapTxt.textContent=(A().key||'')+' ・ 研究決策';const opts=arr(b.opts);let sz=38,osz=33;const est=measureRuns(parseEm(b.q),PW-240,sz,sz*1.45,true)+opts.reduce((s,o)=>s+measureRuns(parseEm(o.t),PW-360,osz,osz*1.45)+46,0);if(est>820){sz=34;osz=29;}if(est>1000){sz=31;osz=26;}
      doc=[{type:'question',t:b.q,sz},...opts.map((o,i)=>({type:'option',k:'ABCDE'[i],t:o.t,idx:i,state:'',sz:osz}))];curHeader={k:(A().key||'')+' ・ 研究決策',t:b.header||'你會怎麼做？'};
      await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),b.model?{model:b.model}:S.scene);S.state='CHOICE';drawCue('點選一個選項 ▸');});return;}
  const blk=textBlock(b);
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  doc.push(blk);const yEnd=renderLeft(leftCanvas,doc,curHeader);
  if(yEnd>PH-150&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  AUDIO.click();drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');}
function showEnding(){locked(async()=>{chapTxt.textContent='結案報告';await turnPage(c=>renderEndLeft(c),c=>renderEndRight(c),(B.ending&&B.ending.model)?{model:B.ending.model}:((B.ending&&B.ending.scene)||null));S.state='DONE';if(window.__markDone)window.__markDone();});}
function advance(){if(S.busy)return;if(S.state==='TITLE'){AUDIO.init();if(ACTS.length)enterAct(0);return;}
  if(S.state==='READING'||S.state==='AFTER'){S.beat++;showBeat();return;}
  if(S.state==='END'){if(S.act<ACTS.length-1)enterAct(S.act+1);else showEnding();}}
function pickOption(idx){if(S.state!=='CHOICE'||S.picked!==null)return;const o=arr(S.choice.opts)[idx];if(!o)return;S.picked=idx;AUDIO.click();DECISIONS.push({q:S.choice.header||S.choice.q,t:o.t,good:!!o.good});
  doc.forEach(b=>{if(b.type==='option')b.state=b.idx===idx?'picked':'dim';});
  // fit question+options+feedback on page: shrink feedback if needed
  let fsz=32;doc.push({type:'feedback',t:o.fb||'',good:!!o.good,sz:fsz});let y=renderLeft(leftCanvas,doc,curHeader);
  while(y>PH-110&&fsz>22){fsz-=2;doc[doc.length-1].sz=fsz;y=renderLeft(leftCanvas,doc,curHeader);}
  if(y>PH-110){doc=doc.filter(b=>b.type!=='option'||b.state==='picked');y=renderLeft(leftCanvas,doc,curHeader);}
  if(fbRect){flap=makeFlap(fbRect);S.state='FLAP';drawCue('掀開紙片 ▸');}else{S.state='AFTER';}}
function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=arr(S.choice.opts)[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});
  gsap.delayedCall(1.0,()=>{AUDIO.chime(!!o.good);S.state='AFTER';S.pendingTurn=true;renderLeft(leftCanvas,doc,curHeader);drawCue(nextIsTurn()?'翻頁 ▸':'翻頁繼續 ▸');});}
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips||['……'];rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}
window.__api={advance,pickOption,liftFlap};

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,dragRot=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup&&!S.onNote){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
</script>
