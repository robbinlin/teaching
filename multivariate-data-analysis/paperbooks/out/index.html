<html lang="zh-Hant">
<head>

<title>研究案件書房</title>
<style>
:root{--paper:#f4eddc;--ink:#1e1912;--teal:#0c4a45;--acc:#86200f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a1c11;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
#three{position:fixed;inset:0}#three canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}#ui .pe{pointer-events:auto}
.pill{position:absolute;top:16px;background:rgba(244,237,220,.94);border:1px solid rgba(60,40,20,.25);border-radius:999px;padding:8px 16px;font-size:13px;letter-spacing:.06em;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;white-space:nowrap}
#brand{left:16px;max-width:calc(100vw - 200px);overflow:hidden;text-overflow:ellipsis}#brand b{font-size:11px;letter-spacing:.25em;color:#7a6a4a}
#tools{right:16px;padding:5px 8px;gap:4px}
#tools a,#tools button{border:none;background:none;cursor:pointer;height:30px;border-radius:15px;display:flex;align-items:center;gap:6px;padding:0 10px;color:#4a3a20;font:inherit;font-size:13px;text-decoration:none}
#tools a:hover,#tools button:hover{background:rgba(60,40,20,.1)}
#tools svg{width:17px;height:17px;fill:none;stroke:#5a4a30;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.off svg{stroke:#b8a98a}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:rgba(244,237,220,.88);background:rgba(30,20,12,.55);padding:7px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--teal);color:var(--teal);font-weight:700;font-size:15px;padding:9px 18px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .25s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#prompt.on{opacity:1;visibility:visible}
#tip{position:absolute;background:rgba(244,237,220,.97);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .15s;max-width:260px;line-height:1.5}
#tip .k{font-size:11px;letter-spacing:.2em;color:var(--teal);font-weight:700}#tip .t{font-size:16px;font-weight:700}
#title{position:absolute;left:50%;top:14%;transform:translateX(-50%);text-align:center;color:#f4e6c8;text-shadow:0 2px 16px rgba(0,0,0,.7);transition:opacity 1.2s;width:min(92vw,720px)}
#title .k{letter-spacing:.45em;font-size:12px;color:#e0c48e}#title h1{font-size:clamp(28px,5vw,46px);margin:10px 0 8px;letter-spacing:.12em}#title p{font-size:15px;letter-spacing:.1em;color:#ead9b6}
#card{position:absolute;right:max(16px,4vw);top:50%;transform:translate(30px,-50%);width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--paper);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:22px 24px 20px;opacity:0;visibility:hidden;transition:opacity .35s,transform .35s,visibility 0s .35s}
#card.on{opacity:1;visibility:visible;transform:translate(0,-50%);transition:opacity .35s,transform .35s}
#card .case{font-size:12px;letter-spacing:.3em;color:var(--teal);font-weight:700}#card .big{font-size:12px;letter-spacing:.25em;color:#7a6a4a;margin-top:2px}
#card h2{font-size:30px;margin:8px 0 4px;letter-spacing:.04em}#card .tag{color:var(--acc);font-weight:700;font-size:14px;margin-bottom:12px}
#card p{font-size:14.5px;line-height:1.8;color:#2e271c}
#card .acts{margin:14px 0 6px;padding:10px 12px;border-left:3px solid var(--teal);background:rgba(12,74,69,.06);font-size:13.5px;line-height:1.8}
#card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}#card .meta span{font-size:12px;border:1px solid rgba(60,40,20,.3);border-radius:999px;padding:3px 10px;color:#4a3a20;background:rgba(255,255,255,.4)}
#card .meta span.st{border-color:var(--acc);color:var(--acc);font-weight:700}#card .meta span.st.done{border-color:var(--teal);color:var(--teal)}
#card .btns{display:flex;gap:10px;flex-wrap:wrap}
#card button{font:inherit;cursor:pointer;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:700;letter-spacing:.06em}
#open{background:var(--teal);color:#fff;border:none;flex:1}#open:hover{background:#0f5c55}
#back{background:none;border:1.5px solid rgba(60,40,20,.4);color:#4a3a20}#back:hover{background:rgba(60,40,20,.08)}
#card .keys{margin-top:10px;font-size:11.5px;color:#7a6a4a;letter-spacing:.06em}
#fade{position:absolute;inset:0;background:#f4eddc;opacity:0;visibility:hidden;transition:opacity .7s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink)}
#fade.on{opacity:1;visibility:visible}#fade .k{letter-spacing:.4em;font-size:12px;color:var(--teal)}#fade .t{font-size:30px;font-weight:700}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#2a1c11;color:#d9c9a8;letter-spacing:.3em;font-size:13px;transition:opacity .8s;text-align:center;padding:16px}

/* arcane archive skin */
html,body{background:#0e0a18;font-family:"Noto Serif TC","Microsoft JhengHei",serif}
.pill{background:rgba(20,15,32,.86);color:#f0dfb0;border:1px solid rgba(214,174,90,.55);box-shadow:0 0 18px rgba(214,174,90,.15),0 4px 14px rgba(0,0,0,.45)}
#brand b{color:#d6ae5a}
#tools a,#tools button{color:#f0dfb0}#tools svg{stroke:#e8c98a}#tools button.off svg{stroke:#6a5a40}#tools a:hover,#tools button:hover{background:rgba(214,174,90,.15)}
#hint{background:rgba(14,10,24,.7);color:#f0dfb0;border:1px solid rgba(214,174,90,.35)}
#prompt{background:rgba(20,15,32,.92);border:1.5px solid #d6ae5a;color:#f6e3b0;box-shadow:0 0 22px rgba(214,174,90,.35)}
#tip{background:rgba(20,15,32,.95);color:#f0dfb0;border:1px solid rgba(214,174,90,.5)}#tip .k{color:#d6ae5a}
#title{color:#f6e3b0;text-shadow:0 0 24px rgba(120,140,255,.45),0 2px 14px rgba(0,0,0,.8)}#title .k{color:#d6ae5a}#title p{color:#e8d6a8}
#card{background:linear-gradient(#f3e6c6,#ead9b0);border:2px solid #b8913e;box-shadow:0 0 0 6px rgba(20,15,32,.6),0 18px 50px rgba(0,0,0,.6),0 0 40px rgba(214,174,90,.25)}
#card .case{color:#5a2a7a}#open{background:linear-gradient(#2a1f4a,#1a1430);color:#f6e3b0;border:1px solid #d6ae5a}#open:hover{background:#3a2a62}
#fade{background:#0e0a18;color:#f6e3b0}#fade .k{color:#d6ae5a}
#loading{background:#0e0a18;color:#e8c98a}
@media (max-width:640px){#card{top:auto;bottom:12px;transform:translate(0,30px);max-height:52vh}#card.on{transform:translate(0,0)}#card h2{font-size:24px}#hint{font-size:11px;letter-spacing:.04em}#title{top:10%}#brand span{display:none}}
</style>

"big": "MANOVA", "tag": "CASE 05 ・ Multivariate Analysis of Variance", "summary": "一項研究比較三種教練回饋方式對游泳選手訓練動機的影響。動機以 ARCS 模式的四個向度測量，作者對每個向度各跑一次 ANOVA，宣稱「數據回饋同時提升兩種不同的動機，但對另外兩種無效」。四張 ANOVA 表，四個 p 值，卻沒有人問：這四個向度，本來就是同一件事的四個面向。", "acts": ["四張 ANOVA 表", "看不見的組合", "誰在出力"], "notes": 7, "viz": 5, "choices": 5, "color": ""}, {"file": "第06章_迴歸分析I_紙本書版.html", "id": "第06章_迴歸分析I_紙本書版", "caseNo": "06", "title": "一公斤的承諾", "big": "REGRESSION", "tag": "CASE 06 ・ Simple Linear Regression", "summary": "某大學肌力體能總教練以 96 位男性運動員的資料宣稱：「體重每增加 1 公斤，深蹲 1RM 就增加 1.82 公斤」，R² 高達 .74。他打算要求全隊增重，還要把公式套用到體重只有 40 公斤的國中選手身上，替他們訂訓練重量。這條直線，真的能這樣用嗎？", "acts": ["教練的直線", "扇形的殘差", "範圍之外"], "notes": 7, "viz": 6, "choices": 5, "color": ""}, {"file": "第07章_迴歸分析II_紙本書版.html", "id": "第07章_迴歸分析II_紙本書版", "caseNo": "07", "title": "翻轉的係數", "big": "MULTIPLE", "tag": "CASE 07 ・ Multiple Regression", "summary": "划船協會委託數據分析師，從 18 項測驗中以逐步迴歸挑出「選才公式」：VO₂max、去脂體重與體重。報告指出體重的係數為負，建議選才時「同等條件下選輕的」，並宣稱身高沒有入選、與成績無關。可是在相關矩陣裡，體重與 2000 公尺功率明明是正相關。", "acts": ["選才公式", "糾纏的變數", "模型的比較"], "notes": 8, "viz": 5, "choices": 5, "color": ""}, {"file": "第08章_邏輯斯迴歸_紙本書版.html", "id": "第08章_邏輯斯迴歸_紙本書版", "caseNo": "08", "title": "三倍的風險", "big": "LOGISTIC", "tag": "CASE 08 ・ Logistic Regression", "summary": "一家運動科技新創公司宣稱，他們的監測系統發現：急慢性負荷比（ACWR）超過 1.5 的球員，「受傷風險是其他人的 3 倍」，預測模型的準確率還有 74%。職業足球隊打算依此設定硬性上限，超過就強制休息。可是這個 3，到底是什麼的 3 倍？", "acts": ["三倍的風險", "S 形的曲線", "準確率的錯覺"], "notes": 8, "viz": 5, "choices": 5, "color": ""}, {"file": "第09章_調節與中介_紙本書版.html", "id": "第09章_調節與中介_紙本書版", "caseNo": "09", "title": "看不見的中間人", "big": "MEDIATION", "tag": "CASE 09 ・ Moderator × Mediator", "summary": "國家隊心理諮詢團隊宣稱：心理技能訓練對比賽表現的效果，完全透過自我效能中介，因此其他訓練模組都可以刪除；他們還說，高焦慮選手接受訓練沒有用。兩個結論都來自 96 位選手的同一份問卷。以安與柏哲重新打開資料，追查效果究竟走哪一條路、又在誰身上變弱。", "acts": ["完全中介的宣稱", "間接效果在哪裡", "焦慮的另一條線"], "notes": 7, "viz": 5, "choices": 5, "color": ""}, {"file": "第10章_驗證性因素分析_紙本書版.html", "id": "第10章_驗證性因素分析_紙本書版", "caseNo": "10", "title": "過度合身的模型", "big": "CONFIRMATORY", "tag": "CASE 10 ・ Confirmatory Factor Analysis", "summary": "某大學運動心理團隊發展了「大專運動員倦怠量表」，宣稱驗證性因素分析的適配指標全數達標、組合信度皆高於 .70，建議大專體總列為選手健康監測工具。但報告的自由度少了 14，兩個因素的相關高達 .92，而且探索與驗證用的是同一批 412 位選手。", "acts": ["漂亮的適配度", "被放開的誤差", "分不開的兩個因素"], "notes": 8, "viz": 5, "choices": 5, "color": ""}, {"file": "第11章_投稿常見的統計謬誤_紙本書版.html", "id": "第11章_投稿常見的統計謬誤_紙本書版", "caseNo": "11", "title": "第二位審查人", "big": "FALLACIES", "tag": "CASE 11 ・ Common Statistical Errors in Manuscripts", "summary": "一份投稿宣稱：冷水浸泡能加速大學足球員的賽後恢復，按摩無效，而且多睡一小時就能減少三成傷害。第一位審查人建議直接接受。主編請以安擔任第二位審查人。從表一的描述統計到討論的最後一句，謬誤一個接一個浮出水面。", "acts": ["表一與摘要", "重複的陷阱", "最後一段討論"], "notes": 8, "viz": 5, "choices": 6, "color": ""}];

  g.textAlign='center';g.fillStyle='#e8cf96';g.font='bold 22px '+FONT;g.fillText('R E S E A R C H   C A S E',w/2,110);g.font='bold 30px '+FONT;g.fillText('CASE '+(b.caseNo||''),w/2,160);
  g.fillStyle='#fbf1d6';let s=fitFont(g,b.big||'',w-120,46,true);g.font='bold '+s+'px '+FONT;g.fillText(b.big||'',w/2,260);g.fillStyle='#d9b45e';g.fillRect(w/2-60,290,120,3);
  g.fillStyle='#ffffff';s=fitFont(g,b.title||'',w-110,62,true);g.font='bold '+s+'px '+FONT;g.fillText(b.title||'',w/2,390);g.fillStyle='#f0dca8';s=fitFont(g,b.tag||'',w-120,26,true);g.font='bold '+s+'px '+FONT;g.fillText(b.tag||'',w/2,450);

const cam={pos:new THREE.Vector3(0,7.5,12.5),look:new THREE.Vector3(0,1.6,-3),mode:'follow',focus:null};camera.position.copy(cam.pos);camera.lookAt(cam.look);
function camGoal(){const p=hero.g.position;const narrow=camera.aspect<0.9;if(cam.mode==='book'&&cam.focus){const f=cam.focus;return {pos:new THREE.Vector3(f.x*0.8+(narrow?0:0.5),2.9,f.z+(narrow?6.8:5.4)),look:new THREE.Vector3(f.x*0.85+(narrow?0:0.5),1.35,f.z-1.2)};}
  const tanH=Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect;const need=(SW/2+0.55)/tanH;
  if(!narrow&&need<12.5){const D=Math.max(6.4,need);const z=Math.max(SHELF_Z+D,p.z+4.2);const px=THREE.MathUtils.clamp(p.x*0.12,-1,1);return {pos:new THREE.Vector3(px,2.5+D*0.13,z),look:new THREE.Vector3(px*0.8,1.3,SHELF_Z+0.4)};}
  const zoff=narrow?8.6:7.2;const px=THREE.MathUtils.clamp(p.x*0.62,-3.6,3.6);return {pos:new THREE.Vector3(px,3.5+(p.z<-2?0.3:0),Math.min(p.z+zoff,11)),look:new THREE.Vector3(p.x*0.78,1.25,p.z-2.0)};}

  $('cActs').innerHTML=(b.acts||[]).map((a,i)=>'<div><b>'+(['第一幕','第二幕','第三幕','第四幕','第五幕'][i]||'')+'</b>　'+esc(a)+'</div>').join('');
  $('cMeta').innerHTML=['研究筆記 '+b.notes+' 則','模型動畫 '+(b.viz||0)+' 頁','研究決策 '+b.choices+' 題'].map(t=>'<span>'+t+'</span>').join('')+'<span class="st'+(bk.state==='done'?' done':'')+'">'+bookState(bk)+'</span>';card.classList.add('on');setTimeout(()=>{try{$('open').focus({preventScroll:true});}catch(e){}},350);}
let titleHidden=false;function hideTitle(){if(titleHidden)return;titleHidden=true;$('title').style.opacity=0;}

/* ---------- interactions ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pick(ev){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hb=ray.intersectObjects(BOOKS.map(b=>b.mesh),false);if(hb.length)return {book:BOOKS[hb[0].object.userData.book]};const hf=ray.intersectObject(floor,false);if(hf.length)return {floor:hf[0].point};return null;}
function walkTo(p,onArrive){H.target=new THREE.Vector3(THREE.MathUtils.clamp(p.x,BOUND.x0,BOUND.x1),0,THREE.MathUtils.clamp(p.z,BOUND.z0,BOUND.z1));H.onArrive=onArrive||null;H.face=null;}
function chooseBook(bk){if(busy||selected||!bk)return;AUDIO.init();hideTitle();busy=true;cam.mode='follow';walkTo(bk.stand,()=>{H.face=Math.PI;setTimeout(()=>takeBook(bk),220);});}
function bookFloatTarget(){const dir=new THREE.Vector3();camera.getWorldDirection(dir);const rightV=new THREE.Vector3().crossVectors(dir,camera.up).normalize();const narrow=camera.aspect<0.9;const p=camera.position.clone().addScaledVector(dir,narrow?2.9:2.0).addScaledVector(rightV,narrow?0:-0.55).add(new THREE.Vector3(0,narrow?0.62:0.02,0));
  const m=new THREE.Object3D();m.position.copy(p);m.lookAt(camera.position);m.rotateY(-Math.PI/2);return {p,q:m.quaternion.clone()};}
function takeBook(bk){selected=bk;store.set('pb:last',bk.b.id);AUDIO.pick();cam.mode='book';cam.focus=bk.stand.clone();
  gsap.to(H,{reach:1,duration:0.45,ease:'power2.out'});
  const g=bk.grp;const st={p:0};const p0=new THREE.Vector3(),q0=new THREE.Quaternion();
  const tl=gsap.timeline({onComplete:()=>{busy=false;showCard(bk);}});
  tl.to(g.position,{z:bk.home.z+0.5,duration:0.45,ease:'power2.out',onStart:()=>AUDIO.slide()},0.25);
  tl.add(()=>{p0.copy(g.position);q0.copy(g.quaternion);},0.72);
  tl.to(st,{p:1,duration:1.0,ease:'power2.inOut',onUpdate:()=>{const tgt=bookFloatTarget();g.position.lerpVectors(p0,tgt.p,st.p);g.quaternion.copy(q0).slerp(tgt.q,st.p);}},0.72);
  tl.to(H,{reach:0,duration:0.5},1.0);}
function putBack(){if(!selected||busy)return;busy=true;card.classList.remove('on');const bk=selected;const g=bk.grp;const st={p:0};const p0=g.position.clone(),q0=g.quaternion.clone();const mid=bk.home.clone().add(new THREE.Vector3(0,0,0.5));
  gsap.timeline({onComplete:()=>{selected=null;busy=false;cam.mode='follow';bk.hov=0;}}).to(st,{p:1,duration:0.8,ease:'power2.inOut',onUpdate:()=>{g.position.lerpVectors(p0,mid,st.p);g.quaternion.copy(q0).slerp(bk.homeQ,st.p);}}).to(g.position,{z:bk.home.z,duration:0.35,ease:'power2.in',onStart:()=>AUDIO.slide()});}
function openBook(){if(!selected||busy)return;busy=true;const bk=selected;AUDIO.open();card.classList.remove('on');const g=bk.grp;const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  gsap.to(g.position,{x:camera.position.x+dir.x*1.0,y:camera.position.y+dir.y*1.0,z:camera.position.z+dir.z*1.0,duration:0.9,ease:'power2.in'});
  $('fadeT').textContent='《'+bk.b.title+'》';setTimeout(()=>$('fade').classList.add('on'),450);setTimeout(()=>{location.href=bk.b.file;},1250);}
window.__lib={books:BOOKS.map(b=>b.b.title),choose:i=>chooseBook(BOOKS[i]),open:openBook,back:putBack,walk:(x,z)=>walkTo({x,z}),state:()=>({selected:selected?selected.i:null,busy,near:nearB?nearB.i:null,hero:hero.g.position.toArray().map(v=>+v.toFixed(2)),mode:cam.mode})};

let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];AUDIO.init();});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>8)return;if(selected){if(!busy)putBack();return;}if(busy)return;const h=pick(e);if(!h)return;hideTitle();if(h.book){chooseBook(h.book);}else if(h.floor){walkTo(h.floor);marker(h.floor);}});
renderer.domElement.addEventListener('pointermove',e=>{if(selected||busy){tip.style.opacity=0;hovered=null;return;}const h=pick(e);const bk=h&&h.book;if(bk!==hovered){hovered=bk||null;if(bk)AUDIO.hover();}
  if(bk){tip.innerHTML='<div class="k">CASE '+esc(bk.b.caseNo)+' ・ '+esc(bk.b.big)+'</div><div class="t">《'+esc(bk.b.title)+'》</div><div>'+esc(bk.b.tag)+'</div><div style="color:#86200f;font-size:12px;margin-top:3px">'+bookState(bk)+' ・ 點一下，走過去取下這本書</div>';tip.style.left=Math.min(innerWidth-270,e.clientX+16)+'px';tip.style.top=Math.max(10,e.clientY-96)+'px';tip.style.opacity=1;renderer.domElement.style.cursor='pointer';}
  else{tip.style.opacity=0;renderer.domElement.style.cursor=h&&h.floor?'crosshair':'default';}});
const keys={};addEventListener('keydown',e=>{AUDIO.init();const k=e.key.toLowerCase();if(selected){if(e.key==='Enter'){e.preventDefault();openBook();}else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();putBack();}return;}
  if(e.key==='Enter'||e.key===' '){if(nearB&&!busy){e.preventDefault();chooseBook(nearB);}return;}if(/^(arrow(up|down|left|right)|w|a|s|d)$/.test(k)){keys[k]=true;e.preventDefault();hideTitle();if(!busy)H.target=null;}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
$('open').addEventListener('click',openBook);$('back').addEventListener('click',putBack);prompt.addEventListener('click',()=>{if(nearB)chooseBook(nearB);});
$('btnMute').addEventListener('click',()=>{AUDIO.init();$('btnMute').classList.toggle('off',AUDIO.toggle());});
const mk=new THREE.Mesh(new THREE.RingGeometry(0.12,0.18,32),new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:0,depthWrite:false,toneMapped:false}));mk.rotation.x=-Math.PI/2;mk.position.y=0.02;scene.add(mk);
function marker(p){mk.position.x=p.x;mk.position.z=p.z;mk.scale.setScalar(1);mk.material.opacity=0.9;gsap.to(mk.scale,{x:2.2,y:2.2,duration:0.6});gsap.to(mk.material,{opacity:0,duration:0.6});}

/* ---------- loop ---------- */
let t=0,last=performance.now(),first=true,stepAcc=0;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  const kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),kz=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  const p=hero.g.position;let vx=0,vz=0;
  if(!selected&&!busy&&(kx||kz)){const l=Math.hypot(kx,kz);vx=kx/l;vz=kz/l;}
  else if(H.target){const d=H.target.clone().sub(p);d.y=0;const L=d.length();if(L<0.05){H.target=null;const cb=H.onArrive;H.onArrive=null;if(cb)cb();}else{vx=d.x/L;vz=d.z/L;if(L<0.3){vx*=Math.max(0.35,L/0.3);vz*=Math.max(0.35,L/0.3);}}}
  const moving=Math.hypot(vx,vz)>0.01;
  if(moving){p.x+=vx*H.speed*dt;p.z+=vz*H.speed*dt;p.x=THREE.MathUtils.clamp(p.x,BOUND.x0,BOUND.x1);p.z=THREE.MathUtils.clamp(p.z,BOUND.z0,BOUND.z1);OBST.forEach(o=>{const dx=p.x-o.x,dz=p.z-o.z,dd=Math.hypot(dx,dz)||1e-3;if(dd<o.r){p.x=o.x+dx/dd*o.r;p.z=o.z+dz/dd*o.r;}});
    const ang=Math.atan2(vx,vz);let da=ang-hero.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));hero.g.rotation.y+=da*Math.min(1,dt*12);H.phase+=dt*9;stepAcc+=dt;if(stepAcc>0.34){stepAcc=0;AUDIO.step();}}
  else{H.phase*=0.85;if(H.face!==null){let da=H.face-hero.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));hero.g.rotation.y+=da*Math.min(1,dt*10);}}
  const sw=Math.sin(H.phase)*(moving?0.65:0.0);hero.legs[0].rotation.x=sw;hero.legs[1].rotation.x=-sw;hero.arms[0].rotation.x=-sw*0.7;hero.arms[1].rotation.x=sw*0.7-H.reach*2.5;hero.body.position.y=moving?Math.abs(Math.sin(H.phase))*0.04:Math.sin(t*2)*0.006;hero.head.rotation.y=moving?0:Math.sin(t*0.6)*0.2;hero.head.rotation.x=H.reach>0.01?-H.reach*0.3:0;
  nearB=null;if(!selected&&!busy&&p.z<-2.9){let best=0.75;BOOKS.forEach(bk=>{const d=Math.abs(bk.stand.x-p.x);if(d<best){best=d;nearB=bk;}});if(best>0.33)nearB=null;}
  if(nearB){prompt.textContent='按 Enter（或點這裡）取下《'+nearB.b.title+'》';prompt.classList.add('on');}else prompt.classList.remove('on');
  BOOKS.forEach(bk=>{if(bk===selected)return;const on=(bk===hovered||bk===nearB)&&!busy?1:0;bk.hov+=(on-bk.hov)*Math.min(1,dt*10);bk.grp.position.z=bk.home.z+bk.hov*0.12;bk.spine.emissiveIntensity=bk.hov*0.28;});
  if(selected&&!busy){const tgt=bookFloatTarget();tgt.p.y+=Math.sin(t*1.5)*0.02;selected.grp.position.lerp(tgt.p,Math.min(1,dt*4));const wob=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.sin(t*0.8)*0.14,0));selected.grp.quaternion.slerp(tgt.q.multiply(wob),Math.min(1,dt*4));}
  const goal=camGoal();const k=cam.mode==='book'?2.5:(t<4.5?0.9:3.0);cam.pos.lerp(goal.pos,Math.min(1,dt*k));cam.look.lerp(goal.look,Math.min(1,dt*k));camera.position.copy(cam.pos);camera.lookAt(cam.look);
  if(holo){holo.rotation.y+=dt*0.5;holo.position.y=1.75+Math.sin(t*1.2)*0.03;}if(globe)globe.rotation.y+=dt*0.15;
  const dp=dust.geometry.attributes.position;for(let i=0;i<dp.count;i++){let y=dp.getY(i)+dt*0.03*(1+(i%3));if(y>5)y=0;dp.setY(i,y);dp.setX(i,dp.getX(i)+Math.sin(t*0.3+i)*dt*0.02);}dp.needsUpdate=true;
  if(typeof ARCH!=='undefined')ARCH.tick(dt,t);
  renderer.render(scene,camera);
  if(first){first=false;window.__booted=true;const L=$('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',900);setTimeout(hideTitle,5500);}
  requestAnimationFrame(frame);})(performance.now());
}
</script>
