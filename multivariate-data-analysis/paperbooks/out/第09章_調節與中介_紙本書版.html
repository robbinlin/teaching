<script>
const BOOK={"file": "第09章_調節與中介_紙本書版", "caseNo": "09", "theme": "arcane", "title": "看不見的中間人", "header": "CASE 09  ·  看不見的中間人  ·  調節與中介", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "MEDIATION", "en": "Who Stands Between Cause and Effect", "tag": "CASE 09 ・ Moderator × Mediator", "tagline": ["效果確實存在，", "但它走的是哪一條路？"], "summary": "國家隊心理諮詢團隊宣稱：心理技能訓練對比賽表現的效果，完全透過自我效能中介，因此其他訓練模組都可以刪除；他們還說，高焦慮選手接受訓練沒有用。兩個結論都來自 96 位選手的同一份問卷。以安與柏哲重新打開資料，追查效果究竟走哪一條路、又在誰身上變弱。", "conflict": "c′ 不顯著，就代表<em>完全中介<\/em>？一組不顯著，就代表<em>沒有效果<\/em>？"}, "cast": {"han": {"name": "韓立衡教授", "role": "國家隊心理諮詢主持人", "look": {"shirt": "#7a3b2e", "hair": "#4a4a4a", "glasses": true, "acc": "tie"}, "quips": ["c′ 不顯著，就是完全中介。", "Baron 和 Kenny 都這樣做。", "高焦慮的選手，練了也沒用。"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["不顯著，不是等於零。", "先問：效果走哪一條路？", "間接效果要直接檢定。"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["學姊，bootstrap 跑了五千次……", "原來中位數切割會丟掉資訊！"]}, "yeh": {"name": "葉思涵", "role": "訓練中心統計顧問", "look": {"shirt": "#4a6fa5", "hair": "#2b1d14", "hairStyle": "long", "acc": "laptop"}, "quips": ["中介問為什麼，調節問對誰。", "先中心化，再做乘積項。", "一組顯著、一組不顯著，不是差異檢定。"]}}, "acts": [{"key": "第一幕", "title": "完全中介的宣稱", "scene": {"type": "conference", "cast": ["han", "hero", "ra"], "screen": {"title": "PST → 自我效能 → 比賽表現", "sub": "N = 96・Baron & Kenny 四步驟", "bars": [["c 總效果", 0.3, "β = .30**"], ["a 路徑", 0.48, "β = .48***"], ["b 路徑", 0.38, "β = .38***"], ["c′ 直接", 0.12, "β = .12 n.s."]]}}, "fig": {"cap": "圖 1.1　運動心理學年會", "sub": "韓教授在台上報告心理技能訓練（PST）的中介分析。投影幕上，直接效果 c′ 的柱子明顯變矮。以安與柏哲坐在台下。"}, "beats": [{"s": "n", "t": "研究室的第九份檔案，封面寫著：<em>看不見的中間人<\/em>。裡面夾著一張年會議程，和一份國家隊心理訓練計畫的草案。"}, {"s": "n", "t": "三個月前，運動心理學年會。韓立衡教授的團隊報告了他們為射擊、射箭與桌球選手設計的八週心理技能訓練（PST）。"}, {"s": "han", "t": "我們追蹤了 96 位國家隊選手。PST 時數越多，比賽表現越好，總效果 β = .30，p = .003。"}, {"s": "han", "t": "更重要的是機制。PST 提升了<em>自我效能<\/em>，自我效能再提升表現。放入自我效能後，PST 的直接效果降到 .12，<em>不再顯著<\/em>。"}, {"type": "viz", "title": "放入中介變項之後", "text": ["第一步只看 PST 對表現的<em>總效果 c = .30<\/em>。第二步把自我效能放進模型：PST 先提升自我效能（a = .48），自我效能再提升表現（b = .38），原本的直接路徑縮成 c′ = .12。", "第三步把數字對起來：線性模型下 c = c′ + ab，.30 ≈ .12 + .48 × .38。看箭頭上流動的光點：效果大多改走上方那條路，但下方的直接路徑並沒有消失。"], "model": {"type": "paths", "title": "PST 對表現的效果", "nodes": [{"id": "X", "label": "PST", "x": -0.8, "y": 0.3}, {"id": "M", "label": "自我效能", "x": 0, "y": 0.88}, {"id": "Y", "label": "表現", "x": 0.8, "y": 0.3}], "edges": [{"from": "X", "to": "M", "label": "a = .48", "color": "teal"}, {"from": "M", "to": "Y", "label": "b = .38", "color": "teal"}, {"from": "X", "to": "Y", "label": "c′ = .12", "color": "gray"}], "steps": [{"cap": "總效果：PST → 表現，c = .30", "nodes": [{"id": "X", "label": "PST", "x": -0.8, "y": 0.3}, {"id": "Y", "label": "表現", "x": 0.8, "y": 0.3}], "edges": [{"from": "X", "to": "Y", "label": "c = .30", "color": "ink"}]}, {"cap": "放入自我效能：直接效果縮成 c′ = .12"}, {"cap": "c = c′ + ab：.30 ≈ .12 + .18", "title": "c′ = .12 不顯著，就等於 0 嗎？", "edges": [{"from": "X", "to": "M", "label": "a = .48", "color": "teal"}, {"from": "M", "to": "Y", "label": "b = .38", "color": "teal"}, {"from": "X", "to": "Y", "label": "c′ = .12？", "color": "red"}]}]}, "cap": "圖 V1　總效果被拆成兩條路", "sub": "黑色箭頭為總效果 c，綠色為中介路徑 a、b，灰色（第三步為紅色）為直接效果 c′；光點代表效果流動的方向（數值為教學示意）。"}, {"s": "han", "t": "依照 Baron 與 Kenny 的步驟，這是完全中介。所以明年我們建議只保留信心訓練模組，放鬆與意象訓練可以刪除。"}, {"type": "note", "id": "concept"}, {"s": "ra", "t": "學姊，他還說高焦慮的選手練 PST 沒效，要把他們排除。焦慮跟自我效能，不都是「第三個變項」嗎？"}, {"s": "hero", "t": "都是第三個變項，但扮演的角色完全不同。"}, {"type": "choice", "header": "第三變項的角色", "q": "韓教授的資料裡有兩個「第三變項」：自我效能、特質焦慮。依研究問題，它們各是什麼角色？", "opts": [{"t": "兩者都是中介：都會影響 PST 與表現的關係。", "good": false, "fb": "「影響關係」太籠統。中介變項位在因果鏈中間：被 X 改變，再影響 Y。特質焦慮不會因為上 PST 而成為效果的管道；它改變的是效果的大小，那是調節。"}, {"t": "自我效能是中介（解釋為什麼有效）；特質焦慮是調節（決定對誰較有效）。", "good": true, "fb": "正確。中介回答機制：X → M → Y，M 必須能被 X 改變。調節回答條件：W 改變 X → Y 的方向或強度，以 X × W 交互作用檢定；W 通常是較穩定的特質或情境。"}, {"t": "兩者都是調節：只要加進模型後係數改變，就是調節。", "good": false, "fb": "加入變項後係數變小，是中介（或混淆）的線索，不是調節的定義。調節要檢定的是交互作用項 X × W：斜率是否隨 W 改變。"}, {"t": "兩者都當共變項控制即可，不必區分角色。", "good": false, "fb": "當成共變項，只會得到「控制後的 PST 效果」，既回答不了機制，也回答不了對誰有效。角色要先由理論與研究問題決定，再選對應的模型。"}]}, {"type": "note", "id": "bk"}, {"s": "hero", "t": "c 從 .30 掉到 .12，確實掉了不少。可是 96 個人，夠不夠讓 .12 這麼小的效果變得顯著？"}, {"s": "hero", "t": "「不顯著」只是沒有證據，不是證明等於零。我想要原始資料。"}, {"type": "viz", "title": "96 人看得見 c′ 嗎？", "text": ["假設直接效果真的是 .12。每一顆球代表一次「重新找 96 位選手」得到的 c′ 估計值；N = 96 時標準誤約 .10，球散得很開。只有落在紅線（約 .20）右側的紅球達到 p < .05，大約只占兩成。", "第二步把樣本增加到 800 人：標準誤縮成約 .035，分布變窄、臨界線左移，九成以上的球都變成顯著。同一個 c′，只是人數不同。"], "model": {"type": "drops", "title": "c′ 的抽樣分布（N = 96）", "x": [-0.2, 0.45], "dist": {"mu": 0.12, "sd": 0.1}, "n": 150, "bins": 25, "shade": {"from": 0.196, "to": 0.45, "label": "p < .05", "color": "red"}, "marks": [{"x": 0, "label": "0", "color": "ink"}, {"x": 0.196, "label": "臨界值", "color": "red"}], "xLabel": "c′ 估計值", "color": "teal", "steps": [{"cap": "N = 96：只有約兩成的樣本會顯著"}, {"cap": "N = 800：九成以上的樣本都顯著", "title": "c′ 的抽樣分布（N = 800）", "dist": {"mu": 0.12, "sd": 0.035}, "shade": {"from": 0.068, "to": 0.45, "label": "p < .05", "color": "red"}, "marks": [{"x": 0, "label": "0", "color": "ink"}, {"x": 0.068, "label": "臨界值", "color": "red"}]}]}, "cap": "圖 V2　不顯著，常常只是人不夠", "sub": "每顆球是一次假想的重複研究，紅球為達到 p < .05 的樣本；假設真正的 c′ = .12（數值為教學示意）。"}, {"s": "n", "t": "散會時，韓教授把隨身碟遞給以安：「歡迎檢查，結論不會變。」"}]}, {"key": "第二幕", "title": "間接效果在哪裡", "scene": {"type": "lab", "cast": ["hero", "ra"], "screen": {"title": "重跑三條迴歸（N = 96）", "lines": ["迴歸 1：表現 ← PST，c = .30", "迴歸 2：效能 ← PST，a = .48", "迴歸 3：b = .38，c′ = .12", "Sobel z = 3.10，p = .002"]}}, "fig": {"cap": "圖 2.1　一週後的研究室", "sub": "柏哲照著韓教授的步驟重跑三條迴歸，數字完全對得上。問題不在計算，而在推論。"}, "beats": [{"s": "n", "t": "一週後，研究室。柏哲把三條迴歸重新跑了一遍，數字和韓教授的投影片完全一樣。"}, {"s": "ra", "t": "學姊，結果都對得上。他們沒有算錯啊？"}, {"s": "hero", "t": "數字沒錯，錯的是推論。Baron 與 Kenny 的步驟從頭到尾，都沒有直接檢定我們真正關心的東西：<em>間接效果 a × b<\/em>。"}, {"s": "ra", "t": "投影片最後有寫 Sobel 檢定，p = .002，還說 60% 的效果被中介。"}, {"s": "hero", "t": "Sobel 檢定假設 a × b 的抽樣分布是常態。但兩個估計值的乘積，分布通常是<em>偏斜<\/em>的。"}, {"type": "note", "id": "indirect"}, {"type": "choice", "header": "怎麼檢定間接效果？", "q": "要檢定「PST → 自我效能 → 表現」的間接效果，最推薦的做法是？", "opts": [{"t": "依 Baron & Kenny：c、a、b 都顯著且 c′ 變小即成立。", "good": false, "fb": "因果步驟法只看各路徑是否顯著，從未直接檢定 a × b；檢定力最低，而且要求 c 顯著，會漏掉直接與間接效果方向相反的「不一致中介」。可作描述，不宜當唯一依據。"}, {"t": "Sobel 檢定：z = ab ÷ SE，p < .05 即成立。", "good": false, "fb": "Sobel 至少直接檢定了 ab，但它假設 ab 的抽樣分布為常態。實際分布常為偏斜，小樣本時 Sobel 偏保守、檢定力不足。可作補充，但不是首選。"}, {"t": "以 bootstrap（如 5,000 次）估計 ab 的 95% 信賴區間，看是否包含 0。", "good": true, "fb": "正確。Bootstrap 不假設 ab 為常態，而是從資料重抽樣得到經驗分布；區間不含 0 即支持間接效果。這也是 PROCESS 等工具的預設做法（Preacher & Hayes, 2008）。"}, {"t": "比較 c 與 c′ 的 p 值：c 顯著、c′ 不顯著即可。", "good": false, "fb": "比較兩個 p 值不是檢定。在 OLS 迴歸下 c − c′ 恰好等於 ab，應直接檢定這個量，而不是看顯著性從「有」變成「沒有」。"}]}, {"s": "ra", "t": "Bootstrap 五千次跑完了：ab = .18，95% CI [.08, .30]，不包含 0。所以中介效果是真的！"}, {"type": "viz", "title": "5,000 次重抽的 ab", "text": ["每一顆球代表一次 bootstrap：從 96 位選手中抽出放回，重估 a 與 b，記下 a × b（以 200 顆球代表 5,000 次）。第一步只看球堆：峰在 .16 附近，右尾比左尾長。", "第二步疊上 Sobel 假設的對稱常態曲線，它描述不了右偏的尾巴。第三步把中間 95% 的球塗成綠色：區間 [.08, .30] 不含 0，間接效果成立。"], "model": {"type": "drops", "title": "ab 的 bootstrap 分布", "x": [-0.06, 0.46], "counts": [0, 0, 1, 9, 34, 53, 46, 34, 18, 3, 1, 1, 0], "dist": {"mu": 0.18, "sd": 0.059}, "curve": false, "color": "blue", "xLabel": "a × b", "counter": false, "steps": [{"cap": "每顆球是一次重抽：右尾比左尾長"}, {"cap": "黑線：Sobel 假設的對稱常態", "curve": true}, {"cap": "中間 95%：[.08, .30]，不含 0", "curve": true, "shade": {"from": 0.08, "to": 0.3, "label": "95% CI", "color": "teal"}, "marks": [{"x": 0, "label": "0", "color": "red"}, {"x": 0.08, "label": ".08", "color": "ink"}, {"x": 0.3, "label": ".30", "color": "ink"}]}]}, "cap": "圖 V3　間接效果的 bootstrap 分布", "sub": "200 顆球代表 5,000 次重抽的 ab；綠球落在 95% 百分位區間內，黑線是 Sobel 法假設的常態分布（數值為教學示意）。"}, {"s": "hero", "t": "間接效果的證據很清楚。現在換另一半問題：c′ = .12 不顯著，是不是代表<em>直接效果等於零<\/em>？"}, {"type": "note", "id": "complete"}, {"type": "choice", "header": "完全中介？", "q": "本案 N = 96：間接效果 ab = .18（95% CI [.08, .30]），直接效果 c′ = .12（p = .23）。結論應該怎麼寫？", "opts": [{"t": "完全中介：PST 只透過自我效能起作用，可刪除其他模組。", "good": false, "fb": "c′ 不顯著只代表 N = 96 時證據不足，不代表直接效果為 0；以 c′ = .12 而言，檢定力只有約 .21。據此刪除課程，是把「沒有證據」當成「證據為零」。"}, {"t": "間接效果顯著；直接效果未達顯著但無法排除，報告 ab、c′ 與信賴區間。", "good": true, "fb": "正確。方法學者建議少用「完全／部分中介」的二分標籤，改報告間接與直接效果的估計值及區間，讓讀者看見不確定性（Rucker et al., 2011；Hayes, 2018）。"}, {"t": "c′ 不顯著，整個中介模型無效，應重新設計。", "good": false, "fb": "剛好相反。中介的核心證據是 ab，而 ab 的 bootstrap 區間不包含 0。c′ 不顯著並不會讓模型無效。"}, {"t": "改寫成「60% 的效果被中介」即可。", "good": false, "fb": "中介比例 ab ÷ c 在小樣本中非常不穩定；c 接近 0 時，還可能超過 100% 或變成負值。可當描述，但不能取代 ab 與 c′ 的區間估計。"}]}, {"s": "ra", "t": "所以就算間接效果成立，也不能說放鬆和意象訓練沒有用。"}, {"s": "hero", "t": "對。c′ 裡可能還藏著別的中介路徑，例如焦慮下降。還有一件事：這三個變項，是<em>同一天<\/em>填的問卷。"}, {"type": "viz", "title": "c′ 裡還藏著什麼？", "text": ["c′ 是「目前模型沒有解釋到」的效果，不是「不存在」的效果。第一步是韓教授的模型：只有自我效能一條中介路徑，剩下的 .12 全被算成直接效果。", "第二步假設再加入第二個中介「焦慮下降」（放鬆訓練的機制）：若 a₂ = .30、b₂ = .20，間接效果 .06 就從 c′ 分出來，c′ 只剩 .06。總效果仍是 .30 = .18 + .06 + .06。"], "model": {"type": "paths", "title": "單一中介模型", "nodes": [{"id": "X", "label": "PST", "x": -0.85, "y": 0.47}, {"id": "M1", "label": "自我效能", "x": 0, "y": 0.93}, {"id": "Y", "label": "表現", "x": 0.85, "y": 0.47}], "edges": [{"from": "X", "to": "M1", "label": "a₁ = .48", "color": "teal"}, {"from": "M1", "to": "Y", "label": "b₁ = .38", "color": "teal"}, {"from": "X", "to": "Y", "label": "c′ = .12", "color": "gray"}], "steps": [{"cap": "只有一條中介：剩下的 .12 都算直接效果"}, {"cap": "加入第二條中介：c′ 從 .12 縮成 .06", "title": "平行中介模型（假想）", "nodes": [{"id": "X", "label": "PST", "x": -0.85, "y": 0.47}, {"id": "M1", "label": "自我效能", "x": 0, "y": 0.93}, {"id": "M2", "label": "焦慮下降", "x": 0, "y": 0.02}, {"id": "Y", "label": "表現", "x": 0.85, "y": 0.47}], "edges": [{"from": "X", "to": "M1", "label": "a₁ = .48", "color": "teal"}, {"from": "M1", "to": "Y", "label": "b₁ = .38", "color": "teal"}, {"from": "X", "to": "M2", "label": "a₂ = .30", "color": "blue"}, {"from": "M2", "to": "Y", "label": "b₂ = .20", "color": "blue"}, {"from": "X", "to": "Y", "label": "c′ = .06", "color": "gray"}]}]}, "cap": "圖 V4　效果不只一條路", "sub": "綠色為自我效能路徑，藍色為假想的第二條中介「焦慮下降」，灰色為剩下的直接效果（數值為教學示意，只示範效果分解的邏輯）。"}, {"type": "note", "id": "report"}, {"s": "n", "t": "以安在報告最後加了一行：「本研究為橫斷式設計，中介結果僅與假設的機制相容，不足以證明因果。」"}]}, {"key": "第三幕", "title": "焦慮的另一條線", "scene": {"type": "meeting", "cast": ["han", "hero", "yeh", "ra"], "screen": {"title": "高焦慮選手：PST 無效？", "sub": "中位數切割・分組迴歸", "bars": [["低焦慮組", 0.38, "β = .38**"], ["高焦慮組", 0.16, "β = .16 n.s."]]}}, "fig": {"cap": "圖 3.1　訓練中心會議室", "sub": "白板上是韓教授團隊的分組結果：以焦慮中位數切成兩組，一組顯著、一組不顯著。新聘的統計顧問葉思涵坐在桌邊。"}, "beats": [{"s": "n", "t": "兩週後，國家隊訓練中心會議室。葉思涵是中心新聘的統計顧問。"}, {"s": "han", "t": "完全中介的說法我同意修正。但焦慮的部分總沒問題吧？我們用中位數把選手分成兩組，低焦慮組 PST 有效，高焦慮組不顯著。"}, {"s": "yeh", "t": "一組顯著、一組不顯著，並不等於兩組<em>顯著不同<\/em>。而且中位數切割，把連續的焦慮分數丟掉了一大半資訊。"}, {"type": "viz", "title": "一組顯著，一組不顯著", "text": ["韓教授用中位數把選手切成兩組。第一步：低焦慮組的 PST 斜率 .37，95% CI [.12, .62] 不含 0，所以「顯著」。第二步：高焦慮組斜率 .17，CI [−.06, .40] 碰到 0，所以「不顯著」。", "第三步才是真正的問題：兩組斜率的<em>差<\/em> .20，CI [−.14, .54] 也包含 0。「一個過線、一個沒過線」不等於兩組顯著不同；要直接檢定差異，而且最好保留連續的焦慮分數。"], "model": {"type": "boxes", "title": "中位數切割後的 PST 斜率", "ymin": -0.3, "ymax": 0.7, "yLabel": "PST 斜率", "refs": [{"value": 0, "label": "0", "color": "red"}], "groups": [{"label": "低焦慮組", "stats": [0.12, 0.12, 0.37, 0.62, 0.62], "mean": 0.37, "color": "teal"}, {"label": "高焦慮組", "stats": [-0.06, -0.06, 0.17, 0.4, 0.4], "mean": 0.17, "color": "gold"}, {"label": "兩組之差", "stats": [-0.14, -0.14, 0.2, 0.54, 0.54], "mean": 0.2, "color": "purple"}], "steps": [{"cap": "低焦慮組：CI 不含 0 → 顯著", "groups": [{"label": "低焦慮組", "stats": [0.12, 0.12, 0.37, 0.62, 0.62], "mean": 0.37, "color": "teal"}]}, {"cap": "高焦慮組：CI 碰到 0 → 不顯著", "groups": [{"label": "低焦慮組", "stats": [0.12, 0.12, 0.37, 0.62, 0.62], "mean": 0.37, "color": "teal"}, {"label": "高焦慮組", "stats": [-0.06, -0.06, 0.17, 0.4, 0.4], "mean": 0.17, "color": "gold"}]}, {"cap": "兩組之差：CI 也包含 0"}]}, "cap": "圖 V5　顯著與不顯著的差，不一定顯著", "sub": "每個方塊從下緣到上緣是 95% CI，中線為斜率估計值，紅線為 0；兩組為中位數切割的結果（數值為教學示意）。"}, {"type": "choice", "header": "怎麼檢定調節？", "q": "要檢定特質焦慮（連續分數）是否調節 PST 對表現的效果，應該怎麼做？", "opts": [{"t": "以中位數分成高、低焦慮兩組，比較兩組迴歸是否顯著。", "good": false, "fb": "「一組顯著、一組不顯著」不是組間差異的檢定。中位數切割還會丟失資訊、降低檢定力，甚至製造假的交互作用。連續的調節變項應保持連續。"}, {"t": "將 PST 與焦慮中心化，建立乘積項 X × W，檢定 b₃ 與 ΔR²。", "good": true, "fb": "正確。這就是講義的四步驟：類別變項編碼、連續變項中心化、建立乘積項、解釋結果。b₃ 顯著，代表 PST 的斜率會隨焦慮改變。"}, {"t": "把焦慮當共變項放入迴歸，看 PST 係數是否改變。", "good": false, "fb": "這是在控制焦慮，不是檢定調節。共變項模型假設 PST 的斜率在所有焦慮程度下都相同，正好排除了你想檢定的事。"}, {"t": "直接以原始分數相乘，並把 PST 係數解釋為主效果。", "good": false, "fb": "有乘積項時，PST 的係數是「焦慮 = 0」時的條件效果；焦慮量表 1–5 分，0 根本不存在。中心化後，它才是「平均焦慮下」的效果。"}]}, {"type": "note", "id": "centering"}, {"s": "ra", "t": "中心化之後重跑：交互作用 b₃ = −.14，p = .02，ΔR² = .04。"}, {"s": "yeh", "t": "所以焦慮確實調節了 PST 的效果。接下來要看：在不同焦慮程度下，PST 的斜率各是多少。"}, {"type": "note", "id": "slopes"}, {"s": "han", "t": "你看，高焦慮那條線的斜率 .12 不顯著。我說對了，他們練了沒用。"}, {"type": "choice", "header": "簡單斜率怎麼讀？", "q": "PST 的簡單斜率：低焦慮（−1 SD）為 .40；平均焦慮為 .26；高焦慮（+1 SD）為 .12，p = .21。合理的結論是？", "opts": [{"t": "高焦慮選手 PST 無效，可以不必參加。", "good": false, "fb": "+1 SD 處的簡單斜率不顯著，不等於效果為 0，區間仍包含不小的正值。而且 ±1 SD 只是任意挑的點，應以 Johnson–Neyman 法報告效果顯著的焦慮範圍。"}, {"t": "焦慮越高、PST 效益越小；以 J–N 區間報告顯著範圍，據以調整課程而非排除選手。", "good": true, "fb": "正確。調節的結論是「效果大小隨 W 改變」。報告 b₃、各點簡單斜率與 J–N 轉折點，再轉成實務建議：高焦慮選手可能需要先處理焦慮。"}, {"t": "交互作用顯著，所以 PST 的主效果沒有意義，不必報告。", "good": false, "fb": "中心化後，PST 係數是平均焦慮下的條件效果（b = .26），具體而有用。交互作用顯著時要小心解讀主效果，但不是把它刪掉。"}], "model": {"type": "fit", "title": "PST 的簡單斜率", "xLabel": "PST（z）", "yLabel": "表現（z）", "showSlope": true, "x": [-2, 2], "y": [-1.3, 1.3], "groups": [{"label": "低焦慮", "color": "teal", "gen": {"n": 14, "b0": 0.15, "b1": 0.4, "noise": 0.3, "x": [-1.8, 1.8], "seed": 3}, "line": {"b0": 0.15, "b1": 0.4}}, {"label": "平均", "color": "gold", "gen": {"n": 14, "b0": 0, "b1": 0.26, "noise": 0.3, "x": [-1.8, 1.8], "seed": 5}, "line": {"b0": 0, "b1": 0.26}}, {"label": "高焦慮", "color": "red", "gen": {"n": 14, "b0": -0.15, "b1": 0.12, "noise": 0.3, "x": [-1.8, 1.8], "seed": 9}, "line": {"b0": -0.15, "b1": 0.12}}], "steps": [{"cap": "平均焦慮：斜率 b₁ = .26", "groups": [{"label": "平均", "color": "gold", "gen": {"n": 14, "b0": 0, "b1": 0.26, "noise": 0.3, "x": [-1.8, 1.8], "seed": 5}, "line": {"b0": 0, "b1": 0.26}}]}, {"cap": "±1 SD：斜率由 .40 降到 .12"}]}}, {"s": "hero", "t": "焦慮越高，PST 的效益越小。但這是在提醒我們要為高焦慮選手<em>調整<\/em>課程，而不是把他們排除在外。"}, {"s": "yeh", "t": "可以把放鬆訓練的比重加在高焦慮選手身上，再做一次隨機分派、分三個時間點測量的試驗。"}, {"s": "n", "t": "會議結束前，韓教授把草案上的「刪除放鬆與意象模組」劃掉，改成「依焦慮程度調整課程比重」。"}]}], "notes": {"concept": {"no": 1, "t": "調節與中介", "blocks": [{"type": "h", "t": "兩種「第三變項」"}, {"type": "p", "t": "<em>中介變項<\/em>（mediator）解釋 X 與 Y 的關係「為什麼」存在：X 先影響 M，M 再影響 Y。它回答的是機制。"}, {"type": "p", "t": "<em>調節變項<\/em>（moderator）改變 X 與 Y 關係的<em>方向或強度<\/em>：在 W 的不同水準下，X 對 Y 的效果不同。它回答的是「對誰、在什麼情況下」。"}, {"type": "formula", "t": "中介：X → M → Y"}, {"type": "formula", "t": "調節：Y = b₀ + b₁X + b₂W + b₃XW"}, {"type": "h", "t": "怎麼分辨？"}, {"type": "bullet", "t": "M 必須能被 X 改變，時間上位於 X 之後、Y 之前。"}, {"type": "bullet", "t": "W 通常是穩定特質或情境（性別、年資、特質焦慮），不受 X 影響。"}, {"type": "p", "t": "同一個變項在不同研究問題中可以扮演不同角色；角色由<em>理論<\/em>決定，而不是由統計結果決定（Frazier et al., 2004）。"}], "fig": {"model": {"type": "paths", "title": "上：中介路徑　下：調節箭頭", "nodes": [{"id": "X", "label": "PST", "x": -0.8, "y": 0.4}, {"id": "M", "label": "自我效能", "x": 0, "y": 0.9}, {"id": "Y", "label": "表現", "x": 0.8, "y": 0.4}, {"id": "W", "label": "特質焦慮", "kind": "mod", "x": 0, "y": 0.02}], "edges": [{"from": "X", "to": "M", "label": "a", "color": "teal"}, {"from": "M", "to": "Y", "label": "b", "color": "teal"}, {"from": "X", "to": "Y", "label": "c′", "color": "gray"}, {"from": "W", "toEdge": ["X", "Y"], "color": "purple"}], "steps": [{"cap": "中介：效果沿 X → M → Y 傳遞", "nodes": [{"id": "X", "label": "PST", "x": -0.8, "y": 0.4}, {"id": "M", "label": "自我效能", "x": 0, "y": 0.9}, {"id": "Y", "label": "表現", "x": 0.8, "y": 0.4}], "edges": [{"from": "X", "to": "M", "label": "a", "color": "teal"}, {"from": "M", "to": "Y", "label": "b", "color": "teal"}, {"from": "X", "to": "Y", "label": "c′", "color": "gray"}]}, {"cap": "調節：W 的箭頭指向路徑本身"}]}, "cap": "圖 N1　一個在路上，一個在路旁", "sub": "綠色箭頭是中介路徑 a、b，灰色是直接效果 c′。紫色八面體是調節變項：它的箭頭指向「PST → 表現」這條路徑本身，而不是指向表現。", "points": ["中介：箭頭先指向 M，再由 M 指向 Y。", "調節：箭頭指向「X → Y」這條路徑。", "角色先由理論決定，再選統計模型。"]}}, "bk": {"no": 2, "t": "Baron & Kenny 四步驟", "blocks": [{"type": "h", "t": "三條迴歸、四個步驟"}, {"type": "p", "t": "Baron 與 Kenny（1986）的因果步驟法，是講義介紹的經典流程："}, {"type": "bullet", "t": "步驟 1：X 預測 Y（路徑 c）。"}, {"type": "bullet", "t": "步驟 2：X 預測 M（路徑 a）。"}, {"type": "bullet", "t": "步驟 3：同時放入 X 與 M，M 預測 Y（路徑 b）。"}, {"type": "bullet", "t": "步驟 4：控制 M 後，X 的效果 c′ 是否顯著變小。"}, {"type": "formula", "t": "c ＝ c′ ＋ a × b"}, {"type": "p", "t": "講義的 GSS 例子：努力工作對稅務態度的總效果 B = −.14；放入「服從權威」後，直接效果降為 −.05（p = .15），被解讀為接近完全中介。"}, {"type": "h", "t": "這個方法的問題"}, {"type": "p", "t": "它從未直接檢定 <em>a × b<\/em>；要求 c 顯著，會漏掉直接與間接效果方向相反的<em>不一致中介<\/em>；而且它是各種方法中檢定力最低的。"}], "fig": {"model": {"type": "paths", "title": "左：總效果 c　右：放入自我效能後", "nodes": [{"id": "X1", "label": "PST", "x": -0.95, "y": 0.8}, {"id": "Y1", "label": "表現", "x": -0.45, "y": 0.8}, {"id": "X2", "label": "PST", "x": -0.2, "y": 0.15}, {"id": "M2", "label": "自我效能", "x": 0.38, "y": 0.85}, {"id": "Y2", "label": "表現", "x": 0.95, "y": 0.15}], "edges": [{"from": "X1", "to": "Y1", "label": "c = .30", "color": "ink"}, {"from": "X2", "to": "M2", "label": "a = .48", "color": "teal"}, {"from": "M2", "to": "Y2", "label": "b = .38", "color": "teal"}, {"from": "X2", "to": "Y2", "label": "c′ = .12", "color": "gray"}], "steps": [{"cap": "步驟 1：總效果 c = .30", "nodes": [{"id": "X1", "label": "PST", "x": -0.95, "y": 0.8}, {"id": "Y1", "label": "表現", "x": -0.45, "y": 0.8}], "edges": [{"from": "X1", "to": "Y1", "label": "c = .30", "color": "ink"}]}, {"cap": "放入自我效能：c′ = .12，ab ≈ .18"}]}, "table": [["迴歸", "依變項", "係數"], ["1", "表現", "c = .30**"], ["2", "自我效能", "a = .48***"], ["3", "表現", "b = .38***"], ["3", "表現", "c′ = .12 n.s."]], "cap": "圖 N2　總效果被拆成兩段", "sub": "總效果 c ＝ .30 被拆成直接效果 c′ ＝ .12 與間接效果 a × b ＝ .48 × .38 ≈ .18（數值為教學示意）。", "points": ["OLS 迴歸下，c − c′ 恰好等於 a × b。", "四步驟只看各路徑是否顯著，不檢定 ab 本身。"]}}, "indirect": {"no": 3, "t": "Sobel 與 Bootstrap", "blocks": [{"type": "h", "t": "Sobel 檢定"}, {"type": "formula", "t": "z ＝ ab ÷ √(b²·SEa² ＋ a²·SEb²)"}, {"type": "p", "t": "本案 z = 3.10，p = .002。講義的 GSS 例子也用 Sobel 報告「65.4% 的效果被中介」。但 Sobel 假設 ab 的抽樣分布為<em>常態<\/em>；兩個估計值的乘積通常右偏，小樣本時 p 值偏保守、檢定力偏低。"}, {"type": "h", "t": "Bootstrap 信賴區間"}, {"type": "bullet", "t": "從 96 人中抽出放回，組成同樣大小的新樣本。"}, {"type": "bullet", "t": "每次重估 a 與 b，記下 a × b；重複 5,000 次。"}, {"type": "bullet", "t": "取第 2.5 與第 97.5 百分位，得到 95% CI。"}, {"type": "p", "t": "本案 ab = .18，95% CI [.08, .30]，<em>不包含 0<\/em>，支持間接效果。區間左右不對稱（−.10、＋.12），正是偏斜分布留下的痕跡。"}], "fig": {"model": {"type": "curves", "title": "ab 的抽樣分布", "x": [-0.1, 0.45], "curves": [{"type": "points", "label": "Bootstrap", "color": "teal", "labelAt": 0.04, "points": [[-0.1, 0], [-0.02, 0], [0.02, 0.3], [0.06, 1.5], [0.1, 4.2], [0.14, 6.6], [0.17, 7.0], [0.2, 6.0], [0.24, 3.9], [0.28, 2.0], [0.32, 0.8], [0.36, 0.3], [0.42, 0], [0.45, 0]]}, {"type": "normal", "mu": 0.18, "sd": 0.059, "label": "Sobel 假設", "color": "gray", "labelAt": 0.33}], "shade": {"curve": 0, "from": 0.08, "to": 0.3, "label": "95% CI", "color": "teal"}, "marks": [{"x": 0, "label": "0", "color": "red"}, {"x": 0.08, "label": ".08", "color": "ink"}, {"x": 0.3, "label": ".30", "color": "ink"}], "xLabel": "a × b", "yLabel": "密度"}, "cap": "圖 N3　ab 的分布是歪的", "sub": "綠線是 5,000 次 bootstrap 得到的 ab 經驗分布，綠色陰影為 95% 區間；半透明灰色是 Sobel 假設的常態分布；紅線為 0（數值為教學示意）。", "points": ["區間不含 0 → 支持間接效果。", "Bootstrap 不需假設 ab 為常態。", "報告重抽次數與區間類型（百分位或偏誤校正）。"]}}, "complete": {"no": 4, "t": "完全中介的陷阱", "blocks": [{"type": "h", "t": "c′ 不顯著 ≠ c′ ＝ 0"}, {"type": "p", "t": "「完全中介」建立在 c′ <em>不顯著<\/em>上。但不顯著只代表證據不足。N = 96 時，要偵測 c′ = .12 這麼小的直接效果，檢定力只有約 .21：就算直接效果真的存在，五次研究裡也有四次「看不到」它。"}, {"type": "p", "t": "樣本越小，越容易得到「完全中介」；樣本越大，幾乎所有中介都會變成「部分中介」。這個標籤反映的常常是<em>樣本數<\/em>，而不是機制。"}, {"type": "h", "t": "比較好的寫法"}, {"type": "bullet", "t": "報告 ab 與 c′ 的點估計和 95% CI。"}, {"type": "bullet", "t": "少用「完全／部分中介」的二分標籤。"}, {"type": "bulle {"type": "bullet", "t": "3. 建立乘積項 X × W。"}, {"type": "bullet", "t": "4. 解釋結果：檢定 b₃ 與 ΔR²。"}, {"type": "formula", "t": "Y ＝ b₀ ＋ b₁X ＋ b₂W ＋ b₃(X×W)"}, {"type": "h", "t": "為什麼要中心化？"}, {"type": "p", "t": "以原始分數相乘，乘積項會與 X、W 高度相關，係數難以解讀。中心化後這種相關幾乎消失。中心化<em>不會<\/em>改變 b₃ 與它的 p 值；改變的是 b₁、b₂ 的意義：b₁ 變成「W 在平均值時」X 的效果，而不是 W ＝ 0 時。"}, {"type": "h", "t": "講義例子"}, {"type": "p", "t": "GSS 資料中，服從 × 快樂的交互作用 b = −.025，p = .11，未達顯著：沒有證據顯示快樂調節了服從與稅務態度的關係。"}], "fig": {"model": {"type": "matrix", "title": "乘積項與原變項的相關", "labels": ["PST", "焦慮", "乘積原始", "乘積中心"], "values": [[1, 0.1, 0.85, 0.06], [0.1, 1, 0.78, 0.04], [0.85, 0.78, 1, 0.2], [0.06, 0.04, 0.2, 1]], "showAbove": 0.3, "steps": [{"cap": "原始分數相乘：乘積項與 X、W 高度相關", "labels": ["PST", "焦慮", "乘積原始"], "values": [[1, 0.1, 0.85], [0.1, 1, 0.78], [0.85, 0.78, 1]]}, {"cap": "中心化後的乘積項，幾乎與兩者無關"}]}, "cap": "圖 N6　中心化拆掉了高塔", "sub": "以原始分數相乘的乘積項，與 PST、焦慮的相關高達 .85、.78（高柱）；中心化後的乘積項幾乎與兩者無關（數值為教學示意）。", "points": ["中心化不改變 b₃，只改變 b₁、b₂ 的意義。", "調節的證據是 b₃ 與 ΔR²，不是 b₁。"]}}, "slopes": {"no": 7, "t": "簡單斜率", "blocks": [{"type": "h", "t": "把交互作用畫出來"}, {"type": "p", "t": "b₃ 顯著只告訴我們斜率會變；<em>怎麼變<\/em>要看簡單斜率：把 W 代入特定值，求 X 對 Y 的條件斜率。"}, {"type": "formula", "t": "X 的斜率 ＝ b₁ ＋ b₃W"}, {"type": "p", "t": "本案 b₁ = .26、b₃ = −.14（焦慮已標準化）：低焦慮（−1 SD）斜率 = .26 ＋ .14 = .40；平均 = .26；高焦慮（＋1 SD）斜率 = .26 − .14 = .12。"}, {"type": "h", "t": "讀圖與報告"}, {"type": "bullet", "t": "線條不平行 → 有交互作用；是否交叉要看資料範圍。"}, {"type": "bullet", "t": "±1 SD 是慣例，不是自然分界。"}, {"type": "bullet", "t": "Johnson–Neyman 法找出斜率由顯著轉為不顯著的 W 值，比挑點更完整。"}, {"type": "p", "t": "高焦慮處斜率不顯著，只說明那裡的證據較弱，不代表 PST 對高焦慮選手毫無效果。"}], "fig": {"model": {"type": "lines", "title": "PST × 焦慮：簡單斜率", "xLabels": ["PST 少", "平均", "PST 多"], "series": [{"label": "低焦慮", "values": [-0.25, 0.15, 0.55], "color": "teal"}, {"label": "平均", "values": [-0.26, 0.0, 0.26], "color": "gold"}, {"label": "高焦慮", "values": [-0.27, -0.15, -0.03], "color": "red"}], "ymin": -0.4, "ymax": 0.7, "yLabel": "表現（z）", "steps": [{"cap": "平均焦慮：PST 斜率 .26", "series": [{"label": "平均", "values": [-0.26, 0.0, 0.26], "color": "gold"}]}, {"cap": "±1 SD：斜率 .40 → .12，線越來越平"}]}, "cap": "圖 N7　焦慮越高，線越平", "sub": "三條線是焦慮在 −1 SD、平均與 ＋1 SD 時，PST 對表現的預測線；斜率由 .40 遞減到 .12（數值為教學示意）。", "points": ["不平行的線，就是交互作用。", "斜率不顯著 ≠ 沒有效果。", "用 J–N 區間報告效果顯著的範圍。"]}}}, "ending": {"title": "看不見的中間人：結案", "paragraphs": ["韓教授的團隊修正了發表的結論：PST 透過自我效能對比賽表現有正向間接效果（ab = .18，95% CI [.08, .30]），但直接效果無法排除。「完全中介」的字樣被刪除，放鬆與意象訓練模組也被保留。", "焦慮的分析改以中心化的連續變項與乘積項重做：交互作用顯著，焦慮越高、PST 效益越小。訓練中心沒有排除高焦慮選手，而是為他們加重放鬆訓練，並規劃一項隨機分派、三個時間點測量的追蹤研究。"], "takeaway": "中介問「為什麼」，要直接檢定間接效果 ab；調節問「對誰」，要檢定交互作用並畫出簡單斜率。不顯著，從來不是「等於零」的證明。", "verdict": ["審查通過：你分清了中介與調節，也沒有把「不顯著」當成「沒有效果」。修正版報告順利刊登。", "有條件接受：主要結論站得住，但有幾個決策仍把顯著與否當成效果的開關。", "退回重審：「完全中介」與「高焦慮無效」仍留在訓練計畫裡，選手的課程被錯誤地刪減。"]}};

    DECISIONS.forEach((d,i)=>{g.fillStyle=d.good?TEAL:ACC;g.font='bold 26px '+FONT;g.fillText((d.good?'✓ ':'△ ')+'決策 '+(i+1),x,y);y+=lh;y=drawRuns(g,parseEm(d.q),x+20,y,maxW-20,sz-3,lh-6,INK2,ACC)+2;y=drawRuns(g,parseEm('你的選擇：'+d.t),x+20,y,maxW-20,sz-2,lh-4,INK,ACC)+18;});
    y+=20;const v=B.ending&&B.ending.verdict?arr(B.ending.verdict):[];const msg=v.length?(good===DECISIONS.length?v[0]:good>=DECISIONS.length/2?(v[1]||v[0]):(v[2]||v[v.length-1])):'';if(msg){y=drawRuns(g,parseEm(msg),x,y,maxW,sz,lh,TEAL,ACC,true)+10;}
    if(y<=PH-100){g.fillStyle=INK2;g.font='bold 30px '+FONT;g.textAlign='center';g.fillText('— 全 書 完 —',PW/2,PH-80);g.textAlign='left';break;}}
  rightTex.needsUpdate=true;}

let flap=null;
function makeFlap(rect){const w=cvW(rect.w),h=cvH(rect.h);const pivot=new THREE.Group();const p0=cvToWorld(rect.x+rect.w/2,rect.y);pivot.position.set(p0.x,THICK+0.008,p0.z);
  const tex=canvasTex(2048,Math.max(64,Math.round(2048*h/w)),(g,cw,ch)=>{g.scale(2,2);cw/=2;ch/=2;g.fillStyle='#efe6d0';g.fillRect(0,0,cw,ch);for(let i=0;i<2500;i++){g.fillStyle=`rgba(120,90,50,${Math.random()*0.08})`;g.fillRect(Math.random()*cw,Math.random()*ch,2,1);}const gr=g.createLinearGradient(0,0,0,70);gr.addColorStop(0,'rgba(60,40,20,.25)');gr.addColorStop(1,'rgba(60,40,20,0)');g.fillStyle=gr;g.fillRect(0,0,cw,70);g.strokeStyle='rgba(60,40,20,.35)';g.lineWidth=2;g.setLineDash([10,8]);g.strokeRect(14,14,cw-28,ch-28);g.setLineDash([]);
    g.fillStyle=INK;g.textAlign='center';g.font='bold 44px '+FONT;g.fillText('掀開紙片，看回饋',cw/2,ch/2+6);g.font='bold 26px '+FONT;g.fillStyle=INK2;g.fillText('LIFT THE FLAP',cw/2,ch/2+52);});
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pageMat(tex));front.rotation.x=-Math.PI/2;front.position.z=h/2;front.castShadow=true;pivot.add(front);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xe6dcc4,roughness:.95}));back.rotation.x=Math.PI/2;back.position.set(0,-0.001,h/2);pivot.add(back);
  pivot.userData={type:'flap'};pivot.scale.setScalar(0.001);book.add(pivot);gsap.to(pivot.scale,{x:1,y:1,z:1,duration:0.8,ease:'elastic.out(1,0.55)'});AUDIO.pop(2);return pivot;}

/* ===================== State machine ===================== */
const ACTS=arr(B.acts);
const S={state:'TITLE',busy:false,act:0,beat:0,sceneGroup:null,chars:{},choice:null,picked:null,scene:null,onNote:false,pendingTurn:false};
window.S=S;
const chapTxt=document.getElementById('chapTxt');document.getElementById('chapKey').textContent=B.caseNo?'CASE '+B.caseNo:(B.short||'BOOK');
async function locked(fn){if(S.busy)return;S.busy=true;try{await fn();}catch(e){console.error(e);}finally{S.busy=false;}}
function buildScene(spec){const g=new THREE.Group();if(spec&&('model' in spec)){if(spec.model){const st=arr(spec.model.steps);const base=Object.assign({},spec.model);delete base.steps;const h=modelHolder(st.length?Object.assign({},base,st[0]):base,0);if(ARC)h.userData.an.t0+=0.95;g.add(h);if(st.length>1)g.userData.steps={base,list:st,i:0,holder:h,hold:num(spec.model.stepHold,2.6)};}const TL=num(spec.model&&spec.model.tilt,-0.62);g.rotation.x=TL;g.position.y=0.36;g.position.z=0.26;g.scale.setScalar(1.06);if(spec.compact){g.scale.setScalar(0.9);g.position.z=-0.3;g.position.y=0.34;}S.chars={};}else{S.chars=buildStory(g,spec);g.rotation.x=num(spec&&spec.tilt,-0.42);g.scale.setScalar(0.8);g.position.y=0.5;g.position.z=0.22;}anchor.add(g);S.sceneGroup=g;if(spec&&spec.model){const H=[];g.traverse(o=>{if(o.userData.an)H.push(o.userData.an);});H.forEach(q=>q.intro.forEach(x=>x.fn(1)));
    const measure=()=>{g.updateMatrixWorld(true);const bx=new THREE.Box3(),b1=new THREE.Box3();g.traverse(o=>{if((o.isMesh||o.isSprite)&&o.visible&&o.geometry&&!(o.isMesh&&o.material&&o.material.depthWrite===false)){if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();b1.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);bx.union(b1);}});return bx;};
    let bx=measure();if(!bx.isEmpty()){const k=anchor.scale.x,sz=bx.getSize(new THREE.Vector3());const lim=spec.compact?[1.9,1.15,1.35]:[2.45,1.5,1.7];const f=Math.max(0.8,Math.min(lim[0]/(sz.x/k),lim[1]/(sz.z/k),lim[2]));g.scale.multiplyScalar(f);
      bx=measure();const c=bx.getCenter(new THREE.Vector3());const want=rightPage.localToWorld(new THREE.Vector3(0,spec.compact?0.56:0.6,0));g.position.x+=(want.x-c.x)/k;g.position.z+=(want.z-c.z)/k;}
    H.forEach(q=>q.intro.forEach(x=>{if(!x.done)x.fn(0);}));}if(ARC)ARC.inkIn(g,spec&&spec.model?spec.model:spec);g.traverse(o=>{if(o.userData.type==='char')o.userData.baseY=o.position.y;});g.children.forEach(c=>{c.userData.bs=c.scale.x;c.scale.setScalar(0.001);});
  return new Promise(res=>{let n=0;if(!g.children.length)return res();g.children.forEach((c,i)=>gsap.to(c.scale,{x:c.userData.bs,y:c.userData.bs,z:c.userData.bs,duration:0.9,ease:'elastic.out(1,0.5)',delay:Math.min(i,20)*0.05+(ARC?0.95:0),onStart:()=>{if(i%3===0)AUDIO.pop(i%5);},onComplete:()=>{if(++n===g.children.length)res();}}));});}
let STEP=null,PEND=null;
function stepTick(){const sg=S.sceneGroup;const st=sg&&sg.userData.steps;if(!st||S.busy||S.state==='TURN'||S.state==='LIFTING')return;const a=st.holder.userData.an;if(CLOCK-a.t0<Math.max(a.end+st.hold,4.5))return;
  st.i=(st.i+1)%st.list.length;const old=st.holder;let rot=0;old.traverse(o=>{if(o.userData.float)rot=o.userData.rotBase;});
  gsap.to(old.scale,{x:0.001,y:0.001,z:0.001,duration:0.3,ease:'power2.in',onComplete:()=>sg.remove(old)});
  const h=modelHolder(Object.assign({},st.base,st.list[st.i]),rot);h.userData.an.t0+=0.25;sg.add(h);st.holder=h;if(ARC)ARC.inkSwap(h);AUDIO.pop(st.i%5);
  if(STEP){STEP.i=st.i;STEP.cap=st.list[st.i].cap||'';if(S.reR)S.reR(rightCanvas);if(S.reL){S.reL(leftCanvas);if(lastCue)drawCue(lastCue);}}}
window.__dbg=()=>{const sg=S.sceneGroup,st=sg&&sg.userData.steps;return {clock:CLOCK,step:st?st.i:null,end:st?st.holder.userData.an.end:null,t0:st?st.holder.userData.an.t0:null};};
function flatten(){const g=S.sceneGroup;if(!g)return Promise.resolve();if(ARC)ARC.inkOut(g);return new Promise(res=>{let n=0;if(!g.children.length){anchor.remove(g);S.sceneGroup=null;return res();}g.children.forEach((c,i)=>gsap.to(c.scale,{y:0.001,z:0.001,duration:0.4,ease:'power3.in',delay:Math.min(i,20)*0.02,onComplete:()=>{if(++n===g.children.length){anchor.remove(g);S.sceneGroup=null;res();}}}));});}
function snapshotRight(){flipFrontCanvas.getContext('2d').drawImage(rightCanvas,0,0,PW,PH);flipFrontTex.needsUpdate=true;}
async function turnPage(newLeftDraw,newRightDraw,sceneSpec){S.state='TURN';STEP=PEND?PEND.step:null;S.reL=PEND?PEND.left:null;S.reR=PEND?PEND.right:null;PEND=null;snapshotRight();if(flap){book.remove(flap);flap=null;}
  await flatten();pageNo+=2;newLeftDraw(flipBackCanvas);flipBackTex.needsUpdate=true;rightNote=null;newRightDraw(rightCanvas);
  flipPivot.rotation.z=0;flipPivot.visible=true;AUDIO.flip();
  await new Promise(r=>gsap.to(flipPivot.rotation,{z:Math.PI,duration:1.1,ease:'power2.inOut',onComplete:r}));
  newLeftDraw(leftCanvas);flipPivot.visible=false;if(sceneSpec)await buildScene(sceneSpec);}
const A=()=>ACTS[S.act]||{beats:[]};
function nextIsTurn(){const nb=arr(A().beats)[S.beat+1];return !nb||nb.type==='choice'||nb.type==='note'||nb.type==='scene';}
function cont(h){return {k:h.k,t:String(h.t).replace('（續）','')+'（續）'};}
function textBlock(b){return b.s===undefined||b.s==='n'||!CAST[b.s]?{type:'narr',t:b.t}:{type:'say',s:b.s,t:b.t};}
function enterAct(i){S.act=i;const a=A();return locked(async()=>{S.scene=a.scene||{type:'lab',cast:Object.keys(B.cast||{}).slice(0,3)};currentFig=a.fig||{cap:'',sub:''};S.chap=(a.key||'')+' ・ '+(a.title||'');chapTxt.textContent=S.chap;S.onNote=false;S.pendingTurn=false;doc=[];curHeader={k:a.key||'',t:a.title||''};
  await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';S.beat=0;}).then(()=>{if(S.state==='READING'&&S.beat===0)showBeat();});}
function finishAct(){const a=A();const last=S.act>=ACTS.length-1;const blk={type:'end',t:(a.key||'')+' ・ 完'};const cue=last?'翻頁看結案報告 ▸':'翻頁進入'+(ACTS[S.act+1].key||'下一幕')+' ▸';
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  doc.push(blk);const y=renderLeft(leftCanvas,doc,curHeader);if(y>PH-120&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  S.state='END';drawCue(cue);}
function showBeat(){const b=arr(A().beats)[S.beat];if(!b){finishAct();return;}
  if(b.type==='note'){const n=(B.notes||{})[b.id];if(!n){S.beat++;showBeat();return;}locked(async()=>{S.onNote=true;const ns=arr(((n.fig||{}).model||{}).steps);PEND={step:ns.length>1?{i:0,n:ns.length,cap:ns[0].cap||''}:null,left:null,right:c=>renderNoteRight(c,n)};chapTxt.textContent='研究筆記 '+n.no+' ・ '+n.t;await turnPage(c=>renderNoteLeft(c,n),c=>renderNoteRight(c,n),{model:(n.fig||{}).model,compact:arr((n.fig||{}).table).length>0});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='viz'){const vs=arr((b.model||{}).steps);const n={no:'',t:b.title||'',fig:{model:b.model,cap:b.cap||'',sub:b.sub||'',points:b.points}};locked(async()=>{S.onNote=true;chapTxt.textContent='模型動畫 ・ '+(b.title||'');PEND={step:vs.length>1?{i:0,n:vs.length,cap:vs[0].cap||''}:null,left:c=>renderVizLeft(c,b),right:c=>renderNoteRight(c,n)};await turnPage(c=>renderVizLeft(c,b),c=>renderNoteRight(c,n),{model:b.model});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='scene'){if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;if(b.title)curHeader={k:curHeader.k,t:b.title};S.pendingTurn=true;S.beat++;showBeat();return;}
  if(b.type==='choice'){S.state='CHOICE';S.choice=b;S.picked=null;S.onNote=false;S.pendingTurn=false;if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;
    locked(async()=>{chapTxt.textContent=(A().key||'')+' ・ 研究決策';const opts=arr(b.opts);let sz=38,osz=33;const est=measureRuns(parseEm(b.q),PW-240,sz,sz*1.45,true)+opts.reduce((s,o)=>s+measureRuns(parseEm(o.t),PW-360,osz,osz*1.45)+46,0);if(est>820){sz=34;osz=29;}if(est>1000){sz=31;osz=26;}
      doc=[{type:'question',t:b.q,sz},...opts.map((o,i)=>({type:'option',k:'ABCDE'[i],t:o.t,idx:i,state:'',sz:osz}))];curHeader={k:(A().key||'')+' ・ 研究決策',t:b.header||'你會怎麼做？'};
      await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),b.model?{model:b.model}:S.scene);S.state='CHOICE';drawCue('點選一個選項 ▸');});return;}
  const blk=textBlock(b);
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  doc.push(blk);const yEnd=renderLeft(leftCanvas,doc,curHeader);
  if(yEnd>PH-150&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  AUDIO.click();drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');}
function showEnding(){locked(async()=>{chapTxt.textContent='結案報告';await turnPage(c=>renderEndLeft(c),c=>renderEndRight(c),(B.ending&&B.ending.model)?{model:B.ending.model}:((B.ending&&B.ending.scene)||null));S.state='DONE';if(window.__markDone)window.__markDone();});}
function advance(){if(S.busy)return;if(S.state==='TITLE'){AUDIO.init();if(ACTS.length)enterAct(0);return;}
  if(S.state==='READING'||S.state==='AFTER'){S.beat++;showBeat();return;}
  if(S.state==='END'){if(S.act<ACTS.length-1)enterAct(S.act+1);else showEnding();}}
function pickOption(idx){if(S.state!=='CHOICE'||S.picked!==null)return;const o=arr(S.choice.opts)[idx];if(!o)return;S.picked=idx;AUDIO.click();DECISIONS.push({q:S.choice.header||S.choice.q,t:o.t,good:!!o.good});
  doc.forEach(b=>{if(b.type==='option')b.state=b.idx===idx?'picked':'dim';});
  // fit question+options+feedback on page: shrink feedback if needed
  let fsz=32;doc.push({type:'feedback',t:o.fb||'',good:!!o.good,sz:fsz});let y=renderLeft(leftCanvas,doc,curHeader);
  while(y>PH-110&&fsz>22){fsz-=2;doc[doc.length-1].sz=fsz;y=renderLeft(leftCanvas,doc,curHeader);}
  if(y>PH-110){doc=doc.filter(b=>b.type!=='option'||b.state==='picked');y=renderLeft(leftCanvas,doc,curHeader);}
  if(fbRect){flap=makeFlap(fbRect);S.state='FLAP';drawCue('掀開紙片 ▸');}else{S.state='AFTER';}}
function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=arr(S.choice.opts)[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});
  gsap.delayedCall(1.0,()=>{AUDIO.chime(!!o.good);S.state='AFTER';S.pendingTurn=true;renderLeft(leftCanvas,doc,curHeader);drawCue(nextIsTurn()?'翻頁 ▸':'翻頁繼續 ▸');});}
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips||['……'];rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}
window.__api={advance,pickOption,liftFlap};

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,dragRot=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup&&!S.onNote){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(ARC)ARC.tick(dt,t);if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
