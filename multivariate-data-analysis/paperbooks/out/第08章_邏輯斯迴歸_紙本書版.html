<script>
const BOOK={"file": "第08章_邏輯斯迴歸_紙本書版", "caseNo": "08", "title": "三倍的風險", "header": "CASE 08  ·  三倍的風險  ·  Logistic Regression", "cover": {"series": "R E S E A R C H   C A S E   F I L E S", "big": "LOGISTIC", "en": "Odds, Risk, and the S-Curve", "tag": "CASE 08 ・ Logistic Regression", "tagline": ["勝算比是三，", "風險卻不一定是三倍。"], "summary": "一家運動科技新創公司宣稱，他們的監測系統發現：急慢性負荷比（ACWR）超過 1.5 的球員，「受傷風險是其他人的 3 倍」，預測模型的準確率還有 74%。職業足球隊打算依此設定硬性上限，超過就強制休息。可是這個 3，到底是什麼的 3 倍？", "conflict": "勝算比 3 等於<em>風險 3 倍<\/em>嗎？一個只比「全猜不會受傷」多 6% 的準確率，<em>算不算好模型<\/em>？"}, "cast": {"ceo": {"name": "江承翰", "role": "運動科技公司執行長", "look": {"shirt": "#222831", "hair": "#1a1a1a", "hairStyle": "short", "acc": "laptop"}, "quips": ["三倍！這數字很好懂吧？", "我們的模型準確率 74%。", "演算法比肉眼可靠。"]}, "pt": {"name": "白若寧", "role": "球隊物理治療師", "look": {"shirt": "#7a4fa0", "hair": "#2b1d14", "hairStyle": "long", "acc": "clipboard"}, "quips": ["強制休息也是有代價的。", "我想知道的是：誰需要介入？"]}, "hero": {"name": "沈以安", "role": "運動科學研究者", "look": {"shirt": "#2e8b84", "coat": true, "glasses": true, "hair": "#2a1e18", "hairStyle": "bun", "acc": "notebook"}, "quips": ["先問：依變數是什麼型態？", "勝算不是機率。", "準確率要和基準比。"]}, "ra": {"name": "柏哲", "role": "研究生", "look": {"shirt": "#5c9c6a", "hair": "#1a1a1a"}, "quips": ["e 的 β 次方……我好像懂了。", "敏感度 .36？那漏掉好多人。"]}}, "acts": [{"key": "第一幕", "title": "三倍的風險", "scene": {"type": "conference", "cast": ["ceo", "pt", "hero", "ra"], "screen": {"title": "ACWR ＞ 1.5 → 受傷風險 3 倍", "lines": ["140 名球員・一個賽季", "ACWR ＞ 1.5：40 人中 20 人受傷", "ACWR ≤ 1.5：100 人中 25 人受傷", "OR = 3.0，模型準確率 74%"]}}, "fig": {"cap": "圖 1.1　職業足球季前會議", "sub": "新創公司執行長江承翰在台上展示「三倍風險」。物理治療師白若寧、以安與柏哲坐在台下。點擊角色可讀到心聲。"}, "beats": [{"s": "n", "t": "職業足球季前會議。投影幕上，一行紅字特別醒目：<em>ACWR ＞ 1.5，受傷風險 3 倍<\/em>。"}, {"s": "n", "t": "講者是運動科技新創公司的執行長江承翰。他的系統追蹤了 140 名球員一整個賽季，記錄每週的急慢性負荷比（ACWR）與是否發生非接觸性傷害。"}, {"s": "ceo", "t": "結論非常清楚：ACWR 超過 1.5 的球員，受傷風險是其他人的<em>三倍<\/em>。我們建議：超過 1.5 就強制休息。"}, {"s": "pt", "t": "強制休息會讓主力缺賽。我想先確定，這個「三倍」是怎麼算出來的。"}, {"s": "ceo", "t": "我們用勝算比算的，OR = 3.0，p < .01。"}, {"s": "hero", "t": "勝算比……那就不是「風險」的三倍。我們得先把<em>勝算<\/em>和<em>機率<\/em>分清楚。"}, {"type": "note", "id": "oddsratio"}, {"type": "choice", "header": "OR = 3.0 怎麼讀？", "q": "高負荷組 40 人中 20 人受傷，低負荷組 100 人中 25 人受傷，OR = 3.0。以下哪個敘述正確？", "opts": [{"t": "高負荷組的受傷機率是低負荷組的 3 倍。", "good": false, "fb": "受傷機率是 .50 對 .25，相對風險 RR = 2.0。OR 只有在事件罕見時才近似 RR；本案受傷率高達 32%，OR 明顯誇大了風險的倍數。"}, {"t": "高負荷組的受傷勝算是低負荷組的 3 倍；風險比約為 2 倍。", "good": true, "fb": "勝算 = p ÷ (1 − p)：高負荷組 .50／.50 = 1.0，低負荷組 .25／.75 = 0.33，OR = 3.0；而 RR = .50 ÷ .25 = 2.0。報告時把兩者寫清楚，避免把 OR 說成「風險 3 倍」。"}, {"t": "高負荷使受傷機率增加了 300%。", "good": false, "fb": "這同時犯了兩個錯：把 OR 當成 RR，又把「3 倍」當成「增加 300%」。3 倍是增加 200%；本案風險實際上是增加 100%（.25 → .50）。"}, {"t": "75% 的受傷是高負荷造成的。", "good": false, "fb": "45 位受傷者中只有 20 位來自高負荷組（44%）。而且這是觀察性資料，OR 描述的是關聯，不能直接說「造成」。"}]}, {"type": "viz", "title": "同樣兩倍風險，OR 不同", "text": ["三步裡，兩組的受傷機率<em>永遠相差兩倍<\/em>（RR = 2），只有基礎發生率不同。第一步是本案：.50 對 .25，OR = 3.0。", "第二步換成罕見事件：.05 對 .025，OR 只有 2.05，幾乎等於 RR。第三步更常見：.60 對 .30，OR 跳到 3.5。事件越常見，OR 離 RR 越遠，越不能說成「風險幾倍」。"], "model": {"type": "bars", "title": "RR 與 OR", "rows": [["RR", 2.0, "teal"], ["OR", 3.0, "gold"]], "max": 4, "thresholds": [1], "steps": [{"cap": "本案：.50 對 .25 → RR 2，OR 3.0"}, {"cap": "罕見：.05 對 .025 → RR 2，OR 2.05", "rows": [["RR", 2.0, "teal"], ["OR", 2.05, "gold"]]}, {"cap": "更常見：.60 對 .30 → RR 2，OR 3.5", "rows": [["RR", 2.0, "teal"], ["OR", 3.5, "gold"]]}]}, "cap": "圖 V1　基礎發生率越高，OR 越誇大風險倍數", "sub": "綠柱為相對風險 RR，黃柱為勝算比 OR，水平線為 1（無關聯）。第二、三步為示意情境。"}, {"s": "n", "t": "江承翰聳聳肩：「勝算、機率，不都一樣嗎？」"}, {"s": "hero", "t": "差很多。而且你把 ACWR 切成兩組，丟掉了很多資訊。為什麼不用連續的 ACWR 建模？"}, {"s": "ceo", "t": "我們試過線性迴歸，可是預測出來的機率，有的超過 1，有的是負的……"}, {"type": "choice", "header": "依變數只有 0 與 1", "q": "依變數是「是否受傷」（0／1），自變數是連續的 ACWR。最適合的分析方法是？", "opts": [{"t": "線性迴歸，把預測值超過 1 或小於 0 的截斷即可。", "good": false, "fb": "0／1 依變數的誤差不是常態，變異數也隨 p 改變，而且機率與 X 的關係本來就不是直線。截斷只是掩蓋問題，係數與標準誤仍然錯誤。"}, {"t": "邏輯斯迴歸：Y 服從二項分配，以 logit 連結 ln(odds) 與 ACWR 的線性關係。", "good": true, "fb": "邏輯斯迴歸是廣義線性模型：隨機成分為二項分配、連結函數為 logit、系統成分為 ACWR 的線性組合。預測機率永遠落在 0 與 1 之間。"}, {"t": "t 檢定比較受傷與未受傷兩組的平均 ACWR。", "good": false, "fb": "t 檢定能說明兩組 ACWR 是否不同，但給不出「ACWR 每增加多少、受傷勝算如何改變」，也無法同時控制其他變數或用來預測。"}, {"t": "以 1.5 為界切成兩組，用卡方檢定即可。", "good": false, "fb": "把連續變數二分會丟失資訊、降低檢定力，而且 1.5 這個切點可能是事後挑選、剛好讓結果最顯著的值。"}]}, {"type": "note", "id": "whylogit"}, {"type": "note", "id": "glm"}, {"s": "n", "t": "會議草草結束。白若寧追了出來：「沈老師，能不能幫我們重新分析？」"}]}, {"key": "第二幕", "title": "S 形的曲線", "scene": {"type": "lab", "cast": ["hero", "ra", "pt"], "screen": {"title": "邏輯斯迴歸（n = 140）", "lines": ["logit(p) = −4.10 ＋ 2.60 × ACWR", "SE = 0.62，Wald χ²(1) = 17.6", "p < .001，每 1 單位 OR = 13.5", "每 0.1 單位 OR = 1.30"]}}, "fig": {"cap": "圖 2.1　研究室裡的重新分析", "sub": "白若寧帶來了完整的逐週資料。柏哲把 ACWR 當成連續變數，跑出第一個邏輯斯迴歸模型。"}, "beats": [{"s": "n", "t": "隔週，研究室。白若寧帶來了完整的逐週資料，柏哲整理出每位球員的賽季 ACWR 峰值。"}, {"s": "ra", "t": "我先複習一下二項分配……所以邏輯斯迴歸的 Y，就像每位球員都在擲一枚不公正的硬幣？"}, {"type": "note", "id": "binomial"}, {"s": "hero", "t": "對。每位球員都是一次試驗，受傷機率 p 隨 ACWR 改變。邏輯斯迴歸用<em>最大概似法<\/em>，找出最可能產生這批 0 與 1 的參數。"}, {"type": "note", "id": "mle"}, {"type": "viz", "title": "最大概似：轉動 S 曲線", "text": ["黑點是未受傷（0）、紅點是受傷（1）。MLE 像在轉動一條 S 曲線：每換一組 β，就算一次「剛好觀察到這批 0 與 1」的機率。", "β₁ = 0 時人人都是 .32，等於不用 ACWR；β₁ = 1 太平緩；β₁ = 5.2 太陡，把中段的 0 與 1 押得太滿。β₁ = 2.60 時概似最大，就是模型的估計值。"], "model": {"type": "curves", "title": "不同 β₁ 的 S 曲線", "x": [0.5, 2.3], "ymax": 1.1, "xLabel": "ACWR", "yLabel": "受傷機率", "dots": [[0.96, 0], [0.8, 0], [0.74, 0], [2.2, 1, "red"], [1.63, 1, "red"], [1.33, 0], [0.91, 0], [0.63, 0], [1.25, 0], [1.21, 1, "red"], [1.01, 0], [0.7, 0], [1.2, 0], [1.14, 0], [1.4, 0], [2.04, 1, "red"], [0.83, 1, "red"], [2.11, 1, "red"], [1.53, 0], [2.01, 1, "red"], [1.17, 0], [0.82, 0], [1.72, 0], [1.95, 1, "red"], [0.92, 1, "red"], [1.45, 0], [0.71, 0], [1.03, 0], [2.03, 1, "red"], [1.23, 1, "red"], [1.66, 0], [1.08, 1, "red"], [1.82, 1, "red"], [0.87, 0], [1.31, 0], [1.54, 1, "red"], [0.75, 1, "red"], [1.18, 0], [2.17, 1, "red"], [1.88, 1, "red"], [1.76, 1, "red"], [1.58, 1, "red"]], "curves": [{"type": "logistic", "b0": -0.75, "b1": 0, "label": "β₁ = 0", "color": "teal", "labelAt": 2.05}], "steps": [{"cap": "β₁ = 0：人人都是 .32"}, {"cap": "β₁ = 1：曲線太平緩", "curves": [{"type": "logistic", "b0": -1.58, "b1": 1, "label": "β₁ = 1", "color": "teal", "labelAt": 2.05}]}, {"cap": "β₁ = 5.2：太陡，押得太滿", "curves": [{"type": "logistic", "b0": -8.2, "b1": 5.2, "label": "β₁ = 5.2", "color": "teal", "labelAt": 2.05}]}, {"cap": "β₁ = 2.60：概似最大（MLE）", "curves": [{"type": "logistic", "b0": -4.1, "b1": 2.6, "label": "β₁ = 2.60", "color": "teal", "labelAt": 2.05}]}]}, "cap": "圖 V2　概似最大的那一條 S 曲線", "sub": "為了看清楚，曲線中點固定在 ACWR ≈ 1.58，只改變斜率 β₁；點與曲線皆為教學示意。"}, {"s": "ra", "t": "跑出來了：logit(p) = −4.10 ＋ 2.60 × ACWR。所以 ACWR 每增加 1，受傷機率增加 2.6？"}, {"s": "hero", "t": "不是。2.6 是 <em>logit<\/em> 的變化。要變成勝算比，得取指數。"}, {"type": "note", "id": "interpret"}, {"type": "choice", "header": "係數 2.60 的意思", "q": "logit(p) = −4.10 ＋ 2.60 × ACWR。球員的 ACWR 多 0.1，下列哪一個解讀正確？", "opts": [{"t": "受傷機率增加 0.26（26 個百分點）。", "good": false, "fb": "2.60 × 0.1 = 0.26 是 logit（對數勝算）的變化，不是機率。機率的變化取決於起點：從 1.0 到 1.1，機率約由 .18 升到 .22；從 1.5 到 1.6，約由 .45 升到 .51。"}, {"t": "受傷勝算乘以 exp(0.26) ≈ 1.30，即勝算增加約 30%。", "good": true, "fb": "勝算比解讀：x 增加 0.1，勝算變為原來的 exp(2.60 × 0.1) ≈ 1.30 倍。這個倍數在任何 ACWR 起點都相同；機率的增加量則會隨起點而變。"}, {"t": "受傷風險變為 exp(2.6) ≈ 13.5 倍。", "good": false, "fb": "13.5 是 ACWR 增加<em>整整 1 單位<\/em>時的勝算比（例如從 0.8 跳到 1.8），而且是勝算比、不是風險比。報告 OR 要選有意義的單位，例如每 0.1。"}, {"t": "受傷機率增加 30%。", "good": false, "fb": "30% 是勝算的變化，不是機率的變化。勝算與機率只有在 p 很小時才接近；本案 ACWR 1.5 附近 p ≈ .45，兩者差很多。"}]}, {"s": "pt", "t": "所以 ACWR 從 1.0 升到 1.1，和從 1.5 升到 1.6，勝算都乘以 1.30，但機率增加的量不一樣？"}, {"s": "hero", "t": "沒錯。這就是 S 形曲線：中段最陡，兩端平緩。"}, {"type": "viz", "title": "勝算相乘，機率 S 形", "text": ["同一條 S 曲線上，三段 ACWR 各增加 0.1。每一段的<em>勝算<\/em>都乘以 exp(0.26) ≈ 1.30，倍數完全相同。", "但機率的增加量不一樣：1.0 → 1.1 只多約 .04，1.5 → 1.6 多約 .07，2.0 → 2.1 又回到約 .05。中段最陡、兩端平緩，所以描述機率變化時一定要講起點。"], "model": {"type": "curves", "title": "同一條 S 曲線", "x": [0.6, 2.4], "ymax": 1.05, "xLabel": "ACWR", "yLabel": "受傷機率", "curves": [{"type": "logistic", "b0": -4.1, "b1": 2.6, "label": "S 曲線", "color": "teal", "labelAt": 0.9}], "shade": {"curve": 0, "from": 1.0, "to": 1.1, "label": ".18→.22", "color": "red"}, "steps": [{"cap": "1.0 → 1.1：勝算 ×1.30，p 只多 .04"}, {"cap": "1.5 → 1.6：勝算 ×1.30，p 多 .07", "shade": {"curve": 0, "from": 1.5, "to": 1.6, "label": ".45→.51", "color": "red"}}, {"cap": "2.0 → 2.1：勝算 ×1.30，p 多 .05", "shade": {"curve": 0, "from": 2.0, "to": 2.1, "label": ".75→.80", "color": "red"}}]}, "cap": "圖 V3　相同的勝算比，不同的機率增量", "sub": "紅色窄帶是 ACWR 增加 0.1 的區段，標籤為該段起訖的受傷機率。"}, {"s": "n", "t": "螢幕上，那條 S 形曲線慢慢轉動。柏哲在旁邊寫下：<em>logit 是直線、勝算相乘、機率是 S 形<\/em>。"}]}, {"key": "第三幕", "title": "準確率的錯覺", "scene": {"type": "meeting", "cast": ["ceo", "pt", "hero", "ra"], "screen": {"title": "模型表現（切點 p = .50）", "lines": ["準確率：74%（104／140）", "全猜「不會受傷」：68%", "敏感度：.36（16／45）", "特異度：.93（88／95）"]}}, "fig": {"cap": "圖 3.1　球隊會議室", "sub": "一個月後，江承翰帶著新簡報回來。白板上是以安整理的分類表，數字和簡報上的「74%」講的是不同的故事。"}, "beats": [{"s": "n", "t": "一個月後，球隊會議室。江承翰帶來了新的簡報：「我們的模型準確率 74%。」"}, {"s": "pt", "t": "可是我們整季只有 32% 的球員受傷。模型如果什麼都不做，全部猜「不會受傷」，準確率也有 68%。"}, {"s": "ceo", "t": "……那 74% 還是比較高啊。"}, {"s": "hero", "t": "準確率把兩種完全不同的錯誤混在一起了。我們要分開看。"}, {"type": "viz", "title": "準確率的錯覺", "text": ["第一步只比準確率：模型 74%，全猜「不會受傷」也有 68%。只多 6 個百分點，卻被包裝成很厲害的數字。", "第二步把準確率拆開：特異度 .93 很高，因為未受傷的人本來就多；<em>敏感度只有 .36<\/em>，45 位受傷者漏掉 29 位。傷害預防最在意的，正是這一根。"], "model": {"type": "bars", "title": "切點 .50 的模型表現", "rows": [["模型", 0.74, "teal"], ["全猜未傷", 0.68, "gold"]], "max": 1.0, "steps": [{"cap": "準確率：模型 74%，基準 68%"}, {"cap": "拆開看：敏感度 .36、特異度 .93", "rows": [["準確率", 0.74, "teal"], ["敏感度", 0.36, "red"], ["特異度", 0.93, "blue"]]}]}, "cap": "圖 V4　多數類別撐起了準確率", "sub": "基準 68% = 95／140，是什麼都不做、全猜「不會受傷」的準確率。"}, {"type": "note", "id": "cutoff"}, {"type": "choice", "header": "74% 準確率算好嗎？", "q": "以預測機率 ≥ .50 判為「會受傷」：準確率 74%、敏感度 .36、特異度 .93。你如何評估這個模型？", "opts": [{"t": "74% 高於 70%，已經是可用的篩檢模型。", "good": false, "fb": "準確率必須和基準比較：全猜「不會受傷」就有 68%。敏感度 .36 代表 45 位受傷者中有 29 位沒被抓到；作為傷害預防工具，這是最不能接受的錯誤。"}, {"t": "把切點提高到 .70，讓準確率再上升。", "good": false, "fb": "受傷率只有 32% 時，提高切點會讓模型更常猜「不會受傷」，準確率可能上升，敏感度卻更低。切點應依兩種錯誤的代價決定，而不是追求準確率。"}, {"t": "分開報告敏感度與特異度，畫 ROC 曲線算 AUC，再依介入代價選切點。", "good": true, "fb": "ROC 曲線列出所有切點下的敏感度與 1 − 特異度，AUC 摘要整體區辨力。傷害預防中漏判代價高、介入（調整負荷）代價低，可選較低的切點以提高敏感度。"}]}, {"type": "note", "id": "roc"}, {"s": "pt", "t": "如果切點降到 .25，敏感度可以到 .80，特異度 .62。被標記的球員，我們先做負荷調整，而不是強制休息。"}, {"type": "viz", "title": "把切點往下移", "text": ["每顆球是一位受傷球員的預測機率。第一步切點 .50：只有紅球被判為「會受傷」，45 人中抓到 16 人，敏感度 .36。", "第二步切點降到 .25，抓到 36 人，敏感度 .80。第三步換看 95 位未受傷者：同一切點下有 36 人被誤判，特異度 .62。降低切點，就是用誤判換漏判。"], "model": {"type": "drops", "title": "受傷者的預測機率", "x": [0, 1], "counts": [0, 1, 2, 3, 3, 4, 4, 4, 4, 4, 4, 3, 3, 2, 2, 1, 1, 0, 0, 0], "curve": false, "color": "blue", "xLabel": "預測機率 p̂", "shade": {"from": 0.5, "to": 1, "label": "抓到 16", "color": "red"}, "marks": [{"x": 0.5, "label": "切點 .50", "color": "ink"}], "steps": [{"cap": "受傷 45 人，切點 .50：抓到 16 人"}, {"cap": "切點降到 .25：抓到 36 人（.80）", "shade": {"from": 0.25, "to": 1, "label": "抓到 36", "color": "red"}, "marks": [{"x": 0.25, "label": "切點 .25", "color": "ink"}]}, {"cap": "未受傷 95 人，切點 .25：誤判 36 人", "title": "未受傷者的預測機率", "counts": [6, 11, 14, 15, 13, 9, 8, 6, 4, 2, 3, 2, 1, 0, 0, 1, 0, 0, 0, 0], "shade": {"from": 0.25, "to": 1, "label": "誤判 36", "color": "red"}, "marks": [{"x": 0.25, "label": "切點 .25", "color": "ink"}]}]}, "cap": "圖 V5　切點移動：敏感度與特異度的取捨", "sub": "藍球為判定「不會受傷」，紅球為判定「會受傷」（數值為教學示意）。"}, {"s": "hero", "t": "這就合理了。最後一個問題：ACWR 高的球員，是不是本來就有<em>舊傷<\/em>，或<em>上場時間比較多<\/em>？"}, {"s": "ra", "t": "我把傷史和上場分鐘數一起放進模型了。ACWR 每 0.1 的 OR 從 1.30 降到 1.21，95% CI [1.05, 1.40]。"}, {"type": "choice", "header": "結論怎麼寫？", "q": "加入傷史與上場時間後，ACWR 每 0.1 的調整後 OR = 1.21（95% CI [1.05, 1.40]）。最恰當的結論是？", "opts": [{"t": "ACWR 造成受傷：每增加 0.1，受傷風險增加 21%。", "good": false, "fb": "觀察性資料只能談關聯；而且 1.21 是勝算比，不是風險比。「造成」與「風險增加 21%」兩處都超出了資料能支持的範圍。"}, {"t": "控制傷史與上場時間後，ACWR 仍與受傷勝算有關，宜作監測指標，不宜當硬性門檻。", "good": true, "fb": "調整後 OR 變小，表示原本的關聯有一部分來自傷史與上場時間；剩下的關聯仍顯著（CI 不含 1）。它適合用來提醒與調整負荷，而非單一切點的硬性規則。"}, {"t": "OR 從 1.30 降到 1.21，表示 ACWR 已經不重要了。", "good": false, "fb": "調整後 OR 仍顯著大於 1（CI 不含 1），關聯沒有消失，只是變小。調整的目的是估計排除混淆後的關聯，不是證明變數無用。"}]}, {"s": "ceo", "t": "所以我們的系統還是有用，只是不能說「三倍風險」，也不能當成強制休息的開關。"}, {"s": "hero", "t": "它可以是提醒，而不是判決。"}, {"s": "n", "t": "會議結束時，白若寧把「超過 1.5 強制休息」改成：<em>ACWR 偏高 → 個別評估與負荷調整<\/em>。"}]}], "notes": {"oddsratio": {"no": 1, "t": "勝算與勝算比", "blocks": [{"type": "h", "t": "勝算（odds）"}, {"type": "p", "t": "勝算是事件發生機率與不發生機率的比值：odds = p ÷ (1 − p)。機率 .50 的勝算是 1，機率 .25 的勝算是 1/3。"}, {"type": "h", "t": "勝算比（OR）與相對風險（RR）"}, {"type": "p", "t": "2 × 2 表中，有風險因子者：事件 a、無事件 b；無風險因子者：c、d。"}, {"type": "formula", "t": "OR = (a/b) ÷ (c/d) = ad ÷ bc"}, {"type": "formula", "t": "RR = [a/(a+b)] ÷ [c/(c+d)]"}, {"type": "p", "t": "OR > 1 表示有風險因子者勝算較高；OR = 1 表示無關；OR < 1 則相反。講義的阿斯匹靈例子：安慰劑組 75／25，勝算 3；阿斯匹靈組 50／50，勝算 1；OR = 3。"}, {"type": "p", "t": "事件<em>罕見<\/em>時，a、c 遠小於 b、d，OR 會接近 RR（講義：心血管疾病 男／女 OR = 1.13）。本案受傷率 32%，OR = 3.0，RR 卻只有 2.0。"}], "fig": {"model": {"type": "bars", "title": "同一份資料：機率與勝算", "rows": [["高負荷 p", 0.5, "teal"], ["低負荷 p", 0.25, "teal"], ["高負荷勝算", 1.0, "gold"], ["低負荷勝算", 0.33, "gold"]], "max": 1.1}, "table": [["ACWR", "受傷", "未受傷", "合計"], ["＞ 1.5", "20", "20", "40"], ["≤ 1.5", "25", "75", "100"], ["合計", "45", "95", "140"]], "cap": "圖 N1　RR = .50 ÷ .25 = 2；OR = 1.0 ÷ .33 = 3", "sub": "綠柱是兩組的受傷機率，黃柱是兩組的勝算。同一張 2 × 2 表，機率的比是 2，勝算的比是 3（數值為教學示意）。", "points": ["OR 是勝算的比，不是機率的比。", "事件常見時，OR 比 RR 更遠離 1。", "表的列對調，OR 變成倒數；ln OR 只變號。"]}}, "whylogit": {"no": 2, "t": "為什麼不用線性迴歸？", "blocks": [{"type": "h", "t": "0／1 依變數的三個問題"}, {"type": "bullet", "t": "預測值可能大於 1 或小於 0，不是合理的機率。"}, {"type": "bullet", "t": "誤差只有兩種值，不是常態；變異數 p(1 − p) 隨 X 改變。"}, {"type": "bullet", "t": "機率與 X 的關係通常是 S 形：兩端平緩、中段最陡。"}, {"type": "h", "t": "邏輯斯迴歸模型"}, {"type": "p", "t": "邏輯斯迴歸不直接對 p 畫直線，而是假設<em>勝算的對數<\/em>（logit）與 x 呈線性關係："}, {"type": "formula", "t": "ln[p ÷ (1 − p)] = β₀ + β₁x"}, {"type": "formula", "t": "p = 1 ÷ [1 + exp(−β₀ − β₁x)]"}, {"type": "p", "t": "logit 可從 −∞ 到 +∞，轉回機率後永遠落在 0 與 1 之間。若 x 為 0／1（如講義的性別，男 = 1），兩組勝算為 exp(β₀ + β₁) 與 exp(β₀)，勝算比就是 exp(β₁)；β₁ = 0 表示 x 不是風險因子。"}], "fig": {"model": {"type": "curves", "title": "線性迴歸 vs. 邏輯斯迴歸", "x": [0.5, 2.3], "ymin": -0.3, "ymax": 1.25, "curves": [{"type": "logistic", "b0": -4.1, "b1": 2.6, "label": "邏輯斯", "color": "teal", "labelAt": 1.95}, {"type": "line", "a": -0.58, "b": 0.7, "label": "線性迴歸", "color": "red", "labelAt": 2.2}, {"type": "line", "a": 1, "b": 0, "label": "p = 1", "color": "gray", "labelAt": 0.6}, {"type": "line", "a": 0, "b": 0, "label": "p = 0", "color": "gray", "labelAt": 1.3}], "dots": [[0.96, 0], [0.8, 0], [0.74, 0], [2.2, 1, "red"], [1.63, 1, "red"], [1.33, 0], [0.91, 0], [0.63, 0], [1.25, 0], [1.21, 1, "red"], [1.01, 0], [0.7, 0], [1.2, 0], [1.14, 0], [1.4, 0], [2.04, 1, "red"], [0.83, 1, "red"], [2.11, 1, "red"], [1.53, 0], [2.01, 1, "red"], [1.17, 0], [0.82, 0], [1.72, 0], [1.95, 1, "red"], [0.92, 1, "red"], [1.45, 0], [0.71, 0], [1.03, 0], [2.03, 1, "red"], [1.23, 1, "red"], [1.66, 0], [1.08, 1, "red"], [1.82, 1, "red"], [0.87, 0], [1.31, 0], [1.54, 1, "red"], [0.75, 1, "red"], [1.18, 0], [2.17, 1, "red"], [1.88, 1, "red"], [1.76, 1, "red"], [1.58, 1, "red"]], "xLabel": "ACWR", "yLabel": "受傷機率", "steps": [{"cap": "直線硬套 0／1：兩端衝出 0 與 1", "curves": [{"type": "line", "a": -0.58, "b": 0.7, "label": "線性迴歸", "color": "red", "labelAt": 2.2}, {"type": "line", "a": 1, "b": 0, "label": "p = 1", "color": "gray", "labelAt": 0.6}, {"type": "line", "a": 0, "b": 0, "label": "p = 0", "color": "gray", "labelAt": 1.3}]}, {"cap": "邏輯斯曲線：永遠在 0 與 1 之間"}]}, "cap": "圖 N2　直線會衝出 0 與 1，S 形曲線不會", "sub": "上排紅點是受傷球員（1），下排黑點是未受傷（0）。紅線是線性迴歸，會越過 p = 0 與 p = 1 的灰線；綠色 S 形曲線是邏輯斯迴歸（數值為教學示意）。", "points": ["線性迴歸用在 0／1 上：預測值可能不是機率。", "邏輯斯迴歸：logit 是直線，機率是 S 形。"]}}, "glm": {"no": 3, "t": "廣義線性模型", "blocks": [{"type": "h", "t": "三個組成"}, {"type": "bullet", "t": "<em>隨機成分<\/em>：依變數的分配。連續 → 常態；成功／失敗 → 二項；次數 → Poisson 或負二項。"}, {"type": "bullet", "t": "<em>系統成分<\/em>：自變數的線性組合 η = β₀ + β₁x₁ + …；x 可以是連續、類別、交互作用（x₁x₂）或多項式（x₁²）。"}, {"type": "bullet", "t": "<em>連結函數<\/em> g(·)：把依變數的平均 μ 連到 η，即 g(μ) = η。原始形式 g(μ) = μ 稱為恆等連結。"}, {"type": "h", "t": "一個家族"}, {"type": "p", "t": "常態分配＋恆等連結時：X 連續是迴歸，X 為類別是 ANOVA，兩者混合是 ANCOVA。二項＋logit 是邏輯斯迴歸；Poisson＋log 是對數線性模型。其他連結還有 probit、complementary log-log 等。"}, {"type": "p", "t": "邏輯斯迴歸中，μ 就是事件機率 p，連結函數為 logit(p) = ln[p ÷ (1 − p)]。"}], "fig": {"model": {"type": "paths", "title": "GLM：三個成分如何串起來", "nodes": [{"id": "x1", "label": "ACWR", "x": -0.9, "y": 0.95}, {"id": "x2", "label": "傷史", "x": -0.9, "y": 0.68}, {"id": "x3", "label": "上場時間", "x": -0.9, "y": 0.41}, {"id": "eta", "label": "η", "kind": "comp", "x": -0.2, "y": 0.68}, {"id": "p", "label": "p", "kind": "lat", "x": 0.35, "y": 0.68}, {"id": "y", "label": "受傷 0／1", "x": 0.88, "y": 0.68}], "edges": [{"from": "x1", "to": "eta", "color": "teal", "label": "β₁"}, {"from": "x2", "to": "eta", "color": "teal", "label": "β₂"}, {"from": "x3", "to": "eta", "color": "teal", "label": "β₃"}, {"from": "eta", "to": "p", "color": "purple", "label": "logit⁻¹"}, {"from": "p", "to": "y", "color": "gray", "label": "二項"}]}, "table": [["分配", "連結", "X", "模型"], ["常態", "恆等", "連續", "迴歸"], ["常態", "恆等", "類別", "ANOVA"], ["常態", "恆等", "混合", "ANCOVA"], ["二項", "logit", "混合", "邏輯斯迴歸"], ["Poisson", "log", "混合", "對數線性"]], "cap": "圖 N3　系統成分 → 連結函數 → 隨機成分", "sub": "方塊是預測變數與結果，綠色六角柱是線性預測值 η，紅球是事件機率 p；η 經 logit 的反函數變成 p，再由二項分配產生 0／1。", "points": ["迴歸、ANOVA、ANCOVA、邏輯斯迴歸同屬一個家族。", "依變數型態不同，就換分配與連結函數。"]}}, "binomial": {"no": 4, "t": "隨機成分：二項分配", "blocks": [{"type": "h", "t": "講義的例子"}, {"type": "p", "t": "一枚不公正的硬幣正面機率 .3，擲 5 次恰好 2 次正面的機率是多少？任一種排列（如 HHTTT）的機率為 .3 × .3 × .7 × .7 × .7 = .03087；2 次正面的排列共有 C(5, 2) = 10 種，所以機率為 10 × .03087 ≈ .309。"}, {"type": "formula", "t": "P(X = x) = C(n, x) pˣ (1 − p)ⁿ⁻ˣ"}, {"type": "h", "t": "和邏輯斯迴歸的關係"}, {"type": "p", "t": "每位球員一季受傷與否，就是一次 n = 1 的試驗（伯努利試驗）：P(Y = 1) = p。邏輯斯迴歸假設 Y 服從二項分配，平均為 p、變異數為 p(1 − p)，並讓 p 隨 ACWR 改變。"}, {"type": "bullet", "t": "變異數由平均決定：p 不同，變異數就不同。這正是線性迴歸的「等變異」假設在 0／1 資料上必然失敗的原因。"}], "fig": {"model": {"type": "columns", "values": [0.168, 0.36, 0.309, 0.132, 0.028, 0.002], "labels": ["0", "1", "2", "3", "4", "5"], "markIndex": 2, "showValues": true, "connect": false, "yLabel": "機率", "notes": [{"text": "P(2) ≈ .309", "at": 2, "color": "red"}]}, "cap": "圖 N4　二項分配 n = 5、p = .3", "sub": "橫軸是 5 次中出現正面的次數 x，柱高是對應機率，紅柱為 x = 2；所有柱子加總為 1。", "points": ["二項分配：n 次獨立試驗、每次成功機率 p。", "邏輯斯迴歸的 Y 是 n = 1 的二項（伯努利）變數。"]}}, "mle": {"no": 5, "t": "最大概似估計與檢定", "blocks": [{"type": "h", "t": "最大概似法（MLE）"}, {"type": "p", "t": "邏輯斯迴歸沒有殘差平方和可以最小化，改用<em>最大概似法<\/em>：找出一組 β，讓觀察到這批 0 與 1 的機率（概似）最大。實務上是最大化對數概似 LL，以疊代法求解。"}, {"type": "h", "t": "檢定 H₀：β₁ = 0"}, {"type": "formula", "t": "Wald χ² = (b₁ ÷ SE)²，df = 1"}, {"type": "p", "t": "本例 b₁ = 2.60、SE = 0.62，Wald χ² = 17.6，p < .001。也可用<em>概似比檢定<\/em>：G² = −2(LL簡 − LL全)，自由度為參數個數差；小樣本或係數很大時，比 Wald 檢定穩定。"}, {"type": "h", "t": "多元邏輯斯迴歸"}, {"type": "p", "t": "放入多個預測變數時，exp(βⱼ) 是<em>調整後<\/em>勝算比：其他變數固定下，xⱼ 增加 1 單位時勝算變為幾倍。模型適配可報告 −2LL、Nagelkerke R²（虛擬 R²）與 Hosmer–Lemeshow 檢定。"}], "fig": {"model": {"type": "curves", "title": "對數概似 LL 與 β₁", "x": [0, 5.2], "ymin": -97, "ymax": -85.5, "curves": [{"type": "points", "points": [[0, -95.4], [0.5, -92.3], [1, -89.9], [1.5, -88.2], [2, -87.1], [2.6, -86.6], [3.2, -87.1], [3.7, -88.2], [4.2, -89.9], [4.7, -92.3], [5.2, -95.4]], "label": "LL", "color": "teal", "labelAt": 4.5}], "marks": [{"x": 2.6, "label": "MLE：b₁ = 2.60", "color": "red"}, {"x": 0.05, "label": "H₀：β₁ = 0", "color": "ink"}], "xLabel": "β₁", "steps": [{"cap": "H₀：β₁ = 0 時的對數概似", "marks": [{"x": 0.05, "label": "H₀：β₁ = 0", "color": "ink"}]}, {"cap": "MLE：b₁ = 2.60 時最高；差距 ×2 即 G²"}]}, "cap": "圖 N5　對數概似在 b₁ = 2.60 達到最高", "sub": "綠線是不同 β₁ 下的對數概似（示意）。紅線標出最大值，左側黑線是 H₀：β₁ = 0；兩處高度差的兩倍就是概似比統計量 G²。", "points": ["MLE：讓資料「最有可能出現」的參數。", "Wald 與概似比檢定都在問：β₁ 是否為 0？"]}}, "interpret": {"no": 6, "t": "三種解讀方式", "blocks": [{"type": "h", "t": "講義的三種解讀"}, {"type": "bullet", "t": "<em>Logit<\/em>：x 每增加 1 單位，logit(p) 增加 β。"}, {"type": "bullet", "t": "<em>勝算比<\/em>：x + 1 時的勝算 = x 時的勝算 × exp(β)。"}, {"type": "bullet", "t": "<em>機率<\/em>：代入邏輯斯函數，算出各 x 的 p。"}, {"type": "h", "t": "講義例子"}, {"type": "formula", "t": "logit(p) = −12.35 + 0.497x"}, {"type": "bullet", "t": "exp(0.497) = 1.64：x 每多 1，勝算乘以 1.64。"}, {"type": "bullet", "t": "x 為 26.3 時，p = .674，勝算 = 2.07。"}, {"type": "bullet", "t": "x 為 27.3 時，p = .773，勝算 = 3.40 ≈ 2.07 × 1.64。"}, {"type": "h", "t": "本案"}, {"type": "p", "t": "每 0.1 單位 OR = exp(0.26) ≈ 1.30。ACWR 為 1.0、1.5、2.0 時，p 分別約為 .18、.45、.75：勝算以固定倍數成長，機率卻是 S 形，中段變化最大。"}], "fig": {"model": {"type": "columns", "values": [0.223, 0.375, 0.631, 1.062, 1.786, 3.004], "labels": ["1.0", "1.2", "1.4", "1.6", "1.8", "2.0"], "showValues": true, "connect": true, "yLabel": "勝算 odds", "plane": {"value": 1}, "lines": [{"values": [0.182, 0.273, 0.387, 0.515, 0.641, 0.75], "label": "機率 p", "color": "gold"}], "steps": [{"cap": "勝算：每 0.2 單位乘以 1.68", "lines": []}, {"cap": "加上機率：S 形，中段變化最大"}]}, "cap": "圖 N6　勝算每 0.2 單位乘以 1.68，機率漸趨平緩", "sub": "橫軸為 ACWR。灰柱是受傷勝算，黃線是對應的受傷機率；半透明平面為勝算 = 1，即 p = .5（數值為教學示意）。", "points": ["報告 OR 要選有意義的單位（每 0.1，而非每 1）。", "說明機率變化時要指明起點，最好畫預測機率圖。"]}}, "cutoff": {"no": 7, "t": "切點與分類表", "blocks": [{"type": "h", "t": "從機率到分類"}, {"type": "p", "t": "邏輯斯迴歸給的是每位球員的預測機率；要做決策，得選一個<em>切點<\/em>：p̂ ≥ 切點判為「會受傷」。講義的緩解例子以 .228 為切點，得到敏感度 4／6、特異度 10／10。"}, {"type": "h", "t": "三個指標"}, {"type": "bullet", "t": "<em>敏感度<\/em> = 真陽性 ÷ 實際受傷者：受傷者被抓到的比例。"}, {"type": "bullet", "t": "<em>特異度<\/em> = 真陰性 ÷ 實際未受傷者：未受傷者被正確排除的比例。"}, {"type": "bullet", "t": "<em>準確率<\/em> = (真陽 + 真陰) ÷ 全部：容易被多數類別主導。"}, {"type": "p", "t": "本案切點 .50：敏感度 16／45 = .36、特異度 88／95 = .93、準確率 104／140 = 74%。但全猜「不會受傷」就有 95／140 = 68%。事件比例不平衡時，準確率幾乎不提供資訊。"}], "fig": {"model": {"type": "boxes", "title": "兩組球員的預測受傷機率", "ymin": 0, "ymax": 1, "yLabel": "預測機率 p̂", "groups": [{"label": "未受傷", "stats": [0.05, 0.14, 0.22, 0.34, 0.62], "mean": 0.26, "outliers": [0.78], "color": "teal"}, {"label": "受傷", "stats": [0.1, 0.26, 0.42, 0.58, 0.86], "mean": 0.43, "color": "red"}], "steps": [{"cap": "切點 .50：高於多數受傷者", "refs": [{"value": 0.5, "label": "切點 .50", "color": "red"}]}, {"cap": "切點 .25：抓到多數受傷者，也誤判較多", "refs": [{"value": 0.25, "label": "切點 .25", "color": "gold"}]}]}, "table": [["", "預測受傷", "預測未傷"], ["實際受傷", "16", "29"], ["實際未傷", "7", "88"]], "cap": "圖 N7　兩組的預測機率大幅重疊", "sub": "綠箱是未受傷者、紅箱是受傷者的預測機率，黃色菱形為平均。切點 .50 高於紅箱中位數，多數受傷者因此被判為「不會受傷」（數值為教學示意）。", "points": ["切點越低：敏感度↑、特異度↓。", "切點要依漏判與誤判的代價決定。"]}}, "roc": {"no": 8, "t": "ROC 曲線與 AUC", "blocks": [{"type": "h", "t": "把所有切點畫在一起"}, {"type": "p", "t": "ROC 曲線以 1 − 特異度為橫軸、敏感度為縱軸，把每一個可能的切點畫成一點。講義的超音波例子：內膜厚度切點 4 mm 時敏感度 99%、特異度 50%；切點提高到 25 mm，敏感度降到 20%、特異度升到 98%。"}, {"type": "h", "t": "AUC 怎麼讀"}, {"type": "p", "t": "曲線下面積 AUC 等於「隨機抽一位受傷者與一位未受傷者，模型給受傷者較高機率」的機率。.5 等於擲硬幣；.7～.8 尚可；.8～.9 良好；.9 以上優秀。本案 AUC = .78。"}, {"type": "p", "t": "AUC 摘要整體區辨力，與切點無關；切點的選擇仍要回到決策代價。本隊漏判（球員受傷）代價高、誤判（多做負荷調整）代價低，因此選用 .25：敏感度 .80、特異度 .62。"}], "fig": {"model": {"type": "curves", "title": "ROC 曲線", "x": [0, 1], "ymax": 1.1, "curves": [{"type": "points", "points": [[0, 0], [0.03, 0.18], [0.07, 0.36], [0.15, 0.52], [0.25, 0.66], [0.38, 0.8], [0.55, 0.89], [0.75, 0.96], [1, 1]], "label": "本案 AUC = .78", "color": "teal", "labelAt": 0.2}, {"type": "line", "a": 0, "b": 1, "label": "隨機 AUC = .5", "color": "gray", "labelAt": 0.6}], "dots": [[0.07, 0.36, "red"], [0.38, 0.8, "gold"]], "xLabel": "1 − 特異度", "yLabel": "敏感度", "steps": [{"cap": "切點 .50：敏感度 .36", "dots": [[0.07, 0.36, "red"]]}, {"cap": "切點 .25：敏感度 .80，代價是特異度 .62"}]}, "cap": "圖 N8　ROC 曲線：每一點都是一個切點", "sub": "綠線是本案模型，灰線是隨機猜測。紅點為切點 .50（敏感度 .36），黃點為切點 .25（敏感度 .80）（數值為教學示意）。", "points": ["AUC 描述區辨力，不受切點影響。", "選切點，就是在漏判與誤判之間取捨。"]}}}, "ending": {"title": "三倍的風險：結案", "paragraphs": ["球隊沒有採用「ACWR ＞ 1.5 強制休息」的規則。修正後的報告以連續的 ACWR 建立邏輯斯迴歸，報告每 0.1 單位的勝算比，並同時列出勝算比與相對風險，避免把 OR 說成「風險三倍」。", "模型的價值不再用準確率宣傳，而是以 ROC 曲線（AUC = .78）與切點 .25 下的敏感度、特異度呈現。被標記的球員進入個別評估與負荷調整，而不是被強制休息。"], "takeaway": "邏輯斯迴歸在 logit 上是直線、在勝算上是相乘、在機率上是 S 形。勝算比不是風險比，準確率要和基準比，切點要和決策代價一起選。", "verdict": ["審查通過：你分清了勝算與風險，也看穿了準確率的錯覺。修正報告順利定案。", "有條件接受：模型方向正確，但部分解讀仍可能把勝算比說成風險倍數。", "退回重審：「三倍風險」與「準確率 74%」仍寫在報告裡，主力球員因此被強制休息。"]}};

function runAnims(h){const a=h.userData.an;if(!a)return;const lt=CLOCK-a.t0;for(const it of a.intro){if(it.done)continue;const p=(lt-it.d)/it.dur;if(p<0)continue;if(p>=1){it.fn(1);it.done=true;continue;}it.fn(it.e(p));}for(const fn of a.idle)fn(lt,a.end);}

function makeFlap(rect){const w=cvW(rect.w),h=cvH(rect.h);const pivot=new THREE.Group();const p0=cvToWorld(rect.x+rect.w/2,rect.y);pivot.position.set(p0.x,THICK+0.008,p0.z);
  const tex=canvasTex(2048,Math.max(64,Math.round(2048*h/w)),(g,cw,ch)=>{g.scale(2,2);cw/=2;ch/=2;g.fillStyle='#efe6d0';g.fillRect(0,0,cw,ch);for(let i=0;i<2500;i++){g.fillStyle=`rgba(120,90,50,${Math.random()*0.08})`;g.fillRect(Math.random()*cw,Math.random()*ch,2,1);}const gr=g.createLinearGradient(0,0,0,70);gr.addColorStop(0,'rgba(60,40,20,.25)');gr.addColorStop(1,'rgba(60,40,20,0)');g.fillStyle=gr;g.fillRect(0,0,cw,70);g.strokeStyle='rgba(60,40,20,.35)';g.lineWidth=2;g.setLineDash([10,8]);g.strokeRect(14,14,cw-28,ch-28);g.setLineDash([]);
    g.fillStyle=INK;g.textAlign='center';g.font='bold 44px '+FONT;g.fillText('掀開紙片，看回饋',cw/2,ch/2+6);g.font='bold 26px '+FONT;g.fillStyle=INK2;g.fillText('LIFT THE FLAP',cw/2,ch/2+52);});
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pageMat(tex));front.rotation.x=-Math.PI/2;front.position.z=h/2;front.castShadow=true;pivot.add(front);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xe6dcc4,roughness:.95}));back.rotation.x=Math.PI/2;back.position.set(0,-0.001,h/2);pivot.add(back);

const chapTxt=document.getElementById('chapTxt');document.getElementById('chapKey').textContent=B.caseNo?'CASE '+B.caseNo:(B.short||'BOOK');
async function locked(fn){if(S.busy)return;S.busy=true;try{await fn();}catch(e){console.error(e);}finally{S.busy=false;}}
function buildScene(spec){const g=new THREE.Group();if(spec&&('model' in spec)){if(spec.model){const st=arr(spec.model.steps);const base=Object.assign({},spec.model);delete base.steps;const h=modelHolder(st.length?Object.assign({},base,st[0]):base,0);if(ARC)h.userData.an.t0+=0.95;g.add(h);if(st.length>1)g.userData.steps={base,list:st,i:0,holder:h,hold:num(spec.model.stepHold,2.6)};}const TL=num(spec.model&&spec.model.tilt,-0.62);g.rotation.x=TL;g.position.y=0.36;g.position.z=0.26;g.scale.setScalar(1.06);if(spec.compact){g.scale.setScalar(0.9);g.position.z=-0.3;g.position.y=0.34;}S.chars={};}else{S.chars=buildStory(g,spec);g.rotation.x=num(spec&&spec.tilt,-0.42);g.scale.setScalar(0.8);g.position.y=0.5;g.position.z=0.22;}anchor.add(g);S.sceneGroup=g;if(spec&&spec.model){const H=[];g.traverse(o=>{if(o.userData.an)H.push(o.userData.an);});H.forEach(q=>q.intro.forEach(x=>x.fn(1)));
    const measure=()=>{g.updateMatrixWorld(true);const bx=new THREE.Box3(),b1=new THREE.Box3();g.traverse(o=>{if((o.isMesh||o.isSprite)&&o.visible&&o.geometry&&!(o.isMesh&&o.material&&o.material.depthWrite===false)){if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();b1.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);bx.union(b1);}});return bx;};
    let bx=measure();if(!bx.isEmpty()){const k=anchor.scale.x,sz=bx.getSize(new THREE.Vector3());const lim=spec.compact?[1.9,1.15,1.35]:[2.45,1.5,1.7];const f=Math.max(0.8,Math.min(lim[0]/(sz.x/k),lim[1]/(sz.z/k),lim[2]));g.scale.multiplyScalar(f);
      bx=measure();const c=bx.getCenter(new THREE.Vector3());const want=rightPage.localToWorld(new THREE.Vector3(0,spec.compact?0.56:0.6,0));g.position.x+=(want.x-c.x)/k;g.position.z+=(want.z-c.z)/k;}
    H.forEach(q=>q.intro.forEach(x=>{if(!x.done)x.fn(0);}));}if(ARC)ARC.inkIn(g,spec&&spec.model?spec.model:spec);g.traverse(o=>{if(o.userData.type==='char')o.userData.baseY=o.position.y;});g.children.forEach(c=>{c.userData.bs=c.scale.x;c.scale.setScalar(0.001);});
  return new Promise(res=>{let n=0;if(!g.children.length)return res();g.children.forEach((c,i)=>gsap.to(c.scale,{x:c.userData.bs,y:c.userData.bs,z:c.userData.bs,duration:0.9,ease:'elastic.out(1,0.5)',delay:Math.min(i,20)*0.05+(ARC?0.95:0),onStart:()=>{if(i%3===0)AUDIO.pop(i%5);},onComplete:()=>{if(++n===g.children.length)res();}}));});}
let STEP=null,PEND=null;
function stepTick(){const sg=S.sceneGroup;const st=sg&&sg.userData.steps;if(!st||S.busy||S.state==='TURN'||S.state==='LIFTING')return;const a=st.holder.userData.an;if(CLOCK-a.t0<Math.max(a.end+st.hold,4.5))return;
  st.i=(st.i+1)%st.list.length;const old=st.holder;let rot=0;old.traverse(o=>{if(o.userData.float)rot=o.userData.rotBase;});
  gsap.to(old.scale,{x:0.001,y:0.001,z:0.001,duration:0.3,ease:'power2.in',onComplete:()=>sg.remove(old)});
  const h=modelHolder(Object.assign({},st.base,st.list[st.i]),rot);h.userData.an.t0+=0.25;sg.add(h);st.holder=h;if(ARC)ARC.inkSwap(h);AUDIO.pop(st.i%5);
  if(STEP){STEP.i=st.i;STEP.cap=st.list[st.i].cap||'';if(S.reR)S.reR(rightCanvas);if(S.reL){S.reL(leftCanvas);if(lastCue)drawCue(lastCue);}}}
window.__dbg=()=>{const sg=S.sceneGroup,st=sg&&sg.userData.steps;return {clock:CLOCK,step:st?st.i:null,end:st?st.holder.userData.an.end:null,t0:st?st.holder.userData.an.t0:null};};
function flatten(){const g=S.sceneGroup;if(!g)return Promise.resolve();if(ARC)ARC.inkOut(g);return new Promise(res=>{let n=0;if(!g.children.length){anchor.remove(g);S.sceneGroup=null;return res();}g.children.forEach((c,i)=>gsap.to(c.scale,{y:0.001,z:0.001,duration:0.4,ease:'power3.in',delay:Math.min(i,20)*0.02,onComplete:()=>{if(++n===g.children.length){anchor.remove(g);S.sceneGroup=null;res();}}}));});}
function snapshotRight(){flipFrontCanvas.getContext('2d').drawImage(rightCanvas,0,0,PW,PH);flipFrontTex.needsUpdate=true;}
async function turnPage(newLeftDraw,newRightDraw,sceneSpec){S.state='TURN';STEP=PEND?PEND.step:null;S.reL=PEND?PEND.left:null;S.reR=PEND?PEND.right:null;PEND=null;snapshotRight();if(flap){book.remove(flap);flap=null;}
  await flatten();pageNo+=2;newLeftDraw(flipBackCanvas);flipBackTex.needsUpdate=true;rightNote=null;newRightDraw(rightCanvas);
  flipPivot.rotation.z=0;flipPivot.visible=true;AUDIO.flip();
  await new Promise(r=>gsap.to(flipPivot.rotation,{z:Math.PI,duration:1.1,ease:'power2.inOut',onComplete:r}));
  newLeftDraw(leftCanvas);flipPivot.visible=false;if(sceneSpec)await buildScene(sceneSpec);}
const A=()=>ACTS[S.act]||{beats:[]};
function nextIsTurn(){const nb=arr(A().beats)[S.beat+1];return !nb||nb.type==='choice'||nb.type==='note'||nb.type==='scene';}
function cont(h){return {k:h.k,t:String(h.t).replace('（續）','')+'（續）'};}
function textBlock(b){return b.s===undefined||b.s==='n'||!CAST[b.s]?{type:'narr',t:b.t}:{type:'say',s:b.s,t:b.t};}
function enterAct(i){S.act=i;const a=A();return locked(async()=>{S.scene=a.scene||{type:'lab',cast:Object.keys(B.cast||{}).slice(0,3)};currentFig=a.fig||{cap:'',sub:''};S.chap=(a.key||'')+' ・ '+(a.title||'');chapTxt.textContent=S.chap;S.onNote=false;S.pendingTurn=false;doc=[];curHeader={k:a.key||'',t:a.title||''};
  await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';S.beat=0;}).then(()=>{if(S.state==='READING'&&S.beat===0)showBeat();});}
function finishAct(){const a=A();const last=S.act>=ACTS.length-1;const blk={type:'end',t:(a.key||'')+' ・ 完'};const cue=last?'翻頁看結案報告 ▸':'翻頁進入'+(ACTS[S.act+1].key||'下一幕')+' ▸';
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  doc.push(blk);const y=renderLeft(leftCanvas,doc,curHeader);if(y>PH-120&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='END';drawCue(cue);});return;}
  S.state='END';drawCue(cue);}
function showBeat(){const b=arr(A().beats)[S.beat];if(!b){finishAct();return;}
  if(b.type==='note'){const n=(B.notes||{})[b.id];if(!n){S.beat++;showBeat();return;}locked(async()=>{S.onNote=true;const ns=arr(((n.fig||{}).model||{}).steps);PEND={step:ns.length>1?{i:0,n:ns.length,cap:ns[0].cap||''}:null,left:null,right:c=>renderNoteRight(c,n)};chapTxt.textContent='研究筆記 '+n.no+' ・ '+n.t;await turnPage(c=>renderNoteLeft(c,n),c=>renderNoteRight(c,n),{model:(n.fig||{}).model,compact:arr((n.fig||{}).table).length>0});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='viz'){const vs=arr((b.model||{}).steps);const n={no:'',t:b.title||'',fig:{model:b.model,cap:b.cap||'',sub:b.sub||'',points:b.points}};locked(async()=>{S.onNote=true;chapTxt.textContent='模型動畫 ・ '+(b.title||'');PEND={step:vs.length>1?{i:0,n:vs.length,cap:vs[0].cap||''}:null,left:c=>renderVizLeft(c,b),right:c=>renderNoteRight(c,n)};await turnPage(c=>renderVizLeft(c,b),c=>renderNoteRight(c,n),{model:b.model});S.chars={};S.state='READING';drawCue('翻頁回到故事 ▸');});return;}
  if(b.type==='scene'){if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;if(b.title)curHeader={k:curHeader.k,t:b.title};S.pendingTurn=true;S.beat++;showBeat();return;}
  if(b.type==='choice'){S.state='CHOICE';S.choice=b;S.picked=null;S.onNote=false;S.pendingTurn=false;if(b.scene)S.scene=b.scene;if(b.fig)currentFig=b.fig;
    locked(async()=>{chapTxt.textContent=(A().key||'')+' ・ 研究決策';const opts=arr(b.opts);let sz=38,osz=33;const est=measureRuns(parseEm(b.q),PW-240,sz,sz*1.45,true)+opts.reduce((s,o)=>s+measureRuns(parseEm(o.t),PW-360,osz,osz*1.45)+46,0);if(est>820){sz=34;osz=29;}if(est>1000){sz=31;osz=26;}
      doc=[{type:'question',t:b.q,sz},...opts.map((o,i)=>({type:'option',k:'ABCDE'[i],t:o.t,idx:i,state:'',sz:osz}))];curHeader={k:(A().key||'')+' ・ 研究決策',t:b.header||'你會怎麼做？'};
      await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),b.model?{model:b.model}:S.scene);S.state='CHOICE';drawCue('點選一個選項 ▸');});return;}
  const blk=textBlock(b);
  if(S.onNote||S.pendingTurn){S.onNote=false;S.pendingTurn=false;locked(async()=>{chapTxt.textContent=S.chap;curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  doc.push(blk);const yEnd=renderLeft(leftCanvas,doc,curHeader);
  if(yEnd>PH-150&&doc.length>1){doc.pop();renderLeft(leftCanvas,doc,curHeader);locked(async()=>{curHeader=cont(curHeader);doc=[blk];await turnPage(c=>renderLeft(c,doc,curHeader),c=>renderRight(c,currentFig),S.scene);S.state='READING';drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');});return;}
  AUDIO.click();drawCue(nextIsTurn()?'翻頁 ▸':'繼續閱讀 ▸');}
function showEnding(){locked(async()=>{chapTxt.textContent='結案報告';await turnPage(c=>renderEndLeft(c),c=>renderEndRight(c),(B.ending&&B.ending.model)?{model:B.ending.model}:((B.ending&&B.ending.scene)||null));S.state='DONE';if(window.__markDone)window.__markDone();});}
function advance(){if(S.busy)return;if(S.state==='TITLE'){AUDIO.init();if(ACTS.length)enterAct(0);return;}
  if(S.state==='READING'||S.state==='AFTER'){S.beat++;showBeat();return;}
  if(S.state==='END'){if(S.act<ACTS.length-1)enterAct(S.act+1);else showEnding();}}
function pickOption(idx){if(S.state!=='CHOICE'||S.picked!==null)return;const o=arr(S.choice.opts)[idx];if(!o)return;S.picked=idx;AUDIO.click();DECISIONS.push({q:S.choice.header||S.choice.q,t:o.t,good:!!o.good});
  doc.forEach(b=>{if(b.type==='option')b.state=b.idx===idx?'picked':'dim';});
  // fit question+options+feedback on page: shrink feedback if needed
  let fsz=32;doc.push({type:'feedback',t:o.fb||'',good:!!o.good,sz:fsz});let y=renderLeft(leftCanvas,doc,curHeader);
  while(y>PH-110&&fsz>22){fsz-=2;doc[doc.length-1].sz=fsz;y=renderLeft(leftCanvas,doc,curHeader);}
  if(y>PH-110){doc=doc.filter(b=>b.type!=='option'||b.state==='picked');y=renderLeft(leftCanvas,doc,curHeader);}
  if(fbRect){flap=makeFlap(fbRect);S.state='FLAP';drawCue('掀開紙片 ▸');}else{S.state='AFTER';}}
function liftFlap(){if(S.state!=='FLAP'||!flap)return;S.state='LIFTING';AUDIO.flip();const o=arr(S.choice.opts)[S.picked];const fl=flap;gsap.to(fl.rotation,{x:-1.6,duration:0.7,ease:'power2.out'});gsap.to(fl.scale,{x:0.001,y:0.001,z:0.001,duration:0.45,delay:0.55,ease:'power2.in',onComplete:()=>{book.remove(fl);if(flap===fl)flap=null;}});
  gsap.delayedCall(1.0,()=>{AUDIO.chime(!!o.good);S.state='AFTER';S.pendingTurn=true;renderLeft(leftCanvas,doc,curHeader);drawCue(nextIsTurn()?'翻頁 ▸':'翻頁繼續 ▸');});}
function charClick(ch){if(ch.userData.busy)return;ch.userData.busy=true;const s=ch.scale.x;AUDIO.pop(Math.floor(Math.random()*4));const tl=gsap.timeline({onComplete:()=>ch.userData.busy=false});tl.to(ch.scale,{x:s*1.25,y:s*0.72,z:s*1.25,duration:0.1}).to(ch.scale,{x:s*0.85,y:s*1.22,z:s*0.85,duration:0.12}).to(ch.scale,{x:s,y:s,z:s,duration:0.7,ease:'elastic.out(1,0.4)'});tl.to(ch.userData.head.rotation,{y:(Math.random()<.5?1:-1)*0.7,duration:0.25},0.1).to(ch.userData.head.rotation,{y:0,duration:0.5,ease:'elastic.out(1,0.5)'},0.45);
  const q=ch.userData.quips||['……'];rightNote={who:ch.userData.name,t:q[Math.floor(Math.random()*q.length)]};renderRight(rightCanvas,currentFig);}
window.__api={advance,pickOption,liftFlap};

/* ---------- input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,dragRot=null;
function hits(ev,objs){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true);}
function findChar(o){while(o&&!(o.userData&&o.userData.type==='char'))o=o.parent;return o;}
function optAt(uv){const cx=uv.x*PW,cy=(1-uv.y)*PH;for(const r of optRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)return r.idx;return null;}
function onClick(e){if(S.busy)return;document.getElementById('hint').style.opacity=0;
  if(flap&&S.state==='FLAP'&&hits(e,[flap]).length){liftFlap();return;}
  if(S.sceneGroup&&!S.onNote){const h=hits(e,[S.sceneGroup]);const ch=h.length?findChar(h[0].object):null;if(ch){charClick(ch);return;}}
  if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h){const i=optAt(h.uv);if(i!==null)pickOption(i);}return;}
  if(S.state==='FLAP'){liftFlap();return;}
  advance();}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(S.onNote&&S.sceneGroup&&!S.busy)dragRot={x:e.clientX};});
addEventListener('pointermove',e=>{if(!dragRot||!S.sceneGroup)return;const dx=e.clientX-dragRot.x;dragRot.x=e.clientX;S.sceneGroup.traverse(o=>{if(o.userData.float)o.userData.rotBase+=dx*0.01;});});
addEventListener('pointerup',()=>{dragRot=null;});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;onClick(e);});
renderer.domElement.addEventListener('pointermove',e=>{let cur='default';if(!S.busy){if(flap&&S.state==='FLAP'&&hits(e,[flap]).length)cur='pointer';else if(S.sceneGroup&&!S.onNote&&hits(e,[S.sceneGroup]).some(h=>findChar(h.object)))cur='pointer';else if(S.state==='CHOICE'&&S.picked===null){const h=hits(e,[leftPage])[0];if(h&&optAt(h.uv)!==null)cur='pointer';}else if(S.onNote)cur='grab';}renderer.domElement.style.cursor=cur;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();if(S.state==='FLAP'){liftFlap();return;}if(S.state!=='CHOICE')advance();}
  if(S.state==='CHOICE'&&S.picked===null&&/^Digit[1-5]$/.test(e.code)){pickOption(+e.code.slice(5)-1);}});
const BOOKFILE=decodeURIComponent((location.pathname.split('/').pop()||'').replace(/\.html$/,''));const mark=v=>{try{const k='pb:'+BOOKFILE;if(v==='done'||localStorage.getItem(k)!=='done')localStorage.setItem(k,v);}catch(e){}};mark('reading');window.__markDone=()=>mark('done');
document.getElementById('btnShelf').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btnMute').addEventListener('click',()=>{if(!AUDIO.ready)AUDIO.init();const m=AUDIO.toggle();document.getElementById('btnMute').classList.toggle('off',m);});

/* ---------- loop ---------- */
renderTitle();let t=0,last=performance.now(),first=true;
(function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;CLOCK=t;if(ARC)ARC.tick(dt,t);if(S.sceneGroup){S.sceneGroup.children.forEach(h=>{if(h.userData.an)runAnims(h);});stepTick();}
  if(S.sceneGroup)S.sceneGroup.traverse(o=>{const fl=o.userData.float;if(fl){o.position.y=fl.baseY+Math.sin(t*1.3+fl.phase)*fl.amp;if(!dragRot)o.userData.rotBase+=fl.spin*dt;o.rotation.y=o.userData.rotBase+Math.sin(t*0.4+fl.phase)*fl.sway;}
    if(o.userData.type==='char'&&!o.userData.busy){o.position.y=o.userData.baseY+Math.sin(t*2+o.userData.phase)*0.01;o.userData.head.rotation.y=Math.sin(t*0.6+o.userData.phase)*0.25;}});
  camera.lookAt(camTarget);renderer.render(scene,camera);if(first){first=false;window.__booted=true;const L=document.getElementById('loading');L.style.opacity=0;setTimeout(()=>L.style.display='none',700);}requestAnimationFrame(frame);})(performance.now());
}
