<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課程網站</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d2433; --muted:#5b6475; --line:#dcd9d0; --accent:#1f3a5f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --ink:#eceef2; --muted:#a3abba; --line:#313846; --accent:#9cc0ee; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:1.75rem; margin:0 0 24px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:16px; }
  a.course { display:block; padding:20px 24px; background:var(--card); border:1px solid var(--line);
             border-radius:12px; color:inherit; text-decoration:none; }
  a.course:hover, a.course:focus-visible { border-color:var(--accent); outline:none; }
  a.course strong { display:block; font-size:1.2rem; color:var(--accent); }
  a.course span { color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>課程網站</h1>
  <ul>
    <li><a class="course" href="measurement-and-statistics/"><strong>體育測驗與統計</strong><span>12 章・48 集短片・60 個互動工具</span></a></li>
    <li><a class="course" href="research-methods/"><strong>高等體育研究法</strong><span>論文五章工作坊</span></a></li>
    <li><a class="course" href="advanced-sports-statistics/"><strong>高等體育統計</strong><span>第 1–8 章</span></a></li>
    <li><a class="course" href="multivariate-data-analysis/"><strong>多變量資料分析</strong><span>研究案件書房</span></a></li>
    <li><a class="course" href="real-world-sports-data/"><strong>真實世界運動大數據分析專題討論</strong><span>第 1–18 週</span></a></li>
  </ul>
</main>
</body>
</html>
