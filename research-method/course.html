<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: five "lanes" (chapters) on the home screen; each chapter opens into modules; each module is a short sequence: read, judge, order, write, check, feedback. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#12202E; --muted:#5A6B7B; --line:#D8DFE6;
  --accent:#D4401C; --accent-ink:#FFFFFF; --navy:#1C3557;
  --ok:#1E7A4F; --okbg:#E2F2E9; --bad:#B3261E; --badbg:#FBE7E4; --paper:#FAFBFC;
  --grid:rgba(28,53,87,.055); --lane:rgba(212,64,28,.14); --wash:rgba(28,53,87,.07); --shadow:0 6px 18px -8px rgba(18,32,46,.22);
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1620; --surface:#15222F; --ink:#E7EDF3; --muted:#9BACBC; --line:#28394A;
  --accent:#F27350; --accent-ink:#1A0B06; --navy:#8DB2E3;
  --ok:#62C792; --okbg:#143324; --bad:#F0877F; --badbg:#3A1C1A; --paper:#101C28;
  --grid:rgba(141,178,227,.06); --lane:rgba(242,115,80,.12); --wash:rgba(141,178,227,.07); --shadow:0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#15222F; --ink:#E7EDF3; --muted:#9BACBC; --line:#28394A;
  --accent:#F27350; --accent-ink:#1A0B06; --navy:#8DB2E3;
  --ok:#62C792; --okbg:#143324; --bad:#F0877F; --badbg:#3A1C1A; --paper:#101C28;
  --grid:rgba(141,178,227,.06); --lane:rgba(242,115,80,.12); --wash:rgba(141,178,227,.07); --shadow:0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
/* Background: a data-sheet grid with the curved lane lines of a running-track bend, fixed behind the content. */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(120% 70% at 100% 0%,var(--wash),transparent 60%),
  linear-gradient(var(--bg),var(--bg))}
.bgfx::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%)}
.bgfx::after{content:"";position:absolute;width:min(900px,140vw);aspect-ratio:1;right:max(-320px,-40vw);top:-36%;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 46px,var(--lane) 46px 48px);
  -webkit-mask-image:radial-gradient(circle at center,transparent 34%,#000 36%,#000 62%,transparent 71%);mask-image:radial-gradient(circle at center,transparent 34%,#000 36%,#000 62%,transparent 71%)}
@keyframes enterF{from{opacity:.25;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:.25;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes enterU{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.go>*{animation:enterU .42s cubic-bezier(.2,.7,.2,1) both}
#app.go.fwd>*{animation-name:enterF}
#app.go.back>*{animation-name:enterB}
#app.go>*:nth-child(2){animation-delay:.03s}#app.go>*:nth-child(3){animation-delay:.06s}#app.go>*:nth-child(4){animation-delay:.09s}
#app.go>*:nth-child(5){animation-delay:.12s}#app.go>*:nth-child(6){animation-delay:.15s}#app.go>*:nth-child(n+7){animation-delay:.18s}
#app.go .lane,#app.go .row{animation:enterU .4s cubic-bezier(.2,.7,.2,1) both}
#app.go .lane:nth-child(2),#app.go .row:nth-child(2){animation-delay:.04s}#app.go .lane:nth-child(3),#app.go .row:nth-child(3){animation-delay:.08s}
#app.go .lane:nth-child(4),#app.go .row:nth-child(4){animation-delay:.12s}#app.go .lane:nth-child(5),#app.go .row:nth-child(5){animation-delay:.16s}#app.go .row:nth-child(n+6){animation-delay:.2s}
#app.go .track i{transform-origin:left;animation:fill .9s .25s cubic-bezier(.2,.7,.2,1) both}
.lane,.row,.btn,.stepbar button,.video{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}
@media (hover:hover){
  .lane:hover,button.row:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--navy)}
  .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .stepbar button:hover{border-color:var(--navy)}
  .video:hover{transform:translateY(-1px);box-shadow:var(--shadow)}}
.lane:active,button.row:active,.btn:not(:disabled):active{transform:scale(.985)}
details>summary{transition:color .15s ease}
details[open]>*:not(summary){animation:enterU .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font:15px/1.75 var(--sans);padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:6px 0;color:var(--accent);text-decoration:underline;font-size:14px}
.back{background:none;border:0;padding:10px 0;min-height:44px;color:var(--muted);font-size:15px;align-self:flex-start}
.top{display:flex;flex-direction:column;gap:8px}

/* lanes */
.lanes{display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;align-items:center;text-align:left;width:100%;

.lane .no{grid-row:1/3;font-family:var(--mono);font-weight:500;font-size:30px;color:var(--navy);line-height:1}
.lane .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lane .nm b{font-family:var(--serif);font-size:17px}
.lane .nm span{font-size:12px;color:var(--muted);white-space:nowrap}
.lane.planned .no,.lane.planned .nm b{opacity:.55}
.track{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 3px),var(--surface) calc(20% - 3px) 20%)}


/* home */
.hero{display:flex;flex-direction:column;gap:18px;padding-block:4px}
.herocv{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
#heroCanvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%}
@media (min-width:660px){#heroCanvas{aspect-ratio:2/1}}
.herotag{display:block;border-top:1px solid var(--line);padding:8px 14px;font-variant-numeric:tabular-nums}
.herotext{display:flex;flex-direction:column;gap:12px;min-width:0}
.heroart{display:flex;justify-content:center}
.tracksvg{width:100%;max-width:300px;height:auto}
.arcb,.arcf{fill:none;stroke-width:12;stroke-linecap:butt}
.arcb{stroke:var(--line)}
.arcf{stroke:var(--accent);stroke-dasharray:var(--p) 100}
#app.go .arcf{animation:arcdraw 1.1s .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes arcdraw{from{stroke-dasharray:0 100}}
.arcn{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.arcbig{font-family:var(--mono);font-size:28px;font-weight:500;fill:var(--ink);font-variant-numeric:tabular-nums}
.arcsm{font-family:var(--sans);font-size:12px;fill:var(--muted);font-weight:400}
.stats{display:flex;gap:22px;flex-wrap:wrap;padding-top:4px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.stat b small{font-size:13px;color:var(--muted)}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:8px}
.how{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}

.howlist{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:12px}
.howlist li{counter-increment:h;display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px}
.howlist li::before{content:counter(h);grid-row:1/3;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--surface);font:500 13px/26px var(--mono);text-align:center}
.howlist b{font-weight:600}
.howlist span{font-size:14px;color:var(--muted)}
.vcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--navy);color:var(--surface);border-radius:10px;padding:18px 16px;
  transition:transform .18s ease,box-shadow .18s ease}
.vcard .mono{color:inherit;opacity:.75}
.vcard b{font-family:var(--serif);font-size:20px}
.vcard span{font-size:14px;opacity:.9}
.vcard .vgo{margin-top:auto;padding-top:8px;font-weight:700;opacity:1;text-decoration:underline;text-underline-offset:3px}
.vcard .play{margin-bottom:6px}
@media (hover:hover){.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px}
.row .id{font-family:var(--mono);font-size:14px;color:var(--navy)}
.row .t{font-weight:500}
.row .d{font-size:13px;color:var(--muted)}
.row.locked{opacity:.55;cursor:default}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.run{border-color:var(--accent);color:var(--accent)}
.chip.done{background:var(--okbg);border-color:transparent;color:var(--ok)}

/* module */
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.step>header{display:flex;gap:10px;align-items:baseline}
.step>header .mono{color:var(--accent)}
.tip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.q{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-height:40px}
.home-h1{font-size:clamp(28px,5vw,38px)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.verdict{font-size:14px;border-radius:8px;padding:8px 10px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict b{margin-right:4px}
.score{font-size:14px;color:var(--muted)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;width:100%;
  border:1px dashed var(--line);border-radius:8px;padding:8px 10px;min-height:44px;background:transparent}
.slot .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.slot.filled{border-style:solid;background:var(--paper)}
.slot.ok{border-color:var(--ok);background:var(--okbg)}
.slot.bad{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--navy);color:var(--ink);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;min-height:40px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:500}
.field .hint{font-size:13px;color:var(--muted)}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.paper{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:14px 14px;
  font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}
.paper.empty{border-left-color:var(--line)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent)}
.ai{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20}
.note{font-size:13px;color:var(--muted)}
.video{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px}.video+.video{margin-top:8px}
:root[data-theme="dark"] .video{color:#0D1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .video{color:#0D1620}}
.video .mono{color:inherit;opacity:.75}
.video .chip{border-color:currentColor;color:inherit}
.vbtn{text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);position:relative}
details.lec,details.rel{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px}
details.lec summary,details.rel summary{cursor:pointer;font-weight:500;padding:8px 0;min-height:44px}
.stepbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:-4px 0 0;scrollbar-width:none}
.stepbar::-webkit-scrollbar{display:none}
.stepbar button{flex:0 0 auto;min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
.stepbar button.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.step{scroll-margin-top:64px}.field{scroll-margin-top:72px}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 2.2s ease-out}
.nextbox{border:1px solid var(--ok);background:var(--okbg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nextbox b{color:var(--ok)}
.resume{border-left:4px solid var(--accent)}
.noai #s-ai .btnrow,.noai #s-ai .ai,.noai #consbtn,.noai #critai{display:none}.aioff{display:none}.noai .aioff{display:block}.noai .aion{display:none}
details.lec ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.ex{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.gquote{margin:8px 0 10px;border-left:3px solid var(--muted);background:var(--surface);border-radius:6px;padding:10px 12px}.gquote div{white-space:pre-wrap;font-size:14px;line-height:1.8;margin-top:4px;color:var(--ink)}.gunit{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.gtitle{margin-top:12px;font-weight:600;font-size:15px}
.gpts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}.gpts li div{margin-top:4px;font-size:14px;line-height:1.7}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.ex p{margin-top:6px;line-height:2.1}
.seg{border-bottom:2px solid var(--accent);padding-bottom:1px}
.seg b{font-size:11px;font-family:var(--mono);color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 5px;margin:0 4px 0 2px;vertical-align:2px}
.relitem{margin-top:10px}.relitem p{font-size:14px;color:var(--ink);margin-top:2px;white-space:pre-wrap}
.tool{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn.on{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.big{font-family:var(--serif);font-weight:800;font-size:20px;line-height:1.5}
.result{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.mxrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.mxhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}

table.mx th{background:var(--paper);font-weight:600}
ol.refs{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:14px;overflow-wrap:anywhere}
.cons{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding:8px 0}
.crow .ctext{font-size:14px;overflow-wrap:anywhere}
.clab{display:flex;flex-direction:column;gap:2px}
.chip.warn{border-color:var(--accent);color:var(--accent)}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
@media (max-width:560px){.crow{grid-template-columns:1fr}}
.play::after{content:"";position:absolute;left:17px;top:13px;border-left:14px solid var(--accent-ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
</style>

<div class="wrap" id="app"></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=s=>/[。！？＿]$/.test(s)?s:s+'。';
const KEY='rm-course-v1';
let S={judge:{},order:{},tpl:{},checks:{},ai:{},refs:[],mx:[],crit:{},pw:{},cho:{},ap:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- 第一章教材 ---------- */
const MODS=[
{id:'1.0',title:'如何選擇研究題目',desc:'從興趣走到做得出來的題目',
 focus:'好題目要過三關：重要（有人在乎答案）、做得到（有對象、資料、時間）、有缺口（文獻裡還沒有好答案）。',
 lead:'興趣是起點，不是題目。從興趣出發，先讀文獻找出大家在意的問題，再縮小到一個你有辦法蒐集資料的範圍，最後用三關檢查。過不了關的題目，再有興趣也做不出來。',
 tip:'題目寫法是「對象＋主題＋關係」，中文 20 字內，不要出現「研究」二字。選題還要看資源：資料、時間、人員、金錢夠不夠。',
 judge:{prompt:'下面四個題目，哪些過得了三關？',items:[
  {text:'大專划船選手的睡眠時數與賽季疲勞的關聯。',good:true,why:'有對象、有變項，資料拿得到，教練也在乎答案。'},
  {text:'如何提升運動表現？',good:false,why:'範圍太大，不知道研究誰、量什麼，過不了「做得到」這一關。'},
  {text:'奧運國手在決賽前的心理狀態。',good:false,why:'題目有趣，但多數研究生接觸不到奧運國手，資料拿不到。'},
  {text:'八週核心肌力訓練對高中排球選手垂直跳高度的影響。',good:true,why:'對象、介入、結果都清楚，學校球隊可以找到受試者。'}]},
 order:{prompt:'把選題的四個步驟排成順序。',parts:[
  '從自己的興趣或實務經驗出發，列出幾個想做的方向。',
  '讀文獻，找出這個方向裡教練或學者在意、但還沒有好答案的問題。',
  '把問題縮小到一個有對象、有變項、資料拿得到的題目。',
  '用三關檢查：重要、做得到、有缺口，選出一個。'],
  why:'興趣 → 文獻 → 縮小 → 三關檢查，先發散再收斂。'},
 tpl:{fields:[
  {id:'a',label:'候選題目一',hint:'寫成「對象＋變項＋關係」。',ph:'大專划船選手的睡眠時數與賽季疲勞的關聯',type:'text'},
  {id:'b',label:'候選題目二',hint:'方向可以不同，但一樣要寫完整。',ph:'高中排球選手八週核心訓練對垂直跳的影響',type:'text'},
  {id:'c',label:'候選題目三',hint:'第三個方向。',ph:'大專田徑選手賽前焦慮與起跑反應時間的關聯',type:'text'},
  {id:'d',label:'我選第幾個',hint:'選一個最過得了三關的。',type:'select',opts:['題目一','題目二','題目三'],min:2},
  {id:'e',label:'為什麼選它',hint:'用三關說明：重要在哪、為什麼做得到、缺口是什麼。',ph:'教練在乎賽季疲勞；校隊選手可以找到；文獻多用心率，少有結合睡眠的證據。',type:'area',min:20},
  {id:'title',label:'論文題目',hint:'20 字內，含對象、主題與關係；不寫「研究」「之研究」。',ph:'大專划船選手睡眠時數與賽季疲勞之關聯',type:'text',min:6}],
  compose:v=>`論文題目：${v.title}\n候選題目：（一）${v.a}；（二）${v.b}；（三）${v.c}。本研究選擇${v.d}，理由如下：${P(v.e)}`},
 checks:['有與此主題相關的文獻','過去有人研究過此主題（或結論不一致）','我具備探索此主題的專業知識與能力','有研究工具可以回答研究問題','能找到適合的研究參與者']},
{id:'1.1',title:'研究背景與動機',desc:'從現象走到缺口',
 focus:'背景要像漏斗：從具體現象，到已知研究，到尚未解決的缺口，最後帶出本研究。',
 lead:'研究背景不是寫你為什麼喜歡這個主題，而是讓讀者相信這個問題值得被研究。常見的路徑是四步：現象、已知、缺口、本研究。',
 tip:'缺口句常以「然而」「但是」開頭，並指出對象、情境或方法上少了什麼。',
 judge:{prompt:'下面四句，哪些可以當作研究背景的段落？',items:[
  {text:'近年來，台灣青少年棒球投手的肩肘傷害比例逐年增加，賽季中的投球量管理成為教練團隊的重要課題。',good:true,why:'從具體現象切入，有對象也有議題。'},
  {text:'運動很重要，所以我想研究運動。',good:false,why:'範圍太大，沒有切入點，也看不出問題。'},
  {text:'我很喜歡打籃球，所以決定研究籃球。',good:false,why:'個人興趣不是研究動機，需要補上實務或學術上的缺口。'},
  {text:'雖然已有研究探討高強度間歇訓練對最大攝氧量的效果，但針對女性大專划船選手的證據仍有限。',good:true,why:'先交代已知，再指出對象上的缺口。'}]},
 order:{prompt:'把四句話排成背景的邏輯順序。',parts:[
  '近年大專運動員的賽季訓練量持續提高，運動傷害與疲勞累積受到關注。',
  '過去研究多以心率與主觀疲勞量表監測訓練負荷。',
  '然而，結合睡眠與肌肉負荷的多指標監測，在大專選手身上的證據仍少。',
  '因此，本研究欲探討多指標監測與賽季疲勞的關聯。'],
  why:'現象 → 已知 → 缺口 → 本研究，是背景最穩的順序。'},
 tpl:{fields:[
  {id:'a',label:'現象或趨勢',hint:'寫一句完整的話，交代對象與議題。',ph:'近年大專划船選手的賽季訓練量持續提高，疲勞累積受到關注。',type:'area'},
  {id:'b',label:'已知的研究',hint:'過去研究做了什麼。',ph:'過去研究多以心率與主觀疲勞量表監測訓練負荷。',type:'area'},
  {id:'c',label:'缺口',hint:'以「然而」開頭，指出缺少什麼。',ph:'然而，結合睡眠與主觀疲勞的多指標監測證據仍少。',type:'area'},
  {id:'d',label:'本研究要做什麼',hint:'接在「因此，本研究」後面。',ph:'欲探討睡眠與賽季疲勞之間的關聯',type:'area',min:6}],
  compose:v=>`${P(v.a)}${P(v.b)}${P(v.c)}因此，本研究${P(v.d)}`},
 checks:['有具體的對象或情境','已知與缺口之間有轉折','缺口是能被這個研究回答的']},
{id:'1.2',title:'研究問題',desc:'把想法寫成可回答的問句',
 focus:'研究問題要有對象、變項與關係，能用資料回答。',
 lead:'好的研究問題讓人一讀就知道你要找誰、量什麼、比較什麼。太大的問題無法回答，太小的問題不值得研究。',
 tip:'句型：（對象）的（變項一）與（變項二）是否有（關係）？若是介入研究，再加上成效方向（增加／減少）與指標。多個研究問題之間要相關但不重疊。',
 judge:{prompt:'哪些問句適合當研究問題？',items:[
  {text:'運動訓練好不好？',good:false,why:'沒有對象、沒有指標，無法用資料回答。'},
  {text:'八週高強度間歇訓練是否能改善大專划船選手的 2000 公尺測驗成績？',good:true,why:'介入、對象、結果指標都很清楚。'},
  {text:'為什麼選手會受傷？',good:false,why:'原因太多，範圍過大。'},
  {text:'大專田徑選手的睡眠時數與賽季疲勞分數是否有關聯？',good:true,why:'兩個變項、一個對象，可以直接蒐集資料。'}]},
 order:{prompt:'把縮小題目的四個步驟排好。',parts:[
  '主題：運動員的疲勞管理',
  '對象：大專划船選手',
  '變項：睡眠時數與疲勞分數',
  '問句：睡眠時數與賽季疲勞分數是否有關聯？'],
  why:'由大到小：主題、對象、變項，最後寫成問句。'},
 tpl:{fields:[
  {id:'pop',label:'研究對象',hint:'誰？越具體越好。',ph:'大專划船選手',type:'text',min:2},
  {id:'x',label:'變項一（自變項）',hint:'你要看的因子；比較差異時寫分組方式，例如「訓練方式」「性別」。',ph:'睡眠時數',type:'text',min:2},
  {id:'y',label:'變項二或結果',hint:'你要測的結果。',ph:'賽季疲勞分數',type:'text',min:2},
  {id:'idx',label:'指標或量數',hint:'依變項用什麼數值呈現。',ph:'Borg CR-10 分數',type:'text',min:2},
  {id:'rel',label:'關係',hint:'選一種你要檢驗的關係。',type:'select',opts:['是否有關聯','是否有顯著差異','能否有效預測'],min:2}],
  compose:v=>`本研究的研究問題為：${rqSentence(v)}`},
 checks:['對象具體','兩個變項都能被測量','答案不是一看就知道的常識']},
{id:'1.3',title:'研究目的',desc:'用動詞開頭的目的句',
 focus:'目的句以動詞開頭，並與研究問題一一對應。',
 lead:'研究目的是研究問題的陳述版。每一條目的都用動詞開頭，例如探討、比較、驗證、建立，並且能用結果回答。',
 tip:'目的的數量通常是兩到三條，太多代表研究範圍太散。',
 judge:{prompt:'哪些句子可以當作研究目的？',items:[
  {text:'探討八週肌力訓練對大專排球選手垂直跳高度的影響。',good:true,why:'動詞、對象、介入與結果都有。'},
  {text:'讓大家更重視運動。',good:false,why:'這是願景，不是能用資料回答的目的。'},
  {text:'了解、研究、看看相關情形。',good:false,why:'動詞太模糊，沒有對象與變項。'},
  {text:'比較有無血流限制訓練的兩組選手在下肢肌力的差異。',good:true,why:'清楚指出比較的組別與指標。'}]},
 order:{prompt:'把四個片段拼成一句目的。',parts:['探討','八週肌力訓練','對大專排球選手','垂直跳高度的影響'],
  why:'動詞 → 介入 → 對象 → 結果，是介入研究目的句最常用的骨架。'},
 tpl:{fields:[
  {id:'p1',label:'目的一',hint:'以動詞開頭。',ph:'探討八週肌力訓練對大專排球選手垂直跳高度的影響。',type:'area',min:8},
  {id:'p2',label:'目的二',hint:'可以是比較、驗證或建立。',ph:'比較不同訓練頻率對下肢爆發力的差異。',type:'area',min:8}],
  compose:v=>`本研究之目的如下：\n（一）${P(v.p1)}\n（二）${P(v.p2)}`},
 checks:['每條都以動詞開頭','能對應到研究問題','資料蒐集後可以回答']},
{id:'1.4',title:'研究假設與名詞定義',desc:'把概念變成可測量的說法',
 focus:'名詞要寫成操作型定義，假設要有方向與比較對象。',
 lead:'「疲勞」「表現」這類詞每個人理解不同。操作型定義說明你用什麼工具、在什麼時間、得到什麼數值。假設則是對結果方向的預測。',
 tip:'名詞釋義寫兩層：概念性定義（學理上的意思）與操作性定義（工具、時間點、數值意義）。研究假設有方向；統計假設（H0）寫「沒有差異」，是要被推翻的。',
 judge:{prompt:'哪些寫法合格？',items:[
  {text:'疲勞：選手感到很累的狀態。',good:false,why:'無法測量，沒有工具與時間點。'},
  {text:'疲勞：以 Borg CR-10 量表，於訓練後 30 分鐘內測得之自覺疲勞分數。',good:true,why:'工具、時間點、數值都交代了。'},
  {text:'H0：兩組 2000 公尺成績進步幅度沒有差異。這是研究假設。',good:false,why:'這是統計假設（虛無假設）。研究假設要寫研究者預期的方向，統計假設才是「沒有差異」。'},
  {text:'H1：八週訓練後，實驗組的 2000 公尺成績進步幅度顯著大於控制組。',good:true,why:'時間、組別、指標、方向俱全。'}]},
 order:{prompt:'把假設句的四個部分排好。',parts:['八週訓練後，','實驗組','的 2000 公尺成績進步幅度','顯著大於控制組。'],
  why:'時間點 → 組別 → 指標 → 方向，句子才完整。'},
 tpl:{fields:[
  {id:'term',label:'要定義的名詞',hint:'一個你研究中的關鍵詞。',ph:'疲勞',type:'text',min:2},
  {id:'con',label:'概念性定義',hint:'學理上的一般定義，可引文獻。',ph:'運動後生理與心理資源耗損、表現能力暫時下降的狀態（Halson, 2014）',type:'area',min:8},
  {id:'def',label:'操作性定義',hint:'工具、時間點、數值意義。',ph:'以 Borg CR-10 量表於訓練後 30 分鐘內測得之自覺疲勞分數，分數越高代表越疲勞。',type:'area',min:10},
  {id:'hyp',label:'研究假設',hint:'寫出時間、組別、指標與方向。',ph:'H1：八週訓練後，實驗組的疲勞分數顯著低於控制組。',type:'area',min:10}],
  compose:v=>`名詞釋義\n${v.term}：概念性定義為${P(v.con)}本研究之操作性定義為${P(v.def)}\n\n研究假設\n${P(v.hyp)}`},
 checks:['概念性與操作性定義都有','操作性定義裡有工具名稱','研究假設有方向，不是「沒有差異」']},
{id:'1.5',title:'範圍、限制與重要性',desc:'誠實交代邊界，說清價值',
 focus:'範圍交代誰、何時、何地；限制說明推論邊界；重要性分理論與實務。',
 lead:'範圍（delimitation）是你刻意設定的邊界：對象、時間、地點、內容。限制（limitation）是威脅研究品質、你控制不了的部分。講義提醒：研究範圍和研究方法本身都不能列為限制，要寫的是它們帶來、你控制不了的影響（例如方便取樣使推論受限）；真正的限制要做完研究才知道，所以這裡先寫「預期的限制」，第五章再寫實際遇到的。重要性不要誇大，說清楚誰可以用這個結果做什麼。',
 tip:'重要性可以分成理論貢獻與實務應用兩句。',
 judge:{prompt:'哪些句子寫得恰當？',items:[
  {text:'本研究對象限於 2026 年就讀北部大專院校之男女划船校隊選手，推論至其他族群時須謹慎。',good:true,why:'範圍明確，也交代推論邊界。'},
  {text:'本研究沒有任何限制。',good:false,why:'每個研究都有限制，說沒有會降低可信度。'},
  {text:'本研究可以讓全世界的選手都變強。',good:false,why:'過度推論，與研究設計不相稱。'},
  {text:'研究結果可提供教練調整賽季訓練量之實證參考。',good:true,why:'指出使用者與用途，語氣適中。'}]},
 order:{prompt:'把這一節的四個部分排成常見順序。',parts:[
  '範圍：對象、時間與地點',
  '限制：取樣與測量上的邊界',
  '重要性：對理論的貢獻',
  '重要性：對實務的應用'],
  why:'先界定範圍，再坦白限制，最後談價值，由理論到實務。'},
 tpl:{fields:[
  {id:'scope',label:'研究範圍',hint:'對象、時間、地點。',ph:'本研究對象為 2026 年就讀北部大專院校之划船校隊選手。',type:'area',min:8},
  {id:'limit',label:'預期的研究限制',hint:'取樣或測量上可預見的限制；不要把範圍或方法寫成限制。',ph:'因採方便取樣，結果推論至其他族群時須謹慎。',type:'area',min:8},
  {id:'sig',label:'研究重要性',hint:'理論一句、實務一句。',ph:'本研究可補充大專划船選手疲勞監測的證據，並提供教練調整訓練量的參考。',type:'area',min:8}],
  compose:v=>`研究範圍\n${P(v.scope)}\n\n預期之研究限制\n${P(v.limit)}\n\n研究重要性\n${P(v.sig)}`},
 checks:['範圍沒有被寫成限制','限制是真的限制，不是優點','重要性沒有誇大']}
];

/* ---------- 第二章教材：文獻探討 ---------- */
const MODS2=[
{id:'2.1',title:'文獻檢索策略',desc:'怎麼找文獻，也要寫進論文',
 focus:'搜尋要有策略：把題目拆成概念，列同義詞，用 AND／OR 組合，再用年份與類型篩選。',
 lead:'文獻搜尋不是在 Google 打一句話就好。先把研究題目拆成兩三個核心概念，每個概念列出中英文同義詞，在資料庫裡用 AND 把概念串起來、用 OR 把同義詞並列，最後記錄你的搜尋式和結果數，別人才能重做一次。',
 tip:'體育運科常用資料庫：PubMed、SPORTDiscus、Web of Science、華藝（CEPS）、臺灣博碩士論文系統。',
 judge:{prompt:'下面四個搜尋做法，哪些合理？',items:[
  {text:'把「大專划船選手睡眠與疲勞的關聯」整句貼進 PubMed 搜尋。',good:false,why:'整句搜尋會漏掉大多數文獻，要先拆成概念再組合。'},
  {text:'概念一：rowing OR rower OR 划船；概念二：sleep OR 睡眠；概念三：fatigue OR 疲勞；三組用 AND 串起來。',good:true,why:'同義詞用 OR 並列、概念用 AND 串接，是標準做法。'},
  {text:'只看前 10 筆，覺得夠了就停。',good:false,why:'沒有篩選標準，也沒有記錄，無法重現。'},
  {text:'把搜尋式、資料庫名稱、日期和結果筆數記在表格裡。',good:true,why:'可重現的搜尋紀錄，寫方法與回應審查時都用得到。'}]},
 order:{prompt:'把文獻搜尋的四個步驟排成順序。',parts:[

  '為每個概念列出中英文同義詞。',
  '在資料庫用 AND／OR 組合搜尋式，並設定年份與類型。',
  '記錄搜尋式與結果筆數，依標題和摘要初篩。'],
  why:'先拆概念、再列同義詞、再組合搜尋、最後記錄與初篩。'},
 tpl:{fields:[

  {id:'c2',label:'概念二（含同義詞）',hint:'用 OR 連接。',ph:'sleep OR sleep duration OR 睡眠',type:'text',min:4},
  {id:'c3',label:'概念三（含同義詞）',hint:'可以是結果變項。',ph:'fatigue OR training load OR 疲勞',type:'text',min:4},
  {id:'db',label:'使用的資料庫',hint:'列兩到三個。',ph:'PubMed、SPORTDiscus、華藝',type:'text',min:4},
  {id:'lim',label:'篩選條件',hint:'年份、語言、文獻類型。',ph:'2015 年以後、英文或中文、期刊論文',type:'text',min:4}],
  compose:v=>`本章文獻之檢索，係於 ${v.db} 等資料庫，以（${v.c1}）AND（${v.c2}）AND（${v.c3}）為搜尋式進行，並限制為 ${P(v.lim)}所得文獻依標題與摘要初篩後，納入本章探討。`},
 checks:['相關性：只收與題目直接相關的','新近性：有近五年的文獻','多元性：來源不只一種、不只一個作者','重要性：有代表性的經典文獻','確實性：讀過全文，不只讀摘要']},
{id:'2.2',title:'閱讀與摘要',desc:'一篇文獻抓五件事',

 tip:'主要結果要寫數字，例如「八週後實驗組 2000 公尺成績進步 3.2%，p < .05」，而不是「有顯著效果」。',
 judge:{prompt:'哪些摘要寫法對後續寫作有幫助？',items:[
  {text:'這篇研究很有趣，作者認為睡眠對運動員很重要。',good:false,why:'沒有對象、設計、數字，之後寫文獻探討時無法引用。'},
  {text:'對象為 24 名大學划船選手；以腕式活動量計記錄睡眠 4 週；睡眠不足 7 小時者次日 RPE 平均高 1.3 分（p = .02）。',good:true,why:'對象、工具、期間、結果數字都有。'},
  {text:'結論：睡眠與疲勞有關。',good:false,why:'太籠統，看不出證據強度。'},

 order:{prompt:'讀一篇實證研究時，建議的閱讀順序是？',parts:[

  '看方法：對象、設計、測量工具。',
  '看結果的數字與圖表。',
  '看討論中的限制與作者建議。'],
  why:'摘要先篩，再看方法確認可信，接著看數字，最後看限制。'},
 tpl:{fields:[
  {id:'cite',label:'文獻（作者，年份）',hint:'APA 格式。',ph:'Smith 等（2021）',type:'text',min:4},

  {id:'res',label:'主要結果（含數字）',hint:'寫出效果大小或 p 值。',ph:'睡眠不足 7 小時者次日 RPE 平均高 1.3 分（p = .02）',type:'area',min:8},
  {id:'lim',label:'限制',hint:'作者自己承認的。',ph:'樣本僅一所學校；未控制訓練量',type:'text',min:4}],
  compose:v=>`${v.cite}以${v.who}為對象，${P(v.how)}結果顯示${P(v.res)}惟該研究${P(v.lim)}`},

{id:'2.3',title:'文獻整理矩陣',desc:'把文獻排成一張表',

  {text:'把每篇的摘要整段貼進表格。',good:false,why:'整段貼上無法比較，矩陣要的是結構化的欄位。'},

  '決定固定欄位：對象、設計、變項、結果、限制、與本研究的關係。',

  {id:'gap',label:'沒人做過的組合',hint:'對象、變項或方法上的空白。',ph:'大專划船選手結合睡眠與肌肉負荷的多指標監測',type:'area',min:10}],
  compose:v=>`整理 ${v.n} 篇文獻後發現，${P(v.same)}然而，${P(v.diff)}目前尚缺乏${P(v.gap)}`},

{id:'2.4',title:'撰寫文獻評析',desc:'不是摘要堆疊，是比較與評價',

 tip:'文獻可以用三種方式組織：依時間順序（講發展史）、依取向或層面、由遠至近（一般到特定）。切忌只列表而無評析。評價句型：「這些研究雖然……但多數未……，因此……仍待釐清。」',
 judge:{prompt:'哪些段落寫法合格？',items:[
  {text:'Smith（2020）研究睡眠。Lee（2021）研究疲勞。Wang（2022）研究訓練量。',good:false,why:'只是列清單，沒有比較，也沒有評價。'},
  {text:'睡眠與疲勞的關聯在耐力項目中較為一致（Smith, 2020; Lee, 2021），但在技術性項目中結果分歧（Wang, 2022），可能與訓練負荷的測量方式不同有關。',good:true,why:'有主題、有比較、有解釋差異的原因。'},
  {text:'這些研究都很重要，對本研究很有幫助。',good:false,why:'空泛評價，沒有具體內容。'},

 order:{prompt:'文獻探討一節的架構，排成「整體—部分—整體」的順序。',parts:[

  '評論性回顧：整理與比較相關理論、工具與研究。',
  '評析：指出一致與不一致之處、對本研究的啟發。',
  '摘要：在節末總結重點，連回本研究。'],
  why:'引言破題（整體）→ 回顧與評析（部分）→ 摘要總結（整體）。'},

  {id:'topic',label:'主題句',hint:'這一段談的變項或議題。',ph:'睡眠與運動員疲勞的關聯已有相當研究。',type:'area',min:8},
  {id:'cmp',label:'比較兩篇以上文獻',hint:'一致或不一致，引用作者年份。',ph:'Smith（2020）與 Lee（2021）均發現睡眠不足者次日疲勞較高；但 Wang（2022）在技術性項目未見此關聯。',type:'area',min:15},
  {id:'eval',label:'你的評價',hint:'解釋差異或指出限制。',ph:'差異可能來自訓練負荷測量方式不同，且多數研究以菁英選手為對象。',type:'area',min:10},
  {id:'link',label:'連回本研究',hint:'所以本研究要做什麼。',ph:'大專划船選手的相關證據仍待補充。',type:'area',min:8}],
  compose:v=>`${P(v.topic)}${P(v.cmp)}${P(v.eval)}因此，${P(v.link)}`},
 checks:['有比較至少兩篇','評價有具體理由','最後一句連回本研究']},
{id:'2.5',title:'由文獻導出假設',desc:'假設要有文獻撐腰',

 lead:'第一章寫了假設，第二章要說明假設從哪裡來。文獻一致的地方給你方向（例如睡眠不足會增加疲勞），不一致或沒人做的地方給你檢驗的理由（例如在大專划船選手身上是否也成立）。每條假設後面都要能指出支持它的文獻。',
 tip:'句型：「根據……（作者，年份）的發現，本研究假設……。」',

  {text:'H1：睡眠時數較少的划船選手，賽季疲勞分數較高（依據 Smith, 2020; Lee, 2021）。',good:true,why:'方向明確，並指出支持的文獻。'},
  {text:'H1：訓練會有效果。',good:false,why:'沒有方向、沒有指標、沒有文獻。'},

  {text:'過去研究在技術性項目未見關聯（Wang, 2022），本研究將檢驗此關聯在划船這類耐力項目是否成立。',good:true,why:'從不一致的結果導出檢驗理由。'}]},
 order:{prompt:'從文獻走到假設的四步排序。',parts:[
  '整理文獻一致的發現。',
  '找出不一致或沒人做過的地方。',
  '決定本研究要檢驗哪個關係。',
  '寫成有方向的假設，並註明依據文獻。'],
  why:'一致的發現給方向，不一致給理由，再寫成假設。'},
 tpl:{fields:[
  {id:'ev',label:'文獻一致的發現',hint:'引用作者年份。',ph:'睡眠不足者次日疲勞較高（Smith, 2020; Lee, 2021）',type:'area',min:10},
  {id:'gap',label:'不一致或缺口',hint:'為什麼還需要檢驗。',ph:'技術性項目未見此關聯（Wang, 2022），划船選手證據仍少',type:'area',min:10},
  {id:'h',label:'研究假設（H1）',hint:'有方向、有指標。',ph:'H1：睡眠時數較少的大專划船選手，賽季疲勞分數顯著較高。',type:'area',min:10},
  {id:'h0',label:'統計假設（H0）',hint:'與研究假設相反、沒有方向。',ph:'H0：睡眠時數與賽季疲勞分數無關聯。',type:'area',min:8}],
  compose:v=>`根據${P(v.ev)}然而，${P(v.gap)}據此，本研究提出${P(v.h)}對應之統計假設為${P(v.h0)}`},
 checks:['假設有方向','每條假設有文獻依據','缺口與假設對得上']},
{id:'2.6',title:'APA 引註與參考文獻',desc:'引得對，查得到',

 lead:'文獻探討寫得再好，引註錯了就會被退回。講義的原則：有需要才引註，常識不引；引註要具體，不曲解原意；要分清楚哪句是誰說的、哪句是你的看法。參考文獻每一筆都要有作者、年份、題名、出處四要素，有 DOI 就加上，讓讀者查得到。',
 tip:'中文作者寫全名，英文只寫姓；兩位作者在內文用「與／and」，括號內中文用頓號、英文用 &；三位以上用「等／et al.」；第二手文獻寫「（原作者，年份，引自 第二手作者，年份）」，參考文獻只列第二手。',
 judge:{prompt:'哪些引註寫法正確？',items:[

  {text:'Smith 與 Lee（2020）指出……；（Smith & Lee, 2020）。',good:true,why:'兩位作者內文用「與」、括號用 &，兩種寫法都對。'},

  {text:'Rabbitt（1982）認為……（整篇只讀了 Lyon 等人 2014 年的轉述）。',good:false,why:'第二手文獻要寫（Rabbitt, 1982，引自 Lyon et al., 2014），參考文獻只列 Lyon。'}]},
 order:{prompt:'一筆期刊論文的參考文獻，四個要素的順序。',parts:[
  '作者：Smith, J. A., & Lee, K.',
  '年份：(2020).',
  '題名：Sleep and fatigue in collegiate rowers.',
  '出處：Journal of Sports Sciences, 38(4), 401–410. https://doi.org/10.xxxx'],
  why:'作者 → 年份 → 題名 → 出處（期刊、卷期、頁碼、DOI）。'},
 tpl:{fields:[

  {id:'yr',label:'年份',hint:'西元。',ph:'2020',type:'text',min:4},
  {id:'ti',label:'題名',hint:'期刊論文題名只有首字與專有名詞大寫。',ph:'Sleep and fatigue in collegiate rowers',type:'text',min:6},
  {id:'src',label:'出處',hint:'期刊名、卷(期)、頁碼、DOI。',ph:'Journal of Sports Sciences, 38(4), 401–410. https://doi.org/10.1080/xxxx',type:'text',min:8}],
  compose:v=>`${v.au} (${v.yr}). ${v.ti}. ${v.src}`},

/* ---------- 第三章教材：研究方法 ---------- */
const MODS3=[
{id:'3.1',title:'研究設計',desc:'選一個能回答問題的設計',
 focus:'設計由研究問題決定：問關聯用相關或觀察設計，問因果用實驗設計，問差異看有無隨機分組。',
 lead:'研究設計是整本論文的骨架。問「有沒有關聯」用橫斷或縱貫觀察設計；問「介入有沒有效」用實驗設計，最好有控制組和隨機分派；做不到隨機就是準實驗，要坦白說。設計一選錯，後面的統計再漂亮也救不回來。',
 tip:'句型：「本研究採（設計名稱），以（對象）為研究對象，於（時間）蒐集（變項）資料。」',
 judge:{prompt:'哪些設計和研究問題對得上？',items:[
  {text:'問題：睡眠時數與疲勞分數是否有關聯？設計：橫斷式觀察研究，同時測量兩變項。',good:true,why:'關聯問題用觀察設計即可。'},
  {text:'問題：八週訓練是否改善 2000 公尺成績？設計：只測一組，訓練前後各測一次。',good:false,why:'沒有控制組，無法排除成熟、練習效應等其他解釋。'},
  {text:'問題：八週訓練是否改善 2000 公尺成績？設計：隨機分成訓練組與控制組，前後測。',good:true,why:'有控制組、有隨機分派，可以談因果。'},
  {text:'問題：教練經驗如何影響訓練決策？設計：隨機對照試驗。',good:false,why:'「如何」是探索性問題，更適合質性或混合設計。'}]},
 order:{prompt:'選擇研究設計的四個步驟排序。',parts:[
  '回頭看研究問題：問關聯、差異，還是因果？',
  '判斷能不能操弄自變項、能不能隨機分派。',
  '決定設計類型：觀察、準實驗或實驗。',
  '畫出設計圖：組別、測量時間點、介入位置。'],
  why:'從問題出發，看可行性，定設計，再畫圖。'},
 tpl:{fields:[
  {id:'design',label:'設計類型',hint:'選一個。',type:'select',opts:['實驗研究（隨機分派）','準實驗研究（不等組前後測）','相關研究','調查研究','發展研究（橫斷或縱貫）','質性研究','混合方法研究'],min:2},
  {id:'why',label:'採取此設計的理由',hint:'依講義示例：目的屬於什麼問題→適合什麼方法→做不到什麼→所以採什麼。',ph:'本研究目的在探討睡眠時數與賽季疲勞的關聯，不操弄自變項，適合相關研究；為掌握賽季中的變化，採每週重複測量',type:'area',min:15},
  {id:'who',label:'研究對象',hint:'族群與人數。',ph:'北部三所大專院校划船校隊選手約 60 名',type:'text',min:6},
  {id:'when',label:'資料蒐集時間與次數',hint:'什麼時候、測幾次。',ph:'2026 年賽季期間，每週測量一次，共 12 週',type:'text',min:6},

  compose:v=>`${P(v.why)}本研究採${v.design}，以${v.who}為研究對象，於${v.when}。研究架構為：${P(v.vars)}`},
 checks:['有寫採取此設計的理由','研究架構有自變項與依變項','有說明是否有控制組與隨機分派']},
{id:'3.2',title:'參與者與取樣',desc:'找誰、找多少、怎麼找',
 focus:'交代納入與排除條件、取樣方式、樣本數估計依據，以及研究倫理。',

 tip:'G*Power 三個輸入：α = .05、檢定力 .80、效果量。效果量來源：文獻、預試，或 Cohen 慣例（t 檢定 d：.2 小／.5 中／.8 大；ANOVA f：.1／.25／.4；迴歸 f²：.02／.15／.35）。',
 judge:{prompt:'哪些寫法合格？',items:[

  {text:'找了願意參加的同學，共 30 人。',good:false,why:'沒有條件、沒有樣本數依據，也看不出取樣方式。'},
  {text:'依 Smith（2020）報告之效果量 d = 0.6，以 G*Power 估計 α = .05、檢定力 .80，兩組各需 45 人。',good:true,why:'樣本數有明確依據。'},
  {text:'本研究樣本數越多越好，所以盡量多收。',good:false,why:'沒有估計依據，無法說服審查者。'}]},

  '樣本數估計依據。',
  '研究倫理：審查核准與知情同意。'],
  why:'先說找誰，再說怎麼找、找多少，最後交代倫理。'},

  {id:'inc',label:'納入條件',hint:'誰可以參加。',ph:'大專院校划船校隊註冊選手，賽季訓練每週至少 5 次',type:'area',min:8},

  {id:'n',label:'樣本數與依據',hint:'人數和怎麼算的。',ph:'依效果量 d = 0.6、α = .05、檢定力 .80，以 G*Power 估計需 90 人',type:'area',min:8},
  {id:'irb',label:'倫理審查',hint:'機構與核准。',ph:'經○○大學研究倫理審查委員會核准，參與者簽署知情同意書',type:'text',min:6}],
  compose:v=>`研究對象之納入條件為${P(v.inc)}排除條件為${P(v.exc)}採${v.samp}，${P(v.n)}本研究${P(v.irb)}`},

{id:'3.3',title:'測量工具與信效度',desc:'每個變項都要說怎麼量',

 judge:{prompt:'哪些測量工具的描述合格？',items:[
  {text:'疲勞以 Borg CR-10 量表測量，0 到 10 分，分數越高越疲勞；該量表於運動員族群的再測信度 ICC = .89（Lee, 2021）。',good:true,why:'工具、計分、信度都有。'},
  {text:'用問卷測疲勞。',good:false,why:'沒有名稱、計分與信效度。'},
  {text:'睡眠時數以腕式活動量計（ActiGraph GT9X）記錄，每日配戴，與多頻道睡眠儀的一致性達 .85（Smith, 2020）。',good:true,why:'儀器型號、程序、效度證據齊全。'},
  {text:'量表的題目看起來都和疲勞有關，所以有建構效度。',good:false,why:'題目「看起來」相關是表面效度；建構效度要用聚斂、區辨或因素分析等證據。'}]},

  '計分方式與數值意義。',
  '信效度證據（引用文獻或預試）。'],
  why:'名稱 → 程序 → 計分 → 信效度。'},
 tpl:{fields:[
  {id:'var',label:'變項名稱',hint:'一個變項。',ph:'賽季疲勞',type:'text',min:2},
  {id:'tool',label:'工具或儀器',hint:'名稱、廠牌型號。',ph:'Borg CR-10 自覺疲勞量表',type:'text',min:4},
  {id:'proc',label:'測量程序',hint:'何時、如何施測。',ph:'每週訓練結束後 30 分鐘內填寫',type:'area',min:8},
  {id:'score',label:'計分方式',hint:'分數範圍與意義。',ph:'0 至 10 分，分數越高代表越疲勞',type:'text',min:6},
  {id:'vtype',label:'效度證據類型',hint:'選一個。',type:'select',opts:['內容效度（專家審查）','效標關聯效度（同時或預測）','建構效度（聚斂、區辨、因素分析）'],min:2},
  {id:'rel',label:'信效度證據',hint:'引用文獻或預試結果。',ph:'運動員族群再測信度 ICC = .89，與心率變異之聚斂效度 r = .62（Lee, 2021）',type:'area',min:8}],
  compose:v=>`${v.var}以${v.tool}測量，${P(v.proc)}計分方式為${P(v.score)}該工具之效度證據屬${v.vtype}，${P(v.rel)}`},
 checks:['有工具名稱','有計分方式','信度與效度證據都有']},
{id:'3.4',title:'實驗程序',desc:'讓別人可以照著做一次',
 focus:'程序要寫到別人能重做：時間軸、每次做什麼、誰施測、如何控制干擾。',
 lead:'程序是方法章最常被審查者質疑的地方。按時間順序寫：招募與同意、前測、介入或觀察期（每次做什麼、多久、誰帶）、後測、資料回收。還要說明你控制了哪些干擾，例如測量時間固定、施測者相同、避開比賽週。',

  {text:'實驗組每週三次、每次 60 分鐘肌力訓練，由同一位體能教練帶領，共八週；控制組維持原訓練。',good:true,why:'頻率、時間、帶領者、期間都清楚。'},
  {text:'選手接受一段時間的訓練後再測一次。',good:false,why:'沒有頻率、期間、內容，無法重做。'},
  {text:'前後測皆於上午 9 到 11 時、同一場地、由同一位施測者進行。',good:true,why:'說明了對干擾變項的控制。'},
  {text:'測驗時間依選手方便安排。',good:false,why:'測量條件不一致，會引入誤差。'}]},
 order:{prompt:'實驗程序的四個階段排序。',parts:[
  '招募參與者並取得知情同意。',

  '介入期或觀察期：依設計執行。',
  '後測與資料回收。'],
  why:'招募 → 前測 → 介入 → 後測。'},
 tpl:{fields:[

  {id:'int',label:'介入或觀察期',hint:'頻率、內容、期間、帶領者。',ph:'實驗組每週三次、每次 60 分鐘肌力訓練，由同一位體能教練帶領，共八週；控制組維持原訓練',type:'area',min:15},
  {id:'post',label:'後測',hint:'何時、測什麼。',ph:'介入結束後一週內，以相同程序測量',type:'area',min:8},

{id:'3.5',title:'資料處理與統計',desc:'每個假設配一個統計方法',

 lead:'統計方法不是越複雜越好，而是要對得上假設和資料型態。先說資料如何清理（遺漏值、極端值、常態檢定），再把每條假設配上一個方法：關聯用相關或迴歸，兩組差異用 t 檢定，兩組以上用 ANOVA，前後測加組別用混合設計 ANOVA。最後寫顯著水準、效果量指標和軟體版本。',
 tip:'尺度決定方法：名目／序位用卡方或無母數，等距／等比用 t、ANOVA、相關、迴歸。效果量要報：r、Cohen d、η²。α = .05 是型一誤差上限，檢定力 .80 是控制型二誤差。',
 judge:{prompt:'哪些統計方法選得對？',items:[
  {text:'H1 問睡眠時數與疲勞分數是否有關聯：採 Pearson 積差相關。',good:true,why:'兩個連續變項的關聯，相關分析正確。'},
  {text:'H2 問訓練組與控制組八週後成績差異：採 Pearson 相關。',good:false,why:'組間差異應用獨立樣本 t 檢定或共變數分析。'},
  {text:'H2 問訓練組與控制組八週後成績差異，並控制前測：採共變數分析（ANCOVA）。',good:true,why:'控制前測差異，ANCOVA 合適。'},
  {text:'三組 ANOVA 達顯著，就可以說 A 組優於 B 組和 C 組。',good:false,why:'ANOVA 只說平均數不全相等，哪兩組不同要做事後檢定（Tukey、Bonferroni 等）。'}]},
 order:{prompt:'選擇統計方法的四個步驟排序。',parts:[
  '判斷變項的尺度：名目、序位、等距或等比。',
  '分清自變項與依變項，數組別與測量次數。',
  '依尺度與設計選方法：相關、t 檢定、ANOVA 或迴歸。',
  '檢查前提假設（assumptions）：常態性、變異數同質性、獨立性；不符則改無母數方法。'],
  why:'尺度 → 自依變項 → 方法 → 假設檢查。'},
 tpl:{fields:[
  {id:'clean',label:'資料清理',hint:'遺漏值與極端值怎麼處理。',ph:'遺漏值以配對刪除處理；以 Shapiro-Wilk 檢定常態性',type:'area',min:8},
  {id:'h1',label:'假設一 → 統計方法',hint:'假設與方法。',ph:'H1 睡眠時數與疲勞分數之關聯，採 Pearson 積差相關',type:'area',min:10},
  {id:'h2',label:'假設二 → 統計方法',hint:'可留空寫「無」。',ph:'H2 兩組後測成績差異，以前測為共變項採 ANCOVA',type:'area',min:1},
  {id:'alpha',label:'顯著水準與效果量',hint:'α 與效果量指標。',ph:'α = .05；效果量以 r 與 partial η² 呈現',type:'text',min:6},
  {id:'sw',label:'統計軟體',hint:'名稱與版本。',ph:'SPSS 29.0',type:'text',min:2}],
  compose:v=>`資料處理方面，${P(v.clean)}推論統計部分，${P(v.h1)}${v.h2&&v.h2!=='無'&&v.h2!=='＿＿'?P(v.h2):''}顯著水準設為 ${P(v.alpha)}所有分析以 ${v.sw} 進行。`},
 checks:['每條假設都有對應方法','有寫效果量','方法與資料型態相符']},
{id:'3.6',title:'研究倫理與 IRB 送審',desc:'先保護參與者，再談資料',

  {text:'為了讓選手自然表現，不告訴他們正在被研究，資料收完也不說明。',good:false,why:'隱匿研究只有在確有必要且無替代方法時才可行，且事後必須告知並澄清。'},

const MODS4=[
{id:'4.1',title:'描述性統計',desc:'先讓讀者認識你的樣本',
 focus:'先報樣本特性，再報各變項的平均數、標準差或次數分配，數字要和表格一致。',
 lead:'結果章的第一段是描述性統計：有效樣本幾人、流失幾人、基本資料（年齡、訓練年資、性別比例），接著是每個主要變項的平均數與標準差。文字只講重點，細節放表格，而且文字裡的數字要和表格完全一致。',

 lead:'限制是做完研究之後才看得清楚的，講義把它分成四種：事先注意到並照預擬策略處理了；注意到但處理得不完整；沒注意到但臨場補救了；沒注意到也沒補救。注意：研究範圍和研究方法是你自己選的，不能列為限制。限制不是自我批評，而是幫讀者判斷結果能推到哪裡。每個限制寫三件事：是什麼、對結果有什麼影響、怎麼減輕了（如果有）。未來研究不要只寫「增加樣本」，要針對每個限制給一個具體方向，例如延長介入期、加入生理指標、用隨機分派。',

 lead:'摘要是論文的濃縮，多數讀者只讀這裡。講義建議用結構式：研究目的或問題、方法、參與者、主要結果、結論與意涵。不要重複題目，不要用「本研究提供學術與實務建議」這種沒有資訊的樣板句。英文摘要用動詞、主動語氣、第三人稱；目的與方法用過去式，可持續應用的結論用現在式。',

const PLAN=[

 {n:3,name:'研究方法',mods:[['3.1','研究設計'],['3.2','參與者與取樣'],['3.3','測量工具與信效度'],['3.4','實驗程序'],['3.5','資料處理與統計']]},

];
const CHAPTERS={1:MODS,2:(typeof MODS2!=='undefined'?MODS2:null),3:(typeof MODS3!=='undefined'?MODS3:null),4:(typeof MODS4!=='undefined'?MODS4:null),5:(typeof MODS5!=='undefined'?MODS5:null)};
const CH=[{n:1,name:'緒論',open:true,mods:MODS}].concat(PLAN.map(c=>CHAPTERS[c.n]?{n:c.n,name:c.name,open:true,mods:CHAPTERS[c.n]}:{n:c.n,name:c.name,open:false,mods:c.mods.map(m=>({id:m[0],title:m[1]}))}));
const ALLMODS=CH.filter(c=>c.open).flatMap(c=>c.mods);
const chOf=m=>CH.find(c=>c.mods.includes(m));
const NUM=['','一','二','三','四','五'];

/* 每個單元的片段會進論文的哪裡 */

async function saveFile(name,data,type){
  if(dlNS){try{await dlNS.save({filename:name,data});return true}catch(err){if(err&&err.code==='declined')return false}}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return true}
  catch(e){toast('這個畫面無法下載，請按「複製全文」後貼到 Word');return false}}

function buildThesisDocx(D){
  const {Document,Packer,Paragraph,TextRun,HeadingLevel,AlignmentType,PageBreak,TableOfContents,Footer,PageNumber,NumberFormat,SectionType}=D;
  const T=thesisParts();
  const F={font:{ascii:'Times New Roman',hAnsi:'Times New Roman',eastAsia:'標楷體'}};
  const run=(t,o={})=>new TextRun({text:t,size:24,...F,...o});
  const para=(t,o={})=>new Paragraph({children:[run(t,o.run||{})],alignment:o.align||AlignmentType.JUSTIFIED,spacing:{line:480,after:0},indent:o.indent||{firstLine:480},...(o.p||{})});
  const center=(t,size=24,bold=false,after=240)=>new Paragraph({children:[run(t,{size,bold})],alignment:AlignmentType.CENTER,spacing:{after,line:480}});
  const h1=(t)=>new Paragraph({heading:HeadingLevel.HEADING_1,children:[run(t,{size:36,bold:true})],alignment:AlignmentType.CENTER,spacing:{before:0,after:480,line:480},pageBreakBefore:true});
  const h2=(t)=>new Paragraph({heading:HeadingLevel.HEADING_2,children:[run(t,{size:28,bold:true})],spacing:{before:360,after:240,line:480}});
  const h0=(t)=>new Paragraph({heading:HeadingLevel.HEADING_1,children:[run(t,{size:36,bold:true})],alignment:AlignmentType.CENTER,spacing:{after:480,line:480}});
  const br=()=>new Paragraph({children:[new PageBreak()]});
  const body=t=>String(t).split('\n').filter(x=>x.trim()).map(x=>para(x));
  // 封面
  const cover=[
    center(META.school,32,true,120),center(META.dept,32,true,120),center(META.degree,32,true,1800),
    center(T.title,36,true,2400),
    center(`研究生：${META.student||'＿＿＿'}`,28,false,120),center(`指導教授：${META.advisor||'＿＿＿'}`,28,false,1800),
    center(META.date||'中華民國＿＿年＿＿月',28,false,0)];
  // 摘要
  const abstract=[h0('摘要')].concat(T.abs?body(T.abs.text).concat([new Paragraph({children:[run('關鍵字：'+T.abs.kw,{bold:true})],spacing:{before:480,line:480}})]):[para('（摘要尚未完成）')]);
  // 目錄

  const chapters=[];
  T.chapters.forEach(c=>{
    chapters.push(h1(`第${CNUM[c.n]}章　${c.name}`));
    c.secs.forEach(s=>{chapters.push(h2(`第${CNUM[s.no]}節　${s.title}`));chapters.push(...body(s.text))});
  });
  // 參考文獻
  const refs=[h1('參考文獻')].concat(T.refs.length?T.refs.map(r=>new Paragraph({children:[run(r)],spacing:{line:480,after:120},indent:{left:720,hanging:720}})):[para('（參考文獻尚未完成）')]);
  const footer=new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({children:[PageNumber.CURRENT],size:20,...F})]})]});
  const page={size:{width:11906,height:16838},margin:{top:1440,bottom:1440,left:1701,right:1701}};
  return new Document({
    creator:'論文五章工作坊',title:T.title,
    features:{updateFields:true},
    styles:{default:{document:{run:{size:24,...F}}},
      paragraphStyles:[
        {id:'Heading1',name:'Heading 1',basedOn:'Normal',next:'Normal',quickFormat:true,run:{size:36,bold:true,...F},paragraph:{alignment:AlignmentType.CENTER,spacing:{after:480,line:480}}},
        {id:'Heading2',name:'Heading 2',basedOn:'Normal',next:'Normal',quickFormat:true,run:{size:28,bold:true,...F},paragraph:{spacing:{before:360,after:240,line:480}}}]},
    sections:[
      {properties:{page,titlePage:false},children:cover},
      {properties:{page,pageNumbers:{start:1,formatType:NumberFormat.LOWER_ROMAN}},footers:{default:footer},children:abstract.concat([br()],toc)},
      {properties:{page,pageNumbers:{start:1,formatType:NumberFormat.DECIMAL}},footers:{default:footer},children:chapters.concat(refs)}
    ]});
}

${chain}

const ST={};
ST.lgamma=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)};
ST.betacf=(a,b,x)=>{const FP=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FP)d=FP;d=1/d;let h=d;
  for(let m=1;m<=400;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-14)break}
  return h};
ST.ibeta=(x,a,b)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(ST.lgamma(a+b)-ST.lgamma(a)-ST.lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*ST.betacf(a,b,x)/a:1-bt*ST.betacf(b,a,1-x)/b};
ST.fcdf=(f,d1,d2)=>f<=0?0:ST.ibeta(d1*f/(d1*f+d2),d1/2,d2/2);
ST.finv=(p,d1,d2)=>{let lo=0,hi=1;while(ST.fcdf(hi,d1,d2)<p)hi*=2;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(ST.fcdf(m,d1,d2)<p)lo=m;else hi=m}return (lo+hi)/2};
ST.ncfSurv=(c,d1,d2,lam)=>{const y=d1*c/(d1*c+d2),h=lam/2;let s=0,lp=-h;const jmax=Math.ceil(h+12*Math.sqrt(h)+60);
  for(let j=0;j<=jmax;j++){if(j>0)lp+=Math.log(h)-Math.log(j);const w=Math.exp(lp);if(w>0)s+=w*(1-ST.ibeta(y,d1/2+j,d2/2))}return s};
ST.qnorm=p=>{const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
  b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
  c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
  d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416],pl=.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)};
ST.power=(t,n,o)=>{const a=o.alpha;let d1,d2,lam;
  if(t==='ind'){d1=1;d2=2*n-2;lam=o.es*o.es*n/2}
  else if(t==='pair'){d1=1;d2=n-1;lam=o.es*o.es*n}
  else if(t==='anova'){d1=o.k-1;d2=n-o.k;lam=o.es*o.es*n}
  else if(t==='reg'){d1=o.u;d2=n-o.u-1;lam=o.es*n}
  if(!(d2>=1))return 0;return ST.ncfSurv(ST.finv(1-a,d1,d2),d1,d2,lam)};
ST.solve=(t,o)=>{
  if(t==='cor'){const C=.5*Math.log((1+o.es)/(1-o.es));const z=ST.qnorm(1-o.alpha/2)+ST.qnorm(o.pw);return {n:Math.ceil((z/C)**2+3),approx:true}}
  const lo0={ind:2,pair:2,anova:o.k+1,reg:o.u+2}[t];if(ST.power(t,lo0,o)>=o.pw){const n0=t==='anova'?Math.ceil(lo0/o.k)*o.k:lo0;return {n:n0,pw:ST.power(t,n0,o)}}
  let lo=lo0,hi=lo0*2;while(ST.power(t,hi,o)<o.pw){lo=hi;hi*=2;if(hi>4e5)return null}
  while(hi-lo>1){const m=Math.floor((lo+hi)/2);if(ST.power(t,m,o)>=o.pw)hi=m;else lo=m}
  if(t==='anova')hi=Math.ceil(hi/o.k)*o.k;
  return {n:hi,pw:ST.power(t,hi,o)}};
const PWT={ind:['獨立樣本 t 檢定（兩組比較）','d','d：.2 小、.5 中、.8 大'],pair:['相依樣本 t 檢定（前後測）','dz','dz：.2 小、.5 中、.8 大'],
  anova:['單因子變異數分析','f','f：.10 小、.25 中、.40 大'],reg:['多元迴歸','f²','f²：.02 小、.15 中、.35 大'],cor:['Pearson 相關','r','r：.1 小、.3 中、.5 大']};
const PWD={t:'ind',es:'0.5',alpha:'0.05',pw:'0.80',k:'3',u:'4'};
const pwState=()=>Object.assign({},PWD,S.pw||{});
function powerCalc(){
  const p=pwState(),o={es:+p.es,alpha:+p.alpha,pw:+p.pw,k:Math.round(+p.k),u:Math.round(+p.u)};
  if(!(o.es>0)||(p.t==='cor'&&o.es>=1))return {err:'請輸入大於 0 的效果量（相關 r 要小於 1）。'};
  if(p.t==='anova'&&!(o.k>=2))return {err:'組數至少 2。'};
  if(p.t==='reg'&&!(o.u>=1))return {err:'預測變項至少 1 個。'};
  const r=ST.solve(p.t,o);if(!r)return {err:'效果量太小，需要的人數超過 40 萬，請重新設定。'};
  const total=p.t==='ind'?r.n*2:r.n,recruit=Math.ceil(total*1.1);
  const per=p.t==='ind'?`每組需 ${r.n} 人，共 ${total} 人`:p.t==='anova'?`共需 ${total} 人（每組約 ${Math.ceil(total/o.k)} 人）`:`共需 ${total} 人`;
  const sentence=`本研究以檢定力分析估計樣本數：採${PWT[p.t][0].replace(/（.*）/,'')}，預期效果量 ${PWT[p.t][1]} = ${p.es}${p.t==='anova'?`、組數 ${o.k}`:p.t==='reg'?`、預測變項 ${o.u} 個`:''}，α = ${p.alpha}，檢定力 = ${p.pw}，估計${per}；考量約一成流失，預計招募 ${recruit} 人。`;
  return {per,total,recruit,sentence,approx:r.approx,pw:r.pw};
}

/* ========== 工具二：統計方法選擇精靈 ========== */
const CHQ={
 q:[['rel','兩個變項之間有沒有關聯'],['pred','用一個或多個變項預測一個結果'],['diff','不同組別之間有沒有差異'],['rep','同一群人測量兩次以上，有沒有改變'],['mix','實驗組與控制組都做前後測']],
 scale:[['con','連續數值（等距、等比：秒數、分數、公分）'],['ord','序位（名次、等級）'],['cat','類別（是否、組別、性別）']],
 k:[['2','兩組（或兩次）'],['3','三組以上（或三次以上）']],
 norm:[['y','近似常態，或每組 30 人以上'],['n','明顯偏態且樣本小']]};
const choState=()=>Object.assign({q:'',scale:'',k:'',norm:''},S.cho||{});
function choNeed(c){const need=['q','scale'];if(c.q==='diff'||c.q==='rep')need.push('k');
  if(c.scale==='con'&&['rel','diff','rep'].includes(c.q))need.push('norm');return need}
function choResult(c){
  const np=c.scale!=='con'||c.norm==='n';
  if(c.q==='rel'){if(c.scale==='cat')return ['卡方獨立性檢定','Cramér\'s V','每格期望次數至少 5'];
    return np?['Spearman 等級相關','ρ','序位資料或非常態時使用']:['Pearson 積差相關','r','兩變項近似常態、呈線性、無極端值；報 r 與 r²'];}
  if(c.q==='pred'){return c.scale==='cat'?['邏輯斯迴歸','勝算比 OR 與 95% CI','結果為二分類；檢查共線性']:['多元迴歸分析','R²、f²、標準化係數 β','殘差常態、變異數同質、共線性（VIF < 10）'];}
  if(c.q==='diff'){if(c.scale==='cat')return ['卡方同質性檢定','Cramér\'s V','每格期望次數至少 5'];
    if(c.k==='2')return np?['Mann-Whitney U 檢定','r = Z / √N','兩獨立組、非常態或序位']:['獨立樣本 t 檢定','Cohen d','Levene 變異數同質性檢定；不同質時用 Welch t'];
    return np?['Kruskal-Wallis 檢定，顯著後做兩兩比較（Bonferroni 校正）','ε²','三組以上、非常態或序位']:['單因子變異數分析（ANOVA），顯著後以 Tukey 或 Bonferroni 事後比較','η²','常態、變異數同質；不同質時用 Welch ANOVA 與 Games-Howell'];}
  if(c.q==='rep'){if(c.scale==='cat')return c.k==='2'?['McNemar 檢定','勝算比','同一群人前後兩次的二分類結果']:['Cochran Q 檢定','Kendall W','同一群人三次以上的二分類結果'];
    if(c.k==='2')return np?['Wilcoxon 符號等級檢定','r = Z / √N','前後差值非常態']:['相依樣本 t 檢定','Cohen dz','前後差值近似常態'];
    return np?['Friedman 檢定','Kendall W','三次以上、非常態']:['重複量數變異數分析','partial η²','球形檢定（Mauchly）；違反時用 Greenhouse-Geisser 校正'];}
  if(c.q==='mix'){return c.scale==='con'?['二因子混合設計變異數分析（組別 × 時間），或以前測為共變項之共變數分析（ANCOVA）','partial η²','看交互作用；ANCOVA 須檢查迴歸斜率同質']
    :['以改變量（後測 − 前測）做 Mann-Whitney U 檢定','r = Z / √N','序位或類別結果的前後測比較'];}
  return null;
}
function choHTML(){const c=choState(),need=choNeed(c);
  const block=(k,lab)=>need.includes(k)||c[k]?`<div class="field"><label>${lab}</label><div class="opts">${CHQ[k].map(([v,l])=>`<button class="chipbtn ${c[k]===v?'on':''}" data-act="cho" data-k="${k}" data-v="${v}">${esc(l)}</button>`).join('')}</div></div>`:'';
  const ready=need.every(k=>c[k]);const r=ready?choResult(c):null;
  return `<div class="tool" id="tool-cho"><h3>統計方法選擇精靈</h3><p class="note">對應講義〈統計方法選擇〉：先看研究問題，再看依變項尺度、組數與分配。</p>
  ${block('q','1. 你的研究問題是哪一種？')}${c.q?block('scale','2. 依變項（結果）是什麼尺度？'):''}
  ${c.scale&&need.includes('k')?block('k','3. 有幾組（或測幾次）？'):''}${c.scale&&need.includes('norm')?block('norm',`${need.includes('k')?'4':'3'}. 資料分配如何？`):''}
  ${r?`<div class="result"><div class="big">${esc(r[0])}</div><p>效果量：${esc(r[1])}</p><p class="note">要檢查：${esc(r[2])}</p>
  <div class="btnrow"><button class="btn pri" data-act="chofill" data-v="${esc(r[0])}">帶入下方「假設一 → 統計方法」</button><button class="link" data-act="choreset">重新選</button></div></div>`:''}</div>`}

const APD={type:'j',lang:'zh',au:'',yr:'',ti:'',jn:'',vol:'',iss:'',pg:'',doi:'',ed:'',pub:'',deg:'碩士論文',sch:'',db:'臺灣博碩士論文知識加值系統',url:'',site:'',date:''};
const apState=()=>Object.assign({},APD,S.ap||{});
const APF={j:[['au','作者'],['yr','年份'],['ti','題名'],['jn','期刊名稱'],['vol','卷'],['iss','期'],['pg','頁碼'],['doi','DOI（可省略 https://doi.org/）']],
  b:[['au','作者'],['yr','年份'],['ti','書名'],['ed','版次（可空白）'],['pub','出版社'],['doi','DOI 或網址（可空白）']],
  t:[['au','作者'],['yr','年份'],['ti','論文名稱'],['deg','學位'],['sch','學校'],['db','資料庫'],['url','網址（handle 或 DOI）']],
  w:[['au','作者或機構'],['yr','年份'],['date','月日（可空白）'],['ti','網頁標題'],['site','網站名稱'],['url','網址']]};
const APH={zh:{au:'中文寫全名，多位作者用頓號：聶喬齡、徐碧昭、李炳昭'},en:{au:'Last, F. M., Last, F. M., & Last, F. M.'}};
function apaFmt(a){const zh=a.lang==='zh',T=s=>String(s||'').trim();const au=T(a.au),yr=T(a.yr)||(zh?'無日期':'n.d.');
  const d=T(a.doi),doi=d?(/^https?:/.test(d)?d:'https://doi.org/'+d):'';
  const join=(parts,sep)=>parts.filter(Boolean).join(sep);
  if(zh){
    if(a.type==='j')return `${au}（${yr}）。${T(a.ti)}。${join([T(a.jn),T(a.vol)?T(a.vol)+(T(a.iss)?`（${T(a.iss)}）`:''):'',T(a.pg)],'，')}。${doi}`.trim();
    if(a.type==='b')return `${au}（${yr}）。${T(a.ti)}${T(a.ed)?`（${T(a.ed)}）`:''}。${T(a.pub)}。${doi}`.trim();
    if(a.type==='t')return `${au}（${yr}）。${T(a.ti)}〔${join([T(a.deg),T(a.sch)],'，')}〕。${T(a.db)?T(a.db)+'。':''}${T(a.url)}`.trim();
    return `${au}（${yr}${T(a.date)?'，'+T(a.date):''}）。${T(a.ti)}。${T(a.site)?T(a.site)+'。':''}${T(a.url)}`.trim();
  }
  if(a.type==='j')return `${au} (${yr}). ${T(a.ti)}. ${join([T(a.jn),T(a.vol)?T(a.vol)+(T(a.iss)?`(${T(a.iss)})`:''):'',T(a.pg)],', ')}. ${doi}`.trim();
  if(a.type==='b')return `${au} (${yr}). ${T(a.ti)}${T(a.ed)?` (${T(a.ed)})`:''}. ${T(a.pub)}. ${doi}`.trim();
  if(a.type==='t')return `${au} (${yr}). ${T(a.ti)} [${join([T(a.deg),T(a.sch)],', ')}]. ${T(a.db)?T(a.db)+'. ':''}${T(a.url)}`.trim();
  return `${au} (${yr}${T(a.date)?', '+T(a.date):''}). ${T(a.ti)}. ${T(a.site)?T(a.site)+'. ':''}${T(a.url)}`.trim();
}

'1.5':{src:'第十五章 研究結果與討論敘寫；緒論敘寫',pts:[
 '研究範圍（delimitation）：研究者考量目的、興趣、能力與資源後設定的邊界，包括參與者、時間、地點或情境、研究內容。',
 '研究範圍與研究方法是研究者自己選的，不能列為研究限制。',
 '研究限制（limitation）：威脅研究品質、未處理或未完全處理的因素，限制了結果的解釋與應用。',
 '真正的限制通常要做完研究才知道；計畫階段只寫「預期的限制」，論文第五章再寫實際遇到的限制。',
 '研究重要性：對個人、他人、理論或實務方法發展的貢獻，例如提供新的證據或方法。']},
'2.1':{src:'文獻探討敘寫',pts:[
 '文獻依來源分為初級來源（學者提出的原始研究）與次級來源（分析彙整後的綜合資料），以初級來源為主。',
 '敘寫範圍五原則：相關性、新近性、多元性、重要性、確實性。',
 '相關性：熱門題目只收直接相關的；過去很少被探討的題目，可擴大到間接相關的文獻。',
 '新近性：一定要包含最新文獻；文獻太多時，可限定一段期間並說明是哪一段。',
 '多元性：博士論文、期刊、會議論文、研究報告都要有，不要只引同一個人。',
 '確實性：來源不明、數字有疑、論點不完整或無助於論述的文獻不引；讀全文，不要只讀摘要或網路上不完整的資料。']},
'2.2':{src:'文獻探討敘寫',pts:[
 '讀完文獻，先依 APA 格式列成參考文獻，再做摘要。',
 '實證研究的摘要包括：研究目的與問題、研究取向與方法、研究結果。',
 '採批判性閱讀：不只表面描述，還要比較與評析。',
 '優先引用第一手、正式出版的文獻；不得已引用第二手時要註明「引自」。'],
 ex:{t:'一篇文獻的摘要句（真實論文，見第三章的論文評析）',segs:[['文獻','Hatzigeorgiadis 等（2014）'],['對象','以 41 名青少年游泳選手為對象，'],['設計','在相隔十週的兩場正式比賽之間，讓介入組接受自我對話訓練，'],['結果','結果介入組的成績進步幅度大於控制組。']]}},
'2.3':{src:'文獻探討敘寫',pts:[
 '評析文獻：依探討的主題或採取的方法分類，分類後做摘要與評論。',
 '評論的面向：研究變項與研究方法是否適切、研究結果是否精確並合乎邏輯。',
 '比較不同文獻的觀點；主題有爭論時，要釐清差異在哪裡、從哪裡來。',
 '整合所有文獻的結果，發展執行本研究的概念脈絡。',
 '文獻探討不能只列表而沒有評析：矩陣是整理工具，不是成品。']},
'2.4':{src:'文獻探討敘寫',pts:[
 '文獻探討的架構：引言（說明範圍，給讀者導覽圖）、評論性回顧（背景、相關理論、實務做法與研究）、摘要（節末總結）。也就是「整體—部分—整體」。',
 '組織文獻的三種方式：依時間順序（適合講議題的發展史）、依不同取向或層面、由遠至近（從一般議題到特定議題）。',
 '每一節的標題清楚明確，並與內文一致。',
 '評析文獻時只提到對本研究的啟發，詳細作法留到第三章，避免重複。',
 '段落排列有邏輯、前後連貫、層次分明，不要跳得太快。'],
 ex:{t:'一個評析段落（範例中的研究結果為示意）',segs:[['主題句','睡眠與運動員疲勞的關聯已累積相當研究。'],['比較','耐力項目的研究多發現睡眠不足者次日疲勞較高，技術性項目的結果則較分歧。'],['評價','差異可能來自訓練負荷的測量方式不同，且多數研究以菁英選手為對象。'],['連回本研究','大專划船選手的證據因此仍待補充。']]}},
'2.5':{src:'研究方法與緒論（論文架構：第二章）',pts:[
 '文獻考查的另一個功能，是建立理論架構，並對研究問題提出假設。',
 '流程：一般性考查 → 判斷有無理論架構 → 綜合整理 → 提出理論架構及假設。',
 '研究假設：研究者根據理論與過去研究預期的結果，有方向。例：戰繩運動訓練組的下肢運動表現優於對照組。',
 '統計假設：與研究者預期相反的假設，通常沒有方向。例：下肢表現分數不因訓練模式不同而有差異。']},
'2.6':{src:'文獻探討敘寫；第十七章 參考文獻',pts:[
 '有需要才引註，常識不必引註。',
 '引註要具體：統計數據或實證研究，要交代是哪一段期間、針對什麼對象。',
 '不曲解原意；分清楚哪些是某位作者的論點、哪些是自己的看法。',
 '直接節錄要加頁碼；第二手文獻寫「（原作者，年份，引自 第二手作者，年份）」，參考文獻只列第二手。',
 '參考文獻四要素：作者、日期、名稱、出處；有 DOI 要列在最後。',
 '排序：中文依作者姓名筆畫，英文依姓氏字母；同一作者依年代先後；同作者同年加 a、b、c。']},
'3.1':{src:'第十三章 量化研究設計與撰寫；量化研究類型；研究方法與緒論',pts:[
 '選擇什麼方法，由研究目的與研究問題決定。',
 '寫法：說明採取的方法與理由 → 這個方法的優點如何符合目的 → 可能遭遇的問題與克服方式 → 研究架構（自變項、依變項）。',
 '實驗研究三要件：組別比較、操弄自變項、隨機分派（隨機取樣影響的是能推論到多大範圍）；準實驗研究有操弄，但無法隨機分派個人。',
 '相關研究探討變項間的關聯或預測，無法回答因果問題。',
 '調查研究適合描述性、常模性與差異性問題，無法回答因果；要說明調查方式、時間、問卷發放與回收方式。',
 '研究層次：第一層探索與敘述，第二層比較與相關，第三層實驗設計驗證因果。'],
 ex:{t:'採取方法與理由（仿講義示例 13-1 的推理）',segs:[['目的的性質','本研究旨在推論戰繩訓練對下肢表現的因果影響，'],['適合的方法','適合採實驗研究；'],['遇到的限制','但無法隨機分派個別學生，只能以班級為單位分組，'],['採取的設計','故採不等組前後測準實驗設計。']]}},
'3.2':{src:'量化研究類型；樣本數計算',pts:[
 '母群：符合特定標準、研究者想把結果推論過去的對象；樣本：依取樣架構從母群選出的一群人。',
 '交代取樣方式：隨機、分層、立意或方便取樣。',
 '樣本數依據：G*Power 輸入 α（通常 .05）、檢定力（通常 .80）與效果量。',
 '效果量的來源：文獻、預試，或 Cohen（1988）的慣例：迴歸 f² .02／.15／.35，ANOVA f .10／.25／.40，t 檢定 d .2／.5／.8（小／中／大）。',
 '寫法：引用前人研究的效果量，說明以 G*Power 估計需要多少人，考量流失再多招募一些。',
 '相關研究的樣本分佈範圍不能太窄，否則失去代表性，也會低估相關。']},
'3.3':{src:'第九週 效度；第九週 信度；第九週 問卷設計',pts:[
 '效度：測驗是否測到它想測的東西。1999 年 AERA、APA、NCME 的標準把效度看成「對分數推論的證據」。',
 '三類效度證據：內容（是否完整涵蓋要測的領域，靠專家判斷）、效標關聯（同時效度、預測效度）、建構（聚斂效度、區辨效度）。',
 '表面效度只是「看起來像在測這件事」，不是有力的證據。',
 '實驗研究另外要談內在效度（排除選擇偏誤、歷史、迴歸等干擾）與外在效度（能否推論到母群與真實情境）。',
 '信度是測量的一致性，常見 Cronbach α、再測信度與評分者一致性。']},
'3.4':{src:'第十三章 量化研究設計與撰寫',pts:[
 '實驗處理（介入方案）可以寫在研究方法裡，也可以另立一節。',
 '有控制組時，要說明控制組在介入期間接受什麼安排。',
 '有對照組（接受另一種方案）時，要清楚說明兩種方案差在哪裡。',
 '研究過程（研究步驟、程序、流程）要寫到別人能照著重做一次。']},
'3.5':{src:'第七週 統計方法選擇',pts:[
 '先判斷尺度：名目（只代表類別）、序位（排序有意義）、等距（差距有意義）、等比（0 代表沒有）。',
 '分清自變項（可能影響者、實驗中操弄的變項）與依變項（因自變項改變而改變的變項）。',
 '兩獨立組比平均用獨立樣本 t 檢定；同一群人前後測用相依樣本 t 檢定；三組以上用 ANOVA，顯著後做事後檢定（LSD、Tukey、Bonferroni、Scheffé 等）。',
 't 檢定與 ANOVA 的假設：獨立、常態、變異數同質，但這些方法相當穩健。',
 '型一誤差：H0 為真卻拒絕它（α）；型二誤差：H0 為假卻沒有拒絕（β）；檢定力 = 1 − β。']},
'3.6':{src:'第二週 研究倫理',pts:[
 '研究倫理是進行研究時必須遵守的行為規範；赫爾辛基宣言提出設置機構審查委員會（IRB），國內依《人體研究法》辦理。',
 '對參與者的四項守則：誠實且尊重、尊重隱私並匿名保密、讓參與者受惠並避免傷害、取得知情同意。',
 '知情同意的三要素：知識、自主、能力；未成年人或受監護宣告者須由法定代理人同意。',
 '參與者可以在任何時間、不需理由、無條件退出，且不必擔心任何影響。',
 '隱匿研究只在確有價值且沒有其他同等有效的方法時可行；資料蒐集完要告知目的並澄清疑問。',
 '匿名：隱藏可辨識身分的人名、地名、機關名；保密：不把參與者說的話告訴別人。']},
'4.1':{src:'第十五章 研究結果與討論敘寫；Streiner（2007）導讀',pts:[
 '結果針對研究目的與問題來寫，正確報導統計資料。',
 '統計報表上的科學記號（例如 1.573E-2）要轉成讀者看得懂的形式。',
 '百分比要附原始人數，否則會誤導：同樣 500 人，占 1,000 人和占 20,000 人意義完全不同。',
 '小數位數不要超過測量的精度：年齡問到歲，報到小數一位已經足夠。']},
'4.2':{src:'第十五章 研究結果與討論敘寫；Streiner（2007）導讀',pts:[
 '量化結果通常先用表呈現統計資料，再用文字解釋它代表的意義。',
 '一張表只回答一個問題。',
 'APA 格式：表的編號與標題在表上方，註解在表下方；圖要有軸標籤與單位。',
 '報告的精確度要和資料能支撐的程度相符。']},
'4.3':{src:'第十五章 研究結果與討論敘寫；Streiner（2007）導讀',pts:[
 '逐一針對每條假設報告，檢視是否接受對立假設；不顯著的結果也不能忽略。',
 'p 值不會是 0，SPSS 顯示 .000 要寫成 p < .001。',
 't 值的正負只代表哪一組減哪一組，本身沒有意義；方向要看平均數。',
 'ANOVA 顯著只代表平均數不全相等，要做事後比較才知道哪幾組不同。',
 '以資料為基礎做合理推論，不呈現資料不允許的部分。'],
 ex:{t:'一段推論統計報告（數字為示意）',segs:[['假設','H1 睡眠時數與疲勞分數之關聯'],['方法','以 Pearson 積差相關檢驗，'],['統計量','r(56) = −.42, p = .001，'],['方向與大小','呈中度負相關，睡眠越少疲勞越高，'],['結論','H1 獲得支持。']]}},
'4.4':{src:'Streiner（2007）A shortcut to rejection 導讀',pts:[
 '統計檢定值和 p 值都不能說明臨床或實務上的重要性。',
 '型三錯誤：用錯誤的理由得到正確的結論。',
 '檢驗不相關的假設：信度或效度係數「顯著不為零」沒有意義，要看它是否超過可接受的值，或看信賴區間下限有沒有超過那個值。',
 '報告效果量與信賴區間，讓讀者判斷效果的大小與估計的精確度。']},
'4.5':{src:'第十五章 研究結果與討論敘寫',pts:[
 '常見錯誤推理：同語反覆（用定義解釋自己）、模糊歸因（歸於命運等無法驗證的因素）、生態謬誤、化約主義與過度推論。',
 '把相關、事後回溯或調查研究的結果誤解成因果關係。',
 '沒有控制或解釋干擾變項對結果的影響。',
 '只報導支持自己觀點的資料（選擇性報導），或在單一脈絡中過度簡化複雜現象。',
 '訴諸錯誤的權威；用「非 A 即 B」否定對立解釋來支持自己。',
 '講義的例子：只調查一年級 200 人中 8 人不喜歡新教材，就說全校多數學生喜歡，這是過度推論。']},
'5.1':{src:'第十五章 研究結果與討論敘寫',pts:[
 '只有研究結果、沒有討論，是「貧血」的研究。',
 '討論承接緒論、文獻、方法與結果：先摘述研究結果，再從研究發現與研究過程兩部分深入。',
 '兩種架構：結果彼此相關時，先寫完結果再綜合討論；結果彼此獨立時，每個結果後面接各自的討論。',
 '有研究假設時，說明發現是否符合預期，以及造成這個現象的可能原因。']},
'5.2':{src:'第十五章 研究結果與討論敘寫',pts:[
 '討論的主體是本研究的發現，不是文獻：先寫「本研究發現了什麼」，再呈現它的深層涵義。',
 '引用的文獻應該已在文獻探討中陳述過，不需要再詳述。',
 '比較本研究與過去研究在內容、方法（參與者特徵、情境、時間、工具、分析方法）與結果上的異同。',
 '說明本研究支持、推翻或修改了哪些理論，對現有文獻有什麼獨特貢獻。'],
 ex:{t:'與文獻對話（範例中的作者與數字為虛構）',segs:[['本研究發現','睡眠較少的選手疲勞分數較高，'],['文獻','此與 Smith（2020）在菁英划船選手的發現一致，'],['意涵','顯示此關聯在大專層級同樣存在；'],['不一致與原因','但與 Wang（2022）在技術性項目的結果不同，可能與訓練負荷的型態不同有關。']]}},
'5.3':{src:'第十五章 研究結果與討論敘寫',pts:[
 '討論與研究發現相關的因素，例如影響自變項對依變項成效的因素。',
 '扣住文獻中的概念與理論，說明研究發現的理論意涵或實務應用。',
 '說明研究發現可以解釋或應用的範圍：可推論的母群、適用的對象、介入程序與情境。',
 '發現其他值得深入探究的議題可以提出，為「未來研究建議」埋下伏筆。']},
'5.4':{src:'第十五章 研究結果與討論敘寫',pts:[
 '研究過程的討論：招募參與者、進入場域、建立關係、蒐集資料的實際狀況，以及研究品質的確保情形。',
 '限制的四種狀況：①事先注意並照預擬策略處理 ②事先注意但沒有完整或妥善處理 ③事先沒注意但臨場補救 ④事先沒注意也沒處理。',
 '研究範圍與研究方法不能列為限制。',
 '限制的討論提醒讀者解釋與應用結果時要注意什麼，也提示未來研究在設計與實施上該考慮什麼。']},
'5.5':{src:'第十六章 研究結論、建議與摘要敘寫',pts:[
 '結論：簡要說明研究目的與方法，依目的呈現結果與其意涵；不重複結果與討論，不放統計數字、逐字稿或引註。',
 '結論必須與結果呼應，避免三種不一致：結論超出結果、結果比結論多、結論與結果互相矛盾。',

const GIACS=[
 {cite:'本所 2025 碩士論文〈學生規律運動與體育學習認知在區域性差異探討〉',
  kind:'碩士論文・次級資料分析',
  ex:{"1.0": "學生規律運動與體育學習認知在區域性差異探討\nExploring Regional Differences in Students' Regular Exercise and Physical Education Learning Cognition", "1.1": "運動是我們人生中不可或缺的技能，也是身體運作的一種生活方式，運動影響國民的終身健康狀況，也會影響全體國人的體力，甚至影響到一個國家整體的生產力。……\n（表 1 列出各國每週體育課時間，例如美國小學 220 分鐘、臺灣小學 80 分鐘）\n本研究透過次級資料分析法，分析中央研究院在 111 學年度最新釋出的「教育部體育署各級學校學生運動參與情形調查」之原始數據，從中進行分析各地區與各年級的學生在運動參與的時間，瞭解規律運動情形，並進一步瞭解規律運動與體育認知學習情形的相關因素做為本硏究探討比較方向。", "1.2": "第壹章 緒論：第一節 研究背景與動機、第二節 研究目的、第三節 研究範圍與限制、第四節 名詞解釋\n（沒有研究問題，也沒有研究假設）\n四、探索影響各地區學生規律運動情形之預測因子。", "1.3": "主要研究目的茲列如下：\n一、瞭解各地區學生運動參與和參加運動社團情形。\n二、瞭解各地區都市化程度對於學生規律運動情形與相關性。\n三、瞭解各地區學生規律運動與體育學習認知之相關性。\n四、探索影響各地區學生規律運動情形之預測因子。", "1.4": "一、都市化：都市化程度計算公式為：都市人口數/全國人口數*100% 。都市化比例越高代表當地工商發展程度高，經濟水準也越高，人口也越集中。\n……\n三、規律運動：由於本研究乃採用教育部體育署的學生運動參與調查資料，因此本研究對規律運動的定義則以下列兩項標準，針對原始數據進行篩選：\n1. 學期中每週運動天數達 3 天以上。\n2. 運動時會流汗也會喘。\n需同時達到以上兩個標準的才會列為本研究具有「規律運動」習慣的學生。", "1.5": "第三節 研究範圍與限制\n本研究乃透過分析中央研究院學術調查研究資料庫 (Survey Research Data Archive, SRDA) 最新釋出教育部體育署例行調查之各級學校學生運動參與資料。其中由於本研究對象乃針對求學時期之學生 (國小、國中、高中、大學)，因此將針對各地區各級學生運動參與情形程度等因素進行統計分析。再根據分析結果，進一步探討學生規律運動情形，以及規律運動與體育學習認知的相關性。", "2.1": "本章節將過去研究之文獻加以整理與敘述，並建立本研究之理論基礎。本章共分為五小節，第一節為規律運動；第二節為體育課程與運動參與的相關；第三節為運動社團與運動參與的關係；第四節為各地區都市化程度；第五節為文獻總結。", "2.2": "表 3 規律運動的好處（依照年份）\nRobert G. 等人 1999 規律運動使人擁有良好的身心健康狀態，增強心血管的功能，降低罹患心血管疾病的機率，並針對體內脂肪進行消耗分……\n黃淑貞等人 2003 規律運動可以改善心理層面上的問題，如：個人情緒、壓力、自尊心、身體意象、自我概念等。\n蔡忠昌、劉蕙綾 2006 規律運動可以促使腦內啡 (Endorphin) 的分泌，達到增加愉悅感，使焦慮感降低，睡眠品質提升，並且可以增加身……\n……", "2.3": "表 2 規律運動之定義（依照年份）\n美國運動醫學學會 ACSM｜1990｜一週3~5次的運動，最大心跳率(HRmax) 的60-90%……\n行政院衛生署｜1994｜「國民保健計劃」中提到每週至少 3 次、每次至少 20 分鐘以上的運動才稱為規律運動。\n教育部｜2013｜「SH150計畫」中建議每週在校運動 5 天，每日 30 分鐘，每週達 150 分鐘以上。\n教育部｜2024｜「SH150+計畫」……每週達 200 分鐘以上。", "2.4": "第貳章：第一節 規律運動、第二節 體育課程與運動參與的相關、第三節 運動社團與運動參與的關係、第四節 各地區都市化程度、第五節 文獻總結\n（沒有「體育學習認知」或「體育素養」一節）\n1. 運動習慣：對於都市化，居住在 「第一層級」 的民眾運動人口比較高 (81.2%)；居住在 「第四層級」 的運動民眾人口比例較低 (77.2%)。而居住地區在 「桃竹苗」 地區的民眾運動人口比例較高 (81.5%)；居住在 「雲嘉南」 地區的民眾運動人口比例較低 (77.2%)。……", "2.5": "第五節 文獻總結\n由於各種因素與大方向政策影響下，都市化程度呈現大幅提高的狀況，由於很多資源與人脈帶入都市中，易形成其他鄉村的落寞，也影響了各地區學生體育素養與規律運動的程度。……\n……\n根據上述文獻回顧，瞭解規律運動之定義、好處、重要性及阻礙因素，透過運動行為與參與後的改變，選擇適合自己的運動項目，能有效提升學生規律運動的機率。……", "2.6": "內文：由Raymond Kim Wai Sum等 (2016) 學者於國外發表文章中所建構Perceived Physical……\n參考文獻：\n呂惟帆 (2021)。大專院校學生運動參與情形與學習認知需求感受之研究 (未出版博士論文)。臺北市立大學，臺北市。https://hdl.handle.net/11296/j423mt\n李淑芳、劉淑燕 (2008)。老年人功能性體適能。都華文化。https://www.sanmin.com.tw/product/index/000663430", "3.1": "本研究的資料來源為「中央研究院學術調查研究資料庫」 (Survey Research Data Archive, SRDA) 釋出最新之教育部體育署 111 學年度各級學校學生運動參與情形調查，並以此問蒐集回來的數據進行次級資料分析。此資料庫由教育部針對所屬各級學校以問卷方式進行運動參與情形調查，並蒐集學生運動參與以及參加學校運動社團情形、對學校體育課學習之認知、學生規律運動情形及相關政策性題項 (教育部體育署，2020)。", "3.2": "(一)、研究對象：台灣地區國小、國中、高中、大專院校學生。不包含延畢(修)生，其中母體為全國各級學校，依據各校學生人數抽樣。\n原始問卷計有 40,867 筆，為配合本次研究目的，凡是問卷題項有遺漏者則不列入分析，故篩選後共有 37,965 份各級學生資料，計有 97.9% 的原始資料做為本次研究之有效問卷對象。", "3.3": "由Raymond Kim Wai Sum等 (2016) 學者於國外發表文章中所建構Perceived Physical Literacy Instrument 「感知體育素養工具」，根據文獻綜述和焦點小組訪談，開發包含 18 項的工具用於初步測試。報告測量採用 5 點李克特量表。……\n……\n……最重要的是，次級資料是政府或學術單位製成的有系統性的資料庫，具有一定的信效度 (袁方，2005)，因此本研究不再針對問卷進行信效度的分析。", "3.4": "一、本研究之研究架構如圖 4 所示，探討各級學生之背景因素、運動參與情形對規律運動的關係，並進一步瞭解規律運動與體育學習認知之相關性。\n二、研究流程與步驟則如圖 5，區分為準備階段與資料整理、分析階段。", "3.5": "本研究採用SSPS20.0統計分析系統，並執行以下幾種分析方式：\n二、卡方檢定：探討如類別變項的「人口學變項」 (包括各級學校、學校地區與都市化程度) 與「運動參與情形」 (是否參加運動社團) 在「規律運動情形」之差異情形。\n三、獨立樣本 t 檢定：探討如連續變項「體育學習認知情形」與「運動參與情形」，利用獨立樣本ｔ檢定 (Independent Sample T-test)，分析有無規律運動是否在這些連續……\n四、二元羅吉斯迴歸分析：以「人口學變項」 (包括各級學校、學校地區與都市化程度) 與「運動參與情形」 (包括參加運動社團與運動時間自覺足夠程度) 與「體育學習認知」為自變項，對於依變項「學生規律運動情形」進行相關性分析。\n……\n在預測因子的選擇上，根據第二節的關聯性分析結果篩選出與規律運動情形具有顯著相關的變項後，再將這些變項以多變量模式對於 「規律運動情形」進行預測力分析，並使用「全部進入法」(Enter 法)，考量自變項之間相互關係，以所有自變項同時預測依變項。", "3.6": "第參章：第一節 研究架構與流程、第二節 資料來源與研究對象、第三節 背景變項、第四節 資料分析方法\n（正文沒有提到資料使用申請、使用規範或研究倫理）", "4.1": "如表 11 所示，學生規律運動情形，以無規律運動者較多 (24,191人，63.7%)，有規律運動者較少 (13,774 人，36.3%)。若將各級學校的學生分開探討，大專院校學生以無規律運動者較多 (4,530 人，54.1%)，有規律運動者較少 (3,837 人，45.9%)；高中職學生以無規律運動者較多 (6,401 人，61.8%)，有規律運動者較少 (3,964 人，38.2%)；國中學生以無規律運動者較多 (6,631 人，67.4%)，有規律運動者較少 (3,213 人，32.6%)；國小學生以無規律……", "4.2": "表 11 規律運動情形與各級學校之描述性分析\n表 12 規律運動情形與各縣市之描述性分析\n表 13 規律運動情形與都市化程度之描述性分析\n表 14–22 運動參與情形與各級學校／各縣市／都市化程度之描述性分析\n（結果章共 16 張表，沒有圖）\n表 26 欄位：影響變項｜B｜SE｜OR (95%CI)｜Wald’s x²｜P", "4.3": "表 26（節錄）　B｜SE｜OR (95%CI)｜Wald’s x²｜P\n第一層　-.131｜.0631｜0.877 (0.775-0.993)｜4.313*｜<.05\n第二層　-.067｜.0554｜0.935 (0.839-1.042)｜1.467｜.117\n第三層　-.073｜.0565｜0.929 (0.832-1.038)｜1.689｜.075\n第四層　-.116｜.0573｜0.891 (0.796-0.997)｜4.075｜.059\n第五層　-.091｜.0680｜0.913 (0.799-1.044)｜1.772｜.107\n第六層　Ref\n……都市化程度方面，第一層 (B = -1.31，P = <.05) 迴歸係數達顯著水準，OR值為0.877低於1，表示第一層學生進行規律運動的可能性低於第六層學生……", "4.4": "如表 23 所示，由卡方檢定可知，各級學校 (χ2 = 598.278，p < .001)、縣市別(χ2 = 202.822，p < .001) 與都市化程度 (χ2 = 82.092，p < .001)的檢定結果達顯著水準，表示學生的人口……\n表 25（節錄）　無規律運動｜有規律運動｜t\n我有較好的社交技能　3.38 ± 0.996｜3.70 ± 0.984｜29.841***\n我對戶外求生具信心　2.91 ± 1.065｜3.28 ± 1.083｜31.974***\n我能認知運動對健康的好處　3.91 ± 0.839｜4.17 ± 0.815｜29.652***\n（全章沒有效果量）", "4.5": "如表 12 所示，將學生有規律運動比例超過 40% 的縣市做探討，高雄市學生以無規律運動者較多 (533 人，53.0%)，有規律運動者較少 (472 人，47.0%)；屏東縣學生以無規律運動者較多 (656 人，57.4%)，有規律運動者較少 (487 人，42.6%)；臺東縣學生以無規律運動者較多 (489 人，55.2%)，有規律運動者較少 (397 人，44.8%)；金門縣學生以無規律運動者較多 (494 人，58.5%)，有規律運動者較少 (351 人，41.5%)；連江縣學生以無規律運動者較多 (209……", "5.1": "本研究也有納入個人因素進行分析，發現自覺運動程度與體育學習認知亦是影響規律運動的重要因素，學生感受自己運動程度越高時，規律運動的機會與可能性越高，當學生在運動的時間越長，或體驗運動時有正向感受，亦有效提升規律運動機率。……\n……\n結論 4. 養成規律運動，能成為全民終身運動，促進身心健康，增加體魄與信心，將會是政府必須推展之長遠目標，政府若能有完整政策規劃，全民依照政府所制定的計畫執行，有更多機會養成終身運動，體育運動發展才能落實。", "5.2": "在影響各級學生規律運動情形，人口學變項、運動參與情形與體育學習認知，均有明顯相關聯情形，呂惟帆 (2021) 指出若是能夠增加體育課程的時間，並改善上課環境，將可以使學生運動參與意願提升，並同時增加體育課程滿意度。……\n……\n不過，體育學習認知裡有題目是顯著的負相關 (自我評價健康、懂得處理困難)，代表學生知道運動對於自身有很多好處，卻因為上課時間太少，教學中給予學生很多的技能與體育規則知識已經佔滿了課堂，很難增加時間與健康或不同事件處理有關知識，因此若能增加體育課上課的時間，能期待學生更多學習機會。……", "5.3": "3. 應規劃國小、國中、高中職與大專院校的學生，依據生長情況與地域特性，發展不同種類運動目標，或在推展「一校一團隊」時，優先找尋具有代表性的項目引導學生進行運動，如：高中學生以團隊合作為主，可發展排球或壘球，而大專院校學生可尋找 4 - 6 人可共享的運動 (羽球或有氧)，慢慢呈現區域性多元種類發展。", "5.4": "第伍章 結論與建議：第一節 結論、第二節 建議\n（全文沒有研究限制；第壹章第三節「研究範圍與限制」也只寫了範圍）", "5.5": "結論 2. 針對都市化程度因素與規律運動相關的分析，可發現越核心的區域不代表較多人有規律運動的情形，反而都市化程度不高的區域，有較大空間與時間讓學生去參與運動，研究成果能給予政府參考與規劃，做更多政策上的修正，讓各縣市政府依據大方向，制定不同的區域計劃，有效的提升學生規律運動的比例。", "5.6": "……結果：學生規律運動情形、人口學變項、運動參與情形與體育學習認知，均有顯著關聯性。透過迴歸分析控制各項因素後，大專院校學生比國小學生較多的規律運動比例；都市化程度第六層比第一層較多的規律運動比例；參加運動社團、運動天數、自覺運動足夠程度與體育學習認知方面，亦是影響規律運動的重要因子。結論：在運動參與的各項因素，不同都市化程度與體育學習認知確實為影響學生規律運動的因素。……\n關鍵詞：學生運動、都市化程度、運動參與、體育素養"},
  sum:'國立體育大學競技與教練科學研究所 2025 年的碩士論文。作者分析中研院釋出的 111 學年各級學校學生運動參與調查（有效樣本 37,965 人），用卡方檢定、t 檢定與二元羅吉斯迴歸，比較不同學制與都市化程度學生的規律運動，以及規律運動和體育學習認知的關係。結果：大專生、參加運動社團、自覺運動足夠與多數體育學習認知題目，都和較高的規律運動比例有關。',
  ch:{1:{part:'第壹章 緒論（研究背景與動機、研究目的、研究範圍與限制、名詞解釋）',pts:[
 ['ok','1.0','題目點出了研究對象（學生）、兩個主要變項（規律運動、體育學習認知）與比較的面向（區域），讀者一看就知道要研究什麼。'],
 ['fix','1.0','題目的文法有點拗口，「區域性差異」也不完全符合內容：分析主要比較學制與都市化程度，縣市只做描述。可改成「各級學校學生規律運動的相關因素：都市化程度與體育學習認知」之類，讓題目和分析對齊。'],
 ['ok','1.1','用表 1 各國每週體育課時間開場（臺灣小學 80 分鐘、美國 220 分鐘），具體數字比「體育很重要」更有說服力。'],
 ['fix','1.1','背景前半多是「運動很重要」「少子化」這類普遍陳述；研究缺口（較少研究比較各地區學生的規律運動）只寫在摘要，緒論裡沒有明講。缺口要在背景最後一段寫出來，研究目的才有來由。'],
 ['fix','1.2','四個目的都是「瞭解……」，沒有研究問題。目的四可以改寫成問題：「控制學制與都市化程度後，參加運動社團與體育學習認知是否仍與規律運動有關？」'],
 ['ok','1.3','四個目的由描述（運動參與、社團）到關聯（都市化、體育學習認知）再到預測因子，和第四章三節的順序一致。'],
 ['ok','1.4','規律運動先寫概念性定義（ACSM 與一般常見定義），再寫本研究的操作性定義：「學期中每週運動 3 天以上」且「運動時會流汗也會喘」，兩項都達到才算。定義直接對到資料庫的題目，拿去就能篩資料。'],
 ['fix','1.4','都市化的名詞解釋寫的是「都市人口數÷全國人口數」與人口密度公式，但分析用的是臺灣社會變遷基本調查的鄉鎮市區七層分類，應寫實際使用的那一種。另外同一個變項在題目寫「體育學習認知」、目的寫「體育認知學習」、關鍵詞寫「體育素養」，名稱要全文統一，並放進名詞解釋。'],
 ['fix','1.5','「研究範圍與限制」一節只寫了範圍。次級資料的題目不是為本研究設計、橫斷面、自陳問卷，這些限制應集中寫在這裡；也沒有寫研究的重要性。']]},
2:{part:'第貳章 文獻探討（規律運動、體育課程與運動參與、運動社團、都市化程度、文獻總結）',pts:[
 ['fix','2.1','沒有交代文獻怎麼找：用了哪些資料庫、哪些關鍵字、年代範圍。不必像系統性回顧那麼完整，但章首一段說明，讀者才知道文獻是否有偏。'],
 ['ok','2.2','表 3、表 4 把「規律運動的好處」「運動參與與健康的關係」依年份整理，每一筆寫出作者與重點，是把閱讀摘要變成表格的做法。'],
 ['ok','2.3','表 2「規律運動之定義」依年份排列（ACSM 1990、衛生署 1994、SH150 2013、SH150+ 2024），定義怎麼演變一目了然，也說明了本研究為什麼採每週 3 天的標準。'],
 ['ok','2.4','節次和研究變項對應：規律運動（依變項）、體育課程、運動社團、都市化（自變項）。'],
 ['fix','2.4','關鍵變項「體育學習認知」（感知體育素養量表）沒有獨立一節。量表來源、三個因素的意義、它和規律運動的關係，都應該在文獻探討先交代。都市化一節大量引用體育署報告的百分比（第一層 81.2%、第四層 77.2%），差距只有幾個百分點，作者沒有評論差距大小就推到「值得探討」。'],
 ['fix','2.5','文獻總結大多在談少子化與學校招生，沒有收斂到本研究的變項關係，也沒有由文獻導出可檢驗的預期。總結應寫出：哪些已知、哪些未知、所以本研究預期看到什麼。'],
 ['fix','2.6','參考文獻有 APA 第 7 版的細節要修：學位論文應寫成〔博士論文，臺北市立大學〕而不是「(未出版博士論文)。臺北市立大學，臺北市」；書籍不要附書店網址；內文引用外文作者用姓氏，「Raymond Kim Wai Sum 等 (2016)」應為「Sum 等人（2016）」，三位以上作者第一次就用「等人」。']]},
3:{part:'第參章 研究方法（研究架構與流程、資料來源與研究對象、背景變項、資料分析方法）',pts:[
 ['ok','3.1','使用中研院學術調查研究資料庫（SRDA）公開的 111 學年各級學校學生運動參與調查，並說明次級資料分析的優點與限制；有研究架構圖。'],
 ['ok','3.2','交代母體（全國各級學校、依各校人數抽樣）、範圍（22 縣市）與排除條件（不含延畢生、刪除有遺漏的問卷），並以表 6 列出各組人數。'],
 ['fix','3.2','有效樣本比例算錯：40,867 份刪去有遺漏的問卷後剩 37,965 份，是 92.9%，不是 97.9%。刪掉近三千份時，也要說明遺漏者是否集中在某些學制或地區。'],
 ['ok','3.3','每個變項都寫出原題目與選項（運動社團：有／沒有；運動天數：0–2 天、3 天以上；自覺足夠程度：五點），並附人數百分比或平均數標準差。'],
 ['fix','3.3','「次級資料由政府製成，本研究不再進行信效度分析」這個理由不成立。感知體育素養量表原本是以 336 名香港體育教師發展的，用在國小到大專學生，至少要報告本樣本的 Cronbach’s α，最好再做驗證性因素分析。'],
 ['ok','3.4','研究流程圖把「準備階段」與「資料整理、分析階段」分開；附錄附上 SRDA 的資料說明與四個學制的原始問卷，讀者可以核對每個變項的題目。'],
 ['ok','3.5','四種統計方法各自寫清楚用在哪些變項：類別對類別用卡方、連續變項比較兩組用 t 檢定、多個自變項同時預測用二元羅吉斯迴歸。'],
 ['fix','3.5','三個問題：（1）調查依各校人數抽樣，分析應考慮抽樣權重與同校群聚；（2）迴歸自變項是「雙變項分析顯著」才放入，但近 38,000 人幾乎每個變項都顯著，這個篩選沒有作用，應依理論決定；（3）量表 9 題各自放進迴歸，而不是用 3 個因素分數，容易出現共線性與方向反轉的係數。'],
 ['fix','3.6','附錄雖附了 SRDA 的資料說明，正文沒有交代資料使用的申請、使用規範與去識別化；應在方法寫一兩句，說明為何不需另送倫理審查。']]},
4:{part:'第肆章 結果與討論（第一至三節：描述統計、關聯分析、羅吉斯迴歸）',pts:[
 ['ok','4.1','表 11 先給全體再分學制，人數與百分比並列，國小 29.4% 到大專 45.9% 的規律運動比例一眼可比。'],
 ['fix','4.2','描述統計用了 12 張表（表 11–22），學制、縣市、都市化各做一輪，全章沒有一張圖。各學制或各都市化層級的規律運動比例，用一張長條圖或點圖就能取代好幾張表。'],
 ['ok','4.2','表 26 的欄位完整：B、SE、OR 與 95% 信賴區間、Wald χ²、p，並標出參照組（國小、第六層、未參加社團）。這是羅吉斯迴歸表的標準寫法。'],
 ['fix','4.3','表 26 的 p 值和自己的 Wald 值對不上：第四層 Wald = 4.075，p 應約 .044（信賴區間 0.796–0.997 也不含 1），表中卻寫 .059，判為不顯著；第二、三、五層的 p 應約 .23、.19、.18，不是 .117、.075、.107。另外分析方法說「縣市別」放進迴歸，表中卻沒有縣市；都市化七層只出現六層。'],
 ['ok','4.4','羅吉斯迴歸每個 OR 都附 95% 信賴區間，讀者能判斷估計的精確度。'],
 ['fix','4.4','卡方與 t 檢定沒有報告效果量。近 38,000 人幾乎都 p < .001，但有無規律運動在體育學習認知各題只差約 0.3 分（Cohen’s d 約 0.3，小效果），第一層對第六層 OR = 0.88 也很小。大樣本要靠效果量判斷重要性。'],
 ['fix','4.5','結果文字逐列重述表格（「高雄市學生以無規律運動者較多……有規律運動者較少……」每一列都寫一次）。文字應點出規律，例如「規律運動比例隨學制逐級上升」。內文還把第一層寫成「B = -1.31」（表中是 -.131），兩題的解釋句抄成了另一題的文字。']]},
5:{part:'第肆章第四節 討論、第伍章 結論與建議，以及摘要',pts:[
 ['fix','5.1','「自覺運動時間足夠」和規律運動在同一份問卷同時測量，比較像規律運動的結果而不是原因；橫斷面資料只能說「有關」，不能寫成「影響」。結論第 4 點「政府若能有完整政策規劃……」不是本研究的發現，應刪去。'],
 ['fix','5.2','討論多用推測解釋（都市學生上安親班、才藝課壓縮運動時間；體育課時間太少，所以兩題呈負相關），沒有資料或文獻支持，和前人研究的比較也很少。兩題的負係數更可能來自 9 題同時放入迴歸的共線性，應先排除統計上的原因。'],
 ['fix','5.3','實務建議超出資料：調查沒有運動項目的變項，卻建議「高中發展排球或壘球，大專發展羽球或有氧」。應用要從結果推得出來，例如「運動社團參與和規律運動有關，可優先檢視社團開設率低的學制」。'],
 ['fix','5.4','全文沒有獨立的研究限制（橫斷面、自陳、次級資料題目、未加權、量表效度）。限制寫清楚，未來研究的建議才有根據。'],
 ['ok','5.5','建議分成政策（縣市指標、體育課時數）、學校（社團銜接課後活動）與未來研究（畢業後追蹤）三個層次。'],
 ['fix','5.5','結論「越核心的區域不代表較多人規律運動，都市化不高的區域有較大空間與時間」，根據只是第一層對第六層一個 p ≈ .04、OR = 0.88 的比較，其他層都不顯著。結論的強度要和證據相稱。'],
 ['ok','5.6','中英文摘要依「目的、背景、方法、結果、結論」分段，方法交代了資料來源與四種統計方法。'],
 ['fix','5.6','摘要寫「運動天數」是影響規律運動的重要因子；但規律運動本身就是用「每週運動 3 天以上」定義的，運動天數不能拿來解釋規律運動，表 26 也沒有這個變項。關鍵詞「體育素養」和題目的「體育學習認知」也要統一。']]}}},
 {cite:'本所 2024 博士論文〈基於可解釋性人工智慧模型探討棒球比賽勝負關鍵〉',
  kind:'博士論文・機器學習',
  ex:{"1.0": "基於可解釋性人工智慧模型探討棒球比賽勝負關鍵\nApplication of Explainable AI Models for Baseball Outcome Prediction", "1.1": "大數據 (Big Data) 又稱為「巨量資料」，因為資料量龐大且非常複雜，無法使用傳統分析數據的方式處理，都需具有分析大數據資料的技術，包含人工智慧、機器學習或預測分析等，而大數據分析亦是目前全球最夯趨勢，也被廣泛運用於各領域分析與預測 (江信宏等，2019……\n……\n目前各國的體育組織與職業賽事皆使用不同方法來衡量球員的表現與貢獻，在高科技與數據時代中，分析數據的方式已經穩定於運動競賽中發展，數據分析不僅是分析比賽數據，更是協助球員在場上如何面對多元又複雜的比賽，透過較客觀的數據分析，提供球員能在比賽中能獲得更佳的運動表現，並且利用分析整體趨勢來採取相對的決策模式，對比賽結果也會有嶄新的收穫。", "1.2": "第壹章 緒論：第一節 研究背景與動機、第二節 研究目的、第三節 研究重要性、第四節 名詞解釋\n（沒有研究問題，也沒有研究假設）\n(1) 透過傳統數據與進階數據找出較高準確率的機器學習模型。", "1.3": "而本研究目的旨在分析中華職棒比賽結果的表現：\n(1) 透過傳統數據與進階數據找出較高準確率的機器學習模型。\n(2) 使用最高預測準確率模型找出響勝敗結果的因子並且排序。\n(3) 再以決策樹的產出決策規則供教練參考。", "1.4": "5. 陽性預測值 (Positive Predictive Value, PPV)：是指將預測為勝利且結果為勝利比率，即真陽性/陽性。\n7. 靈敏度 (Sensitivity)：是指將勝利比賽預測為勝利結果的比率，即真陽性/陽性。\n6. 陰性預測值 (Negative Predictive Value, NPV)：是指將輸預測為失敗且結果為失敗比率，即真陰性/陰性。\n8. 特異度 (Specificity)：是指將失敗比賽預測為失敗結果的比率。即真陰性/陰性。", "1.5": "第三節 研究重要性\n數據科學是現今許多領域重視的一環，在競技運動中，數據是不可或缺的一項指標，透過客觀的評估可減少人為主觀因素。而數據科學時代中，傳統數據可透過數學公式轉換為進階數據，可更貼近選手實際表現。而分析過程中利用大數據特性與進階數據來檢驗不同模型中的差異，再以高準確率模型進行可解釋機器學習模型並找出影響比賽結果的關鍵因素，再以決策樹輔助決策規，透過本研究結果可提供教練與選手在練習時強化影響比賽關鍵因素的指標，而比賽中，教練可建立選手贏球目標，增加贏球機會。\n（緒論沒有研究範圍與限制）", "2.1": "第貳章：第一節 運動大數據應用與挑戰、第二節 機器學習運用於比賽表現分析、第三節 預測棒球比賽數據分析、第四節 文獻總結\n（沒有說明文獻如何檢索）", "2.2": "……Huang與Li (2021) 使用2019年資料共4858場比賽，將資料集分為先發投手與全部投手，再使用1DCNN、ANN與SVM支援向量機再以五倍交叉驗證結果顯示，使用全部投手的資料集的預測率約94%，若僅使用先發投手的預測率僅有約92%。……", "2.3": "……宋孟遠、許建民 (2020) 以邏輯斯回歸運用防禦型指標、攻擊型指標、競賽制度與球隊戰績預測個別球隊比賽勝負發現，整體預測率為62.71%~71.20%。而陳麒文等 (2014) 以邏輯斯回歸正確預測率僅有61.11%，若採用人工神經網路預測正確預測率提升至72.22%。……", "2.4": "……Ivanković等 (2010) 使用人工神經網路研究五季塞爾維亞的籃球聯賽預測率也達80.96%。Huang 與 Li (2021) 使用兩種資料集，建立打擊者變數共26個，投手變數共34個預測大聯盟勝敗隊之間的關係，以五倍交叉驗證評估模型，以人工神經網路模型發現最高準確率為93.91%。還有使用決策樹預測籃球比賽結果，利用決策修剪，正確分類為78.2%，且能指出變數之間的重要變數 (林雅俐、林宜劭，2014)。……", "2.5": "從過去文獻可知，許多文獻是透過基本數據預測棒球比賽結果，以目前多數都是使用傳統統計預測比賽結果解釋變項之間關係，而僅有幾位學者使用機器學習模型進行預測棒球比賽，且經常使用特徵工程方式提高準確率，在研究結果僅比較各種機器學習模型準確率，並沒有解釋模型所產生的規則，本研究將以傳統數據與進階數據對於多種機器學習模型進行比較是否會有所影響準確率，再以可解釋人工智慧的機器學習模型進行決策分析。", "2.6": "內文：…… (Hall, 2000; Horvat & job, 2020; Mohamad et al., 2020)\n參考文獻：\n江信宏、謝承勳、蕭聖翰、林建宇、蔡孟勳 (2019)。 利用決策樹分析日本 200 公尺個人混合式選手之各泳姿成績。大專體育學刊，21，17–29。doi:10.5297/ser.201903_21(1).0002\n宋孟遠、許建民 (2020)。以攻守表現與競賽制度預測中華職棒比賽勝負。運動與遊憩研究，15(2)，41–51。https://doi.org/10.29423/JSRR.202012_15(2).04", "3.1": "本研究以中華職棒2021-2023年的攻擊數據與防守數據分為傳統數據與進階數據，並透過九種機器學習模型進行傳統數據與進階數據的模型比較，再以可解釋機器學習模型決策樹找出決策規則，並透過特徵重要程度找出影響勝敗隊的關鍵因素。", "3.2": "依照中華職棒大聯盟 (Chinese Professional Baseball League, CPBL) 賽制規定，例行賽每隊需要完成120場賽事，本研究所使用的資料來源為2021年至2023年賽季資料，共有五支球隊，每年預計300場賽事，預計三年共有900場賽事的攻守數據資料進行分析，本研究依變項針對勝敗進行預測，故排除平手場次共31場，實驗比賽資料869場，資料來源自中華職棒官方網站 (https://www.cpbl.com.tw)，本研究依變項……\n……\n本研究利用中華職棒官網與野球革命數據公司搜集2021年至2023年中華職棒例行賽900場賽事比賽數據，透過比賽數據進行統整及計算進階數據，並將排除31場平手賽事，故將859場賽事分出勝敗隊，共1738筆資料。……", "3.3": "表 1（節錄）　B1 打數 AB｜P1 面對打席 BF；……；B10 被三振 SO｜P10 防禦率 ERA；……\n進階數據　B19 加權上壘率 wOBA｜P19 獨立防禦率 FIP；B20 加權得分期望 wRAA｜P20 殘壘率 PLOB%；B21 標準化加權得分 wRC＋\n……\n10. 防禦率：是指投手每場比賽所失掉的自責分。", "3.4": "本研究利用中華職棒官網與野球革命數據公司搜集2021年至2023年中華職棒例行賽900場賽事比賽數據，透過比賽數據進行統整及計算進階數據，並將排除31場平手賽事，故將859場賽事分出勝敗隊，共1738筆資料。利用R軟體進行模型建立，以80%資料建立訓練集模型，20%作為測試集模型，首先進行比較九種機器學習模型，並以最佳準確率模型以SHAP Values (SHapley Additive exPlanations)及特徵重要度 (Feature Importance Plot) 解釋模型，最後以決策樹模型產出決策規則。", "3.5": "本研究使用 R軟體與Python程式語言進行統計分析與資料視覺化，首先進行九種機器學習模型比較，並且由最佳預測準確模型以SHAP Values及Feature Importance Plot呈現視覺化圖，並且解釋影響預測模型的特徵重要程度，再以決策樹透過視覺化產出決策規則，透過決策規則建立贏球模式。透過本研究結果提供教練及選手在練習強化影響勝敗指標，並且能提供教練與選手在比賽時建立贏球目標。", "3.6": "第參章：第一節 研究架構、第二節 資料收集與變項、第三節 資料處理流程、第四節 統計分析\n（沒有提到資料使用規範或研究倫理）", "4.1": "第肆章：第一節 比較模型準確率、第二節 影響勝敗結果的因子排序出重要影響程度、第三節 決策樹的產出決策規則\n本研究使用九種機器學習模型包含決策樹、貝氏分類器、邏輯斯回歸、K–近鄰演算法、SVM支援向量機、集成學習、隨機森林、ANN與XGboost進行傳統數據與進階數據的預測，從表2可知，進階數據 (加權上壘率、加權得分期望、標準化加權得分、獨立防……\n（沒有描述統計）", "4.2": "圖 11 至圖 17：不同數據類型使用機器學習模型的預測準確率、F1 Score、PPV、NPV、Sensitivity、Specificity、AUC Score（共七張）\n表 4（節錄）\n4 若”投手防禦率” ≥ 2，且”標準化加權得分” > 123 ，且” 投手防禦率” ≤7.5，則比賽結果為“贏”。\n5 若”投手防禦率” ≥ 2，且” 標準化加權得分” > 123 ，且” 投手防禦率” ≥ 7.5，則比賽結果為“輸”。\n圖 21 決策樹（摘述）：第一層 ERA >= 2；左支下一層 wRC+ < 123；右支下一層 wOBA < 0.23\n……圖12投手防禦率為第一決策節點需要小於2，才能提高機會贏球；其次為打擊者加權上壘率需要大於0.23就有贏球機會，或標準化加權得分小於123時，輸球機率增加，其次……", "4.3": "本研究使用九種機器學習模型包含決策樹、貝氏分類器、邏輯斯回歸、K–近鄰演算法、SVM支援向量機、集成學習、隨機森林、ANN與XGboost進行傳統數據與進階數據的預測，從表2可知，進階數據 (加權上壘率、加權得分期望、標準化加權得分、獨立防禦率、殘壘率) 預測準確率都高於傳統數據 (打數、一壘安打、三振數、保送等變項)。……", "4.4": "表 2（節錄）　Accuracy｜F1｜PPV｜NPV｜Sensitivity｜Specificity｜AUC\nRandom Forest advance　0.96｜0.96｜0.97｜0.96｜0.96｜0.96｜0.96\nXGBoost advance　0.98｜0.98｜0.98｜0.98｜0.98｜0.98｜1.00\n（沒有信賴區間或模型比較檢定）", "4.5": "……由圖19可知，以f(x)為原始模型下的預測值，本研究模型的預測值為2.70，模型平均預測值為1.25，每個特徵的貢獻可從藍色代表負影響，紅色代表正影響；透過結果可知，對於比賽影響有負相關指標包含ERA降低2.11、PLOB%降低1.7，B_SO降低0.41，而其餘的指標皆是正影響包含wRAA增加2.43、wRC+增加1.23、wOBA增加0.93、B_BB增加0.56、AVG與SLG都是增加0.55。", "5.1": "本研究結果發現新增進階數據比僅用傳統數據在預測比賽結果的勝敗具有更高準確率，且XGboost比決策樹、貝氏分類器、邏輯斯迴歸、K–近鄰演算法、SVM支援向量機、集成學習、隨機森林與人工類神經網路具有較高的預測準確率。透過XBboost特徵重要程度發現，對於影響比賽結果的因子包含投手防禦率具有22.3%，依序為標準化加權得分15.7%、加權上壘率9.9%、加權得分期望7.7%其餘指標皆低於5%的重要程度。……", "5.2": "……而本研究使用2021至2023年比賽資料發現，XGboost與隨機森林使用進階數據在預測比賽結果的準確率都能高達95%，以XGboost是經由決策樹的改良，使每棵樹都有關聯性，故在預測上具有高準確率；而隨機森林則是多個決策樹的分類組合，且預測效果不會受到增加變動產生影響，故兩者皆是目前模型中屬於高準確率的模型 (陳伯杰，2022)。……\n……\n……而過往研究也發現，常使用的人工類神經網路之準確率約75% (陳麒文等，2014；Hubácek et al., 2019; Kahn, 2003; Loeffelholz et al., 2009; Purucker, 1996)。……", "5.3": "……教練在作戰過程中，如何讓球員有機會獲得更多打席機會必須經由選球訓練增加保送機會、增加積極進攻的戰術，減少消極的短打戰術，才能有效增加打席機會，以增加預期得分期望，增加贏球機會。以上四項指標是特徵重要程度中高於5%以上的重要程度。", "5.4": "第陸章 結論與建議：第一節 結論、第二節 建議\n（全文沒有研究限制）", "5.5": "……在實務比賽過程中，需要降低投手的失分情況，若能有效能使先發投手的失分控制於2分內，則有高機率贏球機會，教練換投期間也成為關鍵因素。……", "5.6": "……目的：本研究目的以不同機器學習模型找出最佳預測模型，透過最佳的模型歸納出影響勝負的關鍵因素，再以決策樹產生勝敗規則。方法：本研究以2021~2023年中華職棒869場比賽，由中華職棒官網與Rebas棒球數據網站將數據分為傳統數據與進階數據，以九種機器學習模型找出最佳準確率的模型，並且以最高模型透過SHAP Values與Feature Importance Plot顯示影響模型影響勝敗程度，最後以決策樹產生規則結果進行解釋勝敗隊與因子之間關聯性。……\n關鍵詞：中華職棒、可解釋人工智慧、運動大數據、權重指標"},
  sum:'國立體育大學競技與教練科學研究所 2024 年的博士論文。作者整理 2021–2023 年中華職棒 869 場例行賽的攻守數據，分成傳統數據與加入進階數據兩個資料集，比較九種機器學習模型的分類表現，再用 XGBoost 的特徵重要度、SHAP 值與決策樹找出和勝負最有關的指標，結果以投手防禦率、wRC+、wOBA 最重要。',
  ch:{1:{part:'第壹章 緒論（研究背景與動機、研究目的、研究重要性、名詞解釋）',pts:[
 ['ok','1.0','題目包含方法（可解釋性人工智慧）、對象（棒球比賽）與依變項（勝負），讀者一看就知道研究什麼。'],
 ['fix','1.0','「勝負關鍵」帶有因果意味，但資料只能找出和勝負最相關的指標。可改成「與勝負最相關的指標」，或在題目加上「中華職棒」與資料年份。'],
 ['ok','1.1','背景由大到小收斂：大數據 → 運動數據分析 → 傳統數據與進階數據的差別 → 預測比賽結果的難度，最後落到「要準也要能解釋」。'],
 ['fix','1.2','本研究屬探索性的模型比較，沒有寫研究問題或研究假設。若要寫，可把目的（1）改成有方向的假設，例如「加入進階數據後，各模型的分類準確率高於只用傳統數據」，並在方法交代用什麼檢定比較。'],
 ['ok','1.3','三個研究目的分別對應第肆章的三節（比較模型準確率、因子排序、決策規則），也對應第伍章討論的三節。這就是「環環相扣」：目的寫了什麼，結果與討論就逐條回答什麼。'],
 ['fix','1.4','名詞解釋把靈敏度與陽性預測值都寫成「真陽性／陽性」，特異度與陰性預測值也寫成同一式。應分開：靈敏度＝真陽性÷（真陽性＋偽陰性），是實際贏球中被判為贏的比例；陽性預測值＝真陽性÷（真陽性＋偽陽性），是判為贏的場次中真的贏的比例。操作性定義要寫到別人能算出同一個數字。'],
 ['ok','1.5','有獨立的「研究重要性」一節，說明結果可給教練設定訓練與比賽目標。'],
 ['fix','1.5','緒論沒有「研究範圍與限制」。範圍（中華職棒、2021–2023 例行賽、排除和局）只寫在方法章，限制則全文都沒有寫（見第五章）。']]},
2:{part:'第貳章 文獻探討（運動大數據、機器學習於比賽表現分析、棒球比賽預測、文獻總結）',pts:[
 ['fix','2.1','沒有交代文獻怎麼找：用了哪些資料庫（如 Google Scholar、華藝、SPORTDiscus）、哪些關鍵字、年代範圍。章首一段說明，讀者才知道文獻是否完整。'],

function gQuote(g,u){const q=g.ex&&g.ex[u];return q?`<div class="gquote"><span class="mono">論文原文（節錄）</span><div>${esc(q)}</div></div>`:''}
function gUnit(g,u,pts,self){return `<div class="gunit">${self?'':`<button class="link" data-act="mod" data-id="${u}">${esc(srcName(u))}</button>`}${gQuote(g,u)}<span class="mono">老師評註</span>${gPts(pts)}</div>`}

  ${L.map(g=>{const pts=g.ch[c.n].pts,units=[...new Set(pts.map(p=>p[1]))];
