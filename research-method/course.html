function readHTML(n){const r=READ[n],a=(S.crit||{})[n]||{},c=CH[n-1];
  return `<button class="back" data-act="ch" data-c="${n}">← 第${NUM[n]}章　${esc(c.name)}</button>
  <div class="top"><span class="mono">文章評析 · 第 ${n} 章 · ${critDone(n)} / ${rqs(n).length} 題</span><h1>讀一篇真論文</h1>
  <p class="lede">課綱的 Article Critique 作業：讀一篇已發表的研究，用這一章學到的標準評析它。</p></div>
  <section class="step"><header><span class="mono">1</span><h3>這篇論文</h3></header>
    <div class="paper">${esc(r.cite)}</div>
    <p>${esc(r.sum)}</p>
    <div class="tip"><b>要讀的部分：</b>${esc(r.part)}<br><b>檔案：</b>課程資料夾「1151 國體 高等體育研究法／參考資料」中的〈${esc(r.file)}〉。網站不提供全文，請讀原文再作答。</div></section>
  <section class="step"><header><span class="mono">2</span><h3>回答評析問題</h3></header>
    ${rqs(n).map(([k,l],i)=>`<div class="field"><label for="cr-${n}-${k}">${i+1}. ${esc(l)}</label><textarea id="cr-${n}-${k}" data-cr="${n}" data-crk="${k}">${esc(a[k]||'')}</textarea></div>`).join('')}
    <p class="note">每題至少寫一兩句具體的觀察，最好指出頁碼或段落。</p></section>
  <section class="step"><header><span class="mono">3</span><h3>匯出與回饋</h3></header>
    <div class="btnrow"><button class="btn pri" data-act="critdl" data-c="${n}">下載評析（Markdown）</button><button class="btn" data-act="critcopy" data-c="${n}">複製全文</button><button class="btn" id="critai" data-act="critai" data-c="${n}">請 Claude 給回饋</button></div>
    <p class="note aioff">AI 回饋只在 Claude 網站版提供。</p><p class="note aion">Claude 沒有讀過這篇論文的全文，回饋只看你的評析寫得是否具體、是否用上這一章的標準。</p>
    <div class="ai" id="critout" ${(S.ai['crit'+n])?'':'hidden'}>${esc(S.ai['crit'+n]||'')}</div>
    <div class="paper" id="crittext">${esc(critText(n))}</div></section>`}
async function runCritAI(n){
  const out=document.getElementById('critout'),b=document.getElementById('critai');
  if(critDone(n)===0){toast('先回答至少一題評析，再請 Claude 給回饋');return}
  out.hidden=false;out.textContent='正在連線 Claude…';b.disabled=true;
  const sm=await getSample();if(!sm){out.textContent=NOAI;b.disabled=false;return}
  out.hidden=false;out.textContent='Claude 正在閱讀你的評析…';b.disabled=true;
  const prompt=`你是研究法課程的助教。研究生讀了下面這篇論文，用論文第${NUM[n]}章（${CH[n-1].name}）的標準寫了評析。你沒有讀過原文，請只依評析本身判斷。
${critText(n)}
請用繁體中文，250 字內回覆：
【寫得具體的地方】一點
【太籠統或漏掉的地方】最多兩點，指出題號
【下一步】一個可以讓評析更深入的問題
不要編造論文內容，不要過度稱讚。`;
  try{const r=await sm(prompt,{cache:false,onText:({text})=>{out.textContent=text}});S.ai['crit'+n]=r.text;save();out.textContent=r.text}
  catch(err){out.textContent=aiErr(err)}
  finally{b.disabled=false}
}

/* ---------- 事件 ---------- */
function refreshProg(m){const p=document.getElementById('prog');if(p)p.textContent=progText(m);const b=document.getElementById('stepbar');if(b)b.innerHTML=stepbarHTML(m)}
function stepbarHTML(m){const L=[['s-read','重點'],['s-judge','判斷',judgeDone(m)],['s-order','排序',orderDone(m)]];
  if(TOOLS[m.id])L.push(['toolsec','工具']);L.push(['s-write','寫草稿',tplDone(m)],['s-check','檢核'],['s-ai','回饋']);
  return L.map(([id,l,d])=>`<button type="button" class="${d?'ok':''}" data-act="jump" data-to="${id}">${d?'✓ ':''}${l}</button>`).join('')}
function flash(el){if(!el)return;try{el.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){el.scrollIntoView()}el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function curMod(){return modById(view.id)}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
  if(act==='home')return go({n:'home'});
  if(act==='ch')return go({n:'ch',c:+t.dataset.c});
  if(act==='mod')return go({n:'mod',id:t.dataset.id});
  if(act==='sum')return go({n:'sum',c:+t.dataset.c});
  if(act==='thesis')return go({n:'thesis'});
  if(act==='read')return go({n:'read',c:+t.dataset.c});
  if(act==='jump'){const el=document.getElementById(t.dataset.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(act==='consai')return runConsAI();
  if(act==='critai')return runCritAI(+t.dataset.c);
  if(act==='critcopy'){const txt=critText(+t.dataset.c);try{await navigator.clipboard.writeText(txt);toast('已複製')}catch(err){toast('無法複製，請手動選取下方文字')}return}
  if(act==='critdl'){const n=+t.dataset.c;if(await saveFile(`文章評析_第${NUM[n]}章.md`,'# '+critText(n)))toast('已存檔');return}
  if(act==='chk')return; // handled in change
  const m=view.n==='mod'?curMod():null;
  if(act==='ans'){const a=S.judge[m.id]=S.judge[m.id]||{};a[+t.dataset.i]=t.dataset.v==='1';save();
    document.getElementById('sec-judge').innerHTML=judgeHTML(m);refreshProg(m)}
  else if(act==='resetj'){S.judge[m.id]={};save();document.getElementById('sec-judge').innerHTML=judgeHTML(m);refreshProg(m)}
  else if(act==='place'){const pl=ord[m.id]=ord[m.id]||[];pl.push(+t.dataset.p);
    if(pl.length===m.order.parts.length&&pl.every((x,i)=>x===i)){S.order[m.id]={done:true};save();refreshProg(m)}
    document.getElementById('sec-order').innerHTML=orderHTML(m)}
  else if(act==='unplace'){const pl=ord[m.id]||[];pl.splice(+t.dataset.i,1);document.getElementById('sec-order').innerHTML=orderHTML(m)}
  else if(act==='clearo'){ord[m.id]=[];document.getElementById('sec-order').innerHTML=orderHTML(m)}
  else if(act==='reseto'){S.order[m.id]={};ord[m.id]=[];save();document.getElementById('sec-order').innerHTML=orderHTML(m);refreshProg(m)}
  else if(act==='ai')runAI(m);
  else if(act==='carry'){const L=carryList(m);const o=S.tpl[m.id]=S.tpl[m.id]||{};L.forEach(([k,v])=>{o[k]=v});save();
    lastCarry={id:m.id,n:L.length,src:(CSRC[m.id]||[]).filter(anyFilled).map(srcName).join('、')};
    const y=window.scrollY;render();window.scrollTo(0,y);
    L.forEach(([k],i)=>{const el=document.querySelector(`[data-m="${m.id}"][data-f="${k}"]`);const fd=el&&(el.closest('.field')||el);if(!fd)return;if(i===0)flash(fd);else{fd.classList.add('flash')}});
    toast(`已帶入 ${L.length} 欄，請改成通順的句子`)}
  else if(act==='pwfill'){const r=powerCalc();if(r.sentence){setTplField('3.2','n',r.sentence);toast('已帶入樣本數與依據')}}
  else if(act==='cho'){S.cho=Object.assign(choState(),{[t.dataset.k]:t.dataset.v});const order=['q','scale','k','norm'];const i=order.indexOf(t.dataset.k);order.slice(i+1).forEach(k=>{if(!choNeed(S.cho).includes(k))S.cho[k]=''});save();refreshTool()}
  else if(act==='choreset'){S.cho={};save();refreshTool()}
  else if(act==='chofill'){const meth=t.dataset.v,cur=g('3.5','h1');
    if(cur.includes(NEED))setTplField('3.5','h1',cur.replace(NEED,meth));
    else if(!cur){const h=g('2.5','h')||g('1.4','hyp');setTplField('3.5','h1',h?`${noDot(h)}，採${meth}`:`H1：（請寫假設），採${meth}`)}
    else{try{await navigator.clipboard.writeText(meth)}catch(e){}return toast('「假設一」已有內容，方法名稱已複製，請貼到適當位置')}
    toast('已帶入統計方法')}
  else if(act==='mxadd'){(S.mx=S.mx||[]).push({});save();refreshTool()}
  else if(act==='mxdel'){(S.mx||[]).splice(+t.dataset.i,1);save();refreshTool()}
  else if(act==='mxfrom22'){const a=S.tpl['2.2']||{};if(!(a.cite||'').trim())return toast('2.2 還沒有填文獻');
    (S.mx=S.mx||[]).push({au:a.cite||'',who:a.who||'',des:a.how||'',vars:'',res:a.res||'',lim:a.lim||'',rel:''});save();refreshTool();toast('已加入矩陣')}
  else if(act==='mxn'){setTplField('2.3','n',String((S.mx||[]).length));toast('已帶入篇數')}
  else if(act==='mxcsv'){
    const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';const csv='\ufeff'+[MXC.map(([,l])=>q(l)).join(',')].concat((S.mx||[]).map(r=>MXC.map(([k])=>q(r[k])).join(','))).join('\r\n');
    if(await saveFile('文獻整理矩陣.csv',csv,'text/csv;charset=utf-8'))toast('已存檔')}
  else if(act==='apset'){S.ap=Object.assign(apState(),{[t.dataset.k]:t.dataset.v});
    if(t.dataset.k==='lang'){S.ap.deg=t.dataset.v==='zh'?'碩士論文':"Master's thesis";S.ap.db=t.dataset.v==='zh'?'臺灣博碩士論文知識加值系統':''}save();refreshTool()}
  else if(act==='apadd'){const r=apaFmt(apState());S.refs=S.refs||[];if(S.refs.includes(r))return toast('清單裡已經有這筆');S.refs.push(r);save();refreshTool();toast('已加入參考文獻清單')}
  else if(act==='apclear'){const a=apState();S.ap={type:a.type,lang:a.lang,deg:a.deg,db:a.db};save();refreshTool()}
  else if(act==='refdel'){(S.refs||[]).splice(+t.dataset.i,1);save();refreshTool()}
  else if(act==='copy'){const c=CH[+t.dataset.c-1],txt=chapterText(c);
    try{await navigator.clipboard.writeText(txt);toast('已複製')}catch(err){
      const r=document.createRange();r.selectNodeContents(document.getElementById('sumtext'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('請長按已選取的文字複製')}}
  else if(act==='docx')downloadThesisDocx();
  else if(act==='copyt'){const txt=thesisText();
    try{await navigator.clipboard.writeText(txt);toast('已複製')}catch(err){
      const r=document.createRange();r.selectNodeContents(document.getElementById('sumtext'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('請長按已選取的文字複製')}}
  else if(act==='dlt'){
    if(await saveFile('論文初稿.md',`# ${thesisText()}`))toast('已存檔')}
  else if(act==='dl'){const c=CH[+t.dataset.c-1];
    if(await saveFile(`第${NUM[c.n]}章草稿.md`,`# ${chapterText(c)}`))toast('已存檔')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='chk'){const a=S.checks[t.dataset.id]=S.checks[t.dataset.id]||[];a[+t.dataset.k]=t.checked;save()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.meta){META[t.dataset.meta]=t.value;saveMeta();return}
  if(t.dataset.pw){S.pw=Object.assign(pwState(),{[t.dataset.pw]:t.value});save();if(t.dataset.pw==='t'){refreshTool()}else{const o=document.getElementById('pwout');if(o)o.innerHTML=powerOutHTML()}return}
  if(t.dataset.mx!==undefined){const r=(S.mx||[])[+t.dataset.mx];if(r){r[t.dataset.mxk]=t.value;save()}return}
  if(t.dataset.ap){S.ap=Object.assign(apState(),{[t.dataset.ap]:t.value});save();const o=document.getElementById('apout');if(o)o.innerHTML=apOutHTML();return}
  if(t.dataset.cr){const n=t.dataset.cr;S.crit=S.crit||{};const a=S.crit[n]=S.crit[n]||{};a[t.dataset.crk]=t.value;save();const ct=document.getElementById('crittext');if(ct)ct.textContent=critText(+n);return}
  if(!t.dataset.f)return;
  const m=modById(t.dataset.m);const o=S.tpl[m.id]=S.tpl[m.id]||{};o[t.dataset.f]=t.value;save();
  document.getElementById('sec-prev').innerHTML=prevHTML(m);refreshProg(m);
  const h=document.getElementById('aihint');if(h)h.hidden=tplDone(m);
});

async function runAI(m){
  if(!tplDone(m)){const t=S.tpl[m.id]||{};const miss=m.tpl.fields.find(f=>((t[f.id]||'').trim().length<(f.min||4)));
    toast(`先把第 4 步寫完：「${miss?miss.label:''}」還不夠完整`);const el=miss&&document.querySelector(`[data-m="${m.id}"][data-f="${miss.id}"]`);if(el)flash(el.closest('.field')||el);return}
  const out=document.getElementById('aiout'),b=document.getElementById('aibtn');
  out.hidden=false;out.textContent='正在連線 Claude…';b.disabled=true;
  const sm=await getSample();if(!sm){out.textContent=NOAI;b.disabled=false;return}
  out.textContent='Claude 正在閱讀你的片段…';
  const prompt=`你是研究法課程的助教，協助體育與運動科學領域的研究生修改論文草稿。
章節：第${NUM[chOf(m).n]}章 ${chOf(m).name}／${m.id} ${m.title}
這一節的寫作重點：${m.focus}
學生寫的片段：
"""
${snippet(m)}
"""
請用繁體中文，總長 280 字內，依下列格式回覆：
【做得好的地方】一點
【需要修正】最多兩點，引用學生的具體句子
【改寫示範】只改寫最需要修正的那一句
不要重寫整段，不要過度稱讚。`;
  try{
    const r=await sm(prompt,{cache:false,onText:({text})=>{out.textContent=text}});
    S.ai[m.id]=r.text;save();out.textContent=r.text;
  }catch(err){
    out.textContent=aiErr(err);
  }finally{b.disabled=false}
}

try{view=dec(location.hash)}catch(e){}
if(!(window.claude&&claude.use))document.documentElement.classList.add('noai');
render();
if(window.claude&&claude.use){
  claude.use('sample').then(s=>{sampleNS=s}).catch(()=>{});
  claude.use('downloads').then(d=>{dlNS=d}).catch(()=>{});
}
</script>
